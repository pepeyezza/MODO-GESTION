/* ---------- DB bootstrap ---------- */
// Rellena en `db` cualquier campo que exista en `defaults` (emptyDB()) pero no en `db`,
// sin tocar los datos ya guardados. Necesario porque la base de datos vive en localStorage
// del navegador de cada usuario: si guardaron datos con una versión anterior de la app
// (antes de que existieran, por ejemplo, modoDiagnostics o helpRequests), esos campos
// nuevos faltarían al cargar y romperían cualquier código que asuma que existen.
function migrateDB(db, defaults){
  Object.keys(defaults).forEach(key=>{
    const def = defaults[key];
    if(db[key]===undefined){ db[key] = def; return; }
    if(Array.isArray(def)) return; // los arrays existentes se respetan tal cual
    if(def && typeof def==='object'){ migrateDB(db[key], def); return; } // objetos anidados (ej. consulting, finance)
  });
  // Backfill de campos agregados a registros existentes durante la evolución de Acciones
  // (origin/objectiveId/indicatorId/startDate): una acción guardada con una versión anterior
  // de la app no los tiene, y Historia de Gestión los necesita para no romperse.
  if(db.consulting && Array.isArray(db.consulting.actions)){
    db.consulting.actions.forEach(a=>{
      if(a.startDate===undefined) a.startDate = a.dueDate || (db.companies[0]&&db.companies[0].lastUpdated) || new Date().toISOString().slice(0,10);
      if(a.origin===undefined) a.origin = 'Consultoría';
      if(a.objectiveId===undefined) a.objectiveId = null;
      if(a.indicatorId===undefined) a.indicatorId = null;
    });
  }
  // Backfill de Fichas de producto (costo unitario por componentes) y margen objetivo por empresa,
  // agregados junto con el módulo de Costos > Productos / La Carta.
  if(Array.isArray(db.companies)){
    db.companies.forEach(c=>{
      if(c.targetMarginPct===undefined) c.targetMarginPct = /gastronom|restaur|gourmet/i.test((c.sector||'')+' '+(c.activity||'')) ? 65 : 45;
      // Empresas ya guardadas cuyo rubro coincide con alguna regla (agro, turismo...)
      // reciben ese módulo aunque se hayan cargado antes de que existiera.
      if(Array.isArray(c.modules) && G.ensureAutoModules) G.ensureAutoModules(c);
    });
  }
  if(Array.isArray(db.products)){
    db.products.forEach(p=>{
      if(p.costComponents===undefined) p.costComponents = [];
      if(p.unit===undefined) p.unit = 'unidad';
      if(p.active===undefined) p.active = true;
    });
  }
  return db;
}
/* ---------- Arranque de la app ----------
   G.DB ya no se arma localmente (seedDatabase/migrateDB quedan definidas arriba
   pero sólo las usa scripts/extract-demo-data.mjs del lado del servidor, no el
   navegador): se pide entero al backend en /api/bootstrap, ya recortado a lo que
   la sesión actual puede ver. Mientras se resuelve ese pedido se muestra una
   pantalla de carga simple. */
async function initApp(){
  const app = document.getElementById('app');
  if(app) app.innerHTML = '<div class="boot-loading"><div class="spinner"></div><div>Cargando MODO Gestión…</div></div>';
  try{
    const res = await fetch('/api/bootstrap', {credentials:'include'});
    if(res.status===401){
      G.DB = {companies:[], users:[], homeContent: G.DEFAULT_HOME_CONTENT};
      G.currentUser = null;
      G.session = null;
      G.companyVersions = {};
      try{
        const hcRes = await fetch('/api/home-content');
        if(hcRes.ok) G.DB.homeContent = (await hcRes.json()).homeContent || G.DEFAULT_HOME_CONTENT;
      }catch(e){ /* si falla, se queda con G.DEFAULT_HOME_CONTENT */ }
      G.renderLogin();
      return;
    }
    if(!res.ok) throw new Error('bootstrap_failed:'+res.status);
    const payload = await res.json();
    G.DB = payload.db;
    G.currentUser = payload.currentUser;
    G.companyVersions = payload.companyVersions || {};
    G.session = {
      userId: payload.currentUser.id,
      viewingCompanyId: payload.currentUser.role==='SUPER_ADMIN' ? null : payload.currentUser.companyId,
      consultantMode: false,
    };
    G.render();
  }catch(err){
    console.error(err);
    if(app) app.innerHTML = '<div class="boot-loading"><div>No se pudo conectar con el servidor.</div>'+
      '<button class="btn btn-primary" id="bootRetryBtn" style="margin-top:12px">Reintentar</button></div>';
    const retryBtn = document.getElementById('bootRetryBtn');
    if(retryBtn) retryBtn.addEventListener('click', initApp);
  }
}
G.initApp = initApp;

/* ---------- Guardado (persist) ----------
   Cada mutación (vía G.crud o los pocos persist() directos) llama a esta función
   igual que antes; en vez de escribir en localStorage, ahora agrupa los cambios
   seguidos (debounce) y manda el estado actual de la empresa que se está viendo al
   backend. Si el backend avisa que alguien más guardó una versión más nueva
   (409), se recarga todo desde /api/bootstrap en vez de arriesgarse a pisar datos. */
const doSync = G.util.debounce(async function(){
  const companyId = G.session && G.session.viewingCompanyId;
  if(!companyId) return; // ej: Super Admin parado en el dashboard global, sin empresa abierta
  const baseVersion = (G.companyVersions && G.companyVersions[companyId]) || 0;
  const data = extractCompanySlice(G.DB, companyId);
  try{
    const res = await fetch('/api/companies/'+companyId+'/sync', {
      method:'PUT', credentials:'include', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({baseVersion, data}),
    });
    if(res.status===409){
      G.toast('Estos datos se actualizaron en otro dispositivo. Recargando la información más reciente…');
      await G.initApp();
      return;
    }
    if(!res.ok) throw new Error('sync_failed:'+res.status);
    const {newVersion} = await res.json();
    G.companyVersions[companyId] = newVersion;
  }catch(err){
    console.error(err);
    G.toast('No se pudieron guardar los últimos cambios. Verificá tu conexión a internet.');
    // No reintenta en loop: la próxima mutación del usuario vuelve a llamar a persist().
  }
}, 700);
// Arma el "slice" de una empresa puntual a partir del G.DB (con companyId en cada
// item), filtrando sólo lo de esa empresa -- el propio backend (extractOperationalData
// en lib/db-shape.ts, el mismo código que usa /api/companies/:id/sync) es quien le
// quita el campo companyId a cada item antes de guardarlo. Importante: ACÁ no hay
// que quitarlo también, o el filtro por companyId del lado del servidor no
// encontraría ninguna coincidencia (y guardaría todo vacío).
function extractCompanySlice(db, companyId){
  const keep = (arr)=> (arr||[]).filter(x=>x.companyId===companyId);
  return {
    finance: {incomes: keep(db.finance.incomes), expenses: keep(db.finance.expenses)},
    financeCategories: {[companyId]: (db.financeCategories && db.financeCategories[companyId]) || {income:[],expense:[]}},
    costsFixed: keep(db.costsFixed), costsVariable: keep(db.costsVariable),
    products: keep(db.products), clients: keep(db.clients), sales: keep(db.sales),
    pipeline: keep(db.pipeline), employees: keep(db.employees), evaluations: keep(db.evaluations),
    innovation: keep(db.innovation), objectives: keep(db.objectives), indicators: keep(db.indicators),
    modoDiagnostics: keep(db.modoDiagnostics),
    modoWeights: {[companyId]: (db.modoWeights && db.modoWeights[companyId]) || {}},
    consulting: {
      diagnostics: keep(db.consulting.diagnostics), actions: keep(db.consulting.actions),
      meetings: keep(db.consulting.meetings), notes: keep(db.consulting.notes),
    },
    helpRequests: keep(db.helpRequests), videoCalls: keep(db.videoCalls),
    chatMessages: keep(db.chatMessages), activityLog: keep(db.activityLog),
    livestockInventory: keep(db.livestockInventory), rainfallLog: keep(db.rainfallLog),
    agroLots: keep(db.agroLots), agroTasks: keep(db.agroTasks),
    agroLivestockMovements: keep(db.agroLivestockMovements),
    agroMachinery: keep(db.agroMachinery), agroMachineryLog: keep(db.agroMachineryLog),
    turismoUnits: keep(db.turismoUnits), turismoBookings: keep(db.turismoBookings),
    companyLogos: {[companyId]: (db.companyLogos && db.companyLogos[companyId]) || ''},
  };
}
function persist(){ doSync(); }
G.persist = persist;

/* ---------- Session / auth ---------- */
async function login(email, password){
  const res = await fetch('/api/auth/login', {
    method:'POST', credentials:'include', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({email, password}),
  });
  if(!res.ok) return false;
  const {user} = await res.json();
  G.currentUser = user;
  return true;
}
async function logout(){
  try{ await fetch('/api/auth/logout', {method:'POST', credentials:'include'}); }catch(e){}
  G.currentUser = null; G.DB = null; G.session = null; G.companyVersions = null;
}
function currentUser(){
  return G.currentUser || null;
}
function currentCompany(){
  const u = currentUser();
  if(!u) return null;
  const cid = u.role==='SUPER_ADMIN' ? (G.session && G.session.viewingCompanyId) : u.companyId;
  if(!cid) return null;
  return (G.DB.companies||[]).find(c=>c.id===cid) || null;
}
G.auth = {login, logout, currentUser, currentCompany};

/* ---------- Permissions ---------- */
function moduleEnabledForCompany(company, moduleKey){
  const mod = G.moduleByKey(moduleKey);
  if(!mod) return false;
  if(mod.core) return true;
  const flagKey = mod.pairsWith || moduleKey;
  return company && company.modules.includes(flagKey);
}
function userCanSeeModule(user, company, moduleKey){
  if(!user || !company) return false;
  if(!moduleEnabledForCompany(company, moduleKey)) return false;
  // El consultor (Súper Admin) y el administrador de la empresa ven cualquier
  // módulo que la empresa tenga activo -- ya sea porque lo activó el rubro
  // solo, o porque el consultor lo prendió a mano en Configuración -- sin
  // restricciones adicionales. Antes el Súper Admin veía TODOS los módulos
  // opcionales en cualquier empresa sin importar si estaban activos, lo que
  // hacía parecer que la activación automática por rubro no funcionaba.
  if(user.role==='SUPER_ADMIN' || user.role==='ADMIN_EMPRESA') return true;
  // USUARIO_EMPRESA: dashboard/asistente/indicadores/reportes son siempre
  // visibles si la empresa los tiene; los módulos opcionales requieren que el
  // Súper Admin se los haya asignado explícitamente ("Módulos permitidos").
  const mod = G.moduleByKey(moduleKey);
  if(mod.core) return true;
  const flagKey = mod.pairsWith || moduleKey;
  return user.allowedModules.includes(flagKey);
}
function userCan(user, moduleKey, action){
  if(!user) return false;
  if(user.role==='SUPER_ADMIN') return true;
  if(user.role==='ADMIN_EMPRESA') return true;
  const custom = user.permissions && user.permissions[moduleKey];
  if(custom) return custom.includes(action);
  return ['ver','crear','editar'].includes(action); // default for usuario_empresa
}
G.perm = {moduleEnabledForCompany, userCanSeeModule, userCan};

/* ---------- Activity log ---------- */
function logActivity(action, entity, companyIdOverride){
  const user = G.auth.currentUser();
  if(!user) return;
  const company = companyIdOverride!==undefined ? G.DB.companies.find(c=>c.id===companyIdOverride) : G.auth.currentCompany();
  G.DB.activityLog.unshift({
    id: uid('log'), userId: user.id, userName: user.name,
    companyId: company?company.id:null, companyName: company?company.name:null,
    action, entity, date: new Date().toISOString(),
  });
  if(G.DB.activityLog.length>500) G.DB.activityLog.length = 500;
  persist();
}
G.logActivity = logActivity;

/* ---------- Generic CRUD helpers (per collection, tenant-aware) ---------- */
function byCompany(list, companyId){ return list.filter(x=>x.companyId===companyId); }
function findIndex(list, id){ return list.findIndex(x=>x.id===id); }
function addItem(list, item, idPrefix){
  item.id = item.id || uid(idPrefix||'item');
  list.push(item);
  persist();
  return item;
}
function updateItem(list, id, patch){
  const i = findIndex(list, id);
  if(i<0) return null;
  Object.assign(list[i], patch);
  persist();
  return list[i];
}
function removeItem(list, id){
  const i = findIndex(list, id);
  if(i<0) return false;
  list.splice(i,1);
  persist();
  return true;
}
G.crud = {byCompany, findIndex, addItem, updateItem, removeItem};

})();
</script>

<script>
/* ============================================================
   PART 6 — Selectors: aggregation, KPIs, and the alerts engine
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const fmt = G.fmt;

G.PERIODS = [
  {key:'mes', label:'Mes', months:1},
  {key:'trimestre', label:'Trimestre', months:3},
  {key:'semestre', label:'Semestre', months:6},
  {key:'anio', label:'Año', months:10},
];
function periodMonths(periodKey){
  const p = G.PERIODS.find(p=>p.key===periodKey) || G.PERIODS[0];
  return p.months;
}
G.periodMonths = periodMonths;

function inWindow(dateStr, monthKeys){ return monthKeys.includes(dateStr.slice(0,7)); }

function financeWindow(companyId, monthsCount, offset){
  offset = offset||0;
  const months = G.lastMonths(monthsCount+offset).slice(0, monthsCount);
  const keys = months.map(m=>m.key);
  const incomes = G.DB.finance.incomes.filter(x=>x.companyId===companyId && keys.includes(x.date.slice(0,7)));
  const expenses = G.DB.finance.expenses.filter(x=>x.companyId===companyId && keys.includes(x.date.slice(0,7)));
  const income = G.util.sum(incomes, x=>x.amount);
  const expense = G.util.sum(expenses, x=>x.amount);
  return {months, income, expense, result: income-expense, margin: income? (income-expense)/income*100 : 0, incomes, expenses};
}
G.financeWindow = financeWindow;

function salesWindow(companyId, monthsCount){
  const months = G.lastMonths(monthsCount);
  const keys = months.map(m=>m.key);
  const sales = G.DB.sales.filter(x=>x.companyId===companyId && keys.includes(x.date.slice(0,7)));
  return {months, sales, total: G.util.sum(sales, s=>s.total)};
}
G.salesWindow = salesWindow;

function monthlySeriesFor(companyId, monthsCount, kind){
  // kind: 'finance' -> {income,expense,result} per month ; 'sales' -> {total}
  const months = G.lastMonths(monthsCount);
  return months.map(mo=>{
    if(kind==='sales'){
      const total = G.util.sum(G.DB.sales.filter(s=>s.companyId===companyId && s.date.startsWith(mo.key)), s=>s.total);
      return Object.assign({}, mo, {total});
    }
    const inc = G.util.sum(G.DB.finance.incomes.filter(x=>x.companyId===companyId && x.date.startsWith(mo.key)), x=>x.amount);
    const exp = G.util.sum(G.DB.finance.expenses.filter(x=>x.companyId===companyId && x.date.startsWith(mo.key)), x=>x.amount);
    return Object.assign({}, mo, {income:inc, expense:exp, result: inc-exp});
  });
}
G.monthlySeriesFor = monthlySeriesFor;

function pctDelta(curr, prev){
  if(!prev) return null;
  return ((curr-prev)/Math.abs(prev))*100;
}
G.pctDelta = pctDelta;

/* ---------- Company-level KPI bundle (used by company dashboard) ---------- */
function companyKPIs(companyId, periodKey){
  const months = periodMonths(periodKey||'mes');
  const curr = financeWindow(companyId, months, 0);
  const prev = financeWindow(companyId, months, months);
  const salesCurr = salesWindow(companyId, months);
  const clients = G.DB.clients.filter(c=>c.companyId===companyId);
  const activeClients = clients.filter(c=>c.status==='Activo').length;
  const monthKeys = G.lastMonths(months).map(m=>m.key);
  const newClients = clients.filter(c=> monthKeys.includes(c.createdAt.slice(0,7))).length;
  const employees = G.DB.employees.filter(e=>e.companyId===companyId && e.status==='Activo');
  const costoLaboral = G.util.sum(employees, e=>e.salary);
  const costosFijos = G.util.sum(G.DB.costsFixed.filter(c=>c.companyId===companyId), c=>c.amount);
  const ticketProm = salesCurr.sales.length ? salesCurr.total/salesCurr.sales.length : 0;

  return {
    periodKey: periodKey||'mes', months,
    ingresos: curr.income, egresos: curr.expense, resultado: curr.result, margen: curr.margin,
    ingresosPrev: prev.income, egresosPrev: prev.expense, resultadoPrev: prev.result,
    deltaIngresos: pctDelta(curr.income, prev.income), deltaEgresos: pctDelta(curr.expense, prev.expense), deltaResultado: pctDelta(curr.result, prev.result),
    ventas: salesCurr.total, ventasPrev: financeWindow(companyId,months,months).income, // fallback
    clientesActivos: activeClients, clientesTotal: clients.length, clientesNuevos: newClients,
    ticketPromedio: ticketProm, empleadosActivos: employees.length, costoLaboral, costosFijos,
    costoLaboralSobreVentas: salesCurr.total ? (costoLaboral/salesCurr.total*100) : 0,
  };
}
G.companyKPIs = companyKPIs;

/* ---------- Alerts engine ---------- */
// returns [{level:'critical'|'warning'|'good', title, desc, module, companyId}]
function alertsForCompany(companyId){
  const alerts = [];
  const company = G.DB.companies.find(c=>c.id===companyId);
  if(!company) return alerts;
  const kpi = companyKPIs(companyId, 'mes');
  const indicators = G.DB.indicators.filter(i=>i.companyId===companyId);
  const objectives = G.DB.objectives.filter(o=>o.companyId===companyId);

  const rent = indicators.find(i=>i.name==='Rentabilidad neta');
  if(rent){
    if(rent.current < rent.target*0.75) alerts.push({level:'critical', title:'Rentabilidad muy por debajo del objetivo', desc:'Rentabilidad neta de '+fmt.pct(rent.current)+' vs. objetivo de '+fmt.pct(rent.target)+'.', module:'indicadores', companyId});
    else if(rent.current < rent.target) alerts.push({level:'warning', title:'Rentabilidad debajo del objetivo', desc:'Rentabilidad neta de '+fmt.pct(rent.current)+' vs. objetivo de '+fmt.pct(rent.target)+'.', module:'indicadores', companyId});
    else alerts.push({level:'good', title:'Rentabilidad en línea con el objetivo', desc:'Rentabilidad neta de '+fmt.pct(rent.current)+', por encima del objetivo.', module:'indicadores', companyId});
  }
  const series = monthlySeriesFor(companyId, 3, 'sales');
  if(series.length>=2){
    const last = series[series.length-1].total, prevM = series[series.length-2].total;
    const delta = pctDelta(last, prevM);
    if(delta!=null && delta <= -10) alerts.push({level:'critical', title:'Caída de ventas superior al 10%', desc:'Las ventas cayeron '+fmt.pct(Math.abs(delta))+' respecto del mes anterior.', module:'comercial', companyId});
    else if(delta!=null && delta<0) alerts.push({level:'warning', title:'Ventas en baja', desc:'Las ventas bajaron '+fmt.pct(Math.abs(delta))+' respecto del mes anterior.', module:'comercial', companyId});
  }
  if(kpi.margen < 0) alerts.push({level:'critical', title:'Resultado negativo del mes', desc:'Los egresos superaron a los ingresos en el mes en curso.', module:'finanzas', companyId});
  const days = G.fmt.timeAgo(company.lastUpdated);
  const daysNum = Math.round((new Date(G.TODAY_ISO)-new Date(company.lastUpdated))/86400000);
  if(daysNum>20) alerts.push({level:'warning', title:'Información financiera desactualizada', desc:'La última actualización fue '+days+'.', module:'finanzas', companyId});

  const atRiskObjectives = objectives.filter(o=>o.status==='En riesgo');
  if(atRiskObjectives.length) alerts.push({level:'warning', title: atRiskObjectives.length+' objetivo(s) en riesgo', desc: atRiskObjectives.map(o=>o.name).join(', '), module:'planificacion', companyId});
  const doneObjectives = objectives.filter(o=>o.status==='Cumplido');
  if(doneObjectives.length) alerts.push({level:'good', title: doneObjectives.length+' objetivo(s) cumplido(s)', desc: doneObjectives.map(o=>o.name).join(', '), module:'planificacion', companyId});

  const incompleteIndicators = indicators.filter(i=> i.current==null);
  if(incompleteIndicators.length) alerts.push({level:'warning', title:'Indicadores incompletos', desc: incompleteIndicators.length+' indicador(es) sin valor actual cargado.', module:'indicadores', companyId});

  if(G.moduleEnabledFor(company,'costos')){
    const bep = indicators.find(i=>i.name.includes('equilibrio'));
    if(bep && bep.current > bep.target) alerts.push({level:'critical', title:'Punto de equilibrio no alcanzado', desc:'Se necesitan '+fmt.num(bep.current)+' unidades para cubrir los costos fijos, por encima de las '+fmt.num(bep.target)+' unidades de referencia: la estructura de costos se volvió menos eficiente.', module:'costos', companyId});
  }

  const pendingActions = G.DB.consulting.actions.filter(a=>a.companyId===companyId && a.status!=='Completada');
  if(pendingActions.length>=2) alerts.push({level:'warning', title: pendingActions.length+' acciones de mejora pendientes', desc:'Hay acciones del plan de consultoría sin completar.', module:'consultoria', companyId});

  /* ---------- Reglas ampliadas MODO 2.0 (Costos, Personas, Comercial, Gestión) ---------- */
  const financeSeries = monthlySeriesFor(companyId, 3, 'finance');
  if(financeSeries.length>=2){
    const lastExp = financeSeries[financeSeries.length-1].expense, prevExp = financeSeries[financeSeries.length-2].expense;
    const deltaExp = pctDelta(lastExp, prevExp);
    if(deltaExp!=null && deltaExp>=15) alerts.push({level:'critical', title:'Aumento fuerte de costos', desc:'Los egresos crecieron '+fmt.pct(deltaExp)+' respecto del mes anterior. Esto puede estar erosionando el margen: conviene identificar qué rubro impulsó el aumento antes del cierre del mes.', module:'costos', companyId});
    else if(deltaExp!=null && deltaExp>=8) alerts.push({level:'warning', title:'Aumento de costos', desc:'Los egresos crecieron '+fmt.pct(deltaExp)+' respecto del mes anterior. Vale la pena revisar los costos fijos y variables del período.', module:'costos', companyId});
  }

  const ausentismoInd = indicators.find(i=>i.name==='Ausentismo');
  if(ausentismoInd){
    if(ausentismoInd.current > ausentismoInd.target*1.4) alerts.push({level:'critical', title:'Ausentismo muy por encima del objetivo', desc:'Ausentismo de '+fmt.pct(ausentismoInd.current)+' vs. objetivo de '+fmt.pct(ausentismoInd.target)+'. Un ausentismo alto suele impactar en productividad y clima laboral: conviene identificar si está concentrado en algún equipo o turno.', module:'rrhh', companyId});
    else if(ausentismoInd.current > ausentismoInd.target) alerts.push({level:'warning', title:'Ausentismo por encima del objetivo', desc:'Ausentismo de '+fmt.pct(ausentismoInd.current)+' vs. objetivo de '+fmt.pct(ausentismoInd.target)+'.', module:'rrhh', companyId});
  }

  const rotacionInd = indicators.find(i=>i.name==='Rotación de empleados');
  if(rotacionInd && rotacionInd.current > rotacionInd.target*1.3) alerts.push({level:'warning', title:'Rotación de personal elevada', desc:'Rotación de '+fmt.pct(rotacionInd.current)+' vs. objetivo de '+fmt.pct(rotacionInd.target)+'. Puede afectar la curva de aprendizaje del equipo y el costo de reposición: conviene revisar los motivos de las bajas recientes.', module:'rrhh', companyId});

  const costoLaboralInd = indicators.find(i=>i.name==='Costo laboral / Ventas');
  if(costoLaboralInd && costoLaboralInd.history && costoLaboralInd.history.length>=2){
    const lastV = costoLaboralInd.history[costoLaboralInd.history.length-1].value, prevV = costoLaboralInd.history[costoLaboralInd.history.length-2].value;
    if(lastV > prevV && lastV > costoLaboralInd.target) alerts.push({level:'warning', title:'Costo laboral en aumento', desc:'El costo laboral sobre ventas subió a '+fmt.pct(lastV)+' (objetivo: '+fmt.pct(costoLaboralInd.target)+'). Si las ventas no acompañan ese ritmo, el margen se resiente: conviene revisar dotación y productividad.', module:'rrhh', companyId});
  }

  const ticketInd = indicators.find(i=>i.name==='Ticket promedio');
  if(ticketInd && ticketInd.history && ticketInd.history.length>=2){
    const lastT = ticketInd.history[ticketInd.history.length-1].value, prevT = ticketInd.history[ticketInd.history.length-2].value;
    const deltaT = pctDelta(lastT, prevT);
    if(deltaT!=null && deltaT<=-8) alerts.push({level:'warning', title:'Ticket promedio en baja', desc:'El ticket promedio bajó '+fmt.pct(Math.abs(deltaT))+' respecto del mes anterior ('+fmt.currency(lastT,{compact:true})+'). Puede indicar menor venta cruzada o descuentos más agresivos: conviene revisar la mezcla de productos y la política comercial.', module:'comercial', companyId});
  }

  const lostClients = G.DB.clients.filter(c=>c.companyId===companyId && c.status==='Inactivo');
  if(lostClients.length>=3) alerts.push({level:'critical', title:'Pérdida de clientes', desc: lostClients.length+' clientes pasaron a estado inactivo. Conviene relevar los motivos de baja y priorizar un plan de recuperación con los de mayor valor histórico.', module:'clientes', companyId});
  else if(lostClients.length>=1) alerts.push({level:'warning', title:'Clientes inactivos', desc: lostClients.length+' cliente(s) en estado inactivo. Vale la pena confirmar si es una baja definitiva o una pausa temporal.', module:'clientes', companyId});

  const overdueActions = G.DB.consulting.actions.filter(a=>a.companyId===companyId && actionIsOverdue(a));
  if(overdueActions.length) alerts.push({level:'critical', title: overdueActions.length+' acción(es) de mejora vencida(s)', desc: overdueActions.map(a=>a.action).join(', ')+'. Las acciones vencidas suelen frenar el avance de los objetivos a los que están vinculadas: conviene redefinir fecha o responsable en la próxima reunión.', module:'consultoria', companyId});

  const overdueObjectives = objectives.filter(o=> o.status!=='Cumplido' && o.status!=='Cancelado' && o.targetDate && o.targetDate < G.TODAY_ISO);
  if(overdueObjectives.length) alerts.push({level:'warning', title: overdueObjectives.length+' objetivo(s) con fecha vencida', desc: overdueObjectives.map(o=>o.name).join(', ')+'. Puede ser un buen momento para replanificar el plazo o reforzar el seguimiento.', module:'planificacion', companyId});

  const staleIndicators = indicators.filter(i=>i.frequency==='Mensual');
  if(daysNum>45 && staleIndicators.length) alerts.push({level:'warning', title:'Indicadores desactualizados', desc: staleIndicators.length+' indicador(es) de frecuencia mensual no se actualizan hace más de 45 días. Sin datos frescos, el diagnóstico y las alertas pierden precisión.', module:'indicadores', companyId});

  const order = {critical:0, warning:1, good:2};
  return alerts.sort((a,b)=>order[a.level]-order[b.level]);
}
G.alertsForCompany = alertsForCompany;
G.moduleEnabledFor = function(company, key){ return G.perm.moduleEnabledForCompany(company, key); };

function companyHealthLevel(companyId){
  const alerts = alertsForCompany(companyId);
  if(alerts.some(a=>a.level==='critical')) return 'critical';
  if(alerts.some(a=>a.level==='warning')) return 'warning';
  return 'good';
}
G.companyHealthLevel = companyHealthLevel;

// Clasificación de 4 niveles para "Empresas que requieren atención" (sección 15 del brief):
// 🔴 Crítica · 🟠 Requiere atención · 🟡 Seguimiento · 🟢 Normal — construida sobre las
// mismas alertas ya calculadas por alertsForCompany, sin duplicar lógica de severidad.
function companyRiskTier(companyId){
  const alerts = alertsForCompany(companyId);
  const criticalCount = alerts.filter(a=>a.level==='critical').length;
  const warningCount = alerts.filter(a=>a.level==='warning').length;
  if(criticalCount>=2) return {key:'critica', emoji:'🔴', label:'Crítica', tone:'critical'};
  if(criticalCount>=1) return {key:'atencion', emoji:'🟠', label:'Requiere atención', tone:'critical'};
  if(warningCount>=1) return {key:'seguimiento', emoji:'🟡', label:'Seguimiento', tone:'warning'};
  return {key:'normal', emoji:'🟢', label:'Normal', tone:'good'};
}
G.companyRiskTier = companyRiskTier;
G.RISK_TIERS = [
  {key:'critica', emoji:'🔴', label:'Crítica'},
  {key:'atencion', emoji:'🟠', label:'Requiere atención'},
  {key:'seguimiento', emoji:'🟡', label:'Seguimiento'},
  {key:'normal', emoji:'🟢', label:'Normal'},
];

// Whether a higher value is the "good" direction for a given indicator name — used
// consistently by the alerts engine and by the Indicadores card so both agree.
function higherIsBetterKPI(name){
  return !/rotaci[oó]n|ausentismo|costo laboral|costo de producci[oó]n|costo por|equilibrio|morosidad|devoluci/i.test(name||'');
}
G.higherIsBetterKPI = higherIsBetterKPI;
G.indicatorIsAboveGoal = function(k){ return higherIsBetterKPI(k.name) ? k.current>=k.target : k.current<=k.target; };

function companiesNeedingAttention(){
  return G.DB.companies.map(c=>{
    const alerts = alertsForCompany(c.id).filter(a=>a.level!=='good');
    return {company:c, alerts};
  }).filter(x=>x.alerts.length).sort((a,b)=> b.alerts.filter(x=>x.level==='critical').length - a.alerts.filter(x=>x.level==='critical').length);
}
G.companiesNeedingAttention = companiesNeedingAttention;

/* ---------- Global consultant dashboard aggregation ---------- */
function globalKPIs(periodKey){
  const months = periodMonths(periodKey||'mes');
  const companies = G.DB.companies;
  let facturacion=0, costos=0, empleados=0, ventas=0, rentSum=0, rentCount=0;
  companies.forEach(c=>{
    const fw = financeWindow(c.id, months, 0);
    facturacion += fw.income; costos += fw.expense;
    empleados += G.DB.employees.filter(e=>e.companyId===c.id && e.status==='Activo').length;
    ventas += salesWindow(c.id, months).total;
    const rent = G.DB.indicators.find(i=>i.companyId===c.id && i.name==='Rentabilidad neta');
    if(rent){ rentSum+=rent.current; rentCount++; }
  });
  const activas = companies.filter(c=>c.status==='Activa').length;
  const actualizadas = companies.filter(c=> Math.round((new Date(G.TODAY_ISO)-new Date(c.lastUpdated))/86400000) <= 20).length;
  const pendientes = companies.length - actualizadas;
  const criticas = companies.filter(c=> companyHealthLevel(c.id)==='critical').length;
  return {
    empresasActivas: activas, empresasActualizadas: actualizadas, empresasPendientes: pendientes, empresasCriticas: criticas,
    facturacion, costos, rentabilidadEstimada: facturacion-costos, empleados, ventas,
    rentabilidadPromedio: rentCount? rentSum/rentCount : 0,
    totalAlertas: companies.reduce((a,c)=>a+alertsForCompany(c.id).filter(x=>x.level!=='good').length,0),
  };
}
G.globalKPIs = globalKPIs;

/* ---------- Comercial selectors ---------- */
function salesByGroup(companyId, monthsCount, groupFn, labelFn){
  const sw = salesWindow(companyId, monthsCount);
  const groups = G.util.groupBy(sw.sales, groupFn);
  return Object.entries(groups).map(([k,arr])=>({label: labelFn?labelFn(k,arr):k, value: G.util.sum(arr,s=>s.total), count:arr.length}))
    .sort((a,b)=>b.value-a.value);
}
G.salesByClient = function(companyId, months){
  return salesByGroup(companyId, months, s=>s.clientId, (id)=>{ const c=G.DB.clients.find(c=>c.id===id); return c?c.name:'—'; });
};
G.salesByProduct = function(companyId, months){
  return salesByGroup(companyId, months, s=>s.productId, (id)=>{ const p=G.DB.products.find(p=>p.id===id); return p?p.name:'—'; });
};
G.salesBySeller = function(companyId, months){
  return salesByGroup(companyId, months, s=>s.seller);
};
G.pipelineByStage = function(companyId){
  const stages = ['Prospecto','Contactado','Propuesta','Negociación','Ganado','Perdido'];
  const items = G.DB.pipeline.filter(p=>p.companyId===companyId);
  return stages.map(s=>({stage:s, items: items.filter(i=>i.stage===s)}));
};

/* ---------- RRHH selectors ---------- */
G.employeesByArea = function(companyId){
  const emps = G.DB.employees.filter(e=>e.companyId===companyId && e.status==='Activo');
  const groups = G.util.groupBy(emps, e=>e.area);
  return Object.entries(groups).map(([area,arr])=>({label:area, value:arr.length})).sort((a,b)=>b.value-a.value);
};
G.avgSeniorityYears = function(companyId){
  const emps = G.DB.employees.filter(e=>e.companyId===companyId && e.status==='Activo');
  if(!emps.length) return 0;
  const yrs = emps.map(e=> (new Date(G.TODAY_ISO)-new Date(e.startDate))/(365.25*86400000));
  return G.util.sum(yrs)/yrs.length;
};

/* ---------- Costs selectors ---------- */
G.costsSummary = function(companyId){
  const fixed = G.DB.costsFixed.filter(c=>c.companyId===companyId);
  const variable = G.DB.costsVariable.filter(c=>c.companyId===companyId);
  const totalFixed = G.util.sum(fixed, c=>c.amount);
  return {fixed, variable, totalFixed};
};
G.breakEven = function(companyId, productId){
  const {totalFixed} = G.costsSummary(companyId);
  const product = G.DB.products.find(p=>p.id===productId);
  if(!product) return null;
  const contribution = product.price - product.variableCost;
  if(contribution<=0) return {units:Infinity, revenue:Infinity, contribution};
  const units = totalFixed/contribution;
  return {units, revenue: units*product.price, contribution, marginPct: contribution/product.price*100};
};

/* ---------- MODO Diagnóstico: Índice MODO, tonos y prioridades ---------- */
// Calcula el Índice MODO en base a las puntuaciones y las ponderaciones configuradas
// (no hardcodeado: si mañana cambian las dimensiones o los pesos, este cálculo se adapta solo).
function computeModoIndex(scores, weights){
  if(!scores) return null;
  let sum=0, wsum=0;
  G.MODO_DIMENSIONS.forEach(d=>{
    const v = scores[d.key];
    if(v==null) return;
    const w = (weights && weights[d.key]!=null) ? weights[d.key] : d.defaultWeight;
    sum += v*w; wsum += w;
  });
  return wsum ? Math.round(sum/wsum) : null;
}
G.computeModoIndex = computeModoIndex;

function modoTone(score){ return score>=70?'good':score>=50?'warning':'critical'; }
G.modoTone = modoTone;

function modoTier(index){
  if(index==null) return {label:'Sin datos', tone:'neutral'};
  if(index>=75) return {label:'Destacado', tone:'good'};
  if(index>=60) return {label:'Sólido', tone:'good'};
  if(index>=40) return {label:'En desarrollo', tone:'warning'};
  return {label:'Crítico', tone:'critical'};
}
G.modoTier = modoTier;

function lastModoDiagnostic(companyId){
  return G.DB.modoDiagnostics.filter(d=>d.companyId===companyId).sort((a,b)=>b.date.localeCompare(a.date))[0] || null;
}
G.lastModoDiagnostic = lastModoDiagnostic;

// Prioridades sugeridas: se generan en base a las dimensiones más débiles, no están hardcodeadas por empresa.
function modoPriorities(scores, limit){
  if(!scores) return [];
  return G.MODO_DIMENSIONS
    .map(d=>({key:d.key, label:d.label, icon:d.icon, score:scores[d.key], suggestion:d.suggestion, relatedModule:d.relatedModule}))
    .filter(d=>d.score!=null && d.score<60)
    .sort((a,b)=>a.score-b.score)
    .slice(0, limit||5);
}
G.modoPriorities = modoPriorities;

function modoStrengths(scores, limit){
  if(!scores) return [];
  return G.MODO_DIMENSIONS
    .map(d=>({key:d.key, label:d.label, icon:d.icon, score:scores[d.key]}))
    .filter(d=>d.score!=null && d.score>=70)
    .sort((a,b)=>b.score-a.score)
    .slice(0, limit||5);
}
G.modoStrengths = modoStrengths;

/* ---------- MODO Acciones: vencimientos y criticidad ---------- */
function actionIsOpen(a){ return a.status!=='Completada' && a.status!=='Cancelada'; }
G.actionIsOpen = actionIsOpen;
function actionIsOverdue(a){ return actionIsOpen(a) && a.dueDate < G.TODAY_ISO; }
G.actionIsOverdue = actionIsOverdue;
function actionIsDueSoon(a){
  if(!actionIsOpen(a) || actionIsOverdue(a)) return false;
  const days = (new Date(a.dueDate)-new Date(G.TODAY_ISO))/86400000;
  return days>=0 && days<=7;
}
G.actionIsDueSoon = actionIsDueSoon;
function actionIsCritical(a){ return actionIsOpen(a) && (a.priority==='Alta') && (actionIsOverdue(a) || actionIsDueSoon(a) || a.status==='En riesgo'); }
G.actionIsCritical = actionIsCritical;
function actionsSummary(companyId){
  const list = G.DB.consulting.actions.filter(a=>a.companyId===companyId);
  return {
    total: list.length,
    vencidas: list.filter(actionIsOverdue).length,
    proximasAVencer: list.filter(actionIsDueSoon).length,
    criticas: list.filter(actionIsCritical).length,
    completadas: list.filter(a=>a.status==='Completada').length,
  };
}
G.actionsSummary = actionsSummary;

/* ---------- Historia de Gestión ----------
   Línea de tiempo transversal: agrega diagnósticos, objetivos, acciones,
   reuniones, notas de consultoría y el registro de auditoría existente
   en un único historial ordenado por fecha. No duplica datos — lee
   directamente de las entidades ya existentes (DB.modoDiagnostics,
   DB.objectives, DB.consulting.*, DB.activityLog). */
const HISTORY_DEDUPE_ACTIONS = [
  'creó un nuevo objetivo estratégico',
  'creó una acción de consultoría',
  'registró una reunión de consultoría',
  'realizó un nuevo diagnóstico MODO',
];
function historyForCompany(companyId, opts){
  opts = opts || {};
  const events = [];

  G.DB.modoDiagnostics.filter(d=>d.companyId===companyId).forEach(d=>{
    const idx = G.computeModoIndex(d.scores, G.DB.modoWeights[companyId]);
    events.push({date:d.date, type:'diagnostico', icon:'activity',
      title:'Diagnóstico MODO realizado',
      desc:'Índice MODO: '+idx+'/100 ('+G.modoTier(idx).label+')'+(d.notes?' — '+d.notes:'')});
  });

  G.DB.consulting.diagnostics.filter(d=>d.companyId===companyId).forEach(d=>{
    events.push({date:d.date, type:'diagnostico', icon:'clipboard',
      title:'Diagnóstico FODA registrado',
      desc: d.priorityProblems || 'Se registró un diagnóstico FODA de la empresa.'});
  });

  G.DB.consulting.meetings.filter(m=>m.companyId===companyId).forEach(m=>{
    events.push({date:m.date, type:'reunion', icon:'users',
      title:'Reunión de consultoría',
      desc: m.topics + (m.agreements?' Acuerdos: '+m.agreements:'')});
  });

  G.DB.objectives.filter(o=>o.companyId===companyId).forEach(o=>{
    events.push({date:o.startDate, type:'objetivo', icon:'target',
      title:'Se creó el objetivo "'+o.name+'"',
      desc:(o.description?o.description+' ':'')+'Indicador: '+o.indicator+' · Meta: '+o.goal+' (estado actual: '+o.status+').'});
  });

  G.DB.consulting.actions.filter(a=>a.companyId===companyId).forEach(a=>{
    events.push({date:a.startDate, type:'accion', icon:'check-circle',
      title:'Se creó la acción "'+a.action+'"',
      desc:'Origen: '+(a.origin||'Manual')+' · Responsable: '+a.responsible+' · Estado actual: '+a.status+'.'});
  });

  if(opts.includePrivate){
    G.DB.consulting.notes.filter(n=>n.companyId===companyId).forEach(n=>{
      events.push({date:n.date, type:'nota', icon:'lock',
        title:'Nota privada del consultor',
        desc:n.text, private:true});
    });
  }

  G.DB.activityLog.filter(l=>l.companyId===companyId && !HISTORY_DEDUPE_ACTIONS.some(a=>l.action.startsWith(a))).forEach(l=>{
    events.push({date:l.date.slice(0,10), time:l.date, type:'cambio', icon:'edit',
      title:(l.userName?l.userName+' ':'')+l.action, desc: l.entity||''});
  });

  events.sort((a,b)=>{
    const ad = a.date||'', bd = b.date||'';
    if(ad!==bd) return ad.localeCompare(bd);
    return (a.time&&b.time) ? a.time.localeCompare(b.time) : 0;
  });
  return events;
}
G.historyForCompany = historyForCompany;

})();
</script>

<script>
/* ============================================================
   PART 7 — UI kit (kpi/badges/tables), Modal system, Login, App shell, Router
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml;

/* ============================================================
   Theme toggle
   ============================================================ */
function applyTheme(mode){
  const root = document.documentElement;
  if(mode==='light') root.setAttribute('data-theme','light');
  else if(mode==='dark') root.setAttribute('data-theme','dark');
  else root.removeAttribute('data-theme');
  try{ localStorage.setItem('gestiona_theme', mode); }catch(e){}
}
function cycleTheme(){
  let cur = 'system';
  try{ cur = localStorage.getItem('gestiona_theme') || 'system'; }catch(e){}
  const next = cur==='system' ? 'light' : cur==='light' ? 'dark' : 'system';
  applyTheme(next);
  refreshThemeIcon();
}
function refreshThemeIcon(){
  const btn = document.getElementById('themeToggleBtn');
  if(!btn) return;
  let cur='system'; try{ cur = localStorage.getItem('gestiona_theme')||'system'; }catch(e){}
  btn.innerHTML = icon(cur==='dark'?'moon':cur==='light'?'sun':'compass');
  btn.title = 'Tema: '+(cur==='dark'?'oscuro':cur==='light'?'claro':'automático')+' (clic para cambiar)';
}
G.ICONS = G.ICONS || {}; // ensure exists (sun/moon fallback below)
(function ensureThemeIcons(){
  // add minimal sun/moon icons to icon set if absent
  const I = document.createElement('div'); // no-op placeholder to keep IIFE valid
})();
try{ let cur = localStorage.getItem('gestiona_theme'); if(cur) applyTheme(cur); }catch(e){}
G.theme = {applyTheme, cycleTheme, refreshThemeIcon};

/* ============================================================
   UI kit: KPI cards, badges, empty states, headers
   ============================================================ */
const STATUS_LABEL = {good:'Bien', warning:'Atención', serious:'Atención', critical:'Crítico'};
function badge(level, label, opts){
  opts = opts||{};
  const cls = {good:'badge-good', warning:'badge-warning', serious:'badge-serious', critical:'badge-critical', neutral:'badge-neutral', accent:'badge-accent'}[level]||'badge-neutral';
  return '<span class="badge '+cls+'">'+(opts.dot!==false?'<span class="dot"></span>':'')+esc(label)+'</span>';
}
G.ui = G.ui || {};
G.ui.badge = badge;

G.ui.statusBadgeFor = function(kind, value){
  // generic mapper for common status strings used across modules
  const map = {
    'Activo':'good','Activa':'good','Cumplido':'good','Ganado':'good','Implementada':'good','Completada':'good',
    'Prospecto':'neutral','No iniciado':'neutral','Idea':'neutral','Pendiente':'neutral','Inactivo':'neutral','Baja':'neutral','Perdido':'critical',
    'En progreso':'accent','Contactado':'accent','Propuesta':'accent','Negociación':'accent','En desarrollo':'accent','En curso':'accent','Evaluación':'accent','Evaluada':'accent',
    'En riesgo':'warning', 'Pausada':'warning', 'Cancelada':'neutral',
  };
  return badge(map[value]||'neutral', value);
};

G.ui.kpiCard = function(opts){
  const deltaHtml = opts.delta!=null ? '<span class="kpi-delta '+(opts.delta>0.05?'up':opts.delta<-0.05?'down':'flat')+'">'+icon(opts.delta>0.05?'arrow-up':opts.delta<-0.05?'arrow-down':'arrow-right',null)+' '+Math.abs(opts.delta).toFixed(1)+'% vs. período anterior</span>' : (opts.deltaText? '<span class="kpi-delta '+(opts.deltaTone||'flat')+'">'+esc(opts.deltaText)+'</span>' : '');
  return '<div class="kpi-card">'+
    '<div class="kpi-label">'+(opts.icon?icon(opts.icon):'')+' '+esc(opts.label)+'</div>'+
    '<div class="kpi-value">'+opts.value+'</div>'+
    deltaHtml+
    (opts.spark ? '<div class="kpi-spark">'+G.charts.sparklineSvg(opts.spark, {color: opts.sparkColor})+'</div>' : '')+
    '</div>';
};

G.ui.emptyState = function(iconName, text, actionHtml){
  return '<div class="empty-state">'+icon(iconName||'info','icon')+'<div>'+esc(text)+'</div>'+(actionHtml||'')+'</div>';
};

G.ui.pageHeader = function(title, desc, actionsHtml){
  return '<div class="page-head"><div><h1 class="page-title">'+esc(title)+'</h1>'+(desc?'<p class="page-desc">'+desc+'</p>':'')+'</div>'+(actionsHtml?'<div class="page-actions">'+actionsHtml+'</div>':'')+'</div>';
};

G.ui.infoCallout = function(text){
  return '<div class="info-callout">'+icon('info')+'<div>'+text+'</div></div>';
};

G.ui.card = function(title, sub, innerHtml, headExtra){
  return '<div class="card"><div class="card-head"><div><div class="card-title">'+esc(title)+'</div>'+(sub?'<div class="card-sub">'+esc(sub)+'</div>':'')+'</div>'+(headExtra||'')+'</div>'+innerHtml+'</div>';
};

/* ---------- Logo de empresa ----------
   El logo (si se cargó uno) se guarda como imagen en base64 dentro de
   G.DB.companyLogos[companyId] -- viaja como parte de los datos operativos de
   la empresa (mismo mecanismo de guardado que el resto, sin columna nueva en
   la base). Si no hay logo cargado, se sigue mostrando el círculo de color
   con las iniciales de siempre. */
G.companyLogoUrl = function(companyId){
  return (G.DB && G.DB.companyLogos && G.DB.companyLogos[companyId]) || '';
};
G.ui.companyLogoHtml = function(company, opts){
  opts = opts||{};
  const size = opts.size||42, fontSize = opts.fontSize||15;
  const sizeStyle = 'width:'+size+'px;height:'+size+'px;font-size:'+fontSize+'px;';
  const url = G.companyLogoUrl(company.id);
  if(url) return '<div class="company-logo" style="'+sizeStyle+'background:#fff;padding:2px;overflow:hidden"><img src="'+esc(url)+'" style="width:100%;height:100%;object-fit:contain;border-radius:8px"/></div>';
  return '<div class="company-logo" style="'+sizeStyle+'background:'+esc(company.logoColor||'#2a78d6')+'">'+esc(company.initials||'')+'</div>';
};

G.ui.progressBar = function(pct, tone){
  const p = Math.max(0,Math.min(100,pct));
  return '<div class="progress-track"><div class="progress-fill '+(tone||'')+'" style="width:'+p+'%"></div></div>';
};

/* ---------- Imprimir / Descargar PDF ----------
   Un solo botón reutilizable: llama a window.print(), que en cualquier
   navegador (computadora o celular) deja elegir una impresora O "Guardar como
   PDF" -- cubre los dos pedidos con un solo mecanismo, sin sumar una librería
   nueva. El botón lleva "no-print" para no aparecer él mismo en el resultado;
   el resto de la interfaz (menú lateral, barra superior, botones) se oculta
   vía la hoja de estilos @media print. Un solo listener delegado en document
   alcanza para cualquier botón con data-print-btn en toda la app, sin tener
   que cablear un click handler por página. */
G.ui.printBtn = function(label){
  return '<button type="button" class="btn btn-sm no-print" data-print-btn>'+icon('printer')+' '+esc(label||'Imprimir / PDF')+'</button>';
};
document.addEventListener('click', function(e){
  if(e.target.closest('[data-print-btn]')) window.print();
});

/* ---------- Marca: toggle-switch ("MODO") ---------- */
G.ui.toggleMarkHtml = function(emHeight){
  return '<span class="toggle-mark" style="height:'+(emHeight||0.6)+'em"><span class="toggle-mark-dot"></span></span>';
};
// Lockup completo "MODO<toggle> / SUBPALABRA", usado en espacios prominentes (login).
G.ui.brandLockupHtml = function(px, opts){
  opts = opts||{};
  const wordColor = opts.dark ? '#fff' : 'var(--text-primary)';
  const subColor = opts.subColor || 'var(--brand-orange, var(--accent))';
  return '<div class="brand-lockup" style="font-size:'+px+'px">'+
    '<span class="brand-word" style="color:'+wordColor+'">MODO'+G.ui.toggleMarkHtml(0.6)+'</span>'+
    '<span class="brand-subword" style="color:'+subColor+';font-size:0.52em">'+(opts.sub||'GESTIÓN')+'</span>'+
  '</div>';
};
// Marca compacta (solo ícono), para espacios chicos como la barra lateral.
G.ui.compactMarkHtml = function(px, cls){
  return '<div class="'+(cls||'brand-mark')+'" style="width:'+px+'px;height:'+px+'px;font-size:'+px+'px">'+G.ui.toggleMarkHtml(0.46)+'</div>';
};

/* ============================================================
   Modal system
   ============================================================ */
let modalStack = [];
function closeModal(){
  const top = modalStack.pop();
  if(top && top.overlay) top.overlay.remove();
}
function openModal(innerHtml, opts){
  opts = opts||{};
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal '+(opts.wide?'wide':'')+'">'+innerHtml+'</div>';
  overlay.addEventListener('mousedown', e=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
  modalStack.push({overlay});
  return overlay;
}
G.modal = {close: closeModal, open: openModal};

G.modal.confirm = function(opts){
  const overlay = openModal(
    '<div class="modal-head"><h3>'+esc(opts.title||'Confirmar')+'</h3><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<div class="modal-body"><p class="muted">'+ (opts.desc||'') +'</p></div>'+
    '<div class="modal-foot"><button class="btn" data-close>Cancelar</button><button class="btn '+(opts.danger?'btn-danger':'btn-primary')+'" id="modalConfirmBtn">'+esc(opts.confirmLabel||'Confirmar')+'</button></div>'
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  overlay.querySelector('#modalConfirmBtn').addEventListener('click', ()=>{ closeModal(); opts.onConfirm && opts.onConfirm(); });
};

// Generic field-driven form modal. fields: [{key,label,type,options,required,placeholder,hint,step,value,rows,fullWidth}]
G.modal.form = function(opts){
  const initial = opts.initial || {};
  function fieldHtml(f){
    const val = initial[f.key]!=null ? initial[f.key] : (f.value!=null?f.value:'');
    const req = f.required ? 'required' : '';
    let input;
    if(f.type==='select'){
      input = '<select name="'+f.key+'" '+req+' '+(f.onChangeKey?('data-watch="'+f.onChangeKey+'"'):'')+'>'+
        (f.placeholder?'<option value="">'+esc(f.placeholder)+'</option>':'')+
        (f.options||[]).map(o=>{
          const ov = typeof o==='object' ? o.value : o;
          const ol = typeof o==='object' ? o.label : o;
          return '<option value="'+esc(ov)+'" '+(String(val)===String(ov)?'selected':'')+'>'+esc(ol)+'</option>';
        }).join('')+'</select>';
    } else if(f.type==='textarea'){
      input = '<textarea name="'+f.key+'" '+req+' rows="'+(f.rows||3)+'" placeholder="'+esc(f.placeholder||'')+'">'+esc(val)+'</textarea>';
    } else if(f.type==='checkbox'){
      input = '<label class="checkline"><input type="checkbox" name="'+f.key+'" '+(val?'checked':'')+'/> '+esc(f.checkLabel||'')+'</label>';
    } else {
      input = '<input type="'+(f.type||'text')+'" name="'+f.key+'" '+req+' '+(f.step?'step="'+f.step+'"':'')+' placeholder="'+esc(f.placeholder||'')+'" value="'+esc(val)+'"/>';
    }
    return '<div class="field" style="'+(f.fullWidth?'grid-column:1/-1':'')+'"><label>'+esc(f.label)+(f.required?' *':'')+'</label>'+input+(f.hint?'<div class="hint">'+f.hint+'</div>':'')+'</div>';
  }
  const gridFields = opts.fields.filter(f=>f.type!=='textarea' && !f.fullWidth);
  const soloFields = opts.fields.filter(f=>f.type==='textarea' || f.fullWidth);
  const bodyHtml = '<div class="form-grid'+(opts.cols3?' cols-3':'')+'">'+gridFields.map(fieldHtml).join('')+'</div>'+
    soloFields.map(fieldHtml).join('');
  const overlay = openModal(
    '<div class="modal-head"><div><h3>'+esc(opts.title)+'</h3>'+(opts.subtitle?'<div class="card-sub">'+esc(opts.subtitle)+'</div>':'')+'</div><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<form id="genericForm"><div class="modal-body">'+(opts.note?G.ui.infoCallout(opts.note):'')+bodyHtml+'<div id="formError" style="display:none;color:var(--critical);font-size:12.5px;font-weight:600;"></div></div>'+
    '<div class="modal-foot">'+(opts.onDelete?'<button type="button" class="btn btn-danger" id="modalDeleteBtn" style="margin-right:auto">'+icon('trash')+' Eliminar</button>':'')+'<button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn btn-primary">'+esc(opts.submitLabel||'Guardar')+'</button></div></form>',
    {wide: opts.wide}
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeModal));
  if(opts.onDelete){
    overlay.querySelector('#modalDeleteBtn').addEventListener('click', ()=>{
      closeModal();
      G.modal.confirm({title:'Eliminar registro', desc:'Esta acción no se puede deshacer. ¿Confirmás que querés eliminarlo?', danger:true, confirmLabel:'Eliminar', onConfirm: opts.onDelete});
    });
  }
  const form = overlay.querySelector('#genericForm');
  // onSubmit puede ser síncrono (como antes) o devolver una Promise (para los
  // formularios que ahora llaman a la API en vez de mutar G.DB directamente) --
  // en ambos casos el botón se deshabilita mientras se resuelve y el modal
  // solo se cierra si no se devolvió `false` ni se lanzó/rechazó un error.
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const fd = new FormData(form);
    const values = {};
    opts.fields.forEach(f=>{
      if(f.type==='checkbox'){ values[f.key] = form.elements[f.key].checked; return; }
      let v = fd.get(f.key);
      if(f.type==='number') v = v===''||v==null ? 0 : parseFloat(v);
      values[f.key] = v;
    });
    const errEl = overlay.querySelector('#formError');
    const submitBtn = form.querySelector('button[type="submit"]');
    errEl.style.display = 'none';
    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = 'Guardando…';
    try{
      const ok = await opts.onSubmit(values);
      if(ok===false){
        errEl.textContent = opts.errorMessage||'Revisá los datos ingresados.'; errEl.style.display='block';
        submitBtn.disabled = false; submitBtn.textContent = originalLabel;
        return;
      }
      closeModal();
    }catch(err){
      console.error(err);
      errEl.textContent = (err && err.message) ? err.message : 'Ocurrió un error al guardar.';
      errEl.style.display='block';
      submitBtn.disabled = false; submitBtn.textContent = originalLabel;
    }
  });
  // basic dependent-field watchers
  overlay.querySelectorAll('[data-watch]').forEach(sel=>{
    sel.addEventListener('change', ()=>{ opts.onFieldChange && opts.onFieldChange(sel.name, sel.value, form); });
  });
  return overlay;
};

/* ============================================================
   Login screen
   ============================================================ */
// Expuesta en G porque G.initApp() (definida en otro bloque <script> / otra
// función auto-invocada, con su propio scope) la necesita para el caso "sin
// sesión" (401 de /api/bootstrap) -- una function declaration de nivel superior
// dentro de un IIFE no queda visible fuera de ese IIFE aunque ambos compartan
// el objeto global G.
function renderLogin(){
  const app = document.getElementById('app');
  const hc = Object.assign({}, G.DEFAULT_HOME_CONTENT, (G.DB && G.DB.homeContent)||{});
  app.innerHTML =
  '<div class="login-screen">'+
    '<div class="login-side hide-mobile">'+
      '<div>'+
        G.ui.brandLockupHtml(32, {dark:true})+
        '<div class="brand-sub" style="color:rgba(255,255,255,.6);margin-top:9px">'+esc(hc.tagline)+'</div>'+
      '</div>'+
      '<div class="login-quote">'+esc(hc.quoteTitle)+' <span>'+esc(hc.quoteSub)+'</span></div>'+
      (hc.heroImage ? '<img src="'+hc.heroImage+'" style="max-width:100%;max-height:200px;border-radius:14px;object-fit:cover;box-shadow:0 12px 30px rgba(0,0,0,.35)"/>' : '')+
      '<div style="display:flex;flex-direction:column;gap:14px;color:rgba(255,255,255,.85);font-size:12.8px;max-width:420px">'+
        (hc.features||[]).map(f=>loginFeature(f.icon||'sparkles', f.title, f.desc)).join('')+
      '</div>'+
    '</div>'+
    '<div class="login-form-wrap">'+
      '<div class="login-card">'+
        '<div style="margin-bottom:14px">'+G.ui.brandLockupHtml(24, {dark:false})+'</div>'+
        '<form id="loginForm">'+
          '<div class="field"><label>Email</label><input type="email" name="email" required autocomplete="username"/></div>'+
          '<div class="field" style="margin-top:10px"><label>Contraseña</label><input type="password" name="password" required autocomplete="current-password"/></div>'+
          '<div id="loginError" style="display:none;color:var(--critical);font-size:12.5px;font-weight:600;margin-top:10px"></div>'+
          '<button type="submit" class="btn btn-primary" style="margin-top:16px;width:100%" id="loginSubmitBtn">Ingresar</button>'+
        '</form>'+
      '</div>'+
    '</div>'+
  '</div>';
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async e=>{
    e.preventDefault();
    const btn = document.getElementById('loginSubmitBtn');
    const errEl = document.getElementById('loginError');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Ingresando…';
    const fd = new FormData(form);
    try{
      const ok = await G.auth.login(fd.get('email'), fd.get('password'));
      if(!ok){
        errEl.textContent = 'Email o contraseña incorrectos.'; errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Ingresar';
        return;
      }
      G.toast('Bienvenido/a, '+G.currentUser.name.split(' ')[0]);
      await G.initApp();
    }catch(err){
      console.error(err);
      errEl.textContent = 'No se pudo conectar con el servidor. Probá de nuevo.'; errEl.style.display = 'block';
      btn.disabled = false; btn.textContent = 'Ingresar';
    }
  });
}
G.renderLogin = renderLogin;
function loginFeature(iconName, title, desc){
  return '<div class="flex gap-sm" style="align-items:flex-start"><div style="width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:none">'+icon(iconName)+'</div><div><b style="color:#fff;font-size:13px">'+esc(title)+'</b><br>'+esc(desc)+'</div></div>';
}
function initialsOf(name){ return (name||'').split(' ').filter(Boolean).slice(0,2).map(s=>s[0]).join('').toUpperCase(); }
G.initialsOf = initialsOf;

/* ============================================================
   Router
   ============================================================ */
function defaultRouteFor(user){
  if(user.role==='SUPER_ADMIN'){
    return G.session.viewingCompanyId ? ('company/'+G.session.viewingCompanyId+'/dashboard') : 'dashboard';
  }
  return 'company/'+user.companyId+'/dashboard';
}
G.defaultRouteFor = defaultRouteFor;

function parseHash(){
  let h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('/').filter(Boolean);
  if(!parts.length) return {top:'dashboard'};
  if(parts[0]==='company') return {top:'company', companyId:parts[1], module:parts[2]||'dashboard', tab:parts[3]||null};
  if(parts[0]==='admin') return {top:'admin', sub:parts[1]||'usuarios'};
  return {top:parts[0], tab:parts[1]||null};
}
function navigate(path){
  if(location.hash === '#/'+path){ G.render(); }
  else location.hash = '#/'+path;
}
G.navigate = navigate;

window.addEventListener('hashchange', ()=> G.render());

function render(){
  const user = G.auth.currentUser();
  if(!user){ renderLogin(); return; }
  let route = parseHash();

  if((route.top==='empresas' || route.top==='admin' || route.top==='dashboard') && user.role!=='SUPER_ADMIN'){
    navigate(defaultRouteFor(user)); return;
  }
  let company = null;
  if(route.top==='company'){
    company = G.DB.companies.find(c=>c.id===route.companyId);
    if(!company){ navigate(defaultRouteFor(user)); return; }
    if(user.role!=='SUPER_ADMIN' && user.companyId!==company.id){ navigate(defaultRouteFor(user)); return; }
    if(user.role==='SUPER_ADMIN' && G.session.viewingCompanyId!==company.id){
      G.session.viewingCompanyId = company.id;
    }
    if(!G.perm.userCanSeeModule(user, company, route.module) && route.module!=='dashboard' && route.module!=='perfil' && route.module!=='configuracion'){
      navigate('company/'+company.id+'/dashboard'); return;
    }
  }
  G.route = route;
  renderShell(user, company, route);
}
G.render = render;

/* ============================================================
   App shell (sidebar + topbar + content)
   ============================================================ */
function navGroupsFor(user, company){
  if(!company){
    // global consultant-level nav
    return [{label:'Consultoría', items:[
      {key:'dashboard', label:'Dashboard general', icon:'grid', path:'dashboard'},
      {key:'empresas', label:'Empresas', icon:'building2', path:'empresas'},
    ]},{label:'Sistema', items:[
      {key:'usuarios', label:'Usuarios y permisos', icon:'user-cog', path:'admin/usuarios'},
      {key:'configuracion', label:'Configuración general', icon:'settings', path:'admin/configuracion'},
    ]}];
  }
  const groups = {};
  G.MODULES.forEach(m=>{
    if(!G.perm.userCanSeeModule(user, company, m.key)) return;
    const g = m.group||'Gestión';
    groups[g] = groups[g]||[];
    groups[g].push({key:m.key, label:m.label, icon:m.icon, path:'company/'+company.id+'/'+m.key});
  });
  const order = ['Gestión','Estrategia','Sistema'];
  const out = order.filter(g=>groups[g]).map(g=>({label:g, items:groups[g]}));
  if(user.role!=='USUARIO_EMPRESA'){
    out.push({label:'Empresa', items:[
      {key:'perfil', label:'Perfil de empresa', icon:'building', path:'company/'+company.id+'/perfil'},
      {key:'configuracion', label:'Configuración', icon:'settings', path:'company/'+company.id+'/configuracion'},
    ]});
  }
  return out;
}

function renderShell(user, company, route){
  const app = document.getElementById('app');
  const isSuper = user.role==='SUPER_ADMIN';
  const groups = navGroupsFor(user, company);
  const activeKey = company ? route.module : route.top;

  const crumbParts = [];
  if(company){
    crumbParts.push(isSuper ? '<a data-nav="empresas">Empresas</a>' : company.name);
    crumbParts.push('<b>'+esc(company.name)+'</b>');
    const mod = G.moduleByKey(route.module);
    if(mod && route.module!=='dashboard') crumbParts.push(esc(mod.label));
  } else {
    crumbParts.push('<b>'+(route.top==='empresas'?'Empresas':route.top==='admin'?'Administración':'Dashboard general')+'</b>');
  }

  const alertCount = company ? G.alertsForCompany(company.id).filter(a=>a.level!=='good').length : G.globalKPIs('mes').totalAlertas;

  app.innerHTML =
  '<div class="app-shell">'+
    '<aside class="sidebar" id="sidebarEl">'+
      '<div class="brand">'+G.ui.compactMarkHtml(34)+'<div><div class="brand-text">MODO Gestión</div><div class="brand-sub">Software + método + profesionales</div></div></div>'+
      (isSuper ? ('<div class="workspace-switch" data-nav="'+(company?('company/'+company.id+'/dashboard'):'empresas')+'">'+
        '<div class="ws-label">'+(company?'Espacio de trabajo':'Consultor')+'</div>'+
        '<div class="ws-name">'+esc(company?company.name:'Todas las empresas')+' '+icon('chevron-down','subtle')+'</div></div>') : '')+
      '<nav class="nav-scroll">'+groups.map(g=>
        '<div class="nav-group"><div class="nav-group-label">'+esc(g.label)+'</div><ul>'+
          g.items.map(it=>'<li class="nav-item '+(it.key===activeKey?'active':'')+'" data-nav="'+it.path+'">'+icon(it.icon)+'<span>'+esc(it.label)+'</span>'+(it.key==='dashboard' && alertCount>0 ? '<span class="nav-badge">'+alertCount+'</span>':'')+'</li>').join('')+
        '</ul></div>'
      ).join('')+'</nav>'+
      (isSuper && company ? '<div class="consultant-flag">'+icon('shield-check')+'<div>Estás dentro del espacio de <b>'+esc(company.name)+'</b> como consultor.</div></div>' : '')+
      '<div class="sidebar-foot"><button class="btn btn-ghost w-full" id="logoutBtn" style="justify-content:flex-start">'+icon('log-out')+' Cerrar sesión</button></div>'+
    '</aside>'+
    '<div class="flex-col grow" style="min-width:0">'+
      (isSuper && company ? '<div class="consultant-strip"><span>'+icon('eye')+'</span><span>Modo consultor — viendo el espacio de <b>'+esc(company.name)+'</b></span><button data-nav="empresas" style="margin-left:auto">Volver a Empresas</button></div>' : '')+
      '<header class="topbar">'+
        '<button class="icon-btn hamburger" id="hamburgerBtn">'+icon('grid')+'</button>'+
        '<div class="crumb">'+crumbParts.join('<span class="subtle">/</span>')+'</div>'+
        '<div class="topbar-actions">'+
          '<button class="icon-btn" id="themeToggleBtn" title="Cambiar tema"></button>'+
          '<button class="icon-btn" id="bellBtn" style="position:relative;overflow:visible">'+icon('bell')+(alertCount>0?'<span class="nav-badge" style="position:absolute;top:-6px;right:-6px;min-width:16px;text-align:center">'+alertCount+'</span>':'')+'</button>'+
          '<div class="user-chip" id="userChip"><span class="avatar">'+esc(initialsOf(user.name))+'</span><span class="who"><span class="name">'+esc(user.name)+'</span><br><span class="role">'+esc(G.ROLES[user.role].label)+'</span></span>'+icon('chevron-down','subtle')+'</div>'+
        '</div>'+
      '</header>'+
      '<main class="content" id="contentEl"></main>'+
    '</div>'+
  '</div>';

  app.querySelectorAll('[data-nav]').forEach(el=> el.addEventListener('click', ()=> navigate(el.getAttribute('data-nav'))));
  const logoutBtn = document.getElementById('logoutBtn');
  if(logoutBtn) logoutBtn.addEventListener('click', async ()=>{ await G.auth.logout(); location.hash=''; await G.initApp(); });
  G.theme.refreshThemeIcon();
  document.getElementById('themeToggleBtn').addEventListener('click', G.theme.cycleTheme);
  document.getElementById('bellBtn').addEventListener('click', ()=> showAlertsDropdown(company));
  document.getElementById('userChip').addEventListener('click', ()=> showUserMenu(user));
  const hb = document.getElementById('hamburgerBtn');
  if(hb) hb.addEventListener('click', ()=>{ document.getElementById('sidebarEl').classList.toggle('open'); document.getElementById('sidebarScrim').classList.toggle('show'); });
  const scrim = document.getElementById('sidebarScrim');
  scrim.onclick = ()=>{ document.getElementById('sidebarEl').classList.remove('open'); scrim.classList.remove('show'); };

  const contentEl = document.getElementById('contentEl');
  renderPage(contentEl, user, company, route);
}

function showAlertsDropdown(company){
  const list = company ? G.alertsForCompany(company.id) : G.DB.companies.flatMap(c=>G.alertsForCompany(c.id).map(a=>Object.assign({},a,{companyName:c.name})));
  const overlay = G.modal.open(
    '<div class="modal-head"><h3>Alertas'+(company?(' — '+esc(company.name)):' — todas las empresas')+'</h3><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<div class="modal-body">'+(list.length? list.slice(0,12).map(a=>alertRowHtml(a)).join('') : G.ui.emptyState('check-circle','No hay alertas activas.'))+'</div>'
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', G.modal.close));
}
function alertRowHtml(a){
  return '<div class="alert-row"><div class="alert-icon '+(a.level==='critical'?'critical':a.level==='good'?'good':'warning')+'">'+icon(a.level==='critical'?'alert-triangle':a.level==='good'?'check-circle':'alert-triangle')+'</div>'+
    '<div><div class="alert-title">'+esc(a.title)+(a.companyName?' · <span class="subtle" style="font-weight:600">'+esc(a.companyName)+'</span>':'')+'</div><div class="alert-desc">'+esc(a.desc)+'</div></div></div>';
}
G.alertRowHtml = alertRowHtml;

function showUserMenu(user){
  const overlay = G.modal.open(
    '<div class="modal-head"><h3>'+esc(user.name)+'</h3><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<div class="modal-body">'+
      '<div class="flex items-center gap-sm"><span class="avatar lg">'+esc(initialsOf(user.name))+'</span><div><b>'+esc(user.name)+'</b><br><span class="muted" style="font-size:12.5px">'+esc(user.email)+'</span><br>'+G.ui.badge('accent', G.ROLES[user.role].label)+'</div></div>'+
      G.ui.infoCallout('Este es un entorno de demostración: podés cerrar sesión y volver a entrar con cualquiera de los usuarios de ejemplo para probar los distintos roles y permisos.')+
    '</div>'+
    '<div class="modal-foot"><button class="btn" data-close>Cerrar</button><button class="btn btn-danger" id="menuLogout">'+icon('log-out')+' Cerrar sesión</button></div>'
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', G.modal.close));
  overlay.querySelector('#menuLogout').addEventListener('click', async ()=>{ G.modal.close(); await G.auth.logout(); location.hash=''; await G.initApp(); });
}

/* ---------- Page dispatch ---------- */
G.pages = {}; // populated by later parts: {key: function(el,user,company,route)}
function renderPage(el, user, company, route){
  let key = company ? route.module : (route.top==='dashboard' ? 'dashboardGlobal' : route.top);
  if(key==='admin') key = 'admin_'+route.sub;
  const pageFn = G.pages[key];
  if(pageFn){
    try{ pageFn(el, user, company, route); }
    catch(err){
      console.error(err);
      el.innerHTML = G.ui.pageHeader('Ocurrió un error', 'No se pudo cargar esta sección.')+'<div class="card"><pre class="mono" style="white-space:pre-wrap;font-size:11.5px">'+esc(err.stack||err.message)+'</pre></div>';
    }
  } else {
    el.innerHTML = G.ui.pageHeader('Próximamente', 'Esta sección está en construcción.')+G.ui.emptyState('layers','Este módulo se está preparando.');
  }
}

})();
</script>

<script>
/* ============================================================
   PART 8 — Empresas (multiempresa) + Dashboard general del consultor
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

/* ---------- Empresas ---------- */
function companyCardHtml(c){
  const alerts = G.alertsForCompany(c.id).filter(a=>a.level!=='good');
  const health = G.companyHealthLevel(c.id);
  const kpi = G.companyKPIs(c.id, 'mes');
  return '<div class="company-card" data-open="'+c.id+'">'+
    '<div class="flex justify-between" style="align-items:flex-start">'+

      ui.statusBadgeFor('status', c.status)+
    '</div>'+
    '<div style="margin-top:12px"><div class="card-title" style="font-size:15.5px">'+esc(c.name)+'</div><div class="card-sub">'+esc(c.cuit)+' · '+esc(c.activity)+'</div></div>'+
    '<div class="company-meta">'+
      '<span>'+icon('user-cog','subtle')+' Responsable: '+esc(c.responsible)+'</span>'+
      '<span>'+icon('calendar','subtle')+' Actualizado '+fmt.timeAgo(c.lastUpdated)+'</span>'+
    '</div>'+
    '<div style="margin-top:12px"><div class="flex justify-between" style="font-size:11px" class="subtle"><span class="subtle">Avance de gestión</span><span class="mono subtle">'+c.managementProgress+'%</span></div>'+ui.progressBar(c.managementProgress, c.managementProgress<60?'warning':'good')+'</div>'+
    '<div class="mini-kpis">'+

    '</div>'+

    '</div>'+

}

function openCompanyForm(existing){
  const isEdit = !!existing;
  G.modal.form({
    title: isEdit ? 'Editar empresa' : 'Nueva empresa',
    subtitle: isEdit ? existing.name : 'Se creará un espacio de trabajo independiente para esta empresa.',
    submitLabel: isEdit ? 'Guardar cambios' : 'Crear empresa',
    wide:true,
    initial: existing || {status:'Activa'},
    onDelete: isEdit ? async ()=>{
      let res, body;
      try{
        res = await fetch('/api/companies/'+existing.id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status:'Pausada'})});
        body = await res.json().catch(()=>({}));
      }catch(err){ G.toast('No se pudo conectar con el servidor.'); return; }
      if(!res.ok){ G.toast('No se pudo desactivar la empresa.'); return; }
      Object.assign(existing, body.company);
      G.logActivity('desactivó la empresa', existing.name, existing.id);
      G.toast('Empresa desactivada'); G.render();
    } : null,
    fields:[
      {key:'name', label:'Nombre comercial', required:true, placeholder:'Ej: Alfa Servicios'},
      {key:'legalName', label:'Razón social', required:true, placeholder:'Ej: Alfa S.R.L.'},
      {key:'cuit', label:'CUIT', required:true, placeholder:'30-00000000-0'},
      {key:'activity', label:'Actividad', required:true, placeholder:'Ej: Comercio minorista'},
      {key:'sector', label:'Rubro / Sector', type:'select', required:true, options: G.sectorOptionsList()},
      {key:'city', label:'Localidad', required:true, placeholder:'Ciudad, Provincia'},
      {key:'founded', label:'Año de fundación', type:'number', placeholder:'2020'},
      {key:'responsible', label:'Responsable / Contacto', required:true, placeholder:'Nombre y apellido'},
      {key:'website', label:'Sitio web', placeholder:'www.empresa.com.ar'},
      {key:'status', label:'Estado', type:'select', options:['Activa','Pausada'], required:true},
    ],
    async onSubmit(v){
      if(isEdit){
        let res, body;
        try{
          res = await fetch('/api/companies/'+existing.id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(v)});
          body = await res.json().catch(()=>({}));
        }catch(err){ throw new Error('No se pudo conectar con el servidor. Probá de nuevo.'); }
        if(!res.ok){
          if(res.status===403) throw new Error('No tenés permiso para editar esta empresa.');
          throw new Error('No se pudo guardar la empresa.');
        }
        Object.assign(existing, body.company);
        G.toast('Empresa actualizada.'+G.autoModulesToastMsg(body.autoEnabledModules));
        G.logActivity('actualizó los datos de la empresa', existing.name, existing.id);
      } else {
        let res, body;
        try{
          res = await fetch('/api/companies', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(v)});
          body = await res.json().catch(()=>({}));
        }catch(err){ throw new Error('No se pudo conectar con el servidor. Probá de nuevo.'); }
        if(!res.ok){
          if(res.status===403) throw new Error('No tenés permiso para crear empresas.');
          throw new Error('No se pudo crear la empresa.');
        }
        const company = body.company;
        G.DB.companies.push(company);
        G.DB.financeCategories[company.id] = {income: G.DEFAULT_INCOME_CATEGORIES.slice(), expense: G.DEFAULT_EXPENSE_CATEGORIES.slice()};
        G.logActivity('creó una nueva empresa', company.name, company.id);
        G.toast('Empresa creada.'+G.autoModulesToastMsg(body.autoEnabledModules)+' Activá el resto de sus módulos desde Configuración.');
      }
      G.render();
    }
  });
}
