}

})();
</script>

<script>
/* ============================================================
   PART 20 — Carga ágil por voz o texto
   Modal genérico reutilizable desde Finanzas (ingresos/egresos),
   Innovación (ideas) y Consultoría (reuniones): la persona dicta
   o escribe libremente, el sistema interpreta el texto y
   pre-completa el formulario estructurado correspondiente, pero
   SIEMPRE se revisa y confirma antes de guardar — la carga rápida
   sugiere, la persona decide (mismo principio que MODO Copiloto).
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, esc = G.util.escapeHtml, ui = G.ui;

const QC_TYPES = [
  {key:'income', label:'Ingreso', module:'finanzas',
    placeholder:'Ej: "Cobré 350 mil pesos por transferencia a la Ferretería Cortez, categoría ventas, hoy"'},
  {key:'expense', label:'Egreso', module:'finanzas',
    placeholder:'Ej: "Pagué 120 mil pesos de alquiler en efectivo ayer"'},
  {key:'idea', label:'Idea / iniciativa', module:'innovacion',
    placeholder:'Ej: "Idea: armar un combo de productos para el día de la madre, prioridad alta"'},
  {key:'meeting', label:'Reunión', module:'consultoria',
    placeholder:'Ej: "Reunión de hoy con Diego y Carla: vimos el plan de acción de costos, quedó pendiente revisar precios, la próxima es el 10 de septiembre"'},
  {key:'agroTask', label:'Tarea de campo (agro)', module:'agro',
    placeholder:'Ej: "Hoy sembré soja en el lote Norte" · "Regué el lote 3, 2 horas" · "Compré 50 bolsas de fertilizante para el lote Sur, costó 300 mil"'},
];

function speechSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function makeRecognizer(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  const r = new Ctor();
  r.lang = 'es-AR'; r.continuous = true; r.interimResults = true;
  return r;
}

/* ---------- Heurísticas de interpretación (texto libre -> campos) ---------- */
function isoOf(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parseAmount(text){
  const m = text.match(/\$?\s?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)\s*(mil|millones|millón|k)?/i);
  if(!m) return 0;
  let raw = m[1];
  if(/^\d+,\d{3}$/.test(raw)) raw = raw.replace(',', ''); // "1,234" -> miles
  else raw = raw.replace(/\./g,'').replace(',', '.');
  let val = parseFloat(raw)||0;
  const mult = (m[2]||'').toLowerCase();
  if(mult==='mil' || mult==='k') val *= 1000;
  else if(mult==='millón' || mult==='millones') val *= 1000000;
  return val;
}
function parseDate(text, todayISO){
  const t = text.toLowerCase();
  const d = new Date(todayISO+'T00:00:00');
  if(/\banteayer\b/.test(t)){ d.setDate(d.getDate()-2); return isoOf(d); }
  if(/\bayer\b/.test(t)){ d.setDate(d.getDate()-1); return isoOf(d); }
  if(/\bhoy\b/.test(t)) return todayISO;
  if(/\bmañana\b/.test(t)){ d.setDate(d.getDate()+1); return isoOf(d); }
  const months = {enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,setiembre:8,octubre:9,noviembre:10,diciembre:11};
  const m2 = t.match(/(\d{1,2})\s*(?:de)?\s*(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|setiembre|octubre|noviembre|diciembre)/);
  if(m2) return isoOf(new Date(d.getFullYear(), months[m2[2]], parseInt(m2[1],10)));
  const m3 = t.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
  if(m3){
    const yr = m3[3] ? (m3[3].length===2?2000+parseInt(m3[3],10):parseInt(m3[3],10)) : d.getFullYear();
    return isoOf(new Date(yr, parseInt(m3[2],10)-1, parseInt(m3[1],10)));
  }
  return todayISO;
}
function bestCategoryMatch(text, categories){
  const t = text.toLowerCase();
  let best = null;
  (categories||[]).forEach(c=>{ if(t.includes(c.toLowerCase())) best = c; });
  return best;
}
function parsePriority(text){
  const t = text.toLowerCase();
  if(/urgente|prioridad alta|muy importante/.test(t)) return 'Alta';
  if(/prioridad baja|no urgente|poco urgente/.test(t)) return 'Baja';
  return 'Media';
}
function parsePartyName(text){
  const m = text.match(/(?:a|de|del|para)\s+(?:la\s+|el\s+)?([A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑñ.]*(?:\s+[A-ZÁÉÍÓÚÑ][\wÁÉÍÓÚÑñ.]*){0,3})/);
  return m ? m[1].trim() : '';
}
function parseMethod(text){
  const t = text.toLowerCase();
  if(/efectivo/.test(t)) return 'Efectivo';
  if(/tarjeta de cr[eé]dito/.test(t)) return 'Tarjeta de crédito';
  if(/tarjeta de d[eé]bito/.test(t)) return 'Tarjeta de débito';
  if(/d[eé]bito autom[aá]tico/.test(t)) return 'Débito automático';
  if(/cheque/.test(t)) return 'Cheque';
  return 'Transferencia';
}
function bestLotMatch(text, lots){
  const t = text.toLowerCase();
  let best = null;
  (lots||[]).forEach(l=>{ if(l.name && t.includes(l.name.toLowerCase())) best = l.id; });
  return best;
}
function parseAgroTaskType(text){
  const t = text.toLowerCase();
  if(/siembr|sembr/.test(t)) return 'Siembra';
  if(/rieg|regu[eé]|regar/.test(t)) return 'Riego';
  if(/monitor/.test(t)) return 'Monitoreo';
  if(/fumig|fitosanitario|agroqu[ií]mico/.test(t)) return 'Fumigación';
  if(/fertiliz|abon/.test(t)) return 'Fertilización';
  if(/cosech/.test(t)) return 'Cosecha';
  if(/avance|estado del cultivo|desarrollo del cultivo/.test(t)) return 'Avance de cultivo';
  return 'Otro';
}
function parseAgroInput(text){
  const m = text.match(/(\d+(?:[.,]\d+)?)\s*(bolsas?|kg|kilos?|litros?|lts?|l\b|hs\b|horas?|toneladas?|ton\b)\s*(?:de\s+)?([a-záéíóúñ][a-záéíóúñ\s]{2,30})?/i);
  if(!m) return {inputQty:'', inputUnit:'', inputName:''};
  return {inputQty: parseFloat(m[1].replace(',','.'))||'', inputUnit: m[2], inputName: (m[3]||'').trim()};
}
function parseQuickEntry(type, text, ctx){
  text = (text||'').trim();
  if(type==='income' || type==='expense'){
    const isIncome = type==='income';
    const cats = ctx.categories||[];
    const out = {
      date: parseDate(text, ctx.today),
      amount: parseAmount(text),
      category: bestCategoryMatch(text, cats) || (cats[0]||'Otros'),
      method: parseMethod(text),
      concept: text.length>90 ? text.slice(0,90)+'…' : text,
      notes: text,
    };
    out[isIncome?'client':'provider'] = parsePartyName(text);
    return out;
  }
  if(type==='idea'){
    const firstSentence = (text.split(/[.!?\n]/)[0]||'').trim();
    return {
      title: (firstSentence || text).slice(0,80),
      description: text,
      priority: parsePriority(text),
      responsible: ctx.userName||'',
      date: ctx.today,
    };
  }
  if(type==='meeting'){
    return { date: parseDate(text, ctx.today), participants: ctx.userName||'', topics: text, agreements:'', tasks:'' };
  }
  if(type==='agroTask'){
    const hasCostWords = /\$|cost[oó]|gast[eé]|pagu[eé]|compr[eé]/i.test(text);
    const inputInfo = parseAgroInput(text);
    return {
      date: parseDate(text, ctx.today),
      lotId: bestLotMatch(text, ctx.lots) || '',
      type: parseAgroTaskType(text),
      description: text.length>150 ? text.slice(0,150)+'…' : text,
      progressPct: '',
      inputName: inputInfo.inputName,
      inputQty: inputInfo.inputQty,
      inputUnit: inputInfo.inputUnit,
      cost: hasCostWords ? parseAmount(text) : '',
    };
  }
  return {};
}

/* ---------- Campos del paso de revisión ---------- */
function qcField(key, label, type, val, opts){
  opts = opts||{};
  const req = opts.required?'required':'';
  let input;
  if(type==='select'){
    input = '<select id="qcf_'+key+'" '+req+'>'+(opts.options||[]).map(o=>{
      const ov = typeof o==='object'?o.value:o, ol = typeof o==='object'?o.label:o;
      return '<option value="'+esc(ov)+'" '+(String(val)===String(ov)?'selected':'')+'>'+esc(ol)+'</option>';
    }).join('')+'</select>';
  } else if(type==='textarea'){
    input = '<textarea id="qcf_'+key+'" '+req+' rows="'+(opts.rows||3)+'">'+esc(val||'')+'</textarea>';
  } else {
    input = '<input type="'+type+'" id="qcf_'+key+'" '+req+' '+(opts.step?'step="'+opts.step+'"':'')+' value="'+esc(val==null?'':val)+'"/>';
  }
  return '<div class="field" style="'+(opts.fullWidth?'grid-column:1/-1':'')+'"><label>'+esc(label)+(opts.required?' *':'')+'</label>'+input+'</div>';
}
function reviewFieldsHtml(type, p, ctx){
  if(type==='income' || type==='expense'){
    const isIncome = type==='income';
    return '<div class="form-grid">'+
        qcField('date','Fecha','date',p.date,{required:true})+
        qcField('amount','Importe','number',p.amount,{required:true, step:'0.01'})+
        qcField('category','Categoría','select',p.category,{required:true, options:ctx.categories||[]})+
        qcField('method','Medio de '+(isIncome?'cobro':'pago'),'select',p.method,{required:true, options:['Transferencia','Efectivo','Tarjeta de débito','Tarjeta de crédito','Débito automático','Cheque']})+
        qcField(isIncome?'client':'provider', isIncome?'Cliente':'Proveedor', 'text', p[isIncome?'client':'provider'], {})+
      '</div>'+
      qcField('concept','Concepto','text',p.concept,{required:true, fullWidth:true})+
      qcField('notes','Texto original / notas','textarea',p.notes,{fullWidth:true});
  }
  if(type==='idea'){
    return qcField('title','Título','text',p.title,{required:true, fullWidth:true})+
      qcField('description','Descripción','textarea',p.description,{fullWidth:true})+
      '<div class="form-grid">'+
        qcField('responsible','Responsable','text',p.responsible,{required:true})+
        qcField('date','Fecha','date',p.date,{required:true})+
        qcField('priority','Prioridad','select',p.priority,{options:['Baja','Media','Alta']})+
      '</div>';
  }
  if(type==='meeting'){
    return '<div class="form-grid">'+
        qcField('date','Fecha','date',p.date,{required:true})+
        qcField('participants','Participantes','text',p.participants,{required:true})+
      '</div>'+
      qcField('topics','Temas tratados','textarea',p.topics,{required:true, fullWidth:true})+
      qcField('agreements','Acuerdos','textarea',p.agreements,{fullWidth:true})+
      qcField('tasks','Tareas asignadas','textarea',p.tasks,{fullWidth:true});
  }
  if(type==='agroTask'){
    return '<div class="form-grid">'+
        qcField('date','Fecha','date',p.date,{required:true})+
        qcField('lotId','Lote','select',p.lotId,{options:[{value:'',label:'Sin lote / general'}].concat((ctx.lots||[]).map(l=>({value:l.id,label:l.name})))})+
        qcField('type','Tipo de tarea','select',p.type,{required:true, options:G.AGRO_TASK_TYPES||[]})+
      '</div>'+
      qcField('description','Detalle','textarea',p.description,{fullWidth:true})+
      '<div class="form-grid">'+
        qcField('inputName','Insumo usado','text',p.inputName,{})+
        qcField('inputQty','Cantidad','number',p.inputQty,{step:'0.01'})+
        qcField('inputUnit','Unidad','text',p.inputUnit,{})+
        qcField('cost','Costo ($)','number',p.cost,{step:'0.01'})+
      '</div>';
  }
  return '';
}

/* ---------- Modal principal (2 pasos: dictado -> revisión) ---------- */
function openQuickCapture(user, company, opts){
  opts = opts||{};
  const availableTypes = QC_TYPES.filter(t=> G.perm.moduleEnabledForCompany(company, t.module));
  if(!availableTypes.length){ G.toast('No hay módulos habilitados para carga rápida en esta empresa.'); return; }
  let type = availableTypes.find(t=>t.key===opts.type) ? opts.type : availableTypes[0].key;
  let recognizer = null, listening = false;
  const state = {step:'dictado', text:''};

  const overlay = G.modal.open(bodyHtml(), {wide:true});
  wire(overlay);

  function currentTypeDef(){ return QC_TYPES.find(t=>t.key===type); }
  function buildCtx(){
    const ctx = {today: G.TODAY_ISO, userName: user.name};
    if(type==='income' || type==='expense'){
      ctx.categories = ((G.DB.financeCategories[company.id]||{})[type]) || [];
    }
    if(type==='agroTask'){
      ctx.lots = G.crud.byCompany(G.DB.agroLots, company.id);
    }
    return ctx;
  }
  function stopRecognizer(){
    if(recognizer){ try{ recognizer.onresult=null; recognizer.onend=null; recognizer.onerror=null; recognizer.stop(); }catch(e){} }
    recognizer = null; listening = false;
  }
  function rerender(){
    overlay.querySelector('.modal').innerHTML = bodyHtml();
    wire(overlay);
  }
  function closeAll(){ stopRecognizer(); G.modal.close(); }

  function bodyHtml(){
    const td = currentTypeDef();
    if(state.step==='dictado'){
      return '<div class="modal-head"><div><h3>'+icon('mic')+' Carga rápida por voz o texto</h3><div class="card-sub">Contá qué pasó con tus palabras — después revisás y corregís todo antes de guardar.</div></div><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
        '<div class="modal-body">'+
          '<div class="field"><label>¿Qué querés cargar?</label><select id="qcType">'+availableTypes.map(t=>'<option value="'+t.key+'" '+(t.key===type?'selected':'')+'>'+esc(t.label)+'</option>').join('')+'</select></div>'+
          '<div class="field" style="margin-top:12px"><label>Contanos, por voz o por texto</label>'+
            '<textarea id="qcText" rows="5" placeholder="'+esc(td.placeholder)+'">'+esc(state.text)+'</textarea>'+
          '</div>'+
          '<div class="flex items-center gap-sm" style="margin-top:10px;flex-wrap:wrap">'+
            (speechSupported() ?
              '<button type="button" class="btn" id="qcMicBtn">'+icon('mic')+' <span id="qcMicLabel">Dictar por voz</span></button>' :
              '<span class="subtle" style="font-size:11.5px">'+icon('info','subtle')+' Tu navegador no soporta dictado por voz — podés escribir el texto.</span>')+
            '<span class="subtle" style="font-size:11.5px;margin-left:auto">La IA interpreta el texto; siempre revisás antes de guardar.</span>'+
          '</div>'+
        '</div>'+
        '<div class="modal-foot"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" id="qcInterpretBtn">'+icon('sparkles')+' Interpretar</button></div>';
    }
    return '<div class="modal-head"><div><h3>Revisá antes de guardar</h3><div class="card-sub">'+esc(td.label)+' — corregí lo que haga falta y confirmá.</div></div><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
      '<div class="modal-body">'+ui.infoCallout('Interpretamos tu texto y completamos estos campos automáticamente. Revisalos: la carga rápida sugiere, vos decidís.')+
        reviewFieldsHtml(type, state.parsed, buildCtx())+
        '<div id="qcError" style="display:none;color:var(--critical);font-size:12.5px;font-weight:600;margin-top:8px"></div>'+
      '</div>'+
      '<div class="modal-foot"><button type="button" class="btn" id="qcBackBtn">'+icon('chevron-left')+' Volver</button><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" id="qcSaveBtn">'+icon('check')+' Guardar</button></div>';
  }

  function updateMicUI(on){
    const btn = document.getElementById('qcMicBtn'), label = document.getElementById('qcMicLabel');
    if(!btn) return;
    btn.classList.toggle('qc-mic-active', on);
    if(label) label.textContent = on ? 'Escuchando… (clic para detener)' : 'Dictar por voz';
  }
  function toggleMic(){
    if(!speechSupported()) return;
    if(listening){ stopRecognizer(); updateMicUI(false); return; }
    try{ recognizer = makeRecognizer(); }catch(e){ G.toast('No se pudo iniciar el reconocimiento de voz.'); return; }
    listening = true; updateMicUI(true);
    let finalTranscript = state.text ? state.text+' ' : '';
    recognizer.onresult = e=>{
      let interim = '';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const res = e.results[i];
        if(res.isFinal) finalTranscript += res[0].transcript+' '; else interim += res[0].transcript;
      }
      const ta = document.getElementById('qcText');
      if(ta){ ta.value = (finalTranscript+interim).trim(); state.text = ta.value; }
    };
    recognizer.onerror = ()=>{ listening=false; updateMicUI(false); };
    recognizer.onend = ()=>{ listening=false; updateMicUI(false); };
    try{ recognizer.start(); }catch(e){ listening=false; updateMicUI(false); }
  }

  function doSave(){
    const err = document.getElementById('qcError');
    function fail(msg){ err.textContent = msg; err.style.display='block'; }
    const val = id=>{ const e=document.getElementById(id); return e?e.value:''; };
    if(type==='income' || type==='expense'){
      const isIncome = type==='income';
      const date = val('qcf_date'), amount = parseFloat(val('qcf_amount'))||0, category = val('qcf_category'),
        method = val('qcf_method'), party = val('qcf_'+(isIncome?'client':'provider')), concept = val('qcf_concept').trim(), notes = val('qcf_notes');
      if(amount<=0 || !concept){ fail('Revisá el importe y el concepto.'); return; }
      const list = isIncome ? G.DB.finance.incomes : G.DB.finance.expenses;
      const payload = {companyId:company.id, date, concept, category, method, amount, notes};
      payload[isIncome?'client':'provider'] = party;
      G.crud.addItem(list, payload, isIncome?'inc':'exp');
      G.logActivity('registró un nuevo '+(isIncome?'ingreso':'egreso')+' por carga rápida (voz/texto)', concept, company.id);
      G.toast(isIncome?'Ingreso registrado':'Egreso registrado');
    } else if(type==='idea'){
      const title = val('qcf_title').trim(), description = val('qcf_description'), responsible = val('qcf_responsible').trim(),
        date = val('qcf_date'), priority = val('qcf_priority');
      if(!title || !responsible){ fail('Completá el título y el responsable.'); return; }
      G.crud.addItem(G.DB.innovation, {companyId:company.id, title, description, responsible, date, status:'Idea', priority, expectedImpact:'', estimatedCost:0, result:''}, 'inn');
      G.logActivity('creó una nueva iniciativa de Innovación por carga rápida (voz/texto)', title, company.id);
      G.toast('Iniciativa creada');
    } else if(type==='meeting'){
      const date = val('qcf_date'), participants = val('qcf_participants').trim(), topics = val('qcf_topics'),
        agreements = val('qcf_agreements'), tasks = val('qcf_tasks');
      if(!participants || !topics){ fail('Completá participantes y temas tratados.'); return; }
      G.crud.addItem(G.DB.consulting.meetings, {companyId:company.id, date, participants, topics, agreements, tasks, nextMeeting:''}, 'meet');
      G.logActivity('registró una reunión de consultoría por carga rápida (voz/texto)', company.name, company.id);
      G.toast('Reunión registrada');
    } else if(type==='agroTask'){
      const date = val('qcf_date'), lotId = val('qcf_lotId'), taskType = val('qcf_type'),
        description = val('qcf_description'), inputName = val('qcf_inputName').trim(),
        inputQty = parseFloat(val('qcf_inputQty'))||0, inputUnit = val('qcf_inputUnit').trim(),
        cost = parseFloat(val('qcf_cost'))||0;
      if(!taskType){ fail('Elegí el tipo de tarea.'); return; }
      G.crud.addItem(G.DB.agroTasks, {companyId:company.id, date, lotId, type:taskType, description, progressPct:'', inputName, inputQty, inputUnit, cost}, 'atask');
      G.logActivity('cargó una tarea de campo ('+taskType+') por carga rápida (voz/texto)', company.name, company.id);
      G.toast('Tarea de campo registrada');
    }
    stopRecognizer();
    G.modal.close();
    opts.onDone && opts.onDone();
  }

  function wire(ov){
    ov.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', closeAll));
    if(state.step==='dictado'){
      const typeSel = document.getElementById('qcType');
      if(typeSel) typeSel.addEventListener('change', ()=>{ stopRecognizer(); type = typeSel.value; rerender(); });
      const ta = document.getElementById('qcText');
      if(ta) ta.addEventListener('input', ()=> state.text = ta.value);
      const micBtn = document.getElementById('qcMicBtn');
      if(micBtn) micBtn.addEventListener('click', toggleMic);
      const interpretBtn = document.getElementById('qcInterpretBtn');
      if(interpretBtn) interpretBtn.addEventListener('click', ()=>{
        stopRecognizer();
        const ta2 = document.getElementById('qcText');
        state.text = (ta2?ta2.value:state.text).trim();
        if(!state.text){ G.toast('Escribí o dictá algo primero.'); return; }
        state.parsed = parseQuickEntry(type, state.text, buildCtx());
        state.step = 'revision';
        rerender();
      });
    } else {
      const backBtn = document.getElementById('qcBackBtn');
      if(backBtn) backBtn.addEventListener('click', ()=>{ state.step='dictado'; rerender(); });
      const saveBtn = document.getElementById('qcSaveBtn');
      if(saveBtn) saveBtn.addEventListener('click', doSave);
    }
  }
}
G.openQuickCapture = openQuickCapture;

})();
</script>

<script>
/* ============================================================
   PART 21 — Videollamadas
   Le da al consultor la posibilidad de iniciar una videollamada o
   compartir una invitación con sus empresas cliente, y al
   administrador de empresa la misma posibilidad con sus propios
   colaboradores. Usa salas de videollamada reales (Jitsi Meet,
   públicas y sin necesidad de instalar nada ni crear cuenta) —
   no requiere backend propio para funcionar de verdad.
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

function makeRoomName(company){
  const base = 'MODOGestion-'+(company.initials||company.id).replace(/[^A-Za-z0-9]/g,'');
  return base+'-'+Math.random().toString(36).slice(2,8);
}
function roomLink(roomName){ return 'https://meet.jit.si/'+roomName; }

G.pages.videollamadas = function(el, user, company){
  renderVideollamadas(el, user, company);
};

function renderVideollamadas(el, user, company){
  const isSuper = user.role==='SUPER_ADMIN';
  const isAdminEmpresa = user.role==='ADMIN_EMPRESA';
  const rows = G.crud.byCompany(G.DB.videoCalls, company.id).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const clienteCalls = rows.filter(r=>r.audience==='cliente');
  const equipoCalls = rows.filter(r=>r.audience==='equipo');

  const actions =
    (isSuper?'<button class="btn btn-primary" id="vcNewClienteBtn">'+icon('video')+' Videollamada con la empresa</button>':'')+
    (isAdminEmpresa?'<button class="btn btn-primary" id="vcNewEquipoBtn" style="margin-left:8px">'+icon('video')+' Videollamada con el equipo</button>':'');

  el.innerHTML = ui.pageHeader('Videollamadas', 'Iniciá una videollamada o compartí una invitación — funciona desde cualquier navegador, sin instalar nada.', actions)+
    '<div class="grid-2">'+
      ui.card('Consultor ↔ Empresa', 'Reuniones virtuales entre tu consultor y '+company.name+'.', vcListHtml(clienteCalls))+
      ui.card('Empresa ↔ Equipo', 'Reuniones virtuales del administrador con sus colaboradores.', vcListHtml(equipoCalls))+
    '</div>'+
    (!isSuper && !isAdminEmpresa ? ui.infoCallout('Cualquiera de estas videollamadas la puede iniciar tu consultor o el administrador de tu empresa. Vos podés sumarte a cualquiera desde acá.') : '');

  const b1 = document.getElementById('vcNewClienteBtn'); if(b1) b1.addEventListener('click', ()=> openVideoCallForm(user, company, 'cliente', ()=>renderVideollamadas(el,user,company)));
  const b2 = document.getElementById('vcNewEquipoBtn'); if(b2) b2.addEventListener('click', ()=> openVideoCallForm(user, company, 'equipo', ()=>renderVideollamadas(el,user,company)));
  el.querySelectorAll('[data-join-call]').forEach(btn=>btn.addEventListener('click', ()=>{
    const call = G.DB.videoCalls.find(c=>c.id===btn.getAttribute('data-join-call'));
    if(call) window.open(call.link, '_blank');
  }));
  el.querySelectorAll('[data-share-call]').forEach(btn=>btn.addEventListener('click', ()=>{
    const call = G.DB.videoCalls.find(c=>c.id===btn.getAttribute('data-share-call'));
    if(call) showShareModal(call);
  }));
}

function vcListHtml(rows){
  if(!rows.length) return ui.emptyState('video','Todavía no hubo videollamadas acá.');
  return '<div class="stack-10">'+rows.map(r=>
    '<div class="card" style="padding:12px 14px">'+
      '<div class="flex justify-between items-start">'+
        '<div><b style="font-size:13px">'+esc(r.title)+'</b><br><span class="subtle" style="font-size:11.5px">'+icon('user-cog','subtle')+' '+esc(r.createdByName)+' · '+fmt.dateTime(r.createdAt)+'</span></div>'+
        ui.badge('good','Disponible')+
      '</div>'+
      (r.notes?'<p class="subtle" style="font-size:12px;margin-top:8px">'+esc(r.notes)+'</p>':'')+
      '<div class="flex gap-sm" style="margin-top:10px;flex-wrap:wrap">'+
        '<button class="btn btn-sm btn-primary" data-join-call="'+r.id+'">'+icon('video')+' Unirse</button>'+
        '<button class="btn btn-sm" data-share-call="'+r.id+'">'+icon('send')+' Compartir invitación</button>'+
      '</div>'+
    '</div>'
  ).join('')+'</div>';
}

function openVideoCallForm(user, company, audience, onDone){
  const defaultTitle = audience==='cliente' ? 'Videollamada con '+company.name : 'Reunión de equipo — '+company.name;
  G.modal.form({
    title: audience==='cliente' ? 'Nueva videollamada con la empresa' : 'Nueva videollamada con el equipo',
    subtitle: audience==='cliente' ? 'Se comparte con el administrador y usuarios de '+company.name : 'Se comparte con los colaboradores de '+company.name,
    submitLabel:'Crear e invitar',
    initial:{title:defaultTitle},
    fields:[
      {key:'title', label:'Motivo / título', required:true, fullWidth:true, placeholder: audience==='cliente'?'Ej: Seguimiento mensual de consultoría':'Ej: Reunión semanal de equipo'},
      {key:'notes', label:'Notas para la invitación (opcional)', type:'textarea', fullWidth:true, placeholder:'Agenda, temas a tratar...'},
    ],
    onSubmit(v){
      const roomName = makeRoomName(company);
      const call = G.crud.addItem(G.DB.videoCalls, {
        companyId: company.id, audience, title:v.title, notes:v.notes||'',
        roomName, link: roomLink(roomName),
        createdBy: user.id, createdByName: user.name, createdAt: new Date().toISOString(),
      }, 'vc');
      G.logActivity('inició una videollamada'+(audience==='cliente'?' con la empresa':' con el equipo')+' ('+v.title+')', company.name, company.id);
      G.toast('Videollamada creada');
      onDone();
      setTimeout(()=> showShareModal(call), 150);
    }
  });
}

function showShareModal(call){
  const overlay = G.modal.open(
    '<div class="modal-head"><h3>'+icon('video')+' '+esc(call.title)+'</h3><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<div class="modal-body">'+
      ui.infoCallout('Compartí este link con '+(call.audience==='cliente'?'la empresa':'tus colaboradores')+' para que se sumen a la videollamada. Funciona desde cualquier navegador, sin instalar nada.')+
      '<div class="field" style="margin-top:14px"><label>Link de invitación</label><div class="flex gap-sm"><input type="text" id="vcLinkInput" readonly value="'+esc(call.link)+'" style="flex:1"/><button type="button" class="btn" id="vcCopyBtn">'+icon('copy')+' Copiar</button></div></div>'+
    '</div>'+
    '<div class="modal-foot"><button class="btn" data-close>Cerrar</button><button class="btn btn-primary" id="vcJoinNowBtn">'+icon('video')+' Unirse ahora</button></div>'
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', G.modal.close));
  overlay.querySelector('#vcJoinNowBtn').addEventListener('click', ()=> window.open(call.link,'_blank'));
  overlay.querySelector('#vcCopyBtn').addEventListener('click', ()=>{
    const input = overlay.querySelector('#vcLinkInput');
    input.select();
    let copied = false;
    try{ if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(call.link); copied = true; } }catch(e){}
    if(!copied){ try{ copied = document.execCommand('copy'); }catch(e){} }
    G.toast(copied ? 'Link copiado al portapapeles' : 'Seleccioná y copiá el link manualmente');
  });
}

})();
</script>

<script>
/* ============================================================
   PART 22 — Chat
   Dos canales por empresa: "Equipo interno" (solo usuarios de la
   propia empresa) y "Consultoría" (la empresa con su consultor).
   Los mensajes se guardan en G.DB.chatMessages — como el resto de
   esta demo, viven en el navegador y están listos para conectarse
   a mensajería en tiempo real cuando haya un backend real.
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

G.pages.chat = function(el, user, company){
  const isSuper = user.role==='SUPER_ADMIN';
  const state = el._chatState || {channel: isSuper ? 'consultoria' : 'interno'};
  el._chatState = state;
  renderChat(el, user, company, state, isSuper);
};

function channelDescHtml(channel, company, isSuper){
  if(channel==='interno') return 'Chat interno del equipo de '+esc(company.name)+'. Tu consultor no participa acá.';
  return isSuper ? 'Chat directo con '+esc(company.name)+'.' : 'Chat directo con tu consultor.';
}

function renderChat(el, user, company, state, isSuper){
  const tabs = isSuper ? [{key:'consultoria', label:'Consultoría'}] : [{key:'interno',label:'Equipo interno'},{key:'consultoria',label:'Consultoría'}];
  const messages = G.DB.chatMessages.filter(m=>m.companyId===company.id && m.channel===state.channel).sort((a,b)=>a.createdAt.localeCompare(b.createdAt));

  el.innerHTML = ui.pageHeader('Chat', channelDescHtml(state.channel, company, isSuper))+
    (tabs.length>1 ? ui.tabsHtml(tabs, state.channel) : '')+
    '<div class="chat-panel">'+
      '<div class="chat-messages" id="chatMessages">'+
        (messages.length ? messages.map(m=>chatBubbleHtml(m,user)).join('') : ui.emptyState('message-square','Todavía no hay mensajes en este chat. ¡Escribí el primero!'))+
      '</div>'+
      '<form id="chatForm" class="chat-input-row">'+
        '<textarea id="chatInput" rows="1" placeholder="Escribí un mensaje..."></textarea>'+
        '<button type="submit" class="btn btn-primary icon-btn" title="Enviar">'+icon('send')+'</button>'+
      '</form>'+
    '</div>';

  if(tabs.length>1) ui.wireTabs(el, tab=>{ state.channel=tab; renderChat(el,user,company,state,isSuper); });

  const box = document.getElementById('chatMessages');
  if(box) box.scrollTop = box.scrollHeight;

  const form = document.getElementById('chatForm');
  const input = document.getElementById('chatInput');
  function send(){
    const text = input.value.trim();
    if(!text) return;
    G.crud.addItem(G.DB.chatMessages, {
      companyId:company.id, channel:state.channel, authorId:user.id, authorName:user.name, authorRole:user.role,
      text, createdAt:new Date().toISOString(),
    }, 'msg');
    input.value='';
    renderChat(el,user,company,state,isSuper);
  }
  form.addEventListener('submit', e=>{ e.preventDefault(); send(); });
  input.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); } });
  input.focus();
}

function chatBubbleHtml(m, user){
  const mine = m.authorId===user.id;
  const roleTag = m.authorRole==='SUPER_ADMIN' ? 'Consultor' : m.authorRole==='ADMIN_EMPRESA' ? 'Administrador' : 'Usuario';
  return '<div class="chat-bubble-row '+(mine?'mine':'')+'">'+
    '<div class="chat-bubble">'+
      (!mine ? '<div class="chat-author">'+esc(m.authorName)+' <span class="subtle" style="font-weight:500">· '+roleTag+'</span></div>' : '')+
      '<div class="chat-text">'+esc(m.text).replace(/\n/g,'<br>')+'</div>'+
      '<div class="chat-time">'+fmt.dateTime(m.createdAt)+'</div>'+
    '</div>'+
  '</div>';
}

})();
</script>

<script>
/* ============================================================
   PART 23 — Editor de la pantalla de inicio (Página de inicio)
   Le permite al consultor (Super Admin), desde Configuración
   general, editar los textos y la imagen destacada de la pantalla
   de inicio de sesión, con una vista previa en vivo. Se guarda en
   G.DB.homeContent y lo consume renderLogin() (Parte 7).
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, esc = G.util.escapeHtml, ui = G.ui;

function hcField(id, label, val){
  return '<div class="field"><label>'+esc(label)+'</label><input type="text" id="'+id+'" value="'+esc(val||'')+'"/></div>';
}
function hcArea(id, label, val, rows){
  return '<div class="field"><label>'+esc(label)+'</label><textarea id="'+id+'" rows="'+(rows||3)+'">'+esc(val||'')+'</textarea></div>';
}
function hcImageZoneHtml(url){
  if(!url) return '<span class="subtle" style="font-size:12px">Sin imagen cargada.</span>';
  return '<img src="'+url+'" style="max-width:220px;max-height:140px;border-radius:10px;display:block;object-fit:cover"/>'+
    '<button type="button" class="btn btn-sm" id="hcImageRemoveBtn" style="margin-top:8px">'+icon('trash')+' Quitar imagen</button>';
}
function homePreviewHtml(hc){
  return '<div style="background:linear-gradient(160deg,#122840,#0a1826 70%);border-radius:14px;padding:22px;color:#fff">'+
    G.ui.brandLockupHtml(20, {dark:true})+
    '<div style="color:rgba(255,255,255,.6);font-size:11px;margin-top:8px">'+esc(hc.tagline)+'</div>'+
    '<div style="font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.3;margin-top:16px">'+esc(hc.quoteTitle)+' <span style="opacity:.65">'+esc(hc.quoteSub)+'</span></div>'+
    (hc.heroImage?'<img src="'+hc.heroImage+'" style="max-width:100%;max-height:120px;border-radius:10px;object-fit:cover;margin-top:14px;display:block"/>':'')+
    '<div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;font-size:11.5px;color:rgba(255,255,255,.85)">'+
      (hc.features||[]).map(f=>'<div><b style="color:#fff">'+esc(f.title)+'</b><br>'+esc(f.desc)+'</div>').join('')+
    '</div>'+
  '</div>';
}

function homeEditorHtml(){
  const hc = Object.assign({}, G.DEFAULT_HOME_CONTENT, G.DB.homeContent||{});
  return '<div class="grid-2">'+
    '<div class="card">'+
      '<div class="card-title">Textos e imagen de la pantalla de inicio de sesión</div>'+
      '<div class="card-sub">Es lo primero que ve cualquier persona al abrir MODO Gestión, antes de iniciar sesión.</div>'+
      '<div class="stack-16" style="margin-top:16px">'+
        hcField('hcTagline','Tagline (debajo del logo)', hc.tagline)+
        hcArea('hcQuoteTitle','Frase principal', hc.quoteTitle, 2)+
        hcArea('hcQuoteSub','Frase secundaria', hc.quoteSub, 2)+
        '<div style="border-top:1px solid var(--border)"></div>'+
        (hc.features||[]).map((f,i)=>
          '<div class="stack-10"><b style="font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary)">Punto destacado '+(i+1)+'</b>'+
          hcField('hcFeatTitle'+i,'Título', f.title)+
          hcArea('hcFeatDesc'+i,'Descripción', f.desc, 2)+
          '</div>'
        ).join('')+
        '<div class="field"><label>Imagen destacada (opcional)</label>'+
          '<input type="file" id="hcImageInput" accept="image/*"/>'+
          '<div class="hint">Se muestra en el panel izquierdo de la pantalla de inicio. Recomendado: menos de 2 MB.</div>'+
          '<div id="hcImageZone" style="margin-top:10px">'+hcImageZoneHtml(hc.heroImage)+'</div>'+
        '</div>'+
        '<div class="flex gap-sm" style="margin-top:4px;flex-wrap:wrap">'+
          '<button class="btn btn-primary" id="hcSaveBtn">'+icon('check')+' Guardar cambios</button>'+
          '<button class="btn" id="hcResetBtn">Restablecer textos originales</button>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="background:#171a2b;border-color:#171a2b">'+
      '<div class="card-title" style="color:#fff">Vista previa</div>'+
      '<div id="hcPreview" style="margin-top:14px">'+homePreviewHtml(hc)+'</div>'+
    '</div>'+
  '</div>';
}

function wireHomeEditor(el, onDone){
  const draft = JSON.parse(JSON.stringify(Object.assign({}, G.DEFAULT_HOME_CONTENT, G.DB.homeContent||{})));

  function refreshPreview(){
    const wrap = document.getElementById('hcPreview');
    if(wrap) wrap.innerHTML = homePreviewHtml(draft);
  }
  function bindText(id, key){
    const inp = document.getElementById(id);
    if(!inp) return;
    inp.addEventListener('input', ()=>{ draft[key] = inp.value; refreshPreview(); });
  }
  bindText('hcTagline','tagline');
  bindText('hcQuoteTitle','quoteTitle');
  bindText('hcQuoteSub','quoteSub');
  (draft.features||[]).forEach((f,i)=>{
    const t = document.getElementById('hcFeatTitle'+i), d = document.getElementById('hcFeatDesc'+i);
    if(t) t.addEventListener('input', ()=>{ draft.features[i].title = t.value; refreshPreview(); });
    if(d) d.addEventListener('input', ()=>{ draft.features[i].desc = d.value; refreshPreview(); });
  });

  function wireRemoveBtn(){
    const rb = document.getElementById('hcImageRemoveBtn');
    if(rb) rb.addEventListener('click', ()=>{
      draft.heroImage = '';
      const zone = document.getElementById('hcImageZone');
      if(zone) zone.innerHTML = hcImageZoneHtml('');
      refreshPreview();
    });
  }
  wireRemoveBtn();

  const fileInput = document.getElementById('hcImageInput');
  if(fileInput) fileInput.addEventListener('change', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ G.toast('La imagen es muy pesada (máx. 2 MB).'); fileInput.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      draft.heroImage = reader.result;
      const zone = document.getElementById('hcImageZone');
      if(zone){ zone.innerHTML = hcImageZoneHtml(draft.heroImage); wireRemoveBtn(); }
      refreshPreview();
    };
    reader.readAsDataURL(file);
  });

  const saveBtn = document.getElementById('hcSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    G.DB.homeContent = JSON.parse(JSON.stringify(draft));
    G.persist();
    G.logActivity('editó los textos e imagen de la pantalla de inicio de sesión', 'Página de inicio', null);
    G.toast('Cambios guardados. Cerrá sesión para verlos en la pantalla de inicio.');
    onDone();
  });
  const resetBtn = document.getElementById('hcResetBtn');
  if(resetBtn) resetBtn.addEventListener('click', ()=>{
    G.modal.confirm({title:'Restablecer textos originales', desc:'Se van a perder los textos e imagen personalizados de la pantalla de inicio.', confirmLabel:'Restablecer', danger:true, onConfirm:()=>{
      G.DB.homeContent = JSON.parse(JSON.stringify(G.DEFAULT_HOME_CONTENT));
      G.persist();
      G.logActivity('restableció los textos originales de la pantalla de inicio', 'Página de inicio', null);
      G.toast('Textos restablecidos');
      onDone();
    }});
  });
}

G.homeEditorHtml = homeEditorHtml;
G.wireHomeEditor = wireHomeEditor;

})();
</script>

<script>
/* ============================================================
   PART 24 — Módulo Agropecuario
   Se activa automáticamente para empresas cuyo rubro/sector coincide con
   G.isAgroCompany (ver Parte 4). Reutiliza el sistema de Indicadores
   existente para los 11 KPIs numéricos (marcados con "agroKey" para poder
   identificarlos y evitar duplicados), y suma dos colecciones propias
   (livestockInventory, rainfallLog) para los dos trackers que no encajan
   en el modelo de indicador numérico simple.
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

const AGRO_SECTIONS = [
  {key:'ganadera',  label:'Sección Ganadera', icon:'users', desc:'Indicadores reproductivos y de producción de carne o leche.'},
  {key:'agricola',  label:'Sección Agrícola / Forrajero', icon:'trending-up', desc:'Rendimiento de los cultivos y eficiencia en el uso de insumos.'},
  {key:'economica', label:'Sección Económica', icon:'banknote', desc:'Costo, margen y caja de cada actividad del campo.'},
  {key:'recursos',  label:'Recursos y Clima', icon:'sun', desc:'Eficiencia alimentaria, hacienda disponible y registro climático.'},
];

const AGRO_INDICATOR_DEFS = [
  {key:'prenez', section:'ganadera', name:'% de preñez', category:'Ganadera', formula:'(Vientres preñados / Vientres totales servidos) x 100', unit:'%', target:85},
  {key:'destete', section:'ganadera', name:'% de destete', category:'Ganadera', formula:'(Terneros destetados / Vientres entorados) x 100', unit:'%', target:80},
  {key:'cargaAnimal', section:'ganadera', name:'Carga animal', category:'Ganadera', formula:'Equivalentes vaca (EV) / Hectáreas ganaderas', unit:'EV/ha', target:1.2},
  {key:'gdp', section:'ganadera', name:'Ganancia diaria de peso (GDP)', category:'Ganadera', formula:'Kilos ganados / Días del período', unit:'kg/día', target:0.75},
  {key:'kgHaGanadera', section:'ganadera', name:'Kilos producidos por hectárea', category:'Ganadera', formula:'Kilos de carne o leche producidos / Hectáreas ganaderas', unit:'kg/ha', target:220},
  {key:'rendimientoHa', section:'agricola', name:'Rendimiento por hectárea', category:'Agrícola', formula:'Kilos o quintales cosechados / Hectáreas sembradas', unit:'kg/ha', target:4500},
  {key:'eficienciaInsumos', section:'agricola', name:'Eficiencia de uso de insumos', category:'Agrícola', formula:'Producción obtenida / Insumos aplicados (semilla, fertilizante, agroquímicos)', unit:'%', target:85},
  {key:'costoProdKg', section:'economica', name:'Costo de producción por kilo', category:'Económica', formula:'Costo total de la actividad / Kilos producidos', unit:'$', target:900},
  {key:'margenActividad', section:'economica', name:'Margen bruto por actividad', category:'Económica', formula:'(Ingresos de la actividad - Costos directos) / Ingresos x 100', unit:'%', target:35},
  {key:'cashflow', section:'economica', name:'Flujo de caja (Cashflow)', category:'Económica', formula:'Ingresos cobrados - Egresos pagados del período', unit:'$', target:0},
  {key:'eficienciaAlimentaria', section:'recursos', name:'Eficiencia alimentaria', category:'Recursos', formula:'Producción lograda / Alimento suministrado', unit:'%', target:90},
];

const LIVESTOCK_CATEGORIES = ['Vacas','Vaquillonas','Toros','Novillos','Terneros/as','Otros'];
const AGRO_TASK_TYPES = ['Siembra','Riego','Monitoreo','Fumigación','Fertilización','Cosecha','Avance de cultivo','Otro'];
const AGRO_MOVEMENT_TYPES = ['Nacimiento','Compra','Venta','Muerte','Traslado'];
const AGRO_MACHINE_TYPES = ['Tractor','Sembradora','Cosechadora','Pulverizadora / Mosquito','Camión / Acoplado','Otro'];
// Se exportan a G porque Carga rápida (Parte 20, otra IIFE) necesita esta lista
// para armar el formulario de revisión de "Tarea de campo" -- ver la nota sobre
// visibilidad entre <script> en G.renderLogin más arriba en el archivo.
G.AGRO_TASK_TYPES = AGRO_TASK_TYPES;

const AGRO_TABS = [
  {key:'resumen', label:'Resumen'},
  {key:'lotes', label:'Lotes'},
  {key:'tareas', label:'Tareas de campo'},
  {key:'ganado', label:'Ganado'},
  {key:'maquinaria', label:'Maquinaria'},
  {key:'reportes', label:'Reportes'},
];

function ensureAgroIndicators(company){
  const existingKeys = new Set(G.DB.indicators.filter(k=>k.companyId===company.id && k.agroKey).map(k=>k.agroKey));
  AGRO_INDICATOR_DEFS.forEach(def=>{
    if(existingKeys.has(def.key)) return;
    G.crud.addItem(G.DB.indicators, {
      companyId: company.id, agroKey: def.key,
      name: def.name, category: def.category, formula: def.formula, unit: def.unit,
      target: def.target, current: 0, frequency:'Mensual', responsible: company.responsible||'',
      history: [{period:'Actual', value:0}],
    }, 'kpi');
  });
}
function agroIndicatorsFor(company, sectionKey){
  const defKeys = new Set(AGRO_INDICATOR_DEFS.filter(d=>d.section===sectionKey).map(d=>d.key));
  return G.DB.indicators.filter(k=>k.companyId===company.id && k.agroKey && defKeys.has(k.agroKey));
}

G.pages.agro = function(el, user, company){
  ensureAgroIndicators(company);
  const state = el._agroState || {tab:'resumen', reportView:'semana', taskLotFilter:'', taskTypeFilter:'', lotsView:'lista'};
  el._agroState = state;
  renderAgro(el, user, company, state);
};

function renderAgro(el, user, company, state){
  const canCreate = G.perm.userCan(user,'agro','crear'), canEdit = G.perm.userCan(user,'agro','editar'), canDelete = G.perm.userCan(user,'agro','eliminar');
  const canExport = G.perm.userCan(user,'agro','exportar');

  let body = '';
  if(state.tab==='resumen') body = agroResumenHtml(company, canCreate, canEdit, canDelete);
  else if(state.tab==='lotes') body = state.lotsView==='mapa' ? agroLotsMapHtml(company) : agroLotsTableHtml(company, canCreate, canEdit, canDelete);
  else if(state.tab==='tareas') body = agroTasksTableHtml(company, state, canCreate, canEdit, canDelete);
  else if(state.tab==='ganado') body = agroGanadoHtml(company, canCreate, canEdit, canDelete);
  else if(state.tab==='maquinaria') body = agroMaquinariaHtml(company, canCreate, canEdit, canDelete);
  else if(state.tab==='reportes') body = agroReportsHtml(company, state);

  el.innerHTML = ui.pageHeader('Agropecuario', 'Indicadores, lotes, tareas de campo, ganado, maquinaria y reportes.', agroHeaderActionsHtml(state, canCreate, canExport)) +
    ui.tabsHtml(AGRO_TABS, state.tab) +
    body;

  ui.wireTabs(el, tab=>{ state.tab=tab; renderAgro(el, user, company, state); });

  if(state.tab==='resumen') mountAgroSparklines(el, company);
  else if(state.tab==='reportes') mountAgroReportCharts(el, company, state);

  wireAgroPage(el, user, company, state, canCreate, canEdit, canDelete);
}

function agroHeaderActionsHtml(state, canCreate, canExport){
  if(state.tab==='lotes') return '<select class="filter-select" id="agroLotsViewSel"><option value="lista" '+(state.lotsView==='lista'?'selected':'')+'>Lista</option><option value="mapa" '+(state.lotsView==='mapa'?'selected':'')+'>Mapa</option></select>'+
    (canCreate ? '<button class="btn btn-primary" id="agroNewLotBtn">'+icon('plus')+' Nuevo lote</button>' : '');
  if(state.tab==='tareas') return canCreate ? '<button class="btn" id="agroQuickBtn">'+icon('mic')+' Carga rápida</button><button class="btn btn-primary" id="agroNewTaskBtn">'+icon('plus')+' Nueva tarea</button>' : '';
  if(state.tab==='reportes') return '<select class="filter-select" id="agroReportView"><option value="semana" '+(state.reportView==='semana'?'selected':'')+'>Por semana</option><option value="lote" '+(state.reportView==='lote'?'selected':'')+'>Por lote</option></select>'+(canExport?ui.printBtn():'');
  return '';
}

function agroResumenHtml(company, canCreate, canEdit, canDelete){
  return AGRO_SECTIONS.map((sec,i)=> sec.key==='recursos'
    ? agroRecursosSectionHtml(sec, company, canCreate, canEdit, canDelete, i===0)
    : agroSectionHtml(sec, company, i===0)
  ).join('');
}

function agroSectionHeadHtml(sec){
  return '<div style="margin-bottom:14px;display:flex;align-items:center;gap:10px">'+icon(sec.icon)+
    '<div><b style="font-size:14px">'+esc(sec.label)+'</b><div class="hint" style="margin-top:2px">'+esc(sec.desc)+'</div></div></div>';
}
function agroSectionHtml(sec, company, isFirst){
  const items = agroIndicatorsFor(company, sec.key);
  return (isFirst?'':'<div style="border-top:1px solid var(--border);margin:22px 0"></div>')+
    agroSectionHeadHtml(sec)+
    (items.length ? '<div class="grid-3">'+items.map(k=>G.indicatorCardHtml(k)).join('')+'</div>' : ui.emptyState('bar-chart','Sin indicadores en esta sección.'));
}
function agroRecursosSectionHtml(sec, company, canCreate, canEdit, canDelete, isFirst){
  const items = agroIndicatorsFor(company, sec.key);
  return (isFirst?'':'<div style="border-top:1px solid var(--border);margin:22px 0"></div>')+
    agroSectionHeadHtml(sec)+
    (items.length ? '<div class="grid-3" style="margin-bottom:14px">'+items.map(k=>G.indicatorCardHtml(k)).join('')+'</div>' : '')+

      agroLivestockCardHtml(company, canCreate, canEdit, canDelete)+
      agroRainfallCardHtml(company, canCreate, canEdit, canDelete)+

function agroLivestockCardHtml(company, canCreate, canEdit, canDelete){

  const body = '<div class="table-wrap"><table><thead><tr><th>Categoría</th><th class="num">Cabezas</th><th>Actualizado</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(r=>'<tr><td><b>'+esc(r.category)+'</b></td><td class="num mono">'+fmt.num(r.qty)+'</td><td class="subtle">'+(r.date?fmt.date(r.date):'—')+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-livestock="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-livestock="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td></tr>').join('')
      : '<tr><td colspan="4">'+ui.emptyState('package','Sin dotación de hacienda cargada.')+'</td></tr>')+
    '</tbody></table></div>';

}
function agroRainfallCardHtml(company, canCreate, canEdit, canDelete){
  const rows = G.crud.byCompany(G.DB.rainfallLog, company.id);
  const addBtn = canCreate ? '<button class="btn btn-sm" id="agroRainNewBtn">'+icon('plus')+' Agregar</button>' : '';
  const chart = rows.length ? '<div id="agroRainChart" style="margin-bottom:14px"></div>' : '';
  const body = chart+'<div class="table-wrap"><table><thead><tr><th>Período</th><th class="num">Milímetros</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(r=>'<tr><td><b>'+esc(r.period)+'</b></td><td class="num mono">'+fmt.num(r.mm,1)+' mm</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-rain="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-rain="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td></tr>').join('')

function mountAgroSparklines(el, company){
  const all = G.DB.indicators.filter(k=>k.companyId===company.id && k.agroKey);
  el.querySelectorAll('[data-spark]').forEach(elx=>{
    const k = all.find(x=>x.id===elx.getAttribute('data-spark'));

    const rows = G.crud.byCompany(G.DB.rainfallLog, company.id);

/* ---------- Lotes ---------- */
// Suma y resta los movimientos de hacienda que tienen lote de origen/destino
// cargado, para estimar cuántos animales hay HOY en cada lote. Los movimientos
// sin lote asignado (la mayoría de los que se cargaron antes de esta función,
// o cargas rápidas sin ese dato) no se cuentan en ningún lote -- por eso esto
// es una estimación que depende de que se cargue el lote en cada movimiento,
// no un inventario físico verificado.
function agroLotLivestockBalances(company){
  const moves = G.crud.byCompany(G.DB.agroLivestockMovements, company.id);
  const balances = {};
  function add(lotId, category, delta){
    if(!lotId) return;
    if(!balances[lotId]) balances[lotId] = {};
    balances[lotId][category] = (balances[lotId][category]||0) + delta;
  }
  moves.forEach(m=>{
    const qty = parseFloat(m.qty)||0;
    if(m.movementType==='Nacimiento' || m.movementType==='Compra') add(m.toLotId, m.category, qty);
    else if(m.movementType==='Venta' || m.movementType==='Muerte') add(m.fromLotId, m.category, -qty);
    else if(m.movementType==='Traslado'){ add(m.fromLotId, m.category, -qty); add(m.toLotId, m.category, qty); }
  });
  return balances;
}
function agroLotHeadcount(balances, lotId){
  const cats = balances[lotId];
  if(!cats) return 0;
  return G.util.sum(Object.values(cats), v=>v);
}
function agroLotHeadcountDetail(balances, lotId){
  const cats = balances[lotId];
  if(!cats) return '';
  return Object.entries(cats).filter(([,v])=>v!==0).map(([k,v])=>k+': '+fmt.num(v)).join(', ');
}
function agroLotsTableHtml(company, canCreate, canEdit, canDelete){
  const rows = G.crud.byCompany(G.DB.agroLots, company.id);
  const totalHa = G.util.sum(rows.filter(r=>r.active!==false), r=>parseFloat(r.areaHa)||0);
  const balances = agroLotLivestockBalances(company);
  return '<div class="table-card">'+
    '<div class="table-toolbar"><div class="subtle" style="font-size:12.5px">'+rows.length+' lote(s) · '+fmt.num(totalHa,1)+' ha activas en total</div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Lote</th><th class="num">Hectáreas</th><th>Cultivo / uso</th><th class="num">Cabezas de ganado</th><th>Estado</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(r=>{
      const head = agroLotHeadcount(balances, r.id);
      const detail = agroLotHeadcountDetail(balances, r.id);
      return '<tr>'+
      '<td><b>'+esc(r.name)+'</b></td>'+
      '<td class="num mono">'+fmt.num(parseFloat(r.areaHa)||0,1)+'</td>'+
      '<td>'+esc(r.crop||'—')+'</td>'+
      '<td class="num mono" title="'+esc(detail)+'">'+(head?fmt.num(head):'—')+'</td>'+
      '<td>'+ui.badge(r.active!==false?'good':'neutral', r.active!==false?'Activo':'Inactivo')+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-lot="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-lot="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td>'+
    '</tr>';
    }).join('') : '<tr><td colspan="6">'+ui.emptyState('layers','Todavía no cargaste lotes. Empezá agregando el primero.')+'</td></tr>')+
    '</tbody></table></div></div>';
}
const LOT_TILE_COLORS = ['#2a78d6','#1baf7a','#eda100','#eb6834','#e87ba4','#4a3aa7','#0f8a8a','#9a6b2f'];
function lotTileColorFor(crop){
  if(!crop) return '#7a7f8c';
  let hash = 0;
  for(let i=0;i<crop.length;i++) hash = (hash*31 + crop.charCodeAt(i)) >>> 0;
  return LOT_TILE_COLORS[hash % LOT_TILE_COLORS.length];
}
function agroLotsMapHtml(company){
  const rows = G.crud.byCompany(G.DB.agroLots, company.id);
  const balances = agroLotLivestockBalances(company);
  if(!rows.length) return ui.emptyState('layers','Todavía no cargaste lotes. Empezá agregando el primero desde "Lista".');
  const maxHa = Math.max(1, ...rows.map(r=>parseFloat(r.areaHa)||0));
  const tiles = rows.map(r=>{
    const ha = parseFloat(r.areaHa)||0;
    const color = lotTileColorFor(r.crop);
    const head = agroLotHeadcount(balances, r.id);
    const scale = 0.55 + 0.45*(ha/maxHa);
    return '<div class="lot-tile" style="border-top-color:'+color+';flex-grow:'+Math.max(1,ha)+';min-height:'+Math.round(110*scale)+'px">'+
      '<div class="lot-tile-name">'+esc(r.name)+'</div>'+
      '<div class="lot-tile-crop" style="color:'+color+'">'+esc(r.crop||'Sin cultivo asignado')+'</div>'+
      '<div class="lot-tile-meta">'+fmt.num(ha,1)+' ha'+(head?' · '+fmt.num(head)+' cabezas':'')+'</div>'+
      (r.active===false?'<div class="lot-tile-inactive">Inactivo</div>':'')+
    '</div>';
  }).join('');
  return '<div class="hint" style="margin-bottom:12px">Cada tarjeta representa un lote (tamaño aproximado a sus hectáreas) y se colorea según el cultivo cargado. Es una primera versión simple del mapa — más adelante se puede sumar un croquis armable a mano.</div>'+
    '<div class="lot-map-grid">'+tiles+'</div>';
}
function openLotForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar lote':'Nuevo lote', submitLabel: existing?'Guardar cambios':'Agregar',
    initial: existing || {active:true},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.agroLots, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'name', label:'Nombre del lote', required:true, placeholder:'Ej: Lote 3 - Norte'},
      {key:'areaHa', label:'Hectáreas', type:'number', step:'0.1', required:true},
      {key:'crop', label:'Cultivo / uso', placeholder:'Ej: Soja, Maíz, Ganadería'},
      {key:'active', label:'Estado', type:'checkbox', checkLabel:'Lote activo'},
    ],
    onSubmit(v){
      if(v.areaHa<0) return false;
      if(existing){ G.crud.updateItem(G.DB.agroLots, existing.id, v); G.logActivity('editó el lote', v.name, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.agroLots, Object.assign({companyId:company.id}, v), 'lot'); G.logActivity('cargó un nuevo lote', v.name, company.id); G.toast('Lote agregado'); }
      onDone();
    }
  });

/* ---------- Reportes: por semana / por lote ---------- */
function agroIsoDate(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function agroWeeklyReport(company, weeksCount){
  weeksCount = weeksCount||8;
  const today = new Date(G.TODAY_ISO+'T00:00:00');
  const day = (today.getDay()+6)%7; // lunes=0 ... domingo=6
  const thisMonday = new Date(today); thisMonday.setDate(today.getDate()-day);
  const weeks = [];
  for(let i=weeksCount-1;i>=0;i--){
    const monday = new Date(thisMonday); monday.setDate(thisMonday.getDate()-7*i);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    const lbl = d=> String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0');
    weeks.push({start: agroIsoDate(monday), end: agroIsoDate(sunday), label: lbl(monday)+' al '+lbl(sunday), cost:0, inputs:{}});
  }
  const idxOf = dateStr=> weeks.findIndex(w=> dateStr>=w.start && dateStr<=w.end);
  G.crud.byCompany(G.DB.agroTasks, company.id).forEach(t=>{
    const i = idxOf(t.date); if(i<0) return;
    weeks[i].cost += parseFloat(t.cost)||0;
    if(t.inputName){ weeks[i].inputs[t.inputName] = (weeks[i].inputs[t.inputName]||0) + (parseFloat(t.inputQty)||0); }
  });
  G.crud.byCompany(G.DB.agroMachineryLog, company.id).forEach(m=>{
    const i = idxOf(m.date); if(i<0) return;
    weeks[i].cost += parseFloat(m.cost)||0;
  });
  G.crud.byCompany(G.DB.agroLivestockMovements, company.id).forEach(mv=>{
    const i = idxOf(mv.date); if(i<0) return;
    weeks[i].cost += parseFloat(mv.cost)||0;
  });
  return weeks;
}
function agroLotReport(company){
  const lots = G.crud.byCompany(G.DB.agroLots, company.id);
  const tasks = G.crud.byCompany(G.DB.agroTasks, company.id);
  const rowFor = (lot, items)=>{
    const cost = G.util.sum(items, t=>parseFloat(t.cost)||0);
    const inputs = {};
    items.forEach(t=>{ if(t.inputName) inputs[t.inputName] = (inputs[t.inputName]||0) + (parseFloat(t.inputQty)||0); });
    const areaHa = parseFloat(lot.areaHa)||0;
    const dates = items.map(t=>t.date).sort();
    return {lot, taskCount: items.length, cost, costPerHa: areaHa>0?cost/areaHa:null, inputs, lastDate: dates.length?dates[dates.length-1]:null};
  };
  const rows = lots.map(lot=> rowFor(lot, tasks.filter(t=>t.lotId===lot.id)));
  const unassigned = tasks.filter(t=>!t.lotId);
  if(unassigned.length) rows.push(rowFor({id:'', name:'Sin lote asignado', areaHa:0}, unassigned));
  return rows;
}

      '<td class="subtle" style="font-size:12px">'+(r.lastDate?fmt.date(r.lastDate):'—')+'</td>'+
