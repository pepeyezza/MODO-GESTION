function activityLogListHtml(logs, opts){
  opts = opts||{};
  if(!logs.length) return ui.emptyState('activity', 'Todavía no hay actividad registrada.');
  return '<div class="log-list">'+logs.map(l=>{
    const companyPart = (opts.showCompany && l.companyName) ? ' en <b>'+esc(l.companyName)+'</b>' : '';
    return '<div class="log-row"><div class="log-dot"></div><div style="flex:1"><div class="log-text"><b>'+esc(l.userName)+'</b> '+esc(l.action)+companyPart+(l.entity?' — '+esc(l.entity):'')+'</div>'+
      '<div class="log-meta">'+fmt.dateTime(l.date)+' · '+fmt.timeAgo(l.date)+'</div></div></div>';
  }).join('')+'</div>';
}

/* ============================================================
   Global admin: Usuarios y permisos
   ============================================================ */
G.pages.admin_usuarios = function(el, user){
  const state = el._adminUsersState || {search:'', company:'', role:''};
  el._adminUsersState = state;
  renderAdminUsuarios(el, user, state);
};
function renderAdminUsuarios(el, user, state){
  let list = G.DB.users.slice().sort((a,b)=> (a.companyId||'').localeCompare(b.companyId||'') || a.name.localeCompare(b.name));
  if(state.search) list = list.filter(u=> u.name.toLowerCase().includes(state.search.toLowerCase()) || u.email.toLowerCase().includes(state.search.toLowerCase()));
  if(state.company) list = list.filter(u=> u.companyId===state.company);
  if(state.role) list = list.filter(u=> u.role===state.role);

  el.innerHTML = ui.pageHeader('Usuarios y permisos', 'Gestioná todos los accesos a MODO Gestión: consultores, administradores de empresa y usuarios, con sus módulos y permisos.',
    '<button class="btn btn-primary" id="newUserBtn">'+icon('plus')+' Nuevo usuario</button>')+
    '<div class="kpi-grid">'+
      ui.kpiCard({icon:'users', label:'Usuarios totales', value: G.DB.users.length})+
      ui.kpiCard({icon:'shield-check', label:'Consultores', value: G.DB.users.filter(u=>u.role==='SUPER_ADMIN').length})+
      ui.kpiCard({icon:'user-cog', label:'Administradores de empresa', value: G.DB.users.filter(u=>u.role==='ADMIN_EMPRESA').length})+
      ui.kpiCard({icon:'user-check', label:'Usuarios de empresa', value: G.DB.users.filter(u=>u.role==='USUARIO_EMPRESA').length})+
    '</div>'+
    '<div class="table-toolbar" style="border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface)">'+
      '<div class="search-input">'+icon('search')+'<input type="text" id="userSearch" placeholder="Buscar por nombre o email..." value="'+esc(state.search)+'"/></div>'+
      '<select class="filter-select" id="userCompanyFilter"><option value="">Todas las empresas</option><option value="null" '+(state.company==='null'?'selected':'')+'>Consultoría (sin empresa)</option>'+G.DB.companies.map(c=>'<option value="'+c.id+'" '+(state.company===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>'+
      '<select class="filter-select" id="userRoleFilter"><option value="">Todos los roles</option>'+Object.keys(G.ROLES).map(r=>'<option value="'+r+'" '+(state.role===r?'selected':'')+'>'+esc(G.ROLES[r].label)+'</option>').join('')+'</select>'+
    '</div>'+
    usersTableHtml(list, {showCompany:true}).replace('<div class="table-card">','<div class="table-card" style="border-radius:0 0 var(--radius-lg) var(--radius-lg)">');

  const s = document.getElementById('userSearch'); s.addEventListener('input', G.util.debounce(()=>{ state.search=s.value; renderAdminUsuarios(el,user,state); },250));
  document.getElementById('userCompanyFilter').addEventListener('change', e=>{ state.company = e.target.value; renderAdminUsuarios(el,user,state); });
  document.getElementById('userRoleFilter').addEventListener('change', e=>{ state.role = e.target.value; renderAdminUsuarios(el,user,state); });
  document.getElementById('newUserBtn').addEventListener('click', ()=> openUserForm({}, ()=>renderAdminUsuarios(el,user,state)));
  wireUsersTable(el, {}, list, ()=>renderAdminUsuarios(el,user,state));
}

/* ============================================================
   Global admin: Configuración general (+ Auditoría)
   ============================================================ */
G.pages.admin_configuracion = function(el, user){
  const state = el._adminConfigState || {tab:'general'};
  el._adminConfigState = state;
  renderAdminConfiguracion(el, user, state);
};
function renderAdminConfiguracion(el, user, state){
  let body;
  if(state.tab==='general') body = adminGeneralHtml();
  else if(state.tab==='inicio') body = G.homeEditorHtml();
  else body = adminAuditoriaHtml(state);

  el.innerHTML = ui.pageHeader('Configuración general', 'Parámetros de la plataforma y trazabilidad de la actividad de todos los usuarios y empresas.')+
    ui.tabsHtml([{key:'general',label:'General'},{key:'inicio',label:'Página de inicio'},{key:'auditoria',label:'Auditoría'}], state.tab)+
    body;
  ui.wireTabs(el, tab=>{ state.tab=tab; if(tab==='auditoria') state.logSearch=''; renderAdminConfiguracion(el,user,state); });

  if(state.tab==='general'){
    // (nada que cablear en esta pestaña — ver adminGeneralHtml)
  } else if(state.tab==='inicio'){
    G.wireHomeEditor(el, ()=> renderAdminConfiguracion(el,user,state));
  } else {
    const s = document.getElementById('logSearch');
    if(s) s.addEventListener('input', G.util.debounce(()=>{ state.logSearch=s.value; renderAdminConfiguracion(el,user,state); },250));
    const cf = document.getElementById('logCompanyFilter');
    if(cf) cf.addEventListener('change', e=>{ state.logCompany=e.target.value; renderAdminConfiguracion(el,user,state); });
  }
}
function adminGeneralHtml(){
  const totalCompanies = G.DB.companies.length;
  const activeCompanies = G.DB.companies.filter(c=>c.status==='Activa').length;
  return '<div class="grid-2">'+
    ui.card('Plataforma', '', '<div class="stack-10">'+
      infoRow('Nombre de la plataforma', 'MODO Gestión')+
      infoRow('Consultor principal', (G.DB.users.find(u=>u.role==='SUPER_ADMIN')||{}).name || '—')+
      infoRow('Empresas cliente', activeCompanies+' activas de '+totalCompanies+' totales')+
      infoRow('Usuarios totales', String(G.DB.users.length))+
    '</div>')+
    ui.card('Estado del sistema', '', '<div class="stack-10">'+
      infoRow('Almacenamiento de datos', 'Base de datos en la nube — cada empresa con sus datos aislados')+
      infoRow('Asistente de IA', 'Módulo placeholder — listo para integrarse con un motor de IA real')+
      infoRow('Última actualización de datos', fmt.dateTime(new Date().toISOString()))+
    '</div>')+
    '</div>';
}
function infoRow(label, value){
  return '<div class="flex justify-between items-center" style="gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)"><span class="subtle">'+esc(label)+'</span><b style="text-align:right">'+esc(value)+'</b></div>';
}
function adminAuditoriaHtml(state){
  let logs = G.DB.activityLog.slice();
  if(state.logCompany) logs = logs.filter(l=> l.companyId===state.logCompany);
  if(state.logSearch){
    const q = state.logSearch.toLowerCase();
    logs = logs.filter(l=> l.userName.toLowerCase().includes(q) || (l.action||'').toLowerCase().includes(q) || (l.entity||'').toLowerCase().includes(q) || (l.companyName||'').toLowerCase().includes(q));
  }
  logs = logs.slice(0,100);
  return '<div class="table-toolbar" style="border:1px solid var(--border);border-bottom:none;border-radius:var(--radius-lg) var(--radius-lg) 0 0;background:var(--surface)">'+
    '<div class="search-input">'+icon('search')+'<input type="text" id="logSearch" placeholder="Buscar en la actividad..." value="'+esc(state.logSearch||'')+'"/></div>'+
    '<select class="filter-select" id="logCompanyFilter"><option value="">Todas las empresas</option>'+G.DB.companies.map(c=>'<option value="'+c.id+'" '+(state.logCompany===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select>'+
    '<div class="subtle" style="margin-left:auto;font-size:12.5px">'+logs.length+' evento(s)</div>'+
    '</div>'+
    '<div class="card" style="border-radius:0 0 var(--radius-lg) var(--radius-lg);border-top:none">'+activityLogListHtml(logs, {showCompany:true})+'</div>';
}

/* ============================================================
   Per-company Configuración (Módulos / Usuarios / Actividad)
   ============================================================ */
G.pages.configuracion = function(el, user, company){
  const state = el._companyConfigState || {tab:'modulos'};
  el._companyConfigState = state;
  renderCompanyConfig(el, user, company, state);
};
function renderCompanyConfig(el, user, company, state){
  const isSuper = user.role==='SUPER_ADMIN';
  const canManageUsers = isSuper || user.role==='ADMIN_EMPRESA';
  const tabs = [{key:'modulos',label:'Módulos'},{key:'usuarios',label:'Usuarios'},{key:'actividad',label:'Actividad'}];
  let body='', actions='';
  if(state.tab==='modulos') body = companyModulesHtml(company, isSuper);
  else if(state.tab==='usuarios'){
    body = usersTableHtml(G.crud.byCompany(G.DB.users, company.id), {showCompany:false});
    if(canManageUsers) actions = '<button class="btn btn-primary" id="companyNewUserBtn">'+icon('plus')+' Nuevo usuario</button>';
  }
  else body = companyActivityHtml(company);

  el.innerHTML = ui.pageHeader('Configuración', 'Módulos activos, usuarios y actividad de '+esc(company.name)+'.', actions)+
    ui.tabsHtml(tabs, state.tab)+ body;
  ui.wireTabs(el, tab=>{ state.tab=tab; renderCompanyConfig(el,user,company,state); });

  if(state.tab==='modulos' && isSuper){
    el.querySelectorAll('[data-toggle-module]').forEach(inp=>inp.addEventListener('change', ()=>{
      const key = inp.getAttribute('data-toggle-module');
      const on = inp.checked;
      const mods = new Set(company.modules||[]);
      if(on) mods.add(key); else mods.delete(key);
      G.crud.updateItem(G.DB.companies, company.id, {modules:[...mods]});
      company.modules = [...mods];
      G.logActivity((on?'activó':'desactivó')+' el módulo '+esc(moduleFlagLabel(key)), company.name, company.id);
      G.toast('Módulo '+(on?'activado':'desactivado'));
      renderCompanyConfig(el,user,company,state);
    }));
  } else if(state.tab==='usuarios'){
    if(canManageUsers){
      const b = document.getElementById('companyNewUserBtn');
      if(b) b.addEventListener('click', ()=> openUserForm({lockCompanyId:company.id, allowedRoles:['ADMIN_EMPRESA','USUARIO_EMPRESA']}, ()=>renderCompanyConfig(el,user,company,state)));
    }
    wireUsersTable(el, {lockCompanyId:company.id, allowedRoles:['ADMIN_EMPRESA','USUARIO_EMPRESA']}, G.crud.byCompany(G.DB.users, company.id), ()=>renderCompanyConfig(el,user,company,state));
  }
}
function companyModulesHtml(company, canToggle){
  const optional = G.MODULES.filter(m=>m.optional && G.OPTIONAL_MODULE_KEYS.includes(m.key));
  const core = G.MODULES.filter(m=>m.core);
  const enabledSet = new Set(company.modules||[]);
  const optCardHtml = m=>{
    const on = enabledSet.has(m.key);
    return '<div class="module-toggle-card"><div class="mtc-icon">'+icon(m.icon)+'</div><div class="mtc-body"><div class="mtc-title">'+esc(m.label)+(m.key==='comercial'?' <span class="subtle" style="font-weight:500">(incluye Clientes)</span>':'')+'</div><div class="mtc-sub">'+(on?'Activo para esta empresa':'No disponible para esta empresa')+'</div></div>'+
      '<label class="switch"><input type="checkbox" data-toggle-module="'+m.key+'" '+(on?'checked':'')+' '+(canToggle?'':'disabled')+'/><span class="slider"></span></label></div>';
  };
  const coreCardHtml = m=>'<div class="module-toggle-card core"><div class="mtc-icon">'+icon(m.icon)+'</div><div class="mtc-body"><div class="mtc-title">'+esc(m.label)+'</div><div class="mtc-sub">Siempre activo</div></div>'+
    '<label class="switch"><input type="checkbox" checked disabled/><span class="slider"></span></label></div>';
  return (canToggle?'':ui.infoCallout('Solo el consultor puede activar o desactivar módulos. Como administrador de empresa, podés ver el estado actual.'))+
    '<div style="margin:16px 0 8px"><b style="font-size:13px">Módulos opcionales</b></div>'+
    '<div class="module-grid">'+optional.map(optCardHtml).join('')+'</div>'+
    '<div style="margin:22px 0 8px"><b style="font-size:13px">Módulos siempre disponibles</b></div>'+
    '<div class="module-grid">'+core.map(coreCardHtml).join('')+'</div>';
}
function companyActivityHtml(company){
  const logs = G.DB.activityLog.filter(l=>l.companyId===company.id).slice(0,60);
  return '<div class="card">'+activityLogListHtml(logs, {showCompany:false})+'</div>';
}

})();
</script>

<script>
/* ============================================================
   PART 16 — Reportes, Perfil de empresa, Asistente IA (placeholder)
   e importación CSV genérica.
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

/* ============================================================
   Importación CSV genérica (Clientes, Empleados, Finanzas)
   ============================================================ */
function parseCSVText(text){
  const lines = text.replace(/\r\n/g,'\n').split('\n').map(l=>l.trim()).filter(l=>l.length);
  return lines.map(line=>{
    // minimal CSV split supporting quoted fields with commas
    const out = []; let cur=''; let inQuotes=false;
    for(let i=0;i<line.length;i++){
      const ch = line[i];
      if(ch==='"'){ inQuotes = !inQuotes; continue; }
      if(ch===',' && !inQuotes){ out.push(cur.trim()); cur=''; continue; }
      cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function matchColumn(header, columns){
  const h = header.toLowerCase().trim();
  return columns.find(c => c.key.toLowerCase()===h || (c.label||'').toLowerCase()===h);
}
G.openCsvImport = function(opts){
  const columns = opts.columns; // [{key,label,required}]
  const state = {rows:null, headerMap:null};
  const overlay = G.modal.open(
    '<div class="modal-head"><div><h3>'+esc(opts.title)+'</h3><div class="card-sub">Pegá o subí un archivo CSV con encabezados en la primera fila.</div></div><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<div class="modal-body">'+
      ui.infoCallout('Columnas esperadas: '+columns.map(c=>'<b>'+esc(c.label)+'</b>'+(c.required?' (obligatoria)':'')).join(', ')+'. El orden no importa, pero los encabezados deben coincidir con estos nombres.')+
      '<div class="field"><label>Archivo CSV</label><input type="file" id="csvFileInput" accept=".csv,text/csv"/></div>'+
      '<div class="field"><label>O pegá el contenido CSV acá</label><textarea id="csvTextArea" rows="6" placeholder="'+esc(columns.map(c=>c.label).join(','))+'\n...">'+'</textarea></div>'+
      '<div><button type="button" class="btn" id="csvPreviewBtn">'+icon('eye')+' Previsualizar</button></div>'+
      '<div id="csvPreviewWrap"></div>'+
      '<div id="csvImportError" style="display:none;color:var(--critical);font-size:12.5px;font-weight:600;"></div>'+
    '</div>'+
    '<div class="modal-foot"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" id="csvImportBtn" disabled>Importar</button></div>',
    {wide:true}
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', G.modal.close));

  const fileInput = overlay.querySelector('#csvFileInput');
  const textArea = overlay.querySelector('#csvTextArea');
  fileInput.addEventListener('change', ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{ textArea.value = String(reader.result||''); };
    reader.readAsText(file);
  });

  function runPreview(){
    const errEl = overlay.querySelector('#csvImportError');
    errEl.style.display='none';
    const importBtn = overlay.querySelector('#csvImportBtn');
    importBtn.disabled = true;
    const text = textArea.value;
    if(!text.trim()){ errEl.textContent='Pegá contenido CSV o subí un archivo.'; errEl.style.display='block'; return; }
    const matrix = parseCSVText(text);
    if(matrix.length<2){ errEl.textContent='El archivo debe tener una fila de encabezado y al menos una fila de datos.'; errEl.style.display='block'; return; }
    const header = matrix[0];
    const mapped = header.map(h=>matchColumn(h, columns));
    const missingRequired = columns.filter(c=>c.required && !mapped.some(m=>m && m.key===c.key));
    if(missingRequired.length){
      errEl.textContent = 'Faltan columnas obligatorias: '+missingRequired.map(c=>c.label).join(', ')+'.';
      errEl.style.display='block';
      overlay.querySelector('#csvPreviewWrap').innerHTML='';
      return;
    }
    const dataRows = matrix.slice(1).map(r=>{
      const obj = {};
      mapped.forEach((col,i)=>{ if(col) obj[col.key] = r[i]!=null ? r[i] : ''; });
      return obj;
    }).filter(o=>Object.values(o).some(v=>String(v).trim().length));
    state.rows = dataRows;
    const previewRows = dataRows.slice(0,5);
    overlay.querySelector('#csvPreviewWrap').innerHTML =
      '<div class="table-card"><div class="table-wrap"><table><thead><tr>'+columns.map(c=>'<th>'+esc(c.label)+'</th>').join('')+'</tr></thead><tbody>'+
      previewRows.map(r=>'<tr>'+columns.map(c=>'<td class="subtle" style="font-size:12px">'+esc(r[c.key]||'—')+'</td>').join('')+'</tr>').join('')+
      '</tbody></table></div></div>'+
      '<div class="subtle" style="font-size:12px;margin-top:8px">Se importarán <b>'+dataRows.length+'</b> registro(s)'+(dataRows.length>5?' (vista previa de los primeros 5)':'')+'.</div>';
    importBtn.disabled = dataRows.length===0;
  }
  overlay.querySelector('#csvPreviewBtn').addEventListener('click', runPreview);

  overlay.querySelector('#csvImportBtn').addEventListener('click', ()=>{
    if(!state.rows || !state.rows.length) return;
    try{
      opts.onImport(state.rows);
      G.modal.close();
      G.toast(state.rows.length+' registro(s) importado(s)');
    }catch(err){
      console.error(err);
      const errEl = overlay.querySelector('#csvImportError');
      errEl.textContent = 'Ocurrió un error al importar: '+err.message;
      errEl.style.display='block';
    }
  });
};

G.pages.perfil = function(el, user, company){
  renderPerfil(el, user, company);
};
function renderPerfil(el, user, company){
  const canEdit = user.role==='SUPER_ADMIN' || user.role==='ADMIN_EMPRESA';
  el.innerHTML = ui.pageHeader('Perfil de empresa', 'Información general, contactos y presencia digital de '+esc(company.name)+'.',
      canEdit ? '<button class="btn btn-primary" id="perfilEditBtn">'+icon('edit')+' Editar datos generales</button>' : '')+
    '<div class="card" style="margin-bottom:16px"><div class="flex items-center gap-sm" style="align-items:flex-start">'+
      '<div style="position:relative;flex:none">'+ui.companyLogoHtml(company, {size:56, fontSize:20})+
        (canEdit?'<button type="button" class="icon-btn" id="perfilLogoBtn" title="Cambiar logo" style="position:absolute;bottom:-8px;right:-8px;width:28px;height:28px;border-radius:50%">'+icon('image')+'</button>':'')+
      '</div>'+
      '<div style="flex:1"><div class="flex items-center gap-sm">'+
        '<div class="card-title" style="font-size:19px">'+esc(company.name)+'</div>'+ui.statusBadgeFor('status',company.status)+
      '</div><div class="card-sub" style="margin-top:4px">'+esc(company.legalName||'')+' · '+esc(company.cuit||'')+'</div>'+
      '<div class="subtle" style="font-size:12.8px;margin-top:10px;max-width:680px">'+esc(company.description||'Sin descripción cargada.')+'</div>'+
      '</div></div></div>'+
    '<div class="grid-2">'+
      ui.card('Datos generales','', '<div class="stack-10">'+
        infoRow2('Actividad', company.activity)+infoRow2('Sector', company.sector)+infoRow2('Localidad', company.city)+
        infoRow2('Año de fundación', company.founded)+infoRow2('Responsable', company.responsible)+
        infoRow2('Facturación estimada (anual)', fmt.currency(company.billingEstimate||0,{compact:true}))+
        infoRow2('Cliente desde', company.createdAt?fmt.dateLong(company.createdAt):'—')+
      '</div>')+
      ui.card('Presencia digital y contacto','',
        '<div class="stack-10">'+
          infoRow2('Sitio web', (company.social&&company.social.web)||company.website||'—')+
          infoRow2('LinkedIn', (company.social&&company.social.linkedin)||'—')+
          infoRow2('Instagram', (company.social&&company.social.instagram)||'—')+
        '</div>'+
        (canEdit?'<button class="btn btn-sm" id="perfilEditSocialBtn" style="margin-top:14px">'+icon('edit')+' Editar redes y sitio web</button>':''))+
    '</div>'+
    '<div style="margin-top:16px">'+ui.card('Contactos', 'Personas de referencia en '+esc(company.name)+'.',
      contactsTableHtml(company, canEdit),
      canEdit?'<button class="btn btn-sm btn-primary" id="perfilNewContactBtn">'+icon('plus')+' Agregar contacto</button>':'')+'</div>';

  const editBtn = document.getElementById('perfilEditBtn');
  if(editBtn) editBtn.addEventListener('click', ()=> openCompanyProfileForm(company, ()=>renderPerfil(el,user,company)));
  const logoBtn = document.getElementById('perfilLogoBtn');
  if(logoBtn) logoBtn.addEventListener('click', ()=> openCompanyLogoForm(company, ()=>renderPerfil(el,user,company)));
  const editSocialBtn = document.getElementById('perfilEditSocialBtn');
  if(editSocialBtn) editSocialBtn.addEventListener('click', ()=> openSocialForm(company, ()=>renderPerfil(el,user,company)));
  const newContactBtn = document.getElementById('perfilNewContactBtn');
  if(newContactBtn) newContactBtn.addEventListener('click', ()=> openContactForm(company, null, ()=>renderPerfil(el,user,company)));
  el.querySelectorAll('[data-edit-contact]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = parseInt(b.getAttribute('data-edit-contact'),10);
    openContactForm(company, idx, ()=>renderPerfil(el,user,company));
  }));
  el.querySelectorAll('[data-del-contact]').forEach(b=>b.addEventListener('click', ()=>{
    const idx = parseInt(b.getAttribute('data-del-contact'),10);
    G.modal.confirm({title:'Eliminar contacto', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      company.contacts.splice(idx,1);
      G.crud.updateItem(G.DB.companies, company.id, {contacts:company.contacts});
      G.logActivity('eliminó un contacto del perfil', company.name, company.id);
      G.toast('Contacto eliminado'); renderPerfil(el,user,company);
    }});
  }));
}
function infoRow2(label, value){
  return '<div class="flex justify-between items-center" style="gap:12px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--border)"><span class="subtle">'+esc(label)+'</span><b style="text-align:right">'+esc(value||'—')+'</b></div>';
}
function contactsTableHtml(company, canEdit){
  const contacts = company.contacts||[];
  if(!contacts.length) return ui.emptyState('users','Todavía no hay contactos cargados.');
  return '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Rol</th><th>Teléfono</th><th>Email</th>'+(canEdit?'<th></th>':'')+'</tr></thead><tbody>'+
    contacts.map((c,i)=>'<tr><td><b>'+esc(c.name)+'</b></td><td class="subtle">'+esc(c.role||'—')+'</td><td class="subtle" style="font-size:12px">'+esc(c.phone||'—')+'</td><td class="subtle" style="font-size:12px">'+esc(c.email||'—')+'</td>'+
      (canEdit?'<td><div class="row-actions"><button class="btn btn-sm icon-btn" data-edit-contact="'+i+'">'+icon('edit')+'</button><button class="btn btn-sm icon-btn" data-del-contact="'+i+'">'+icon('trash')+'</button></div></td>':'')+
      '</tr>').join('')+
    '</tbody></table></div>';
}
function openCompanyProfileForm(company, onDone){
  G.modal.form({
    title:'Editar datos generales', subtitle: company.name, submitLabel:'Guardar cambios', wide:true,
    initial: company,
    fields:[
      {key:'name', label:'Nombre comercial', required:true},
      {key:'legalName', label:'Razón social', required:true},
      {key:'cuit', label:'CUIT', required:true},
      {key:'activity', label:'Actividad', required:true},
      {key:'sector', label:'Rubro / Sector', type:'select', required:true, options: G.sectorOptionsList()},
      {key:'city', label:'Localidad', required:true},
      {key:'founded', label:'Año de fundación', type:'number'},
      {key:'responsible', label:'Responsable', required:true},
      {key:'billingEstimate', label:'Facturación estimada (anual)', type:'number', step:'1'},
      {key:'description', label:'Descripción', type:'textarea', fullWidth:true, rows:4},
    ],
    async onSubmit(v){
      // Estos campos son datos de la empresa (columnas propias en la base), no
      // datos operativos: se guardan vía la API de empresas (como en "Empresas" >
      // Editar), no vía G.crud/persist() -- eso solo sincroniza operational_data
      // y nunca hubiera guardado esto de verdad.
      let res, body;
      try{
        res = await fetch('/api/companies/'+company.id, {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify(v)});
        body = await res.json().catch(()=>({}));
      }catch(err){ throw new Error('No se pudo conectar con el servidor. Probá de nuevo.'); }
      if(!res.ok){
        if(res.status===403) throw new Error('No tenés permiso para editar el perfil de esta empresa.');
        throw new Error('No se pudo guardar el perfil.');
      }
      Object.assign(company, body.company);
      G.logActivity('actualizó el perfil de la empresa', company.name, company.id);
      G.toast('Perfil actualizado.'+G.autoModulesToastMsg(body.autoEnabledModules));
      onDone();
    }
  });
}
function companyLogoZoneHtml(url){
  if(!url) return '<span class="subtle" style="font-size:12px">Sin logo cargado. Se muestran las iniciales de la empresa.</span>';
  return '<img src="'+url+'" style="max-width:160px;max-height:160px;border-radius:10px;display:block;object-fit:contain;background:#fff;padding:8px;border:1px solid var(--border)"/>'+
    '<button type="button" class="btn btn-sm" id="companyLogoRemoveBtn" style="margin-top:8px">'+icon('trash')+' Quitar logo</button>';
}
// Modal chico para subir/quitar el logo -- no usa G.modal.form porque necesita
// leer el archivo a base64 (FileReader) antes de guardar, igual que el editor
// de imagen de la pantalla de inicio (Parte 23). Se guarda en
// G.DB.companyLogos[companyId] y viaja con el resto de los datos operativos
// de la empresa (mismo persist()/sync de siempre), sin columna nueva en la base.
function openCompanyLogoForm(company, onDone){
  let draftLogo = G.companyLogoUrl(company.id);
  const overlay = G.modal.open(
    '<div class="modal-head"><div><h3>Logo de la empresa</h3><div class="card-sub">'+esc(company.name)+'</div></div><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<div class="modal-body">'+
      '<div class="field"><label>Imagen del logo</label>'+
        '<input type="file" id="companyLogoInput" accept="image/*"/>'+
        '<div class="hint">Se muestra acá y en la ficha de "Empresas". Recomendado: menos de 2 MB, fondo blanco o transparente.</div>'+
        '<div id="companyLogoZone" style="margin-top:10px">'+companyLogoZoneHtml(draftLogo)+'</div>'+
      '</div>'+
    '</div>'+
    '<div class="modal-foot"><button type="button" class="btn" data-close>Cancelar</button><button type="button" class="btn btn-primary" id="companyLogoSaveBtn">'+icon('check')+' Guardar</button></div>'
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', G.modal.close));
  function wireRemoveBtn(){
    const rb = document.getElementById('companyLogoRemoveBtn');
    if(rb) rb.addEventListener('click', ()=>{
      draftLogo = '';
      const zone = document.getElementById('companyLogoZone');
      if(zone) zone.innerHTML = companyLogoZoneHtml('');
    });
  }
  wireRemoveBtn();
  const fileInput = document.getElementById('companyLogoInput');
  if(fileInput) fileInput.addEventListener('change', ()=>{
    const file = fileInput.files && fileInput.files[0];
    if(!file) return;
    if(file.size > 2*1024*1024){ G.toast('La imagen es muy pesada (máx. 2 MB).'); fileInput.value=''; return; }
    const reader = new FileReader();
    reader.onload = ()=>{
      draftLogo = reader.result;
      const zone = document.getElementById('companyLogoZone');
      if(zone){ zone.innerHTML = companyLogoZoneHtml(draftLogo); wireRemoveBtn(); }
    };
    reader.readAsDataURL(file);
  });
  const saveBtn = document.getElementById('companyLogoSaveBtn');
  if(saveBtn) saveBtn.addEventListener('click', ()=>{
    G.DB.companyLogos = G.DB.companyLogos || {};
    G.DB.companyLogos[company.id] = draftLogo;
    G.persist();
    G.logActivity(draftLogo?'actualizó el logo de la empresa':'quitó el logo de la empresa', company.name, company.id);
    G.toast(draftLogo?'Logo actualizado':'Logo quitado');
    G.modal.close();
    onDone();
  });
}
function openSocialForm(company, onDone){
  const social = company.social || {web:'',linkedin:'',instagram:''};
  G.modal.form({
    title:'Redes y sitio web', subtitle: company.name, submitLabel:'Guardar',
    initial: {web:social.web||company.website||'', linkedin:social.linkedin||'', instagram:social.instagram||''},
    fields:[
      {key:'web', label:'Sitio web', placeholder:'www.empresa.com.ar'},
      {key:'linkedin', label:'LinkedIn', placeholder:'linkedin.com/company/...'},
      {key:'instagram', label:'Instagram', placeholder:'@empresa'},
    ],
    onSubmit(v){
      const newSocial = {web:v.web, linkedin:v.linkedin, instagram:v.instagram};
      G.crud.updateItem(G.DB.companies, company.id, {social:newSocial, website:v.web});
      company.social = newSocial; company.website = v.web;
      G.logActivity('actualizó las redes y el sitio web de la empresa', company.name, company.id);
      G.toast('Guardado'); onDone();
    }
  });
}
function openContactForm(company, idx, onDone){
  const existing = idx!=null ? company.contacts[idx] : null;
  G.modal.form({
    title: existing?'Editar contacto':'Nuevo contacto', submitLabel: existing?'Guardar cambios':'Agregar contacto',
    initial: existing || {},
    onDelete: existing? ()=>{ company.contacts.splice(idx,1); G.crud.updateItem(G.DB.companies, company.id, {contacts:company.contacts}); G.toast('Eliminado'); onDone(); } : null,
    fields:[
      {key:'name', label:'Nombre', required:true},
      {key:'role', label:'Rol / cargo', placeholder:'Ej: Responsable de compras'},
      {key:'phone', label:'Teléfono', placeholder:'+54 9 11 0000-0000'},
      {key:'email', label:'Email', type:'email'},
    ],
    onSubmit(v){
      company.contacts = company.contacts||[];
      if(existing){ Object.assign(existing, v); } else { company.contacts.push(v); }
      G.crud.updateItem(G.DB.companies, company.id, {contacts:company.contacts});
      G.logActivity(existing?'editó un contacto del perfil':'agregó un contacto al perfil', company.name, company.id);
      G.toast('Guardado'); onDone();
    }
  });
}

const REPORT_TYPES = [
  {key:'ejecutivo', label:'Resumen ejecutivo', icon:'grid', desc:'Panorama general del negocio: finanzas, comercial, RRHH y alertas.'},
  {key:'financiero', label:'Informe financiero', icon:'wallet', desc:'Ingresos, egresos, resultado y evolución del período.'},
  {key:'comercial', label:'Informe comercial', icon:'trending-up', desc:'Ventas, clientes principales y estado del pipeline.'},
  {key:'rrhh', label:'Informe de RRHH', icon:'user-check', desc:'Dotación, costo laboral y distribución por área.'},
];
G.pages.reportes = function(el, user, company){
  const state = el._repState || {type:'ejecutivo', period:'mes'};
  el._repState = state;
  renderReportes(el, user, company, state);
};
function renderReportes(el, user, company, state){
  el.innerHTML = ui.pageHeader('Reportes', 'Generá informes listos para compartir o imprimir, con los datos actuales de '+esc(company.name)+'.',
    '<button class="btn btn-primary" id="repPrintBtn">'+icon('download')+' Imprimir / Guardar como PDF</button>')+
    '<div class="module-grid" style="margin-bottom:20px">'+REPORT_TYPES.map(rt=>
      '<div class="module-toggle-card" data-report-type="'+rt.key+'" style="cursor:pointer;'+(state.type===rt.key?'border-color:var(--accent);background:var(--accent-soft)':'')+'">'+
      '<div class="mtc-icon">'+icon(rt.icon)+'</div><div class="mtc-body"><div class="mtc-title">'+esc(rt.label)+'</div><div class="mtc-sub">'+esc(rt.desc)+'</div></div>'+
      (state.type===rt.key?icon('check-circle'):'')+
      '</div>'
    ).join('')+'</div>'+
    G.periodToggleHtml(state.period)+
    '<div id="reportPreview" style="margin-top:16px"></div>';

  el.querySelectorAll('[data-report-type]').forEach(c=>c.addEventListener('click', ()=>{ state.type=c.getAttribute('data-report-type'); renderReportes(el,user,company,state); }));
  el.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click', ()=>{ state.period=b.getAttribute('data-period'); renderReportes(el,user,company,state); }));
  document.getElementById('repPrintBtn').addEventListener('click', ()=>{
    G.logActivity('exportó un reporte', company.name+' — '+(REPORT_TYPES.find(r=>r.key===state.type)||{}).label, company.id);
    try{ window.print(); }catch(e){ G.toast('No se pudo abrir el diálogo de impresión en este entorno.'); }
  });
  renderReportPreview(document.getElementById('reportPreview'), company, state);
}
function renderReportPreview(el, company, state){
  const kpi = G.companyKPIs(company.id, state.period);
  const periodLabel = (G.PERIODS.find(p=>p.key===state.period)||{}).label || state.period;
  const head = '<div class="flex justify-between items-center" style="margin-bottom:6px"><div><div class="card-title" style="font-size:16px">'+esc((REPORT_TYPES.find(r=>r.key===state.type)||{}).label)+'</div><div class="card-sub">'+esc(company.name)+' · Período: '+esc(periodLabel)+' · Generado '+fmt.dateLong(G.TODAY_ISO)+'</div></div></div>';
  let body = '';
  if(state.type==='ejecutivo'){
    const alerts = G.alertsForCompany(company.id).filter(a=>a.level!=='good');
    body = '<div class="kpi-grid">'+
      ui.kpiCard({icon:'wallet', label:'Ingresos', value: fmt.currency(kpi.ingresos,{compact:true})})+
      ui.kpiCard({icon:'banknote', label:'Resultado', value: fmt.currency(kpi.resultado,{compact:true})})+
      ui.kpiCard({icon:'trending-up', label:'Ventas', value: fmt.currency(kpi.ventas,{compact:true})})+
      ui.kpiCard({icon:'users', label:'Empleados activos', value: kpi.empleadosActivos})+
      '</div>'+
      ui.card('Alertas activas','', alerts.length? '<div class="stack-10">'+alerts.map(a=>'<div>'+ui.badge(a.level,a.title)+' <span class="subtle" style="font-size:12.5px">'+esc(a.desc)+'</span></div>').join('')+'</div>' : ui.emptyState('check-circle','Sin alertas activas en este período.'));
  } else if(state.type==='financiero'){
    body = '<div class="kpi-grid">'+
      ui.kpiCard({icon:'wallet', label:'Ingresos', value: fmt.currency(kpi.ingresos,{compact:true})})+
      ui.kpiCard({icon:'trending-up', label:'Egresos', value: fmt.currency(kpi.egresos,{compact:true})})+
      ui.kpiCard({icon:'banknote', label:'Resultado', value: fmt.currency(kpi.resultado,{compact:true})})+
      ui.kpiCard({icon:'percent', label:'Margen', value: fmt.pct(kpi.margen,1)})+
      '</div>';
  } else if(state.type==='comercial'){
    const topClients = G.salesByClient(company.id, G.periodMonths(state.period)).slice(0,5);
    body = '<div class="kpi-grid">'+
      ui.kpiCard({icon:'trending-up', label:'Ventas', value: fmt.currency(kpi.ventas,{compact:true})})+
      ui.kpiCard({icon:'users', label:'Clientes activos', value: G.DB.clients.filter(c=>c.companyId===company.id && c.status==='Activo').length})+
      '</div>'+
      ui.card('Principales clientes','', topClients.length?'<div class="table-wrap"><table><thead><tr><th>Cliente</th><th class="num">Ventas</th></tr></thead><tbody>'+topClients.map(c=>'<tr><td>'+esc(c.label)+'</td><td class="num mono">'+fmt.currency(c.value)+'</td></tr>').join('')+'</tbody></table></div>':ui.emptyState('users','Sin datos de ventas en este período.'));
  } else if(state.type==='rrhh'){
    body = '<div class="kpi-grid">'+
      ui.kpiCard({icon:'users', label:'Empleados activos', value: kpi.empleadosActivos})+
      ui.kpiCard({icon:'wallet', label:'Costo laboral', value: fmt.currency(kpi.costoLaboral,{compact:true})})+
      '</div>';
  }
  el.innerHTML = '<div class="card">'+head+body+'</div>';
}

/* ============================================================
   MODO Copiloto (antes "Asistente IA")
   ------------------------------------------------------------
   Hoy funciona con reglas (no hay un modelo de lenguaje real
   conectado), pero está armado en capas separadas para que el
   día de mañana la Capa 1 se reemplace por un servicio de IA
   real sin tocar el resto de la aplicación:

     1. AI Service      -> answerCopiloto() (hoy: reglas; a futuro: llamada a un modelo real)
     2. Company Context -> company, user (empresa y rol de quien pregunta)
     3. Business Data    -> G.companyKPIs / G.alertsForCompany / G.lastModoDiagnostic / etc.
     4. Prompt/Analysis  -> interpretación de la pregunta + selección de datos relevantes
     5. Response         -> texto de respuesta mostrado en el chat

   Principio rector: "La IA recomienda. La persona decide." — el
   Copiloto nunca ejecuta cambios por su cuenta, solo informa y
   sugiere en base a los datos reales de la empresa.
   ============================================================ */
const ASISTENTE_SUGGESTIONS = [
  '¿Cómo van las ventas este mes?',
  '¿Cuál es el resultado financiero del mes?',
  '¿Hay alertas activas?',
  '¿Qué debería revisar este mes?',
  '¿Qué productos tienen menor margen?',
  '¿Qué costos aumentaron más?',
  '¿Qué clientes redujeron sus compras?',
  '¿Qué objetivos están en riesgo?',
  'Preparame un resumen de gestión',
];
G.pages.asistente = function(el, user, company){
  const state = el._asistState || {messages:[
    {role:'assistant', text:'Hola '+user.name.split(' ')[0]+', soy MODO Copiloto, el asistente de gestión de '+company.name+'. Hoy funciono con reglas sobre los datos reales de la empresa (todavía no con un modelo de IA real), pero ya puedo ayudarte a leer lo que está pasando y qué priorizar. Probá una sugerencia o escribí tu consulta.'}
  ]};
  el._asistState = state;
  renderAsistente(el, user, company, state);
};
function renderAsistente(el, user, company, state){
  el.innerHTML = ui.pageHeader('MODO Copiloto', 'Versión de demostración basada en reglas sobre los datos reales de '+esc(company.name)+' — preparado para conectarse a un motor de IA real más adelante.')+
    '<div class="card" style="display:flex;flex-direction:column;gap:14px;max-height:64vh;min-height:340px">'+
      '<div id="chatScroll" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding-right:4px">'+
        state.messages.map(m=>'<div class="chat-bubble '+m.role+'">'+m.text+'</div>').join('')+
      '</div>'+
      '<div class="chat-suggest">'+ASISTENTE_SUGGESTIONS.map(q=>'<button type="button" data-suggest="'+esc(q)+'">'+esc(q)+'</button>').join('')+'</div>'+
      '<form id="chatForm" style="display:flex;gap:10px"><input type="text" id="chatInput" placeholder="Escribí tu consulta..." style="flex:1" autocomplete="off"/><button class="btn btn-primary" type="submit">'+icon('send')+'</button></form>'+
      '<div class="subtle" style="font-size:11.5px;text-align:center">'+icon('info','subtle')+' La IA recomienda. La persona decide: MODO Copiloto informa y sugiere, no ejecuta cambios por su cuenta.</div>'+
    '</div>';

  const scroller = document.getElementById('chatScroll');
  scroller.scrollTop = scroller.scrollHeight;

  el.querySelectorAll('[data-suggest]').forEach(b=>b.addEventListener('click', ()=>{
    askAsistente(el, user, company, state, b.getAttribute('data-suggest'));
  }));
  document.getElementById('chatForm').addEventListener('submit', e=>{
    e.preventDefault();
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    askAsistente(el, user, company, state, text);
  });
}
function askAsistente(el, user, company, state, question){
  state.messages.push({role:'user', text: esc(question)});
  const answer = answerCopiloto(company, question);
  state.messages.push({role:'assistant', text: answer});
  renderAsistente(el, user, company, state);
}
/* Capa "AI Service" — hoy basada en reglas, reemplazable a futuro por un modelo real
   sin cambiar cómo la llaman renderAsistente/askAsistente (misma firma: company, pregunta). */
function answerCopiloto(company, question){
  const q = question.toLowerCase();
  const kpi = G.companyKPIs(company.id, 'mes');

  if(/resumen de gesti[oó]n|resum[ií]/.test(q)){
    return resumenDeGestion(company);
  }
  if(/deber[ií]a revisar|qu[eé] priorizo|prioridad/.test(q)){
    return queRevisarEsteMes(company);
  }
  if(/menor margen|margen m[aá]s bajo|margen bajo/.test(q)){
    const prods = G.DB.products.filter(p=>p.companyId===company.id && p.price>0)
      .map(p=>({name:p.name, margin: (p.price-p.variableCost)/p.price*100}))
      .sort((a,b)=>a.margin-b.margin).slice(0,3);
    if(!prods.length) return 'Todavía no hay productos o servicios cargados para calcular márgenes.';
    return 'Los que tienen menor margen son: '+prods.map(p=>'<b>'+esc(p.name)+'</b> ('+fmt.pct(p.margin,1)+')').join(', ')+'. Vale la pena revisar precio o costo variable de esos ítems.';
  }
  if(/costo.*aument|aument.*costo|qu[eé] costo/.test(q)){
    return costosQueMasAumentaron(company);
  }
  if(/cliente.*redu|redu.*cliente|cliente.*menos|dej[oó] de comprar/.test(q)){
    return clientesQueRedujeronCompras(company);
  }
  if(/venta|comercial|factur/.test(q)){
    return 'Las ventas del último mes fueron de <b>'+fmt.currency(kpi.ventas,{compact:true})+'</b>.';
  }
  if(/resultado|financ|ingreso|egreso|gan|perd/.test(q)){
    return 'El resultado del mes es de <b>'+fmt.currency(kpi.resultado,{compact:true})+'</b>, con ingresos de '+fmt.currency(kpi.ingresos,{compact:true})+' y egresos de '+fmt.currency(kpi.egresos,{compact:true})+'.';
  }
  if(/emplead|dotaci|personal|rrhh/.test(q)){
    return 'Actualmente hay <b>'+kpi.empleadosActivos+' empleados activos</b>, con un costo laboral mensual de '+fmt.currency(kpi.costoLaboral,{compact:true})+'.';
  }
  if(/alerta/.test(q)){
    const alerts = G.alertsForCompany(company.id).filter(a=>a.level!=='good');
    if(!alerts.length) return 'No hay alertas activas en este momento. Todo se ve en orden.';
    return 'Hay '+alerts.length+' alerta(s) activa(s): '+alerts.map(a=>'<b>'+esc(a.title)+'</b>').join(', ')+'.';
  }
  if(/equilibrio|breakeven|break-even/.test(q)){
    const bep = G.DB.indicators.find(i=>i.companyId===company.id && i.name.includes('equilibrio'));
    if(!bep || bep.current==null) return 'Todavía no hay suficientes datos para calcular el punto de equilibrio.';
    const status = bep.current>bep.target ? 'por encima del valor de referencia ('+fmt.num(bep.target)+' '+esc(bep.unit||'uds')+'), lo que indica una estructura de costos menos eficiente' : 'dentro del valor de referencia';
    return 'El punto de equilibrio actual es de <b>'+fmt.num(bep.current)+' '+esc(bep.unit||'uds')+'</b>, '+status+'.';
  }
  if(/objetivo|meta|planificaci/.test(q)){
    const objs = G.DB.objectives.filter(o=>o.companyId===company.id && o.status==='En riesgo');
    if(!objs.length) return 'No hay objetivos marcados como "en riesgo" actualmente.';
    return 'Objetivos en riesgo: '+objs.map(o=>'<b>'+esc(o.name)+'</b>').join(', ')+'.';
  }
  return 'Todavía no puedo responder eso con precisión — soy una versión de demostración basada en reglas. Cuando esté conectado a un motor de IA real, voy a poder analizar todos los datos de '+esc(company.name)+' en profundidad.';
}
// alias por compatibilidad, por si algo externo referenciaba el nombre anterior
function answerAsistente(company, question){ return answerCopiloto(company, question); }

function costosQueMasAumentaron(company){
  const months = G.lastMonths(2);
  const prevKey = months[0].key, currKey = months[1].key;
  const byCat = {};
  G.DB.finance.expenses.filter(e=>e.companyId===company.id).forEach(e=>{
    const mk = e.date.slice(0,7);
    if(mk!==prevKey && mk!==currKey) return;
    byCat[e.category] = byCat[e.category] || {prev:0, curr:0};
    if(mk===prevKey) byCat[e.category].prev += e.amount; else byCat[e.category].curr += e.amount;
  });
  const deltas = Object.entries(byCat).map(([cat,v])=>({cat, prev:v.prev, curr:v.curr, delta: G.pctDelta(v.curr, v.prev)}))
    .filter(d=>d.delta!=null && d.delta>0).sort((a,b)=>b.delta-a.delta).slice(0,3);
  if(!deltas.length) return 'No detecto rubros de costos con aumentos significativos respecto del mes anterior.';
  return 'Los rubros que más aumentaron respecto del mes anterior son: '+deltas.map(d=>'<b>'+esc(d.cat)+'</b> ('+fmt.pct(d.delta)+', de '+fmt.currency(d.prev,{compact:true})+' a '+fmt.currency(d.curr,{compact:true})+')').join(', ')+'.';
}

function clientesQueRedujeronCompras(company){
  const months = G.lastMonths(2);
  const prevKey = months[0].key, currKey = months[1].key;
  const byClient = {};
  G.DB.sales.filter(s=>s.companyId===company.id).forEach(s=>{
    const mk = s.date.slice(0,7);
    if(mk!==prevKey && mk!==currKey) return;
    byClient[s.clientId] = byClient[s.clientId] || {prev:0, curr:0};
    if(mk===prevKey) byClient[s.clientId].prev += s.total; else byClient[s.clientId].curr += s.total;
  });
  const drops = Object.entries(byClient).filter(([,v])=>v.prev>0 && v.curr<v.prev)
    .map(([cid,v])=>{ const c=G.DB.clients.find(c=>c.id===cid); return {name:c?c.name:'—', prev:v.prev, curr:v.curr, delta:G.pctDelta(v.curr,v.prev)}; })
    .sort((a,b)=>a.delta-b.delta).slice(0,3);
  if(!drops.length) return 'No detecto clientes con caídas de compra relevantes entre el mes anterior y el actual.';
  return 'Los clientes que más redujeron sus compras son: '+drops.map(d=>'<b>'+esc(d.name)+'</b> ('+fmt.pct(d.delta)+', de '+fmt.currency(d.prev,{compact:true})+' a '+fmt.currency(d.curr,{compact:true})+')').join(', ')+'. Puede valer la pena contactarlos para entender qué pasó.';
}

function queRevisarEsteMes(company){
  const alerts = G.alertsForCompany(company.id).filter(a=>a.level==='critical' || a.level==='warning').slice(0,3);
  const diag = G.lastModoDiagnostic(company.id);
  const parts = [];
  if(alerts.length) parts.push('En alertas: '+alerts.map(a=>'<b>'+esc(a.title)+'</b>').join(', ')+'.');
  if(diag){
    const prios = G.modoPriorities(diag.scores, 2);
    if(prios.length) parts.push('Según el último diagnóstico, las dimensiones más débiles son '+prios.map(p=>'<b>'+esc(p.label)+'</b> ('+p.score+'/100)').join(' y ')+'.');
  }
  if(!parts.length) return 'No encuentro alertas activas ni un diagnóstico reciente con prioridades marcadas: por ahora no hay nada urgente que revisar.';
  return parts.join(' ')+' Te sugiero empezar por ahí.';
}

function resumenDeGestion(company){
  const kpi = G.companyKPIs(company.id, 'mes');
  const alerts = G.alertsForCompany(company.id).filter(a=>a.level!=='good');
  const diag = G.lastModoDiagnostic(company.id);
  const acc = G.actionsSummary(company.id);
  let txt = '<b>Resumen de gestión — '+esc(company.name)+'</b><br>'+
    'Resultado del mes: '+fmt.currency(kpi.resultado,{compact:true})+' (ingresos '+fmt.currency(kpi.ingresos,{compact:true})+', egresos '+fmt.currency(kpi.egresos,{compact:true})+').<br>'+
    'Alertas activas: '+alerts.length+(alerts.length?' ('+alerts.filter(a=>a.level==='critical').length+' crítica(s))':'')+'.<br>'+
    'Acciones de mejora: '+acc.total+' en total, '+acc.vencidas+' vencida(s), '+acc.criticas+' crítica(s).';
  if(diag) txt += '<br>Índice MODO: '+G.computeModoIndex(diag.scores, G.DB.modoWeights[company.id])+'/100 ('+G.modoTier(G.computeModoIndex(diag.scores, G.DB.modoWeights[company.id])).label+').';
  return txt;
}

})();
</script>

<script>
/* ============================================================
   PART 17 — MODO Diagnóstico + Índice MODO
   Evolución MODO Gestión 2.0 — Capa de Inteligencia.
   Evalúa 8 dimensiones (0-100), calcula el Índice MODO (no
   hardcodeado — ver G.computeModoIndex en Part 6) y conecta el
   resultado con Planificación (Objetivos) y Consultoría (Acciones).
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

const MODO_INDICATOR_HINT = {
  finanzas:'Rentabilidad neta', costos:'Margen bruto', comercial:'Ventas mensuales',
  personas:'Rotación de personal', procesos:'Tiempo de ciclo de procesos críticos',
  planificacion:'% de avance de objetivos', tecnologia:'Adopción de herramientas digitales',
  innovacion:'Iniciativas implementadas',
};
function addDaysISO(iso, days){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

G.pages.diagnostico = function(el, user, company){
  const canEdit = user.role==='SUPER_ADMIN' || user.role==='ADMIN_EMPRESA';
  renderDiagnostico(el, user, company, canEdit);
};

function renderDiagnostico(el, user, company, canEdit){
  const diag = G.lastModoDiagnostic(company.id);
  const history = G.DB.modoDiagnostics.filter(d=>d.companyId===company.id).sort((a,b)=>a.date.localeCompare(b.date));
  const actionBtn = canEdit ? '<button class="btn btn-primary" id="modoDiagBtn">'+icon(diag?'edit':'plus')+' '+(diag?'Actualizar diagnóstico':'Realizar diagnóstico inicial')+'</button>' : '';

  el.innerHTML = ui.pageHeader('Diagnóstico', 'Evaluación integral de la gestión de '+esc(company.name)+': cómo está, qué está pasando y qué conviene priorizar.', actionBtn);

  if(!diag){
    el.innerHTML += ui.emptyState('activity', canEdit ? 'Todavía no se realizó un diagnóstico de esta empresa. Empezá por evaluar sus 8 dimensiones clave.' : 'Todavía no se realizó un diagnóstico de esta empresa.');
  } else {
    el.innerHTML += diagnosticoBodyHtml(company, diag, history, canEdit);
  }

  const b = document.getElementById('modoDiagBtn');
  if(b) b.addEventListener('click', ()=> openModoDiagnosticoForm(company, diag, ()=>renderDiagnostico(el,user,company,canEdit)));

  if(diag && canEdit){
    el.querySelectorAll('[data-crear-plan]').forEach(btn=>btn.addEventListener('click', ()=>{
      const dimKey = btn.getAttribute('data-crear-plan');
      const dim = G.modoDimByKey(dimKey);
      const score = diag.scores[dimKey];
      crearPlanDesdeDiagnostico(company, dim, score, ()=>renderDiagnostico(el,user,company,canEdit));
    }));
    if(history.length>1){
      const chartEl = document.getElementById('modoTrendChart');
      if(chartEl) G.charts.line(chartEl, [{name:'Índice MODO', data: history.map(h=>({x:fmt.date(h.date), y:G.computeModoIndex(h.scores, G.DB.modoWeights[company.id])}))}], {showArea:true, money:false});
    }
  }
}

function diagnosticoBodyHtml(company, diag, history, canEdit){
  const index = G.computeModoIndex(diag.scores, G.DB.modoWeights[company.id]);
  const tier = G.modoTier(index);
  const strengths = G.modoStrengths(diag.scores, 4);
  const priorities = G.modoPriorities(diag.scores, 5);
  const prevIndex = history.length>1 ? G.computeModoIndex(history[history.length-2].scores, G.DB.modoWeights[company.id]) : null;
  const delta = prevIndex!=null ? index-prevIndex : null;

  const sortedDims = G.MODO_DIMENSIONS.map(d=>({...d, score: diag.scores[d.key]})).sort((a,b)=>(b.score||0)-(a.score||0));

  return '<div class="grid-2 diag-index-grid" style="margin-bottom:16px">'+
      '<div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px">'+
        '<div class="subtle" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em">Índice MODO</div>'+
        '<div style="font-family:var(--font-display);font-weight:800;font-size:52px;line-height:1">'+(index!=null?index:'—')+'<span style="font-size:20px;color:var(--text-muted)">/100</span></div>'+
        ui.badge(tier.tone, tier.label)+
        (delta!=null ? '<div class="kpi-delta '+(delta>0?'up':delta<0?'down':'flat')+'" style="margin-top:4px">'+icon(delta>0?'arrow-up':delta<0?'arrow-down':'arrow-right')+' '+Math.abs(delta)+' pts vs. diagnóstico anterior</div>' : '')+
        '<div class="subtle" style="font-size:11.5px;margin-top:6px">Diagnóstico del '+fmt.dateLong(diag.date)+'</div>'+
      '</div>'+
      ui.card('Puntuación por dimensión','Cuánto más alto, mejor', '<div class="stack-10">'+sortedDims.map(d=>{
        const tone = G.modoTone(d.score);
        return '<div><div class="flex justify-between" style="font-size:12.5px;margin-bottom:4px"><span style="font-weight:600">'+icon(d.icon,'subtle')+' '+esc(d.label)+'</span><span class="mono subtle">'+d.score+'/100</span></div>'+ui.progressBar(d.score, tone)+'</div>';
      }).join('')+'</div>')+
    '</div>'+
    (history.length>1 ? '<div class="card" style="margin-bottom:16px"><div class="card-title" style="margin-bottom:10px">Evolución del Índice MODO</div><div id="modoTrendChart"></div></div>' : '')+
    '<div class="grid-2" style="margin-bottom:16px">'+
      ui.card('Fortalezas','Dimensiones mejor evaluadas', strengths.length ? '<div class="stack-10">'+strengths.map(s=>'<div class="flex items-center gap-sm">'+icon('thumbs-up','subtle')+' <b style="font-size:13px">'+esc(s.label)+'</b><span class="subtle mono" style="margin-left:auto">'+s.score+'/100</span></div>').join('')+'</div>' : ui.emptyState('thumbs-up','Ninguna dimensión llega todavía a nivel de fortaleza (70+).'))+
      ui.card('Áreas de atención','Dimensiones a trabajar', priorities.length ? '<div class="stack-10">'+priorities.map(p=>'<div class="flex items-center gap-sm">'+icon('alert-triangle','subtle')+' <b style="font-size:13px">'+esc(p.label)+'</b><span class="subtle mono" style="margin-left:auto">'+p.score+'/100</span></div>').join('')+'</div>' : ui.emptyState('check-circle','No hay áreas críticas: todas las dimensiones están en 60 o más.'))+
    '</div>'+
    ui.card('Prioridades sugeridas','Generadas a partir de las dimensiones más débiles del diagnóstico',
      priorities.length ?
      '<div class="stack-16">'+priorities.map((p,i)=>
        '<div class="flex justify-between items-center" style="gap:14px;padding:10px 0;'+(i<priorities.length-1?'border-bottom:1px solid var(--border)':'')+'">'+
          '<div style="display:flex;gap:12px;align-items:flex-start"><div style="width:24px;height:24px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none">'+(i+1)+'</div>'+
          '<div><b style="font-size:13.5px">'+esc(p.label)+'</b> <span class="subtle mono" style="font-size:11.5px">('+p.score+'/100)</span><div class="subtle" style="font-size:12.5px;margin-top:2px">'+esc(p.suggestion)+'</div></div></div>'+
          (canEdit ? '<button class="btn btn-sm btn-primary" style="flex:none" data-crear-plan="'+p.key+'">'+icon('plus')+' Crear plan de acción</button>' : '')+
        '</div>'
      ).join('')+'</div>'
      : ui.emptyState('check-circle','No hay prioridades urgentes en este momento.'))+
    (diag.notes ? '<div style="margin-top:16px">'+ui.infoCallout('<b>Nota del consultor: </b>'+esc(diag.notes))+'</div>' : '');
}

function crearPlanDesdeDiagnostico(company, dim, score, onDone){
  const existingIndicator = G.DB.indicators.find(i=>i.companyId===company.id && i.category && i.category.toLowerCase().startsWith(dim.key.slice(0,4)));
  G.openObjectiveForm(company, null, onDone, {
    subtitle: 'Generado desde Diagnóstico — '+dim.label+' ('+score+'/100)',
    prefill: {
      name: 'Mejorar '+dim.label.toLowerCase(),
      description: dim.suggestion,
      responsible: company.responsible || '',
      startDate: G.TODAY_ISO,
      targetDate: addDaysISO(G.TODAY_ISO, 90),
      indicator: existingIndicator ? existingIndicator.name : (MODO_INDICATOR_HINT[dim.key]||dim.label),
      goal: 100, current: score, status:'No iniciado',
      origin: 'Diagnóstico',
    },
    onCreated(objective){
      G.openAccionForm(company, null, onDone, {
        subtitle: 'Vinculada al objetivo "'+objective.name+'"',
        prefill: {
          problem: dim.label+' por debajo del nivel esperado ('+score+'/100)',
          action: dim.suggestion,
          origin: 'Diagnóstico', objectiveId: objective.id, indicatorId: '',
          responsible: company.responsible || '', startDate: G.TODAY_ISO, dueDate: addDaysISO(G.TODAY_ISO, 30),
          priority: score<45 ? 'Alta' : 'Media', status:'Pendiente', comments:'', result:'',
        }
      });
    }
  });
}

function openModoDiagnosticoForm(company, existing, onDone){
  const initial = {};
  if(existing) G.MODO_DIMENSIONS.forEach(d=> initial['score_'+d.key] = existing.scores[d.key]);
  if(existing) initial.notes = existing.notes;
  G.modal.form({
    title: existing?'Actualizar diagnóstico':'Diagnóstico inicial', subtitle: company.name,
    submitLabel: 'Guardar diagnóstico', wide:true,
    note: 'Puntuá cada dimensión de 0 (crítico) a 100 (excelente). El Índice MODO se calcula automáticamente como promedio de las 8 dimensiones.',
    initial,
    fields: G.MODO_DIMENSIONS.map(d=>({key:'score_'+d.key, label:d.label, type:'number', step:'1', required:true, placeholder:'0-100'}))
      .concat([{key:'notes', label:'Notas del consultor (opcional)', type:'textarea', fullWidth:true}]),
    onSubmit(v){
      const scores = {};
      let invalid = false;
      G.MODO_DIMENSIONS.forEach(d=>{
        let val = Math.round(Number(v['score_'+d.key]));
        if(isNaN(val)) invalid = true;
        scores[d.key] = Math.max(0, Math.min(100, val));
      });
      if(invalid) return false;
      G.crud.addItem(G.DB.modoDiagnostics, {companyId:company.id, date:G.TODAY_ISO, scores, notes:v.notes||''}, 'modo');
      G.logActivity('realizó un nuevo diagnóstico MODO', company.name, company.id);
      G.toast('Diagnóstico guardado');
      onDone();
    }
  });
}

})();
</script>

<script>
/* ============================================================
   PART 18 — Historia de Gestión
   Línea de tiempo transversal (sección 8 del brief): agrega
   diagnósticos, objetivos, acciones, reuniones, notas de
   consultoría y el registro de auditoría (G.historyForCompany,
   Part 6) en un único historial navegable por tipo.
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

const HIST_TYPE_LABELS = {
  diagnostico:'Diagnóstico', objetivo:'Objetivo', accion:'Acción',
  reunion:'Reunión', nota:'Nota privada', cambio:'Cambio',
};
const HIST_FILTERS = [
  {key:'todos', label:'Todo'},
  {key:'diagnostico', label:'Diagnósticos'},
  {key:'objetivo', label:'Objetivos'},
  {key:'accion', label:'Acciones'},
  {key:'reunion', label:'Reuniones'},
  {key:'cambio', label:'Cambios'},
  {key:'nota', label:'Notas privadas', superOnly:true},
];

G.pages.historia = function(el, user, company){
  const isSuper = user.role==='SUPER_ADMIN';
  const state = el._histState || {filter:'todos'};

  renderHistoria(el, user, company, isSuper, state);
};

function renderHistoria(el, user, company, isSuper, state){
  const events = G.historyForCompany(company.id, {includePrivate:isSuper}).slice().reverse(); // más reciente primero
  const filtered = state.filter==='todos' ? events : events.filter(e=>e.type===state.filter);

  el.innerHTML = ui.pageHeader('Historia de Gestión', 'La evolución de '+esc(company.name)+' en un solo lugar: diagnósticos, objetivos, acciones, reuniones y cambios, en orden cronológico.')+
    '<div class="hist-filters">'+HIST_FILTERS.filter(f=>!f.superOnly || isSuper).map(f=>
      '<button type="button" data-hist-filter="'+f.key+'" class="'+(state.filter===f.key?'active':'')+'">'+esc(f.label)+(f.key!=='todos'?' ('+events.filter(e=>e.type===f.key).length+')':'')+'</button>'
    ).join('')+'</div>'+
    '<div class="card">'+
      (filtered.length ? '<div class="hist-timeline">'+filtered.map(histItemHtml).join('')+'</div>'
        : ui.emptyState('calendar', events.length ? 'No hay eventos de este tipo todavía.' : 'Todavía no hay historia registrada para esta empresa: a medida que se realicen diagnósticos, objetivos, acciones y reuniones, van a aparecer acá.'))+
    '</div>';

  el.querySelectorAll('[data-hist-filter]').forEach(b=>b.addEventListener('click', ()=>{
    state.filter = b.getAttribute('data-hist-filter');
    renderHistoria(el, user, company, isSuper, state);
  }));
}

function histItemHtml(e){
  const tone = (e.type==='nota' || e.type==='cambio') ? 'tone-muted' : (e.type==='accion' ? 'tone-good' : '');
  return '<div class="hist-item">'+
    '<div class="hist-icon '+tone+'">'+icon(e.icon)+'</div>'+
    '<div class="hist-body">'+
      '<div class="hist-date">'+fmt.dateLong(e.date)+' · '+esc(HIST_TYPE_LABELS[e.type]||e.type)+'</div>'+
      '<div class="hist-title">'+esc(e.title)+'</div>'+
      (e.desc ? '<div class="hist-desc">'+esc(e.desc)+'</div>' : '')+
    '</div>'+
  '</div>';
}

})();
</script>

<script>
/* ============================================================
   PART 19 — MODO Red
   Prepara el modelo conceptual (sección 18-19 del brief) sin
   construir todavía un marketplace completo: permite a la empresa
   pedir ayuda a un profesional externo. El consultor podrá
   asignar un profesional real en una etapa futura.
   Modelo: Empresa -> Necesidad -> Solicitud de asistencia ->
           Profesional -> Intervención -> Resultado
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

function addDaysISO(iso, days){
  const d = new Date(iso+'T00:00:00');
  d.setDate(d.getDate()+days);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

const PROFESSIONAL_AREAS = ['Finanzas','Costos','RRHH','Marketing','Comercial','Tecnología','IA','Procesos','Legal','Contabilidad','Innovación'];
const AREA_ICONS = {
  Finanzas:'wallet', Costos:'calculator', RRHH:'user-check', Marketing:'trending-up', Comercial:'trending-up',
  Tecnología:'settings', IA:'sparkles', Procesos:'layers', Legal:'shield-check', Contabilidad:'file-text', Innovación:'bulb',
};

G.pages.red = function(el, user, company){
  renderRed(el, user, company);
};

function renderRed(el, user, company){
  const requests = G.DB.helpRequests.filter(r=>r.companyId===company.id).sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||''));

  el.innerHTML = ui.pageHeader('MODO Red', 'Una red de profesionales externos (finanzas, costos, RRHH, tecnología y más) que va a poder intervenir en tu empresa cuando lo necesites. Hoy podés dejar una solicitud; la asignación de profesionales llega en una etapa futura.',
      '<button class="btn btn-primary" id="redHelpBtn">'+icon('plus')+' Necesito ayuda</button>')+
    '<div class="card" style="margin-bottom:16px">'+
      '<div class="card-title" style="margin-bottom:12px">Cómo funciona</div>'+
      '<div class="flex items-center gap-sm" style="flex-wrap:wrap;font-size:12.5px">'+
        ['Empresa','Necesidad','Solicitud de asistencia','Profesional','Intervención','Resultado'].map((s,i,arr)=>
          '<span class="badge" style="background:var(--surface-2)">'+esc(s)+'</span>'+(i<arr.length-1?icon('arrow-right','subtle'):'')
        ).join('')+
      '</div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:16px">'+
      '<div class="card-title" style="margin-bottom:12px">Áreas disponibles en la red</div>'+
      '<div class="module-grid">'+PROFESSIONAL_AREAS.map(a=>
        '<div class="module-toggle-card" style="cursor:default"><div class="flex items-center gap-sm">'+icon(AREA_ICONS[a]||'briefcase')+'<b style="font-size:12.8px">'+esc(a)+'</b></div></div>'
      ).join('')+'</div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="card-title" style="margin-bottom:12px">Tus solicitudes</div>'+
      (requests.length ? '<div class="table-wrap"><table><thead><tr><th>Área</th><th>Problema</th><th>Prioridad</th><th>Fecha deseada</th><th>Estado</th><th>Solicitado por</th></tr></thead><tbody>'+
        requests.map(r=>'<tr><td><b>'+esc(r.area)+'</b></td><td class="subtle" style="max-width:280px">'+esc(r.problem)+'</td><td>'+ui.badge(r.priority==='Alta'?'critical':r.priority==='Media'?'warning':'neutral', r.priority)+'</td><td class="subtle">'+fmt.date(r.desiredDate)+'</td><td>'+ui.badge('warning', r.status)+'</td><td class="subtle">'+esc(r.requestedBy)+'</td></tr>').join('')+
        '</tbody></table></div>'
        : ui.emptyState('briefcase','Todavía no se registraron solicitudes de ayuda para esta empresa.'))+
    '</div>';

  el.querySelector('#redHelpBtn').addEventListener('click', ()=> openHelpRequestForm(user, company, ()=>renderRed(el,user,company)));
}

function openHelpRequestForm(user, company, onDone){
  const objectives = G.DB.objectives.filter(o=>o.companyId===company.id);
  G.modal.form({
    title:'Necesito ayuda', subtitle: company.name,
    submitLabel:'Enviar solicitud',
    note:'Tu consultor va a revisar esta solicitud y coordinar la asignación de un profesional de la red.',
    initial: {priority:'Media', desiredDate: addDaysISO(G.TODAY_ISO,14)},
    fields:[
      {key:'area', label:'Área', type:'select', required:true, options:PROFESSIONAL_AREAS},
      {key:'problem', label:'Problema', type:'text', required:true, placeholder:'Ej: Necesitamos ordenar la estructura de costos'},
      {key:'description', label:'Descripción', type:'textarea', fullWidth:true, placeholder:'Contanos un poco más de contexto...'},
      {key:'priority', label:'Prioridad', type:'select', required:true, options:['Alta','Media','Baja']},
      {key:'objective', label:'Objetivo relacionado (opcional)', type:'select', options:[''].concat(objectives.map(o=>o.name))},
      {key:'desiredDate', label:'Fecha deseada', type:'date', required:true},
    ],
    onSubmit(v){
      G.crud.addItem(G.DB.helpRequests, {companyId:company.id, area:v.area, problem:v.problem, description:v.description||'',
        priority:v.priority, objective:v.objective||'', desiredDate:v.desiredDate, status:'Pendiente', requestedBy:user.name, createdAt:G.TODAY_ISO}, 'help');
      G.logActivity('solicitó ayuda a un profesional externo (MODO Red)', v.area, company.id);
      G.toast('Solicitud enviada. Tu consultor la va a revisar.');
      onDone();
