<style>
/* ============================================================
   MODO Gestión — Design tokens
   ============================================================ */
:root{
  color-scheme: light;
  /* Marca: navy / naranja / verde azulado / crema (ver .VOZ · MODO GESTIÓN) */
  --brand-navy: #0c2036;
  --brand-orange: #b25632;
  --brand-teal: #0f9481;
  --brand-cream: #ece4dc;

  --bg: #f6f2ec;
  --bg-inset: #eee5d8;
  --surface: #fffdfa;
  --surface-2: #efe6da;
  --surface-raised: #ffffff;
  --border: rgba(12,32,54,0.12);
  --border-strong: rgba(12,32,54,0.20);
  --text-primary: #0c2036;
  --text-secondary: #5c6673;
  --text-muted: #948a7c;
  --accent: #b25632;
  --accent-600: #93441f;
  --accent-ink: #ffffff;
  --accent-soft: #f5e2d8;
  --accent-soft-border: rgba(178,86,50,0.32);

  --good: #158a63;
  --good-soft: #dcece5;
  --warning: #a3690b;
  --warning-soft: #f6e8d2;
  --serious: #a83f1d;
  --serious-soft: #f3ddd2;
  --critical: #c73838;
  --critical-soft: #f8dcdc;

  --series-1: #b25632;
  --series-2: #0f9481;
  --series-3: #3f74d1;
  --series-4: #b98000;
  --series-5: #7a54c9;
  --series-6: #cf6d94;
  --series-7: #4f8f3e;
  --series-8: #96432a;

  --grid-line: #e5ded2;
  --axis-line: #cabfa9;

  --shadow-sm: 0 1px 2px rgba(12,32,54,0.07);
  --shadow-md: 0 6px 20px -6px rgba(12,32,54,0.18);
  --shadow-lg: 0 16px 40px -12px rgba(12,32,54,0.28);

  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', 'SFMono-Regular', Menlo, monospace;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 18px;
  --sidebar-w: 258px;
  --topbar-h: 64px;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg: #0d1826;
    --bg-inset: #09121e;
    --surface: #142334;
    --surface-2: #1a2c40;
    --surface-raised: #1a2c40;
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.18);
    --text-primary: #f2efe8;
    --text-secondary: #c3cad4;
    --text-muted: #8b93a0;
    --accent: #c76a3f;
    --accent-600: #db8355;
    --accent-ink: #06101c;
    --accent-soft: rgba(199,106,63,0.18);
    --accent-soft-border: rgba(199,106,63,0.4);

    --good: #29ab8e;
    --good-soft: rgba(41,171,142,0.16);
    --warning: #f0b429;
    --warning-soft: rgba(240,180,41,0.16);
    --serious: #e2593a;
    --serious-soft: rgba(226,89,58,0.16);
    --critical: #e66767;
    --critical-soft: rgba(230,103,103,0.16);

    --series-1: #c76a3f;
    --series-2: #1f9f8a;
    --series-3: #5a8ce0;
    --series-4: #b98420;
    --series-5: #9060d9;
    --series-6: #cc6f95;
    --series-7: #5ba648;
    --series-8: #a8482a;

    --grid-line: #24344a;
    --axis-line: #3a4d66;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 6px 20px -6px rgba(0,0,0,0.5);
    --shadow-lg: 0 20px 50px -14px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg: #0d1826;
  --bg-inset: #09121e;
  --surface: #142334;
  --surface-2: #1a2c40;
  --surface-raised: #1a2c40;
  --border: rgba(255,255,255,0.10);
  --border-strong: rgba(255,255,255,0.18);
  --text-primary: #f2efe8;
  --text-secondary: #c3cad4;
  --text-muted: #8b93a0;
  --accent: #c76a3f;
  --accent-600: #db8355;
  --accent-ink: #06101c;
  --accent-soft: rgba(199,106,63,0.18);
  --accent-soft-border: rgba(199,106,63,0.4);

  --good: #29ab8e;
  --good-soft: rgba(41,171,142,0.16);
  --warning: #f0b429;
  --warning-soft: rgba(240,180,41,0.16);
  --serious: #e2593a;
  --serious-soft: rgba(226,89,58,0.16);
  --critical: #e66767;
  --critical-soft: rgba(230,103,103,0.16);

  --series-1: #c76a3f;
  --series-2: #1f9f8a;
  --series-3: #5a8ce0;
  --series-4: #b98420;
  --series-5: #9060d9;
  --series-6: #cc6f95;
  --series-7: #5ba648;
  --series-8: #a8482a;

  --grid-line: #24344a;
  --axis-line: #3a4d66;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
  --shadow-md: 0 6px 20px -6px rgba(0,0,0,0.5);
  --shadow-lg: 0 20px 50px -14px rgba(0,0,0,0.6);
}

/* ============================================================
   Reset & base
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:14.5px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
h1,h2,h3,h4{font-family:var(--font-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-0.01em;}
p{margin:0;}
button{font-family:inherit;}
a{color:var(--accent);text-decoration:none;}
ul,ol{margin:0;padding:0;list-style:none;}
input,select,textarea,button{font-size:inherit;color:inherit;}
::selection{background:var(--accent-soft);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px;}
svg text{font-family:var(--font-body);}
svg.icon{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle;}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;}
.tabular{font-variant-numeric:tabular-nums;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; transition-duration:0.001ms !important;}
}

/* ============================================================
   Utility
   ============================================================ */
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-xs{gap:6px;} .gap-sm{gap:10px;} .gap-md{gap:16px;} .gap-lg{gap:24px;}
.grow{flex:1 1 auto;}
.muted{color:var(--text-secondary);}
.subtle{color:var(--text-muted);}
.wrap{flex-wrap:wrap;}
.hide-mobile{}
.scrollx{overflow-x:auto;}
.w-full{width:100%;}
.text-right{text-align:right;}
.text-center{text-align:center;}

/* ============================================================
   App shell
   ============================================================ */
#app{min-height:100%;}
.app-shell{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh;background:var(--bg);}

/* Sidebar */
.sidebar{
  background:var(--surface);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  z-index:40;
}
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 20px 16px;
}
.brand-mark{
  width:34px;height:34px;border-radius:10px;
  background:var(--brand-navy, #0c2036);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-family:var(--font-display);font-weight:800;flex:none;
  box-shadow:var(--shadow-sm);
}
.brand-text{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-0.02em;line-height:1;}
.brand-sub{font-size:10.5px;color:var(--text-muted);letter-spacing:0.06em;text-transform:uppercase;margin-top:2px;}

/* Toggle-switch brand mark (".MODO" wordmark icon) */
.toggle-mark{display:inline-block;aspect-ratio:1.85/1;border-radius:999px;position:relative;background:var(--brand-orange,var(--accent));vertical-align:middle;flex:none;}
.toggle-mark .toggle-mark-dot{position:absolute;top:10%;bottom:10%;right:8%;aspect-ratio:1;border-radius:50%;background:#fff;}
.brand-lockup{display:inline-flex;flex-direction:column;line-height:1;}
.brand-lockup .brand-word{display:inline-flex;align-items:center;gap:0.16em;font-family:var(--font-display);font-weight:800;letter-spacing:-0.01em;}
.brand-lockup .brand-subword{font-family:var(--font-display);font-weight:800;letter-spacing:0.01em;margin-top:0.1em;}

.workspace-switch{
  margin:0 14px 10px;padding:10px 12px;border-radius:var(--radius-md);
  background:var(--surface-2);border:1px solid var(--border);
  cursor:pointer;
}
.workspace-switch:hover{border-color:var(--border-strong);}
.workspace-switch .ws-label{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-muted);}
.workspace-switch .ws-name{font-family:var(--font-display);font-weight:700;font-size:13.5px;margin-top:2px;display:flex;align-items:center;justify-content:space-between;gap:6px;}

.nav-scroll{flex:1;padding:6px 12px 16px;}
.nav-group{margin-top:14px;}
.nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:0.08em;color:var(--text-muted);padding:0 10px;margin-bottom:6px;font-weight:600;}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:10px;
  color:var(--text-secondary);font-weight:600;font-size:13.5px;
  cursor:pointer;position:relative;
  border:1px solid transparent;
}
.nav-item:hover{background:var(--surface-2);color:var(--text-primary);}
.nav-item.active{background:var(--accent-soft);color:var(--accent-600);border-color:var(--accent-soft-border);}
:root[data-theme="dark"] .nav-item.active,
:root:not([data-theme="light"]) .nav-item.active{color:var(--accent-600);}
.nav-item .icon{width:17px;height:17px;flex:none;}
.nav-item .nav-badge{margin-left:auto;font-size:10px;background:var(--critical);color:#fff;border-radius:20px;padding:1px 6px;font-weight:700;}

.sidebar-foot{padding:12px;border-top:1px solid var(--border);}
.consultant-flag{
  display:flex;gap:8px;align-items:flex-start;
  background:var(--accent-soft);border:1px solid var(--accent-soft-border);
  border-radius:var(--radius-md);padding:10px 12px;margin:0 12px 12px;font-size:12px;color:var(--accent-600);
}

/* Topbar */
/* min-width:0 acá por la misma razón que en .content (ver más abajo): .topbar
   es un item de un flex-container en columna (.flex-col.grow), así que sin esto
   sus hijos (crumb + topbar-actions) pueden empujar el ancho de toda la página
   en pantallas angostas en vez de achicarse/truncarse dentro del topbar. */
.topbar{
  height:var(--topbar-h);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 24px;
  background:var(--surface);position:sticky;top:0;z-index:30;min-width:0;
}
/* flex:1 + min-width:0 + ellipsis: el breadcrumb se trunca en vez de forzar
   overflow horizontal cuando el nombre de la empresa/página es largo. */
.crumb{font-size:12.5px;color:var(--text-muted);display:flex;align-items:center;gap:6px;flex:1 1 auto;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
.crumb b{color:var(--text-primary);font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex:none;}
.icon-btn{
  width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text-secondary);
}
.icon-btn:hover{background:var(--surface-2);color:var(--text-primary);}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 6px;border-radius:30px;border:1px solid var(--border);cursor:pointer;background:var(--surface);}
.user-chip:hover{background:var(--surface-2);}
.avatar{
  width:28px;height:28px;border-radius:50%;
  background:var(--surface-2);display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-weight:700;font-size:11.5px;color:var(--accent-600);
  border:1px solid var(--border);flex:none;
}
.avatar.lg{width:48px;height:48px;font-size:16px;}
.user-chip .who{line-height:1.15;}
.user-chip .who .name{font-size:12.5px;font-weight:700;}
.user-chip .who .role{font-size:10.5px;color:var(--text-muted);}

/* Content */
/* min-width:0 es necesario porque .content es un item de un flex-container en
   columna (.flex-col.grow) -- sin esto, un elemento ancho adentro (por ejemplo
   una tabla con overflow-x:auto propio) empuja TODO el ancho de la página en
   vez de scrollear solo la tabla, y el celular queda con scroll horizontal en
   toda la pantalla. */
.content{padding:26px 30px 60px;max-width:1400px;width:100%;margin:0 auto;min-width:0;box-sizing:border-box;}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
.page-title{font-size:23px;}
.page-desc{color:var(--text-secondary);font-size:13.5px;margin-top:4px;max-width:640px;}
.page-actions{display:flex;gap:10px;flex-wrap:wrap;}

/* ============================================================
   Buttons
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 15px;border-radius:10px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-primary);font-weight:600;font-size:13px;
  cursor:pointer;transition:background .12s,border-color .12s,transform .06s;white-space:nowrap;
}
.btn:hover{background:var(--surface-2);}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);}
.btn-primary:hover{background:var(--accent-600);border-color:var(--accent-600);}
.btn-danger{background:var(--critical);border-color:var(--critical);color:#fff;}
.btn-danger:hover{filter:brightness(0.92);}
.btn-ghost{background:transparent;border-color:transparent;}
.btn-ghost:hover{background:var(--surface-2);}
.btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
.btn[disabled]{opacity:0.5;cursor:not-allowed;}
.btn .icon{width:15px;height:15px;}

/* ============================================================
   Cards / KPI
   ============================================================ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;}
.card-title{font-family:var(--font-display);font-weight:700;font-size:14.5px;}
.card-sub{font-size:12px;color:var(--text-muted);margin-top:2px;}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:14px;}

.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.kpi-card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px 18px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;
}
.kpi-label{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;display:flex;align-items:center;gap:6px;}
.kpi-value{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-0.01em;font-variant-numeric:tabular-nums;}
.kpi-delta{font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;}
.kpi-delta.up{color:var(--good);} .kpi-delta.down{color:var(--critical);} .kpi-delta.flat{color:var(--text-muted);}
.kpi-spark{position:absolute;right:0;bottom:0;opacity:0.9;}

.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;}
.diag-index-grid{grid-template-columns:0.9fr 1.6fr;}

/* Mapa de lotes (Agropecuario): grilla simple de tarjetas, primera versión
   antes de un croquis armable a mano. flex-wrap para que en mobile las
   tarjetas caigan a su propia fila en vez de forzar overflow horizontal. */
.lot-map-grid{display:flex;flex-wrap:wrap;gap:14px;}
.lot-tile{
  flex-basis:160px;flex-shrink:0;min-width:150px;
  background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--accent);
  border-radius:var(--radius-lg);padding:14px 16px;position:relative;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
}
.lot-tile-name{font-weight:700;font-size:14px;}
.lot-tile-crop{font-size:12px;font-weight:600;}
.lot-tile-meta{font-size:11.5px;color:var(--text-muted);}
.lot-tile-inactive{position:absolute;top:10px;right:12px;font-size:10px;font-weight:700;color:var(--text-muted);text-transform:uppercase;}
.stack-16{display:flex;flex-direction:column;gap:16px;}
.stack-10{display:flex;flex-direction:column;gap:10px;}

/* ============================================================
   Badges / pills / status
   ============================================================ */
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:700;border:1px solid transparent;white-space:nowrap;
}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.badge-good{background:var(--good-soft);color:var(--good);}
.badge-warning{background:var(--warning-soft);color:var(--warning);}
.badge-serious{background:var(--serious-soft);color:var(--serious);}
.badge-critical{background:var(--critical-soft);color:var(--critical);}
.badge-neutral{background:var(--surface-2);color:var(--text-secondary);border-color:var(--border);}
.badge-accent{background:var(--accent-soft);color:var(--accent-600);border-color:var(--accent-soft-border);}

.progress-track{height:7px;border-radius:20px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border);}
.progress-fill{height:100%;border-radius:20px;background:var(--accent);}
.progress-fill.good{background:var(--good);}
.progress-fill.warning{background:var(--warning);}
.progress-fill.critical{background:var(--critical);}

/* ============================================================
   Tables
   ============================================================ */
.table-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
.table-toolbar{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
/* flex-shrink:0 evita un bug de renderizado de Chromium: cuando esta tabla
   queda como hijo directo de un contenedor flex en columna (p.ej. el body de
   un modal, .modal-body), el navegador a veces calcula bien la geometría
   (getBoundingClientRect) pero nunca la pinta ni la hace clickeable -- la fila
   queda invisible e inerte aunque exista en el DOM. Pasó, por ejemplo, con la
   tabla de "Composición del costo unitario" en la ficha de producto. */
.table-wrap{overflow-x:auto;flex-shrink:0;}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:600px;}
thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:0.05em;color:var(--text-muted);
  padding:10px 16px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap;background:var(--surface-2);
}
tbody td{padding:11px 16px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:var(--surface-2);}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--font-mono);font-size:12.5px;}
.row-actions{display:flex;gap:6px;justify-content:flex-end;}
.empty-state{padding:40px 20px;text-align:center;color:var(--text-muted);font-size:13px;}
.empty-state .icon{width:34px;height:34px;margin:0 auto 10px;opacity:.5;}

/* ============================================================
   Forms
   ============================================================ */
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;font-weight:600;color:var(--text-secondary);}
.field .hint{font-size:11px;color:var(--text-muted);}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=password],input[type=tel],input[type=url],
select,textarea{
  padding:9px 11px;border-radius:9px;border:1px solid var(--border-strong);background:var(--surface);
  color:var(--text-primary);width:100%;
}
textarea{resize:vertical;min-height:70px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.form-grid.cols-3{grid-template-columns:1fr 1fr 1fr;}
.search-input{position:relative;flex:1;min-width:180px;}
.search-input input{padding-left:32px;}
.search-input svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);}
.filter-select{min-width:140px;}
.checkline{display:flex;align-items:center;gap:8px;font-size:13px;}
.checkline input{width:auto;}

/* ============================================================
   Tabs
   ============================================================ */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto;}
.tab{padding:10px 14px;font-size:13px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;}
.tab:hover{color:var(--text-primary);}
.tab.active{color:var(--accent-600);border-color:var(--accent);}

.period-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
.period-toggle button{border:none;background:var(--surface);padding:7px 13px;font-size:12.5px;font-weight:600;color:var(--text-secondary);cursor:pointer;border-right:1px solid var(--border);}
.period-toggle button:last-child{border-right:none;}
.period-toggle button.active{background:var(--accent);color:var(--accent-ink);}

/* ============================================================
   Modal
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(10,13,16,0.5);backdrop-filter:blur(2px);
  display:flex;align-items:flex-start;justify-content:center;padding:5vh 16px;z-index:200;overflow-y:auto;
}
.modal{
  background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border);
  width:100%;max-width:560px;box-shadow:var(--shadow-lg);
}
.modal.wide{max-width:860px;}
.modal-head{display:flex;align-items:flex-start;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);gap:10px;}
.modal-head h3{font-size:16.5px;}
.modal-body{padding:20px 22px;display:flex;flex-direction:column;gap:16px;max-height:70vh;overflow-y:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid var(--border);}

/* ============================================================
   Kanban
   ============================================================ */
.kanban{display:flex;gap:14px;overflow-x:auto;padding-bottom:8px;align-items:flex-start;}
.kanban-col{background:var(--surface-2);border-radius:var(--radius-lg);padding:12px;min-width:250px;flex:1 0 250px;border:1px solid var(--border);}
.kanban-col-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px;font-weight:700;font-size:12.5px;}
.kanban-count{font-size:11px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1px 8px;}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:grab;box-shadow:var(--shadow-sm);}
.kanban-card:hover{border-color:var(--border-strong);}
.kanban-card.dragging{opacity:0.4;}
.kanban-col.drop-target{outline:2px dashed var(--accent);outline-offset:-4px;}
.kanban-card .kc-title{font-weight:700;font-size:12.8px;margin-bottom:6px;}
.kanban-card .kc-meta{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:8px;font-size:11px;color:var(--text-muted);}

/* ============================================================
   Login
   ============================================================ */
.login-screen{
  height:100vh;display:flex;background:var(--bg-inset);overflow:hidden;
}
.login-side{
  flex:1;height:100vh;overflow-y:auto;background:
    radial-gradient(circle at 15% 15%, rgba(178,86,50,0.35), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(15,148,129,0.3), transparent 45%),
    linear-gradient(160deg,#12293f,#0a1826 70%);
  color:#fff;padding:52px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;box-sizing:border-box;
}
.login-form-wrap{width:480px;max-width:100%;height:100vh;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:40px;box-sizing:border-box;}
.login-card{width:100%;max-width:400px;padding:24px 0;}
.login-quote{font-family:var(--font-display);font-size:26px;font-weight:700;line-height:1.28;max-width:480px;text-wrap:balance;}
.login-quote span{opacity:0.65;}
.demo-user{
  display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--border);
  cursor:pointer;background:var(--surface);text-align:left;width:100%;
}
.demo-user:hover{border-color:var(--accent);background:var(--accent-soft);}
.demo-user .dn{font-weight:700;font-size:13px;}
.demo-user .dr{font-size:11.2px;color:var(--text-muted);}

/* ============================================================
   Charts (SVG)
   ============================================================ */
.viz{position:relative;}
.viz svg{display:block;width:100%;height:auto;overflow:visible;}
.viz .grid-l{stroke:var(--grid-line);stroke-width:1;}
.viz .axis-l{stroke:var(--axis-line);stroke-width:1;}
.viz .axis-t{font-size:10.5px;fill:var(--text-muted);}
.viz .val-t{font-size:11px;fill:var(--text-secondary);font-weight:600;}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:11.5px;color:var(--text-secondary);}
.legend-item{display:flex;align-items:center;gap:6px;}
.legend-dot{width:9px;height:9px;border-radius:3px;flex:none;}
.viz-tooltip{
  position:absolute;pointer-events:none;background:var(--text-primary);color:var(--bg);
  padding:7px 10px;border-radius:8px;font-size:11.5px;box-shadow:var(--shadow-md);
  transform:translate(-50%,-115%);white-space:nowrap;z-index:5;line-height:1.4;
}
:root[data-theme="dark"] .viz-tooltip,:root:not([data-theme="light"]) .viz-tooltip{color:var(--text-primary);background:#000;}
.viz-tooltip b{font-family:var(--font-mono);}

/* ============================================================
   Alerts list
   ============================================================ */
.alert-row{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);}
.alert-row + .alert-row{margin-top:8px;}
.alert-icon{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:none;}
.alert-icon.critical{background:var(--critical-soft);color:var(--critical);}
.alert-icon.warning{background:var(--warning-soft);color:var(--warning);}
.alert-icon.good{background:var(--good-soft);color:var(--good);}
.alert-title{font-weight:700;font-size:13px;}
.alert-desc{font-size:12px;color:var(--text-secondary);margin-top:2px;}

/* toast */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--text-primary);color:var(--bg);padding:11px 16px;border-radius:10px;font-size:13px;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:8px;animation:toastin .18s ease;}
@keyframes toastin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

/* company cards */
.company-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.company-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;cursor:pointer;transition:border-color .12s,transform .1s;}
.company-card:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:var(--shadow-md);}
.company-logo{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;color:#fff;font-size:15px;}
.company-meta{font-size:12px;color:var(--text-muted);display:flex;flex-direction:column;gap:3px;margin-top:10px;}
.mini-kpis{display:flex;gap:14px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);}
.mini-kpi .mv{font-family:var(--font-mono);font-weight:600;font-size:13.5px;}
.mini-kpi .ml{font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;}

/* consultant mode strip */
.consultant-strip{
  background:linear-gradient(90deg,var(--accent),#4a3aa7);color:#fff;font-size:12.5px;font-weight:600;
  padding:7px 24px;display:flex;align-items:center;gap:10px;
}
.consultant-strip button{background:rgba(255,255,255,0.18);border:1px solid rgba(255,255,255,0.3);color:#fff;border-radius:7px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-weight:700;}

/* helper cards for AI assistant */
.chat-bubble{max-width:78%;padding:11px 14px;border-radius:14px;font-size:13.2px;line-height:1.5;}
.chat-bubble.assistant{background:var(--surface-2);border:1px solid var(--border);border-bottom-left-radius:4px;}
.chat-bubble.user{background:var(--accent);color:var(--accent-ink);margin-left:auto;border-bottom-right-radius:4px;}
.chat-suggest{display:flex;flex-wrap:wrap;gap:8px;}
.chat-suggest button{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--accent-600);}
.chat-suggest button:hover{background:var(--accent-soft);}

.info-callout{display:flex;gap:10px;background:var(--accent-soft);border:1px solid var(--accent-soft-border);border-radius:12px;padding:12px 14px;font-size:12.3px;color:var(--text-secondary);}
.info-callout svg{flex:none;color:var(--accent-600);width:17px;height:17px;margin-top:1px;}

/* ============================================================
   Switch toggle / module cards / permission matrix (Admin)
   ============================================================ */
.switch{position:relative;display:inline-block;width:38px;height:22px;flex:none;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch .slider{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;transition:background .15s,border-color .15s;}
.switch .slider::before{content:'';position:absolute;width:16px;height:16px;left:2px;top:2px;background:var(--surface);border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,0.25);}
.switch input:checked + .slider{background:var(--accent);border-color:var(--accent);}
.switch input:checked + .slider::before{transform:translateX(16px);background:#fff;}
.switch input:disabled + .slider{opacity:0.5;cursor:not-allowed;}

.module-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.module-toggle-card{display:flex;align-items:flex-start;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;}
.module-toggle-card .mtc-icon{width:36px;height:36px;border-radius:10px;background:var(--accent-soft);color:var(--accent-600);display:flex;align-items:center;justify-content:center;flex:none;}
.module-toggle-card .mtc-body{flex:1;}
.module-toggle-card .mtc-title{font-weight:700;font-size:13.5px;}
.module-toggle-card .mtc-sub{font-size:11.5px;color:var(--text-muted);margin-top:2px;}
.module-toggle-card.core{opacity:0.75;}

.perm-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.perm-table th,.perm-table td{padding:9px 10px;text-align:center;border-bottom:1px solid var(--border);}
.perm-table th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-muted);font-weight:700;}
.perm-table td:first-child,.perm-table th:first-child{text-align:left;font-weight:600;}
.perm-table input[type=checkbox]{width:16px;height:16px;cursor:pointer;}

.role-pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--text-secondary);border:1px solid var(--border);}
.role-pill.role-super{background:var(--accent-soft);color:var(--accent-600);border-color:var(--accent-soft-border);}
.role-pill.role-admin{background:var(--good-soft);color:var(--good);}
.role-pill.role-user{background:var(--surface-2);color:var(--text-secondary);}

.user-row-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none;}

.log-list{display:flex;flex-direction:column;}
.log-row{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start;}
.log-row:last-child{border-bottom:none;}
.log-row .log-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);margin-top:6px;flex:none;}
.log-row .log-text{font-size:13px;line-height:1.45;}
.log-row .log-text b{font-weight:700;}
.log-row .log-meta{font-size:11px;color:var(--text-muted);margin-top:2px;}

.hist-timeline{position:relative;}
.hist-item{position:relative;display:flex;gap:14px;padding:0 0 22px 0;}
.hist-item:last-child{padding-bottom:0;}
.hist-item::before{content:'';position:absolute;left:15px;top:32px;bottom:-6px;width:2px;background:var(--border);}
.hist-item:last-child::before{display:none;}
.hist-icon{width:32px;height:32px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--accent);z-index:1;}
.hist-icon .icon{width:16px;height:16px;}
.hist-icon.tone-muted{color:var(--text-muted);}
.hist-icon.tone-good{color:var(--good);}
.hist-body{flex:1;padding-top:3px;min-width:0;}
.hist-date{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px;}
.hist-title{font-size:13.5px;font-weight:700;}
.hist-desc{font-size:12.5px;color:var(--text-muted);margin-top:2px;line-height:1.45;}
.hist-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.hist-filters button{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-secondary);}
.hist-filters button.active{background:var(--accent);border-color:var(--accent);color:#fff;}

/* Carga rápida (voz/texto) */
.qc-mic-active{background:var(--critical-soft) !important;color:var(--critical) !important;border-color:var(--critical) !important;animation:qcPulse 1.4s infinite;}
@keyframes qcPulse{0%{box-shadow:0 0 0 0 rgba(220,38,38,.35);}70%{box-shadow:0 0 0 9px rgba(220,38,38,0);}100%{box-shadow:0 0 0 0 rgba(220,38,38,0);}}

/* Chat */
.chat-panel{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface);overflow:hidden;}
.chat-messages{flex:1;min-height:360px;max-height:520px;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;}
.chat-bubble-row{display:flex;}
.chat-bubble-row.mine{justify-content:flex-end;}
.chat-bubble{max-width:72%;background:var(--surface-2);border-radius:14px;padding:9px 13px;font-size:13px;line-height:1.45;}
.chat-bubble-row.mine .chat-bubble{background:var(--accent);color:#fff;}
.chat-author{font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:2px;}
.chat-text{white-space:pre-wrap;word-break:break-word;}
.chat-time{font-size:10px;opacity:.65;margin-top:4px;text-align:right;}
.chat-input-row{display:flex;gap:10px;align-items:flex-end;padding:12px 14px;border-top:1px solid var(--border);background:var(--surface);}
.chat-input-row textarea{flex:1;resize:none;min-height:auto;max-height:110px;font:inherit;}
.chat-input-row button{flex:none;}

/* responsive */
/* minmax(0,1fr) en vez de 1fr a secas: un grid-item por defecto no se achica
   más allá del ancho de su contenido ("min-width:auto" implícito, igual que en
   flexbox) -- con texto largo dentro (nombres de objetivos, indicadores, etc.)
   eso empuja TODA la fila del grid (y la página) más ancha que la pantalla en
   vez de que el texto se ajuste/trunque dentro de la tarjeta. minmax(0,1fr)
   le saca ese piso mínimo a la columna. */
@media (max-width: 1180px){
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .grid-2,.grid-3,.grid-4{grid-template-columns:minmax(0,1fr);}
  .company-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
}
@media (max-width: 880px){
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .18s;box-shadow:var(--shadow-lg);}
  .sidebar.open{transform:translateX(0);}
  .sidebar-scrim{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:39;display:none;}
  .sidebar-scrim.show{display:block;}
  .content{padding:18px 16px 50px;}
  .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
  .company-grid{grid-template-columns:minmax(0,1fr);}
  .form-grid,.form-grid.cols-3{grid-template-columns:minmax(0,1fr);}
  .module-grid{grid-template-columns:minmax(0,1fr);}
  .hamburger{display:flex !important;}
  .hide-mobile{display:none !important;}
  .login-form-wrap{padding:24px;}
  .topbar{padding:0 12px;gap:8px;}
  .topbar-actions{gap:6px;}
  .user-chip{padding:5px 8px 5px 5px;gap:6px;}
  .user-chip .who{display:none;}
}
.hamburger{display:none;}

/* Imprimir / Descargar PDF: se oculta todo el "chrome" de la app (menú,
   barra superior, botones, modales, toasts) y el contenido queda a ancho
   completo -- así cualquier pantalla se puede imprimir o guardar como PDF
   desde el navegador (Ctrl/Cmd+P, o el botón "Imprimir / PDF" que llama a
   window.print()) sin que se corte el menú lateral en el resultado. */
@media print{
  .sidebar, .topbar, .sidebar-scrim, .consultant-strip, .no-print, .page-actions .btn:not([data-print-btn]),
  .modal-overlay, .toast-wrap, .row-actions, .table-toolbar .filter-select{display:none !important;}
  .app-shell{display:block !important;}
  .content{padding:0 !important;max-width:none !important;}
  .card, .table-card{border:1px solid #ccc !important;box-shadow:none !important;break-inside:avoid;}
  body{background:#fff !important;}
}
</style>

function icon(name, cls){

}
G.icon = icon;

/* ---------- Formatting ---------- */
const MONTHS_ES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MONTHS_ES_LONG = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function fmtCurrency(n, opts){
  opts = opts||{};
  const v = Math.round(n||0);
  const sign = v<0?'-':'';
  const abs = Math.abs(v);
  if(opts.compact){
    if(abs>=1000000) return sign+'$'+(abs/1000000).toFixed(abs>=10000000?0:1).replace('.',',')+'M';
    if(abs>=1000) return sign+'$'+(abs/1000).toFixed(0)+'K';
  }
  return sign+'$'+abs.toLocaleString('es-AR');
}
function fmtNum(n, dec){ return (n||0).toLocaleString('es-AR', {maximumFractionDigits: dec==null?0:dec, minimumFractionDigits: dec==null?0:dec}); }
function fmtPct(n, dec){ return (n==null||isNaN(n)?'0':n.toFixed(dec==null?1:dec)) + '%'; }
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
}
function fmtDateLong(iso){
  const d = new Date(iso+'T00:00:00');
  if(isNaN(d)) return iso;
  return d.getDate()+' de '+MONTHS_ES_LONG[d.getMonth()]+' de '+d.getFullYear();
}
function fmtDateTime(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return fmtDate(d.toISOString().slice(0,10))+' · '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function monthLabel(y,m){ return MONTHS_ES[m]+' '+String(y).slice(2); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysAgo(iso){
  const d = new Date(iso+'T00:00:00');
  return Math.round((Date.now()-d.getTime())/86400000);
}
function timeAgo(iso){
  const days = daysAgo(iso.length>10?iso.slice(0,10):iso);
  if(days<=0) return 'hoy';
  if(days===1) return 'ayer';
  if(days<7) return 'hace '+days+' días';
  if(days<30){ const w=Math.floor(days/7); return 'hace '+w+(w===1?' semana':' semanas'); }
  if(days<365){ const m=Math.floor(days/30); return 'hace '+m+(m===1?' mes':' meses'); }
  const y=Math.floor(days/365); return 'hace '+y+(y===1?' año':' años');
}
G.fmt = {currency: fmtCurrency, num: fmtNum, pct: fmtPct, date: fmtDate, dateLong: fmtDateLong, dateTime: fmtDateTime, monthLabel, timeAgo};
G.MONTHS_ES = MONTHS_ES; G.MONTHS_ES_LONG = MONTHS_ES_LONG;

/* ---------- ID / RNG ---------- */
let __idc = 1;
function uid(prefix){ return (prefix||'id')+'_'+(Date.now().toString(36))+'_'+(__idc++).toString(36); }
function mulberry32(seed){
  let a = seed>>>0;
  return function(){
    a |= 0; a = (a+0x6D2B79F5)|0;
    let t = Math.imul(a ^ a>>>15, 1|a);
    t = (t + Math.imul(t ^ t>>>7, 61|t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
G.uid = uid; G.rng = mulberry32;

/* ---------- Storage ----------
   Los datos ahora viven en el servidor (Postgres), no en localStorage: G.DB se
   carga con un fetch a /api/bootstrap y se guarda con un fetch a
   /api/companies/:id/sync (ver G.initApp y persist() más abajo). G.storage queda
   como un objeto vacío únicamente para que no rompa si algún código viejo todavía
   lo referencia -- no debería quedar ninguno tras esta migración. */
G.storage = {};

/* ---------- Toast ---------- */
function toast(msg, opts){
  opts = opts||{};
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = icon(opts.icon||'check-circle') + '<span>'+msg+'</span>';
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity='0'; el.style.transform='translateY(6px)'; setTimeout(()=>el.remove(),260); }, opts.duration||2600);
}
G.toast = toast;

/* ---------- Misc helpers ---------- */
function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
function sum(arr, fn){ return arr.reduce((a,x)=>a+(fn?fn(x):x),0); }
function groupBy(arr, fn){
  const out = {};
  arr.forEach(x=>{ const k = fn(x); (out[k]=out[k]||[]).push(x); });
  return out;
}
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function debounce(fn, ms){ let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), ms); }; }
G.util = {clamp, sum, groupBy, escapeHtml, debounce};

})();
</script>

<script>
/* ============================================================
   PART 3 — Chart rendering (inline SVG, theme-aware, hover tooltips)
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const fmt = G.fmt;

function cssVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim() || '#999'; }
function seriesColor(i){ return cssVar('--series-'+(((i%8)+8)%8+1)); }
G.charts = G.charts || {};
G.charts.seriesColor = seriesColor;
G.charts.palette = function(n){ const out=[]; for(let i=0;i<n;i++) out.push(seriesColor(i)); return out; };

function niceMax(v){
  if(v<=0) return 10;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  const n = v/p;
  let m;
  if(n<=1) m=1; else if(n<=2) m=2; else if(n<=2.5) m=2.5; else if(n<=5) m=5; else m=10;
  return m*p;
}

function ensureTooltip(){
  let tt = document.getElementById('globalVizTooltip');
  if(!tt){
    tt = document.createElement('div');
    tt.id = 'globalVizTooltip';
    tt.className = 'viz-tooltip';
    tt.style.display = 'none';
    document.body.appendChild(tt);
  }
  return tt;
}
function showTooltip(x,y,html){
  const tt = ensureTooltip();
  tt.innerHTML = html;
  tt.style.left = x+'px'; tt.style.top = y+'px'; tt.style.display='block';
}
function hideTooltip(){ const tt=document.getElementById('globalVizTooltip'); if(tt) tt.style.display='none'; }

/* ---------- Line / area chart ---------- */
// opts: {height, money, compact, unit, showArea}
G.charts.line = function(el, series, opts){
  if(!el) return;
  opts = opts||{};
  const W = Math.max(280, el.clientWidth || 560);
  const H = opts.height || 220;
  const padL = 46, padR = 14, padT = 16, padB = 26;
  const plotW = W - padL - padR, plotH = H - padT - padB;
  const labels = (series[0] && series[0].data || []).map(d=>d.x);
  const n = labels.length;
  let maxV = 0, minV = 0;
  series.forEach(s=> s.data.forEach(d=>{ if(d.y>maxV) maxV=d.y; if(d.y<minV) minV=d.y; }));
  maxV = niceMax(maxV||1);
  minV = minV<0 ? -niceMax(-minV) : 0;
  const xAt = i => n<=1 ? padL+plotW/2 : padL + (plotW*i/(n-1));
  const yAt = v => padT + plotH - ((v-minV)/(maxV-minV||1))*plotH;

  const gridN = 4;
  let gridSvg = '';
  for(let g=0; g<=gridN; g++){
    const v = minV + (maxV-minV)*g/gridN;
    const y = yAt(v);
    gridSvg += '<line class="grid-l" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'"/>';
    gridSvg += '<text class="axis-t" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+(opts.money===false?fmt.num(v):fmt.currency(v,{compact:true}))+'</text>';
  }
  let xLabelsSvg = '';
  const step = n>8 ? Math.ceil(n/8) : 1;
  labels.forEach((l,i)=>{ if(i%step===0 || i===n-1) xLabelsSvg += '<text class="axis-t" x="'+xAt(i)+'" y="'+(H-6)+'" text-anchor="middle">'+l+'</text>'; });

  let defs = '', paths = '', dots = '';
  series.forEach((s,si)=>{
    const color = s.color || seriesColor(si);
    const d = s.data.map((pt,i)=> (i===0?'M':'L')+xAt(i)+' '+yAt(pt.y)).join(' ');
    if(series.length===1 && opts.showArea!==false){
      const areaD = d+' L'+xAt(n-1)+' '+yAt(minV)+' L'+xAt(0)+' '+yAt(minV)+' Z';
      const gid = 'grad_'+Math.random().toString(36).slice(2);
      defs += '<linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="'+color+'" stop-opacity="0.28"/>'+
        '<stop offset="100%" stop-color="'+color+'" stop-opacity="0.02"/></linearGradient>';
      paths += '<path d="'+areaD+'" fill="url(#'+gid+')" stroke="none"/>';
    }
    paths += '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"/>';
    s.data.forEach((pt,i)=>{
      dots += '<circle class="dot-'+si+'" cx="'+xAt(i)+'" cy="'+yAt(pt.y)+'" r="3" fill="'+color+'" stroke="var(--surface)" stroke-width="1.5"/>';
    });
  });

  let hitRects = '';
  for(let i=0;i<n;i++){
    const x0 = i===0 ? padL : (xAt(i-1)+xAt(i))/2;
    const x1 = i===n-1 ? W-padR : (xAt(i)+xAt(i+1))/2;
    hitRects += '<rect data-i="'+i+'" x="'+x0+'" y="'+padT+'" width="'+(x1-x0)+'" height="'+plotH+'" fill="transparent"/>';
  }

  el.innerHTML = '<div class="viz"><svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="height:'+H+'px"><defs>'+defs+'</defs>'+
    gridSvg+'<line class="axis-l" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+yAt(minV)+'" y2="'+yAt(minV)+'"/>'+
    paths+dots+xLabelsSvg+
    '<g id="crosshair" style="display:none"><line x1="0" y1="'+padT+'" x2="0" y2="'+(padT+plotH)+'" stroke="var(--axis-line)" stroke-width="1" stroke-dasharray="3,3"/></g>'+
    '<g class="hit">'+hitRects+'</g>'+
    '</svg>'+
    (series.length>1 ? '<div class="legend">'+series.map((s,si)=>'<span class="legend-item"><span class="legend-dot" style="background:'+(s.color||seriesColor(si))+'"></span>'+escapeHtml(s.name)+'</span>').join('')+'</div>' : '')+
    '</div>';

  const svg = el.querySelector('svg');
  const cross = el.querySelector('#crosshair');
  svg.querySelectorAll('.hit rect').forEach(r=>{
    r.addEventListener('mousemove', e=>{
      const i = +r.getAttribute('data-i');
      cross.style.display='block';
      cross.querySelector('line').setAttribute('x1', xAt(i)); cross.querySelector('line').setAttribute('x2', xAt(i));
      const rect = svg.getBoundingClientRect();
      const scaleX = rect.width / W;
      let html = '<div style="font-weight:700;margin-bottom:3px">'+labels[i]+'</div>';
      series.forEach((s,si)=>{ html += '<div>'+escapeHtml(s.name)+': <b>'+(opts.money===false?fmt.num(s.data[i].y):fmt.currency(s.data[i].y,{compact:false}))+'</b></div>'; });
      showTooltip(rect.left+xAt(i)*scaleX, rect.top+window.scrollY, html);
    });
    r.addEventListener('mouseleave', ()=>{ cross.style.display='none'; hideTooltip(); });
  });
};

function escapeHtml(s){ return G.util.escapeHtml(s); }

/* ---------- Bar chart (vertical) ---------- */
G.charts.bar = function(el, data, opts){
  if(!el) return;
  opts = opts||{};
  const W = Math.max(280, el.clientWidth || 560);
  const H = opts.height || 220;
  const padL = 46, padR = 10, padT = 16, padB = 26;
  const plotW = W-padL-padR, plotH = H-padT-padB;
  const n = data.length;
  const maxV = niceMax(Math.max(...data.map(d=>d.value),1));
  const gap = opts.gap==null?0.38:opts.gap;
  const bw = (plotW/n) * (1-gap);
  const xAt = i => padL + (plotW/n)*i + ((plotW/n)-bw)/2;
  const yAt = v => padT + plotH - (v/maxV)*plotH;

  let gridSvg='';
  for(let g=0; g<=4; g++){
    const v = maxV*g/4; const y=yAt(v);
    gridSvg += '<line class="grid-l" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'"/>';
    gridSvg += '<text class="axis-t" x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end">'+(opts.money===false? fmt.num(v) : fmt.currency(v,{compact:true}))+'</text>';
  }
  let bars='', xLabels='', hit='';
  data.forEach((d,i)=>{
    const color = d.color || opts.color || seriesColor(0);
    const x = xAt(i), y = yAt(d.value), h = plotH+padT-y;
    bars += '<rect data-i="'+i+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(h,1.5)+'" rx="4" fill="'+color+'"/>';
    xLabels += '<text class="axis-t" x="'+(x+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+escapeHtml(d.label)+'</text>';
    hit += '<rect data-i="'+i+'" x="'+(padL+(plotW/n)*i)+'" y="'+padT+'" width="'+(plotW/n)+'" height="'+plotH+'" fill="transparent"/>';
  });
  el.innerHTML = '<div class="viz"><svg viewBox="0 0 '+W+' '+H+'" style="height:'+H+'px">'+
    gridSvg+'<line class="axis-l" x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(padT+plotH)+'" y2="'+(padT+plotH)+'"/>'+
    bars+xLabels+'<g class="hit">'+hit+'</g></svg></div>';
  const svg = el.querySelector('svg');
  svg.querySelectorAll('.hit rect').forEach(r=>{
    const i = +r.getAttribute('data-i');
    r.addEventListener('mousemove', ()=>{
      const rect = svg.getBoundingClientRect();
      const scaleX = rect.width/W;
      showTooltip(rect.left+(xAt(i)+bw/2)*scaleX, rect.top+window.scrollY, '<b>'+escapeHtml(data[i].label)+'</b><br>'+(opts.money===false?fmt.num(data[i].value):fmt.currency(data[i].value)));
    });
    r.addEventListener('mouseleave', hideTooltip);
  });
};

/* ---------- Donut chart ---------- */
G.charts.donut = function(el, data, opts){
  if(!el) return;
  opts = opts||{};
  const size = opts.size || 190;
  const stroke = opts.stroke || 26;
  const r = (size-stroke)/2;
  const cx = size/2, cy = size/2;
  const circ = 2*Math.PI*r;
  const total = data.reduce((a,d)=>a+d.value,0) || 1;
  let offset = 0, segs = '';
  data.forEach((d,i)=>{
    const color = d.color || seriesColor(i);
    const frac = d.value/total;
    const len = frac*circ;
    segs += '<circle data-i="'+i+'" cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+color+'" stroke-width="'+stroke+'" '+
      'stroke-dasharray="'+len+' '+(circ-len)+'" stroke-dashoffset="'+(-offset)+'" transform="rotate(-90 '+cx+' '+cy+')" stroke-linecap="butt"/>';
    offset += len;
  });
  el.innerHTML = '<div class="viz flex items-center gap-lg" style="flex-wrap:wrap">'+
    '<svg viewBox="0 0 '+size+' '+size+'" style="width:'+size+'px;height:'+size+'px;flex:none">'+segs+
    '<text x="'+cx+'" y="'+(cy-3)+'" text-anchor="middle" style="font-family:var(--font-display);font-weight:800;font-size:19px;fill:var(--text-primary)">'+(opts.money===false?fmt.num(total):fmt.currency(total,{compact:true}))+'</text>'+
    '<text x="'+cx+'" y="'+(cy+15)+'" text-anchor="middle" style="font-size:10.5px;fill:var(--text-muted)">total</text>'+
    '</svg>'+
    '<div class="legend" style="margin-top:0;flex-direction:column;gap:8px">'+data.map((d,i)=>{
      const pct = total? (d.value/total*100):0;
      return '<span class="legend-item"><span class="legend-dot" style="background:'+(d.color||seriesColor(i))+'"></span>'+escapeHtml(d.label)+' <span class="subtle mono" style="margin-left:4px">'+(opts.money===false?fmt.num(d.value):fmt.currency(d.value,{compact:true}))+' · '+pct.toFixed(0)+'%</span></span>';
    }).join('')+'</div></div>';
};

/* ---------- Horizontal ranking bars (HTML) ---------- */
G.charts.hbar = function(el, data, opts){
  if(!el) return;
  opts = opts||{};
  const maxV = Math.max(...data.map(d=>d.value), 1);
  el.innerHTML = '<div class="stack-10">'+data.map((d,i)=>{
    const pct = clampPct(d.value/maxV*100);
    const color = d.color || seriesColor(i);
    return '<div>'+
      '<div class="flex justify-between" style="font-size:12.5px;margin-bottom:4px"><span style="font-weight:600">'+escapeHtml(d.label)+'</span><span class="mono subtle">'+(opts.money===false?fmt.num(d.value):fmt.currency(d.value,{compact:true}))+'</span></div>'+
      '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%;background:'+color+'"></div></div>'+
      '</div>';
  }).join('')+'</div>';
};
function clampPct(n){ return Math.max(3, Math.min(100,n)); }

/* ---------- Sparkline (mini, for KPI cards) ---------- */
G.charts.__marker_part3 = true;
G.charts.sparklineSvg = function(values, opts){
  opts = opts||{};
  const W = opts.width||100, H = opts.height||32;
  if(!values.length) return '';
  const max = Math.max(...values), min = Math.min(...values,0);
  const range = (max-min)||1;
  const step = W/(values.length-1||1);
  const pts = values.map((v,i)=> [i*step, H-((v-min)/range)*H*0.86 - 2]);
  const d = pts.map((p,i)=>(i===0?'M':'L')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const color = opts.color || cssVar('--accent');
  const areaD = d+' L'+pts[pts.length-1][0]+' '+H+' L0 '+H+' Z';
  return '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" preserveAspectRatio="none">'+
    '<path d="'+areaD+'" fill="'+color+'" opacity="0.14" stroke="none"/>'+
    '<path d="'+d+'" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
};

function genMonthlySeries(rnd, base, growth, months, overrideFirst4){
  const out = [];
  let v = base;
  months.forEach((mo,i)=>{
    if(overrideFirst4 && i<overrideFirst4.length){
      v = overrideFirst4[i];
    } else {
      const trend = v*(1+growth);
      const noise = (rnd()-0.45)*0.12*v;
      v = Math.max(base*0.55, trend+noise);
    }
    out.push(Object.assign({}, mo, {total: round100(v)}));
  });
  return out;
}

function buildCompanyData(profile, DB){
  const rnd = rng(profile.id.charCodeAt(1)*97 + 13);
  const months = lastMonths(10);
  const cid = profile.id;

  const products = profile.products.map(p=>({
    id: uid('prod'), companyId: cid, name:p.name, type:p.type, category:p.category,
    unit: p.unit || 'unidad', price:p.price,
    costComponents: (p.costComponents||[]).map(cc=>({name:cc.name, category:cc.category||'', qty:cc.qty, unitCost:cc.unitCost})),
    variableCost: (p.costComponents&&p.costComponents.length) ? G.util.sum(p.costComponents, cc=>cc.qty*cc.unitCost) : p.cost,
    active:true,
  }));
  DB.products.push(...products);

  const clients = profile.clients.map((c,i)=>({
    id: uid('cli'), companyId: cid, name:c.name, type:c.type,
    cuit: c.type==='Empresa' ? '30-'+(70000000+Math.floor(rnd()*9999999))+'-'+Math.floor(rnd()*9) : '',
    contact: c.type==='Empresa' ? pick(rnd,['Gerencia General','Administración','Compras']) : c.name,
    phone: '+54 9 '+(300+Math.floor(rnd()*600))+' '+(4000000+Math.floor(rnd()*5999999)),
    email: c.name.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'.').replace(/(^\.|\.$)/g,'')+'@correo.com',
    city:c.city, segment:c.segment,
    status: rnd()<0.86 ? 'Activo' : (rnd()<0.5?'Prospecto':'Inactivo'),
    notes:'', createdAt: randDateInMonth(rnd, months[Math.floor(rnd()*6)].y, months[Math.floor(rnd()*6)].m),
  }));
  DB.clients.push(...clients);

  const overrideFirst4 = profile.id==='c1' ? [4200000,4600000,4450000,5100000] : null;
  let salesSeries;
  if(overrideFirst4){
    salesSeries = months.map((mo,i)=>{
      let total;
      if(i===2) total = overrideFirst4[0];
      else if(i===3) total = overrideFirst4[1];
      else if(i===4) total = overrideFirst4[2];
      else if(i===5) total = overrideFirst4[3];
      else {
        const ref = 4200000;
        const trend = ref*Math.pow(1+profile.incomeGrowth, i-2);
        total = round100(trend*(0.94+rnd()*0.12));
      }
      return Object.assign({}, mo, {total});
    });
  } else {
    salesSeries = genMonthlySeries(rnd, profile.incomeBase, profile.incomeGrowth, months);
  }
  if(profile.troubled){
    salesSeries[salesSeries.length-1].total = round100(salesSeries[salesSeries.length-1].total*0.80);
    salesSeries[salesSeries.length-2].total = round100(salesSeries[salesSeries.length-2].total*0.91);
  }

  const sellers = profile.employees.filter(e=> ['Comercial','Dirección'].includes(e.area)).map(e=>e.name);
  if(!sellers.length) sellers.push(profile.responsible);
  const sales = [];
  salesSeries.forEach(mo=>{
    const txCount = profile.id==='c2' ? (14+Math.floor(rnd()*8)) : (5+Math.floor(rnd()*4));
    const monthSales = [];
    let running = 0;
    for(let i=0;i<txCount;i++){
      const prod = pick(rnd, products);
      const price = Math.round(prod.price*(0.94+rnd()*0.12)/100)*100;
      let qty;
      if(i===txCount-1){
        // last transaction of the month closes the gap to the monthly target, at a realistic catalog price
        const remaining = Math.max(price*0.5, mo.total-running);
        qty = Math.max(1, Math.min(30, Math.round(remaining/price)));
      } else {
        const share = (mo.total/txCount)*(0.5+rnd()*1.0);
        qty = Math.max(1, Math.round(share/price));
      }
      const lineTotal = qty*price;
      running += lineTotal;
      const discount = rnd()<0.18 ? round100(lineTotal*(0.03+rnd()*0.07)) : 0;
      monthSales.push({
        id: uid('sale'), companyId: cid, date: randDateInMonth(rnd, mo.y, mo.m),
        clientId: pick(rnd, clients).id, productId: prod.id, qty, price,
        discount, total: lineTotal-discount, seller: pick(rnd, sellers),
      });
    }
    // reconcile: use the realized (bottom-up) total so Comercial and Finanzas always agree
    mo.total = round100(G.util.sum(monthSales, s=>s.total));
    sales.push(...monthSales);
  });
  DB.sales.push(...sales);

  const stages = ['Prospecto','Contactado','Propuesta','Negociación','Ganado','Perdido'];
  const pipelineNames = clients.slice(0,7).map(c=>c.name).concat(['Nuevo prospecto - '+profile.sector.split(' ')[0], 'Cliente potencial referido']);
  const pipeline = pipelineNames.map((name,i)=>({
    id: uid('pipe'), companyId: cid, clientName:name,
    value: round100(profile.incomeBase*(0.03+rnd()*0.12)),
    stage: pickW(rnd,[['Prospecto',3],['Contactado',3],['Propuesta',2.5],['Negociación',2],['Ganado',2],['Perdido',1.3]]),
    owner: pick(rnd, sellers),
    updatedAt: randDateInMonth(rnd, months[8].y, months[8].m),
  }));
  DB.pipeline.push(...pipeline);

  DB.financeCategories[cid] = {income: G.DEFAULT_INCOME_CATEGORIES.slice(), expense: G.DEFAULT_EXPENSE_CATEGORIES.slice()};

  const incomes = [];
  salesSeries.forEach(mo=>{
    const parts = 2+Math.floor(rnd()*2);
    let rem = mo.total;
    for(let i=0;i<parts;i++){
      const amt = i===parts-1? rem : round100(mo.total*(0.25+rnd()*0.35));
      rem -= amt;
      incomes.push({
        id: uid('inc'), companyId: cid, date: randDateInMonth(rnd, mo.y, mo.m),
        concept: 'Liquidación de ventas del mes', client: pick(rnd, clients).name,
        category:'Ventas', method: pick(rnd,['Transferencia','Tarjeta de débito','Tarjeta de crédito','Efectivo']),
        amount: Math.max(amt,10000), notes:'',
      });
    }
    if(rnd()<0.3){
      incomes.push({
        id: uid('inc'), companyId: cid, date: randDateInMonth(rnd, mo.y, mo.m),
        concept: pick(rnd,['Intereses por plazo fijo','Ingreso extraordinario','Honorario puntual']),
        client:'—', category: pick(rnd,['Intereses','Otros ingresos']), method:'Transferencia',
        amount: round100(mo.total*(0.01+rnd()*0.03)), notes:'',
      });
    }
  });
  DB.finance.incomes.push(...incomes);

  const expenses = [];
  const providerNames = {
    Alquiler:['Inmobiliaria Central'], Sueldos:['Liquidación de sueldos'],
    Servicios:['EDESUR','Metrogas','Telecom','AySA'], Impuestos:['AFIP','ARBA','Rentas Provinciales'],
    Insumos:['Distribuidora de Insumos SA','Proveedor Mayorista Norte'], Marketing:['Agencia Digital Plus','Meta Ads'],
    Transporte:['Logística Rápida','YPF Flota'], Tecnología:['Microsoft','AWS','Soporte IT'],
    Honorarios:['Estudio Contable Asociado','Consultor externo'], Otros:['Gastos varios'],
  };
  salesSeries.forEach(mo=>{
    const targetTotal = mo.total * profile.expenseRatio * (1 + (rnd()-0.5)*profile.expenseNoise);
    Object.entries(profile.expenseWeights).forEach(([cat,w])=>{
      const amt = round100(targetTotal*w*(0.88+rnd()*0.24));
      expenses.push({
        id: uid('exp'), companyId: cid, date: randDateInMonth(rnd, mo.y, mo.m),
        concept: pick(rnd, providerNames[cat]||['Gasto operativo']), provider: pick(rnd, providerNames[cat]||['Proveedor']),
        category: cat, method: pick(rnd,['Transferencia','Débito automático','Efectivo']),
        amount: Math.max(amt, 5000), notes:'',
      });
    });
  });
  DB.finance.expenses.push(...expenses);
  DB._salesSeries = DB._salesSeries || {};
  DB._salesSeries[cid] = salesSeries;

  const fixedDefs = {
    c1:[['Alquiler oficina','Alquiler',420000],['Sueldos administrativos','Sueldos',1800000],['Software de gestión','Tecnología',95000],['Seguro responsabilidad civil','Seguros',48000],['Internet y telefonía','Servicios',62000]],
    c2:[['Alquiler local','Alquiler',680000],['Sueldos de tienda','Sueldos',2400000],['Seguro del local','Seguros',55000],['Sistema POS','Software',38000],['Expensas','Otros',110000]],
    c3:[['Alquiler planta','Alquiler',540000],['Sueldos de planta','Sueldos',3200000],['Seguros industriales','Seguros',180000],['Software ERP','Software',140000],['Mantenimiento de maquinaria','Otros',260000]],
  }[cid];
  DB.costsFixed.push(...fixedDefs.map(([name,cat,amount])=>({id:uid('cf'), companyId:cid, name, category:cat, amount, period:'mensual'})));

  const variableDefs = products.map(p=>({
    id: uid('cv'), companyId: cid, name:'Costo variable — '+p.name, category: profile.id==='c1'?'Honorarios':'Materia prima',
    unitCost: p.variableCost, linkedTo: p.type, linkedName: p.name, productId: p.id,
  }));
  DB.costsVariable.push(...variableDefs);

  const employees = profile.employees.map(e=>({
    id: uid('emp'), companyId: cid, name:e.name,
    dni: (20000000+Math.floor(rnd()*20000000)).toString(),
    role:e.role, area:e.area, startDate:e.start, contractType:e.contract,
    schedule: pick(rnd,['Full-time','Part-time']), salary:e.salary,
    status: rnd()<0.95?'Activo':'Baja', notes:'',
  }));
  DB.employees.push(...employees);

  employees.slice(0, Math.min(5,employees.length)).forEach(emp=>{
    DB.evaluations.push({
      id: uid('ev'), companyId: cid, employeeId: emp.id, period:'1er semestre 2026',
      objectives: pick(rnd,['Cumplimiento de metas trimestrales','Mejora de procesos internos','Atención al cliente','Reducción de errores operativos']),
      competencies: pick(rnd,['Trabajo en equipo, comunicación','Liderazgo, autonomía','Orientación a resultados, proactividad']),
      score: (3+rnd()*2).toFixed(1),
      trainingNeeds: pick(rnd,['Curso de Excel avanzado','Capacitación en atención al cliente','Actualización normativa','Herramientas digitales de gestión','Ninguna identificada']),
      notes:'', date: randDateInMonth(rnd, months[7].y, months[7].m),
    });
  });

  return {clients, products, sales, salesSeries};
}
