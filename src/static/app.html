function wirePriceCalculator(el, company){
  const productSel = document.getElementById('calcProduct'), costEl = document.getElementById('calcCost'), marginEl = document.getElementById('calcMargin'), taxEl = document.getElementById('calcTax'), commEl = document.getElementById('calcCommission');
  function recalc(){
    const cost = parseFloat(costEl.value)||0, margin = parseFloat(marginEl.value)||0, tax = parseFloat(taxEl.value)||0, comm = parseFloat(commEl.value)||0;
    const priceBeforeTax = margin<100 ? cost/(1-margin/100) : cost*2;
    const price = priceBeforeTax/(1-(tax+comm)/100 || 1);
    const resultEl = document.getElementById('calcResult');
    resultEl.innerHTML = '<div style="font-family:var(--font-display);font-size:32px;font-weight:800">'+fmt.currency(price)+'</div>'+
      '<div class="stack-10" style="margin-top:16px;font-size:12.8px">'+
      row('Costo unitario', fmt.currency(cost))+
      row('+ Margen ('+margin+'%)', fmt.currency(priceBeforeTax-cost))+
      row('+ Impuestos y comisiones ('+(tax+comm)+'%)', fmt.currency(price-priceBeforeTax))+
      '<div style="border-top:1px solid var(--accent-soft-border);margin-top:6px;padding-top:10px" class="flex justify-between"><b>Precio final sugerido</b><b class="mono">'+fmt.currency(price)+'</b></div>'+
      '</div>';
  }
  function row(label,val){ return '<div class="flex justify-between"><span class="muted">'+label+'</span><span class="mono">'+val+'</span></div>'; }
  if(productSel) productSel.addEventListener('change', ()=>{
    const p = G.DB.products.find(p=>p.id===productSel.value);
    if(p){ costEl.value = p.variableCost; }
    recalc();
  });
  [costEl,marginEl,taxEl,commEl].forEach(e=> e && e.addEventListener('input', recalc));
  recalc();
}

})();
</script>

<script>
/* ============================================================
   PART 11 — Módulo Comercial (Ventas + Pipeline) y Clientes
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

/* ============================================================
   COMERCIAL
   ============================================================ */
G.pages.comercial = function(el, user, company){
  const state = el._comState || {tab:'resumen', period:'mes', search:''};
  el._comState = state;
  renderComercial(el, user, company, state);
};

function renderComercial(el, user, company, state){
  const canCreate = G.perm.userCan(user,'comercial','crear'), canEdit = G.perm.userCan(user,'comercial','editar'), canDelete = G.perm.userCan(user,'comercial','eliminar');
  let body='', actions='';
  if(state.tab==='resumen'){ body = comResumenHtml(company, state.period); actions = G.periodToggleHtml(state.period); }
  else if(state.tab==='ventas'){ body = ventasTableHtml(company, state, canEdit, canDelete); actions = canCreate?'<button class="btn btn-primary" id="ventaNewBtn">'+icon('plus')+' Nueva venta</button>':''; }
  else if(state.tab==='pipeline'){ body = pipelineHtml(company); actions = canCreate?'<button class="btn btn-primary" id="pipeNewBtn">'+icon('plus')+' Nuevo prospecto</button>':''; }

  el.innerHTML = ui.pageHeader('Comercial', 'Ventas, clientes y el recorrido comercial de tu negocio.', actions)+
    ui.tabsHtml([{key:'resumen',label:'Resumen'},{key:'ventas',label:'Ventas'},{key:'pipeline',label:'Pipeline'}], state.tab)+
    body;
  ui.wireTabs(el, tab=>{ state.tab=tab; renderComercial(el,user,company,state); });

  if(state.tab==='resumen'){
    mountComResumenCharts(company, state.period);
    el.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click', ()=>{ state.period=b.getAttribute('data-period'); renderComercial(el,user,company,state); }));
  } else if(state.tab==='ventas'){
    wireVentasTable(el, user, company, state, canEdit, canDelete);
    const newBtn = document.getElementById('ventaNewBtn');
    if(newBtn) newBtn.addEventListener('click', ()=>openVentaForm(company, null, ()=>renderComercial(el,user,company,state)));
  } else if(state.tab==='pipeline'){
    wirePipeline(el, company, ()=>renderComercial(el,user,company,state));
    const newBtn = document.getElementById('pipeNewBtn');
    if(newBtn) newBtn.addEventListener('click', ()=>openPipelineForm(company, null, ()=>renderComercial(el,user,company,state)));
  }
}

function comResumenHtml(company, period){
  const kpi = G.companyKPIs(company.id, period);
  const clients = G.DB.clients.filter(c=>c.companyId===company.id);
  const lost = clients.filter(c=>c.status==='Inactivo').length;
  return '<div class="kpi-grid">'+
    ui.kpiCard({icon:'banknote', label:'Ventas del período', value: fmt.currency(kpi.ventas,{compact:true})})+
    ui.kpiCard({icon:'users', label:'Clientes activos', value: kpi.clientesActivos})+
    ui.kpiCard({icon:'plus', label:'Clientes nuevos', value: kpi.clientesNuevos})+
    ui.kpiCard({icon:'banknote', label:'Ticket promedio', value: fmt.currency(kpi.ticketPromedio,{compact:true})})+
    '</div>'+
    '<div class="grid-2">'+
      ui.card('Evolución de ventas','Últimos 10 meses','<div id="comEvoChart"></div>')+
      ui.card('Ventas por producto','','<div id="comByProduct"></div>')+
    '</div>'+
    '<div class="grid-2" style="margin-top:16px">'+
      ui.card('Ventas por vendedor','','<div id="comBySeller"></div>')+
      ui.card('Ventas por cliente','Top clientes del período','<div id="comByClient"></div>')+
    '</div>';
}
function mountComResumenCharts(company, period){
  const ss = G.monthlySeriesFor(company.id, 10, 'sales');
  G.charts.line(document.getElementById('comEvoChart'), [{name:'Ventas', data: ss.map(m=>({x:m.label,y:m.total}))}]);
  const months = G.periodMonths(period);
  G.charts.hbar(document.getElementById('comByProduct'), G.salesByProduct(company.id, months).slice(0,6));
  G.charts.hbar(document.getElementById('comBySeller'), G.salesBySeller(company.id, months).slice(0,6));
  G.charts.hbar(document.getElementById('comByClient'), G.salesByClient(company.id, months).slice(0,6));
}

function ventasTableHtml(company, state, canEdit, canDelete){
  let rows = G.crud.byCompany(G.DB.sales, company.id).sort((a,b)=>b.date.localeCompare(a.date));
  if(state.search) rows = rows.filter(s=>{
    const client = G.DB.clients.find(c=>c.id===s.clientId);
    return (client&&client.name.toLowerCase().includes(state.search.toLowerCase())) || s.seller.toLowerCase().includes(state.search.toLowerCase());
  });
  const total = G.util.sum(rows, r=>r.total);
  return '<div class="table-card">'+
    '<div class="table-toolbar"><div class="search-input">'+icon('search')+'<input type="text" id="ventaSearch" placeholder="Buscar cliente o vendedor..." value="'+esc(state.search)+'"/></div>'+
    '<div class="subtle" style="margin-left:auto;font-size:12.5px">'+rows.length+' venta(s) · Total <b class="mono">'+fmt.currency(total)+'</b></div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Cliente</th><th>Producto/Servicio</th><th class="num">Cant.</th><th class="num">Precio</th><th class="num">Desc.</th><th class="num">Total</th><th>Vendedor</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.slice(0,120).map(r=>{
      const client = G.DB.clients.find(c=>c.id===r.clientId), prod = G.DB.products.find(p=>p.id===r.productId);
      return '<tr><td>'+fmt.date(r.date)+'</td><td>'+esc(client?client.name:'—')+'</td><td>'+esc(prod?prod.name:'—')+'</td><td class="num">'+r.qty+'</td><td class="num">'+fmt.currency(r.price)+'</td><td class="num subtle">'+(r.discount?fmt.currency(r.discount):'—')+'</td><td class="num" style="font-weight:700">'+fmt.currency(r.total)+'</td><td class="subtle">'+esc(r.seller)+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-venta="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-venta="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td></tr>';
    }).join('') : '<tr><td colspan="9">'+ui.emptyState('trending-up','No hay ventas registradas.')+'</td></tr>')+
    '</tbody></table></div></div>';
}
function wireVentasTable(el, user, company, state, canEdit, canDelete){
  const s = document.getElementById('ventaSearch');
  if(s) s.addEventListener('input', G.util.debounce(()=>{ state.search=s.value; renderComercial(el,user,company,state); },250));
  el.querySelectorAll('[data-edit-venta]').forEach(b=>b.addEventListener('click', ()=>openVentaForm(company, G.DB.sales.find(x=>x.id===b.getAttribute('data-edit-venta')), ()=>renderComercial(el,user,company,state))));
  el.querySelectorAll('[data-del-venta]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar venta', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{ G.crud.removeItem(G.DB.sales, b.getAttribute('data-del-venta')); G.logActivity('eliminó una venta', company.name, company.id); G.toast('Venta eliminada'); renderComercial(el,user,company,state); }});
  }));
}
function openVentaForm(company, existing, onDone){
  const clients = G.DB.clients.filter(c=>c.companyId===company.id);
  const products = G.DB.products.filter(p=>p.companyId===company.id);
  const sellers = G.DB.employees.filter(e=>e.companyId===company.id && e.status==='Activo').map(e=>e.name);
  G.modal.form({
    title: existing?'Editar venta':'Nueva venta', submitLabel: existing?'Guardar cambios':'Registrar venta', wide:true,
    initial: existing || {date:G.TODAY_ISO, qty:1, discount:0},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.sales, existing.id); G.toast('Venta eliminada'); onDone(); }:null,
    fields:[
      {key:'date', label:'Fecha', type:'date', required:true},
      {key:'clientId', label:'Cliente', type:'select', required:true, options:clients.map(c=>({value:c.id,label:c.name}))},
      {key:'productId', label:'Producto/servicio', type:'select', required:true, options:products.map(p=>({value:p.id,label:p.name+' — '+fmt.currency(p.price)}))},
      {key:'qty', label:'Cantidad', type:'number', required:true},
      {key:'price', label:'Precio unitario', type:'number', step:'0.01', required:true},
      {key:'discount', label:'Descuento', type:'number', step:'0.01'},
      {key:'seller', label:'Vendedor', type:'select', required:true, options: sellers.length?sellers:[company.responsible]},
    ],
    onSubmit(v){
      if(v.qty<=0 || v.price<0) return false;
      const total = v.qty*v.price - (v.discount||0);
      const payload = Object.assign({}, v, {total});
      if(existing){ G.crud.updateItem(G.DB.sales, existing.id, payload); G.logActivity('editó una venta', company.name, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.sales, Object.assign({companyId:company.id}, payload), 'sale'); G.logActivity('cargó una nueva venta', company.name, company.id); G.toast('Venta registrada'); }
      onDone();
    }
  });
}

const PIPE_STAGES = ['Prospecto','Contactado','Propuesta','Negociación','Ganado','Perdido'];
function pipelineHtml(company){
  const byStage = G.pipelineByStage(company.id);
  return '<div class="kanban">'+byStage.map(col=>{
    const totalVal = G.util.sum(col.items, i=>i.value);
    return '<div class="kanban-col" data-stage="'+col.stage+'">'+
      '<div class="kanban-col-head"><span>'+esc(col.stage)+'</span><span class="kanban-count">'+col.items.length+'</span></div>'+
      '<div class="subtle" style="font-size:11px;margin:-4px 0 10px 4px">'+fmt.currency(totalVal,{compact:true})+'</div>'+
      col.items.map(it=>'<div class="kanban-card" draggable="true" data-pipe-id="'+it.id+'">'+
        '<div class="kc-title">'+esc(it.clientName)+'</div>'+
        '<div class="subtle" style="font-size:11.5px">'+fmt.currency(it.value,{compact:true})+'</div>'+
        '<div class="kc-meta"><span>'+esc(it.owner)+'</span><span>'+fmt.timeAgo(it.updatedAt)+'</span></div>'+
      '</div>').join('')+
    '</div>';
  }).join('')+'</div>';
}
function wirePipeline(el, company, onDone){
  el.querySelectorAll('[data-pipe-id]').forEach(card=>{
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.getAttribute('data-pipe-id')); card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=> card.classList.remove('dragging'));
    card.addEventListener('click', ()=> openPipelineForm(company, G.DB.pipeline.find(p=>p.id===card.getAttribute('data-pipe-id')), onDone));
  });
  el.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drop-target'); });
    col.addEventListener('dragleave', ()=> col.classList.remove('drop-target'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('drop-target');
      const id = e.dataTransfer.getData('text/plain');
      const stage = col.getAttribute('data-stage');
      const item = G.DB.pipeline.find(p=>p.id===id);
      if(item && item.stage!==stage){
        G.crud.updateItem(G.DB.pipeline, id, {stage, updatedAt:G.TODAY_ISO});
        G.logActivity('movió una oportunidad a "'+stage+'" en el Pipeline', item.clientName, company.id);
        G.toast('Movido a '+stage);
        onDone();
      }
    });
  });
}
function openPipelineForm(company, existing, onDone){
  const sellers = G.DB.employees.filter(e=>e.companyId===company.id && e.status==='Activo').map(e=>e.name);
  G.modal.form({
    title: existing?'Editar oportunidad':'Nuevo prospecto', submitLabel: existing?'Guardar cambios':'Agregar',
    initial: existing || {stage:'Prospecto'},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.pipeline, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'clientName', label:'Cliente / prospecto', required:true, placeholder:'Nombre'},
      {key:'value', label:'Valor estimado', type:'number', step:'0.01', required:true},
      {key:'stage', label:'Etapa', type:'select', required:true, options: PIPE_STAGES},
      {key:'owner', label:'Responsable', type:'select', options: sellers.length?sellers:[company.responsible]},
    ],
    onSubmit(v){
      const payload = Object.assign({}, v, {updatedAt: G.TODAY_ISO});
      if(existing){ G.crud.updateItem(G.DB.pipeline, existing.id, payload); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.pipeline, Object.assign({companyId:company.id}, payload), 'pipe'); G.logActivity('agregó un nuevo prospecto al Pipeline', v.clientName, company.id); G.toast('Prospecto agregado'); }
      onDone();
    }
  });
}

/* ============================================================
   CLIENTES
   ============================================================ */
G.pages.clientes = function(el, user, company){
  const state = el._cliState || {search:'', segment:'', status:''};
  el._cliState = state;
  renderClientes(el, user, company, state);
};
function renderClientes(el, user, company, state){
  const canCreate = G.perm.userCan(user,'clientes','crear')||G.perm.userCan(user,'comercial','crear');
  const canEdit = G.perm.userCan(user,'clientes','editar')||G.perm.userCan(user,'comercial','editar');
  const canDelete = G.perm.userCan(user,'clientes','eliminar')||G.perm.userCan(user,'comercial','eliminar');
  let rows = G.crud.byCompany(G.DB.clients, company.id);
  if(state.search) rows = rows.filter(c=>c.name.toLowerCase().includes(state.search.toLowerCase()));
  if(state.segment) rows = rows.filter(c=>c.segment===state.segment);
  if(state.status) rows = rows.filter(c=>c.status===state.status);
  const segments = [...new Set(G.DB.clients.filter(c=>c.companyId===company.id).map(c=>c.segment))];

  el.innerHTML = ui.pageHeader('Clientes', 'Base de clientes de '+company.name+'.',
      (canCreate?'<button class="btn" id="cliImportBtn">'+icon('upload')+' Importar CSV</button><button class="btn btn-primary" id="cliNewBtn">'+icon('plus')+' Nuevo cliente</button>':''))+
    '<div class="table-card">'+
      '<div class="table-toolbar">'+
        '<div class="search-input">'+icon('search')+'<input type="text" id="cliSearch" placeholder="Buscar por nombre..." value="'+esc(state.search)+'"/></div>'+
        '<select class="filter-select" id="cliSegFilter"><option value="">Todos los segmentos</option>'+segments.map(s=>'<option value="'+esc(s)+'" '+(state.segment===s?'selected':'')+'>'+esc(s)+'</option>').join('')+'</select>'+
        '<select class="filter-select" id="cliStatusFilter"><option value="">Todos los estados</option>'+['Activo','Prospecto','Inactivo'].map(s=>'<option value="'+s+'" '+(state.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'+
        '<div class="subtle" style="margin-left:auto;font-size:12.5px">'+rows.length+' cliente(s)</div>'+
      '</div>'+
      '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Tipo</th><th>Contacto</th><th>Localidad</th><th>Segmento</th><th>Estado</th><th></th></tr></thead><tbody>'+
      (rows.length ? rows.map(c=>'<tr><td><b>'+esc(c.name)+'</b>'+(c.cuit?'<br><span class="subtle" style="font-size:11px">'+esc(c.cuit)+'</span>':'')+'</td><td class="subtle">'+esc(c.type)+'</td><td class="subtle" style="font-size:12px">'+esc(c.phone)+'<br>'+esc(c.email)+'</td><td>'+esc(c.city)+'</td><td>'+ui.badge('neutral',c.segment)+'</td><td>'+ui.statusBadgeFor('status',c.status)+'</td>'+
        '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-cli="'+c.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-cli="'+c.id+'">'+icon('trash')+'</button>':'')+'</div></td></tr>').join('')
        : '<tr><td colspan="7">'+ui.emptyState('users','No hay clientes que coincidan con el filtro.')+'</td></tr>')+
      '</tbody></table></div></div>';

  const s = document.getElementById('cliSearch'); if(s) s.addEventListener('input', G.util.debounce(()=>{ state.search=s.value; renderClientes(el,user,company,state); },250));
  const segF = document.getElementById('cliSegFilter'); if(segF) segF.addEventListener('change', ()=>{ state.segment=segF.value; renderClientes(el,user,company,state); });
  const stF = document.getElementById('cliStatusFilter'); if(stF) stF.addEventListener('change', ()=>{ state.status=stF.value; renderClientes(el,user,company,state); });
  const newBtn = document.getElementById('cliNewBtn'); if(newBtn) newBtn.addEventListener('click', ()=>openClienteForm(company, null, ()=>renderClientes(el,user,company,state)));
  const importBtn = document.getElementById('cliImportBtn'); if(importBtn) importBtn.addEventListener('click', ()=>{
    G.openCsvImport({
      title:'Importar clientes desde CSV',
      columns:[
        {key:'name', label:'name', required:true}, {key:'type', label:'type'}, {key:'cuit', label:'cuit'},
        {key:'contact', label:'contact'}, {key:'phone', label:'phone'}, {key:'email', label:'email'},
        {key:'city', label:'city'}, {key:'segment', label:'segment'}, {key:'status', label:'status'},
      ],
      onImport(rows){
        rows.forEach(r=>{
          G.crud.addItem(G.DB.clients, {
            companyId: company.id, name: r.name, type: r.type||'Empresa', cuit: r.cuit||'',
            contact: r.contact||'', phone: r.phone||'', email: r.email||'', city: r.city||'',
            segment: r.segment||'General', status: r.status||'Prospecto', notes:'', createdAt: G.TODAY_ISO,
          }, 'cli');
        });
        G.logActivity('importó '+rows.length+' cliente(s) desde CSV', company.name, company.id);
        renderClientes(el,user,company,state);
      }
    });
  });
  el.querySelectorAll('[data-edit-cli]').forEach(b=>b.addEventListener('click', ()=>openClienteForm(company, G.DB.clients.find(c=>c.id===b.getAttribute('data-edit-cli')), ()=>renderClientes(el,user,company,state))));
  el.querySelectorAll('[data-del-cli]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar cliente', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{ G.crud.removeItem(G.DB.clients, b.getAttribute('data-del-cli')); G.logActivity('eliminó un cliente', company.name, company.id); G.toast('Cliente eliminado'); renderClientes(el,user,company,state); }});
  }));
}
function openClienteForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar cliente':'Nuevo cliente', submitLabel: existing?'Guardar cambios':'Crear cliente', wide:true,
    initial: existing || {type:'Empresa', status:'Prospecto'},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.clients, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'name', label:'Nombre', required:true, placeholder:'Razón social o nombre'},
      {key:'type', label:'Tipo', type:'select', options:['Empresa','Persona'], required:true},
      {key:'cuit', label:'CUIT', placeholder:'30-00000000-0'},
      {key:'contact', label:'Contacto', placeholder:'Nombre de contacto'},
      {key:'phone', label:'Teléfono', placeholder:'+54 9 11 0000-0000'},
      {key:'email', label:'Email', type:'email', placeholder:'contacto@empresa.com'},
      {key:'city', label:'Localidad', placeholder:'Ciudad'},
      {key:'segment', label:'Segmento', placeholder:'Ej: Comercio, Industria'},
      {key:'status', label:'Estado', type:'select', options:['Activo','Prospecto','Inactivo'], required:true},
      {key:'notes', label:'Observaciones', type:'textarea', fullWidth:true},
    ],
    onSubmit(v){
      if(existing){ G.crud.updateItem(G.DB.clients, existing.id, v); G.logActivity('editó un cliente', v.name, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.clients, Object.assign({companyId:company.id, createdAt:G.TODAY_ISO}, v), 'cli'); G.logActivity('registró un nuevo cliente', v.name, company.id); G.toast('Cliente creado'); }
      onDone();
    }
  });
}

})();
</script>

<script>
/* ============================================================
   PART 12 — Módulo Recursos Humanos
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

G.pages.rrhh = function(el, user, company){
  const state = el._rrhhState || {tab:'resumen', search:'', area:''};
  el._rrhhState = state;
  renderRRHH(el, user, company, state);
};

function renderRRHH(el, user, company, state){
  const canCreate = G.perm.userCan(user,'rrhh','crear'), canEdit = G.perm.userCan(user,'rrhh','editar'), canDelete = G.perm.userCan(user,'rrhh','eliminar');
  let body='', actions='';
  if(state.tab==='resumen') body = rrhhResumenHtml(company);
  else if(state.tab==='empleados'){ body = empleadosTableHtml(company, state, canEdit, canDelete); actions = canCreate?'<button class="btn" id="empImportBtn">'+icon('upload')+' Importar CSV</button><button class="btn btn-primary" id="empNewBtn">'+icon('plus')+' Nuevo empleado</button>':''; }
  else if(state.tab==='evaluacion'){ body = evaluacionesHtml(company); actions = canCreate?'<button class="btn btn-primary" id="evalNewBtn">'+icon('plus')+' Nueva evaluación</button>':''; }

  el.innerHTML = ui.pageHeader('Recursos Humanos', 'Dotación, costo laboral y desarrollo de las personas de tu equipo.', actions)+
    ui.tabsHtml([{key:'resumen',label:'Resumen'},{key:'empleados',label:'Empleados'},{key:'evaluacion',label:'Evaluación y desarrollo'}], state.tab)+
    body;
  ui.wireTabs(el, tab=>{ state.tab=tab; renderRRHH(el,user,company,state); });

  if(state.tab==='resumen') mountRRHHCharts(company);
  else if(state.tab==='empleados'){
    wireEmpleadosTable(el, user, company, state, canEdit, canDelete);
    const b = document.getElementById('empNewBtn'); if(b) b.addEventListener('click', ()=>openEmpleadoForm(company,null,()=>renderRRHH(el,user,company,state)));
    const ib = document.getElementById('empImportBtn'); if(ib) ib.addEventListener('click', ()=>{
      G.openCsvImport({
        title:'Importar empleados desde CSV',
        columns:[
          {key:'name', label:'name', required:true}, {key:'dni', label:'dni'}, {key:'role', label:'role'},
          {key:'area', label:'area', required:true}, {key:'startDate', label:'startDate'}, {key:'contractType', label:'contractType'},
          {key:'schedule', label:'schedule'}, {key:'salary', label:'salary'}, {key:'status', label:'status'},
        ],
        onImport(rows){
          rows.forEach(r=>{
            G.crud.addItem(G.DB.employees, {
              companyId: company.id, name: r.name, dni: r.dni||'', role: r.role||'', area: r.area,
              startDate: r.startDate||G.TODAY_ISO, contractType: r.contractType||'Relación de dependencia',
              schedule: r.schedule||'Full-time', salary: parseFloat(r.salary)||0, status: r.status||'Activo', notes:'',
            }, 'emp');
          });
          G.logActivity('importó '+rows.length+' empleado(s) desde CSV', company.name, company.id);
          renderRRHH(el,user,company,state);
        }
      });
    });
  } else if(state.tab==='evaluacion'){
    const b = document.getElementById('evalNewBtn'); if(b) b.addEventListener('click', ()=>openEvalForm(company,()=>renderRRHH(el,user,company,state)));
  }
}

function rrhhResumenHtml(company){
  const kpi = G.companyKPIs(company.id, 'mes');
  const seniority = G.avgSeniorityYears(company.id);
  const ausentismoInd = G.DB.indicators.find(i=>i.companyId===company.id && i.name==='Ausentismo');
  return '<div class="kpi-grid">'+
    ui.kpiCard({icon:'users', label:'Empleados activos', value: kpi.empleadosActivos})+
    ui.kpiCard({icon:'wallet', label:'Costo laboral / mes', value: fmt.currency(kpi.costoLaboral,{compact:true})})+
    ui.kpiCard({icon:'calendar', label:'Antigüedad promedio', value: seniority.toFixed(1)+' años'})+
    ui.kpiCard({icon:'alert-triangle', label:'Ausentismo', value: ausentismoInd?fmt.pct(ausentismoInd.current):'—'})+
    '</div>'+
    '<div class="grid-2">'+
      ui.card('Distribución por área','', '<div id="rrhhAreaDonut"></div>')+
      ui.card('Evolución de dotación','Últimos 10 meses','<div id="rrhhHeadcountChart"></div>')+
    '</div>';
}
function mountRRHHCharts(company){
  G.charts.donut(document.getElementById('rrhhAreaDonut'), G.employeesByArea(company.id), {money:false});
  const emps = G.DB.employees.filter(e=>e.companyId===company.id);
  const months = G.lastMonths(10);
  const data = months.map(mo=>({x:mo.label, y: emps.filter(e=> e.startDate <= mo.key+'-28').length}));
  G.charts.line(document.getElementById('rrhhHeadcountChart'), [{name:'Dotación', data}], {showArea:true, money:false});
}

function empleadosTableHtml(company, state, canEdit, canDelete){
  let rows = G.crud.byCompany(G.DB.employees, company.id);
  if(state.search) rows = rows.filter(e=>e.name.toLowerCase().includes(state.search.toLowerCase()));
  if(state.area) rows = rows.filter(e=>e.area===state.area);
  const areas = [...new Set(G.DB.employees.filter(e=>e.companyId===company.id).map(e=>e.area))];
  return '<div class="table-card">'+
    '<div class="table-toolbar">'+
      '<div class="search-input">'+icon('search')+'<input type="text" id="empSearch" placeholder="Buscar empleado..." value="'+esc(state.search)+'"/></div>'+
      '<select class="filter-select" id="empAreaFilter"><option value="">Todas las áreas</option>'+areas.map(a=>'<option value="'+esc(a)+'" '+(state.area===a?'selected':'')+'>'+esc(a)+'</option>').join('')+'</select>'+
      '<div class="subtle" style="margin-left:auto;font-size:12.5px">'+rows.length+' empleado(s)</div>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Nombre</th><th>Cargo</th><th>Área</th><th>Ingreso</th><th>Contratación</th><th class="num">Remuneración</th><th>Estado</th><th></th></tr></thead><tbody>'+
    (rows.length?rows.map(e=>'<tr><td><b>'+esc(e.name)+'</b><br><span class="subtle" style="font-size:11px">DNI '+esc(e.dni)+'</span></td><td>'+esc(e.role)+'</td><td>'+ui.badge('neutral',e.area)+'</td><td>'+fmt.date(e.startDate)+'</td><td class="subtle" style="font-size:12px">'+esc(e.contractType)+'</td><td class="num">'+fmt.currency(e.salary)+'</td><td>'+ui.statusBadgeFor('status',e.status)+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-emp="'+e.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-emp="'+e.id+'">'+icon('trash')+'</button>':'')+'</div></td></tr>').join('')
      :'<tr><td colspan="8">'+ui.emptyState('user-check','No hay empleados cargados.')+'</td></tr>')+
    '</tbody></table></div></div>';
}
function wireEmpleadosTable(el, user, company, state, canEdit, canDelete){
  const s = document.getElementById('empSearch'); if(s) s.addEventListener('input', G.util.debounce(()=>{ state.search=s.value; renderRRHH(el,user,company,state); },250));
  const a = document.getElementById('empAreaFilter'); if(a) a.addEventListener('change', ()=>{ state.area=a.value; renderRRHH(el,user,company,state); });
  el.querySelectorAll('[data-edit-emp]').forEach(b=>b.addEventListener('click', ()=>openEmpleadoForm(company, G.DB.employees.find(e=>e.id===b.getAttribute('data-edit-emp')), ()=>renderRRHH(el,user,company,state))));
  el.querySelectorAll('[data-del-emp]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar empleado', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{ G.crud.removeItem(G.DB.employees, b.getAttribute('data-del-emp')); G.logActivity('eliminó un empleado', company.name, company.id); G.toast('Eliminado'); renderRRHH(el,user,company,state); }});
  }));
}
function openEmpleadoForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar empleado':'Nuevo empleado', submitLabel: existing?'Guardar cambios':'Agregar empleado', wide:true,
    initial: existing || {status:'Activo', schedule:'Full-time', startDate:G.TODAY_ISO},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.employees, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'name', label:'Nombre completo', required:true},
      {key:'dni', label:'DNI', required:true},
      {key:'role', label:'Cargo', required:true},
      {key:'area', label:'Área', required:true, placeholder:'Ej: Comercial, Producción, Finanzas'},
      {key:'startDate', label:'Fecha de ingreso', type:'date', required:true},
      {key:'contractType', label:'Tipo de contratación', type:'select', required:true, options:['Relación de dependencia','Monotributo','Part-time','Temporal']},
      {key:'schedule', label:'Jornada', type:'select', options:['Full-time','Part-time']},
      {key:'salary', label:'Remuneración', type:'number', step:'0.01', required:true},
      {key:'status', label:'Estado', type:'select', options:['Activo','Baja'], required:true},
      {key:'notes', label:'Observaciones', type:'textarea', fullWidth:true},
    ],
    onSubmit(v){
      if(existing){ G.crud.updateItem(G.DB.employees, existing.id, v); G.logActivity('editó un empleado en RRHH', v.name, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.employees, Object.assign({companyId:company.id}, v), 'emp'); G.logActivity('agregó un nuevo empleado', v.name, company.id); G.toast('Empleado agregado'); }
      onDone();
    }
  });
}

function evaluacionesHtml(company){
  const rows = G.crud.byCompany(G.DB.evaluations, company.id);
  return '<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Empleado</th><th>Período</th><th>Objetivos</th><th>Competencias evaluadas</th><th class="num">Puntaje</th><th>Necesidad de formación</th></tr></thead><tbody>'+
    (rows.length?rows.map(r=>{
      const emp = G.DB.employees.find(e=>e.id===r.employeeId);
      return '<tr><td><b>'+esc(emp?emp.name:'—')+'</b></td><td>'+esc(r.period)+'</td><td class="subtle" style="font-size:12px;max-width:220px">'+esc(r.objectives)+'</td><td class="subtle" style="font-size:12px;max-width:220px">'+esc(r.competencies)+'</td><td class="num"><b>'+esc(r.score)+'</b>/5</td><td class="subtle" style="font-size:12px">'+esc(r.trainingNeeds)+'</td></tr>';
    }).join('') : '<tr><td colspan="6">'+ui.emptyState('clipboard','No hay evaluaciones cargadas.')+'</td></tr>')+
    '</tbody></table></div></div>'+
    '<div style="margin-top:16px">'+ui.infoCallout('Este espacio permite registrar objetivos, competencias, evaluaciones de desempeño y necesidades de capacitación detectadas para cada persona del equipo.')+'</div>';
}
function openEvalForm(company, onDone){
  const employees = G.DB.employees.filter(e=>e.companyId===company.id && e.status==='Activo');
  G.modal.form({
    title:'Nueva evaluación', submitLabel:'Guardar', wide:true,
    initial:{period:'2do semestre 2026', score:4},
    fields:[
      {key:'employeeId', label:'Empleado', type:'select', required:true, options:employees.map(e=>({value:e.id,label:e.name}))},
      {key:'period', label:'Período', required:true},
      {key:'score', label:'Puntaje (1 a 5)', type:'number', step:'0.1', required:true},
      {key:'objectives', label:'Objetivos evaluados', type:'textarea'},
      {key:'competencies', label:'Competencias evaluadas', type:'textarea'},
      {key:'trainingNeeds', label:'Necesidades de formación detectadas', type:'textarea', fullWidth:true},
    ],
    onSubmit(v){
      G.crud.addItem(G.DB.evaluations, Object.assign({companyId:company.id, notes:''}, v), 'ev');
      G.logActivity('registró una evaluación de desempeño', company.name, company.id);
      G.toast('Evaluación registrada'); onDone();
    }
  });
}

})();
</script>

<script>
/* ============================================================
   PART 13 — Planificación, Indicadores e Innovación
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

/* ============================================================
   PLANIFICACIÓN
   ============================================================ */
G.pages.planificacion = function(el, user, company){
  const canCreate = G.perm.userCan(user,'planificacion','crear'), canEdit = G.perm.userCan(user,'planificacion','editar'), canDelete = G.perm.userCan(user,'planificacion','eliminar');
  renderPlanificacion(el, user, company, canCreate, canEdit, canDelete);
};
function renderPlanificacion(el, user, company, canCreate, canEdit, canDelete){
  const objectives = G.crud.byCompany(G.DB.objectives, company.id);
  el.innerHTML = ui.pageHeader('Planificación', 'Objetivos estratégicos y su avance en el tiempo.', canCreate?'<button class="btn btn-primary" id="objNewBtn">'+icon('plus')+' Nuevo objetivo</button>':'')+
    (objectives.length ? '<div class="grid-2">'+objectives.map(o=>objectiveCardHtml(o)).join('')+'</div>' : ui.emptyState('target','Todavía no se definieron objetivos estratégicos para esta empresa.'));
  const b = document.getElementById('objNewBtn'); if(b) b.addEventListener('click', ()=>openObjectiveForm(company,null,()=>renderPlanificacion(el,user,company,canCreate,canEdit,canDelete)));
  el.querySelectorAll('[data-edit-obj]').forEach(btn=>btn.addEventListener('click', ()=>{
    if(!canEdit) return;
    openObjectiveForm(company, G.DB.objectives.find(o=>o.id===btn.getAttribute('data-edit-obj')), ()=>renderPlanificacion(el,user,company,canCreate,canEdit,canDelete));
  }));
}
function objectiveCardHtml(o){
  const pct = o.goal===0 ? (o.current===0?100:0) : Math.max(0,Math.min(150, Math.round(o.current/o.goal*100)));
  const tone = o.status==='Cumplido'?'good':o.status==='En riesgo'?'warning':'';
  return '<div class="card" data-edit-obj="'+o.id+'" style="cursor:pointer">'+
    '<div class="card-head"><div><div class="card-title">'+esc(o.name)+'</div><div class="card-sub">'+esc(o.description)+'</div></div>'+ui.statusBadgeFor('status',o.status)+'</div>'+
    '<div class="flex justify-between" style="font-size:12px;margin-bottom:5px"><span class="muted">'+esc(o.indicator)+'</span><span class="mono">'+fmtIndicatorVal(o.current,o.unit)+' / '+fmtIndicatorVal(o.goal,o.unit)+'</span></div>'+
    ui.progressBar(pct, tone)+
    '<div class="flex justify-between" style="margin-top:12px;font-size:11.5px" class="subtle">'+
      '<span class="subtle">'+icon('user-cog','subtle')+' '+esc(o.responsible)+'</span>'+
      '<span class="subtle">'+icon('calendar','subtle')+' hasta '+fmt.date(o.targetDate)+'</span>'+
    '</div></div>';
}
function fmtIndicatorVal(v, unit){
  if(unit==='$') return fmt.currency(v,{compact:true});
  const decimals = unit && (unit.length<=2 || unit.includes('/')) ? 1 : 0;
  return fmt.num(v,decimals)+(unit&&unit!=='uds'&&unit!=='clientes'?unit:(unit?(' '+unit):''));
}
function openObjectiveForm(company, existing, onDone, opts){
  opts = opts || {};
  G.modal.form({
    title: existing?'Editar objetivo':'Nuevo objetivo estratégico', subtitle: opts.subtitle, submitLabel: existing?'Guardar cambios':'Crear objetivo', wide:true,
    initial: existing || opts.prefill || {status:'No iniciado', startDate:G.TODAY_ISO},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.objectives, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'name', label:'Nombre del objetivo', required:true, placeholder:'Ej: Aumentar las ventas un 20%', fullWidth:true},
      {key:'description', label:'Descripción', type:'textarea', fullWidth:true},
      {key:'responsible', label:'Responsable', required:true},
      {key:'startDate', label:'Fecha de inicio', type:'date', required:true},
      {key:'targetDate', label:'Fecha objetivo', type:'date', required:true},
      {key:'indicator', label:'Indicador de seguimiento', required:true, placeholder:'Ej: Ventas mensuales'},
      {key:'goal', label:'Meta', type:'number', step:'0.01', required:true},
      {key:'current', label:'Valor actual', type:'number', step:'0.01', required:true},
      {key:'status', label:'Estado', type:'select', options:['No iniciado','En progreso','En riesgo','Cumplido'], required:true},
    ],
    onSubmit(v){
      if(existing){ G.crud.updateItem(G.DB.objectives, existing.id, v); G.logActivity('editó un objetivo de Planificación', v.name, company.id); G.toast('Guardado'); onDone(); }
      else {
        const created = G.crud.addItem(G.DB.objectives, Object.assign({companyId:company.id, origin: opts.prefill?opts.prefill.origin:undefined}, v), 'obj');
        G.logActivity('creó un nuevo objetivo estratégico', v.name, company.id);
        G.toast('Objetivo creado');
        if(opts.onCreated) setTimeout(()=>opts.onCreated(created), 0); else onDone();
      }
    }
  });
}
G.openObjectiveForm = openObjectiveForm;

/* ============================================================
   INDICADORES
   ============================================================ */
G.pages.indicadores = function(el, user, company){
  const canCreate = G.perm.userCan(user,'indicadores','crear'), canEdit = G.perm.userCan(user,'indicadores','editar'), canDelete = G.perm.userCan(user,'indicadores','eliminar');
  renderIndicadores(el, user, company, canCreate, canEdit, canDelete);
};
function renderIndicadores(el, user, company, canCreate, canEdit, canDelete){
  const list = G.crud.byCompany(G.DB.indicators, company.id);
  el.innerHTML = ui.pageHeader('Indicadores', 'Sistema flexible de KPIs para tomar decisiones con datos.', canCreate?'<button class="btn btn-primary" id="kpiNewBtn">'+icon('plus')+' Nuevo indicador</button>':'')+
    (list.length ? '<div class="grid-3">'+list.map(indicatorCardHtml).join('')+'</div>' : ui.emptyState('bar-chart','Todavía no hay indicadores definidos.'));
  list.forEach(k=> G.charts.sparklineSvgMount && null);
  el.querySelectorAll('[data-spark]').forEach(elx=>{
    const k = list.find(x=>x.id===elx.getAttribute('data-spark'));
    if(k) elx.innerHTML = G.charts.sparklineSvg(k.history.map(h=>h.value), {width: elx.clientWidth||140, height:36});
  });
  const b = document.getElementById('kpiNewBtn'); if(b) b.addEventListener('click', ()=>openIndicatorForm(company,null,()=>renderIndicadores(el,user,company,canCreate,canEdit,canDelete)));
  el.querySelectorAll('[data-edit-kpi]').forEach(btn=>btn.addEventListener('click', ()=>{
    openIndicatorForm(company, list.find(k=>k.id===btn.getAttribute('data-edit-kpi')), ()=>renderIndicadores(el,user,company,canCreate,canEdit,canDelete));
  }));
  el.querySelectorAll('[data-update-kpi]').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation();
    openIndicatorUpdate(company, list.find(k=>k.id===btn.getAttribute('data-update-kpi')), ()=>renderIndicadores(el,user,company,canCreate,canEdit,canDelete));
  }));
}
function indicatorCardHtml(k){
  const above = G.indicatorIsAboveGoal(k);
  return '<div class="card">'+
    '<div class="card-head"><div><div class="card-title">'+esc(k.name)+'</div><div class="card-sub">'+esc(k.category)+' · '+esc(k.frequency)+'</div></div>'+
      '<button class="btn btn-sm icon-btn" data-edit-kpi="'+k.id+'">'+icon('edit')+'</button></div>'+
    '<div class="flex items-center justify-between" style="margin:6px 0 2px">'+
      '<div><div class="kpi-value" style="font-size:22px">'+fmtIndicatorVal(k.current,k.unit)+'</div><div class="subtle" style="font-size:11px">objetivo: '+fmtIndicatorVal(k.target,k.unit)+'</div></div>'+
      '<div data-spark="'+k.id+'" style="width:110px;height:36px"></div>'+
    '</div>'+
    ui.badge(above?'good':'warning', above?'En objetivo':'Debajo del objetivo')+
    '<div class="subtle" style="font-size:11px;margin-top:10px">'+esc(k.formula)+'</div>'+
    '<div class="flex justify-between" style="margin-top:10px"><span class="subtle" style="font-size:11.5px">'+icon('user-cog','subtle')+' '+esc(k.responsible)+'</span><button class="btn btn-sm" data-update-kpi="'+k.id+'">Actualizar valor</button></div>'+
  '</div>';
}
function openIndicatorForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar indicador':'Nuevo indicador', submitLabel: existing?'Guardar cambios':'Crear indicador', wide:true,
    initial: existing || {frequency:'Mensual', current:0},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.indicators, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'name', label:'Nombre', required:true, placeholder:'Ej: Rentabilidad neta'},
      {key:'category', label:'Categoría', type:'select', required:true, options:['Finanzas','Comercial','Costos','RRHH','Gestión','Ganadera','Agrícola','Económica','Recursos']},
      {key:'formula', label:'Fórmula', placeholder:'Ej: (Resultado / Ingresos) x 100', fullWidth:true},
      {key:'unit', label:'Unidad', type:'select', required:true, options:[{value:'%',label:'Porcentaje (%)'},{value:'$',label:'Pesos ($)'},{value:'uds',label:'Unidades'},{value:'clientes',label:'Clientes'},{value:'días',label:'Días'},{value:'kg',label:'Kilos (kg)'},{value:'kg/ha',label:'Kilos por hectárea (kg/ha)'},{value:'kg/día',label:'Kilos por día (kg/día)'},{value:'EV/ha',label:'Equiv. vaca por hectárea (EV/ha)'}]},
      {key:'target', label:'Valor objetivo', type:'number', step:'0.01', required:true},
      {key:'current', label:'Valor actual', type:'number', step:'0.01'},
      {key:'frequency', label:'Frecuencia', type:'select', options:['Mensual','Trimestral','Semestral','Anual']},
      {key:'responsible', label:'Responsable', required:true},
    ],
    onSubmit(v){
      if(existing){ G.crud.updateItem(G.DB.indicators, existing.id, v); G.logActivity('editó un indicador', v.name, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.indicators, Object.assign({companyId:company.id, history:[{period:'Actual', value:v.current}]}, v), 'kpi'); G.logActivity('creó un nuevo indicador personalizado', v.name, company.id); G.toast('Indicador creado'); }
      onDone();
    }
  });
}
function openIndicatorUpdate(company, k, onDone){
  G.modal.form({
    title:'Actualizar '+k.name, submitLabel:'Guardar valor',
    initial:{value:k.current, period: 'Actualización '+fmt.date(G.TODAY_ISO)},
    fields:[
      {key:'period', label:'Período / etiqueta', required:true},
      {key:'value', label:'Nuevo valor', type:'number', step:'0.01', required:true},
    ],
    onSubmit(v){
      const history = k.history.concat([{period:v.period, value:v.value}]);
      G.crud.updateItem(G.DB.indicators, k.id, {current:v.value, history});
      G.logActivity('actualizó el valor del indicador', k.name, company.id);
      G.toast('Indicador actualizado'); onDone();
    }
  });
}

/* ============================================================
   INNOVACIÓN
   ============================================================ */
const INNO_STAGES = ['Idea','Evaluación','En desarrollo','Implementada','Evaluada'];
G.pages.innovacion = function(el, user, company){
  const canCreate = G.perm.userCan(user,'innovacion','crear');
  renderInnovacion(el, user, company, canCreate);
};
function renderInnovacion(el, user, company, canCreate){
  const items = G.crud.byCompany(G.DB.innovation, company.id);
  el.innerHTML = ui.pageHeader('Innovación y Mejora', 'Ideas, oportunidades y proyectos que hacen crecer al negocio, más allá de lo administrativo.', canCreate?('<button class="btn" id="innoQuickBtn">'+icon('mic')+' Carga rápida</button><button class="btn btn-primary" id="innoNewBtn">'+icon('plus')+' Nueva iniciativa</button>'):'')+
    '<div class="kanban">'+INNO_STAGES.map(stage=>{
      const col = items.filter(i=>i.status===stage);
      return '<div class="kanban-col" data-stage="'+stage+'"><div class="kanban-col-head"><span>'+stage+'</span><span class="kanban-count">'+col.length+'</span></div>'+
        col.map(it=>'<div class="kanban-card" draggable="true" data-inno-id="'+it.id+'">'+
          '<div class="kc-title">'+esc(it.title)+'</div>'+
          '<div class="subtle" style="font-size:11.5px;margin-bottom:6px">'+esc(it.expectedImpact||'')+'</div>'+
          priorityBadge(it.priority)+
          '<div class="kc-meta"><span>'+esc(it.responsible)+'</span><span>'+fmt.timeAgo(it.date)+'</span></div>'+
        '</div>').join('')+
      '</div>';
    }).join('')+'</div>';

  el.querySelectorAll('[data-inno-id]').forEach(card=>{
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.getAttribute('data-inno-id')); card.classList.add('dragging'); });
    card.addEventListener('dragend', ()=>card.classList.remove('dragging'));
    card.addEventListener('click', ()=>openInnovacionForm(company, items.find(i=>i.id===card.getAttribute('data-inno-id')), ()=>renderInnovacion(el,user,company,canCreate)));
  });
  el.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('drop-target'); });
    col.addEventListener('dragleave', ()=>col.classList.remove('drop-target'));
    col.addEventListener('drop', e=>{
      e.preventDefault(); col.classList.remove('drop-target');
      const id = e.dataTransfer.getData('text/plain');
      const stage = col.getAttribute('data-stage');
      const item = G.DB.innovation.find(i=>i.id===id);
      if(item && item.status!==stage){
        G.crud.updateItem(G.DB.innovation, id, {status:stage});
        G.logActivity('movió una iniciativa a "'+stage+'" en Innovación', item.title, company.id);
        G.toast('Movido a '+stage);
        renderInnovacion(el,user,company,canCreate);
      }
    });
  });
  const b = document.getElementById('innoNewBtn'); if(b) b.addEventListener('click', ()=>openInnovacionForm(company,null,()=>renderInnovacion(el,user,company,canCreate)));
  const qb = document.getElementById('innoQuickBtn'); if(qb) qb.addEventListener('click', ()=>G.openQuickCapture(user, company, {type:'idea', onDone:()=>renderInnovacion(el,user,company,canCreate)}));
}
function priorityBadge(p){
  const tone = p==='Alta'?'critical':p==='Media'?'warning':'neutral';
  return ui.badge(tone, 'Prioridad '+p);
}
function openInnovacionForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar iniciativa':'Nueva iniciativa', submitLabel: existing?'Guardar cambios':'Crear iniciativa', wide:true,
    initial: existing || {status:'Idea', priority:'Media', date:G.TODAY_ISO},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.innovation, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'title', label:'Título', required:true, fullWidth:true},
      {key:'description', label:'Descripción', type:'textarea', fullWidth:true},
      {key:'responsible', label:'Responsable', required:true},
      {key:'date', label:'Fecha', type:'date', required:true},
      {key:'status', label:'Estado', type:'select', options:INNO_STAGES, required:true},
      {key:'priority', label:'Prioridad', type:'select', options:['Baja','Media','Alta'], required:true},
      {key:'expectedImpact', label:'Impacto esperado', placeholder:'Ej: Reducir costos 10%'},
      {key:'estimatedCost', label:'Costo estimado', type:'number', step:'0.01'},
      {key:'result', label:'Resultado', type:'textarea', fullWidth:true, hint:'Completar una vez implementada y evaluada.'},
    ],
    onSubmit(v){
      if(existing){ G.crud.updateItem(G.DB.innovation, existing.id, v); G.logActivity('editó una iniciativa de Innovación', v.title, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.innovation, Object.assign({companyId:company.id}, v), 'inn'); G.logActivity('creó una nueva iniciativa de Innovación', v.title, company.id); G.toast('Iniciativa creada'); }
      onDone();
    }
  });
}

// Expuestos para que otros módulos (ej. Agropecuario) puedan reusar la misma tarjeta
// de indicador y los mismos formularios de alta/actualización, en vez de duplicarlos.
G.indicatorCardHtml = indicatorCardHtml;
G.openIndicatorForm = openIndicatorForm;
G.openIndicatorUpdate = openIndicatorUpdate;
G.fmtIndicatorVal = fmtIndicatorVal;

})();
</script>

<script>
/* ============================================================
   PART 14 — Módulo Consultoría
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

G.pages.consultoria = function(el, user, company){
  const isSuper = user.role==='SUPER_ADMIN';
  const state = el._consState || {tab:'diagnostico'};
  el._consState = state;
  renderConsultoria(el, user, company, state, isSuper);
};

function renderConsultoria(el, user, company, state, isSuper){
  const tabs = [{key:'diagnostico',label:'Diagnóstico FODA'},{key:'plan',label:'Plan de acción'},{key:'reuniones',label:'Reuniones'}];
  if(isSuper) tabs.push({key:'notas',label:'Notas privadas'});

  let body='', actions='';
  if(state.tab==='diagnostico'){ body = diagnosticoHtml(company); actions = isSuper?'<button class="btn btn-primary" id="diagBtn">'+icon('edit')+' Editar diagnóstico</button>':''; }
  else if(state.tab==='plan'){ body = planAccionHtml(company); actions = '<button class="btn btn-primary" id="actionNewBtn">'+icon('plus')+' Nueva acción</button>'; }
  else if(state.tab==='reuniones'){ body = reunionesHtml(company); actions = isSuper?('<button class="btn" id="meetQuickBtn">'+icon('mic')+' Carga rápida</button><button class="btn btn-primary" id="meetNewBtn">'+icon('plus')+' Nueva reunión</button>'):''; }
  else if(state.tab==='notas' && isSuper){ body = notasHtml(company); actions = '<button class="btn btn-primary" id="noteNewBtn">'+icon('plus')+' Nueva nota</button>'; }

  el.innerHTML = ui.pageHeader('Consultoría', 'Diagnóstico, plan de acción y seguimiento del acompañamiento a '+company.name+'.', actions)+
    ui.tabsHtml(tabs, state.tab) + body;
  ui.wireTabs(el, tab=>{ state.tab=tab; renderConsultoria(el,user,company,state,isSuper); });

  if(state.tab==='diagnostico'){
    const b = document.getElementById('diagBtn'); if(b) b.addEventListener('click', ()=>openDiagnosticoForm(company, ()=>renderConsultoria(el,user,company,state,isSuper)));
  } else if(state.tab==='plan'){
    const b = document.getElementById('actionNewBtn'); if(b) b.addEventListener('click', ()=>openAccionForm(company, null, ()=>renderConsultoria(el,user,company,state,isSuper)));
    el.querySelectorAll('[data-edit-action]').forEach(btn=>btn.addEventListener('click', ()=>openAccionForm(company, G.DB.consulting.actions.find(a=>a.id===btn.getAttribute('data-edit-action')), ()=>renderConsultoria(el,user,company,state,isSuper))));
  } else if(state.tab==='reuniones'){
    const b = document.getElementById('meetNewBtn'); if(b) b.addEventListener('click', ()=>openReunionForm(company, ()=>renderConsultoria(el,user,company,state,isSuper)));
    const qb = document.getElementById('meetQuickBtn'); if(qb) qb.addEventListener('click', ()=>G.openQuickCapture(user, company, {type:'meeting', onDone:()=>renderConsultoria(el,user,company,state,isSuper)}));
  } else if(state.tab==='notas' && isSuper){
    const b = document.getElementById('noteNewBtn'); if(b) b.addEventListener('click', ()=>openNotaForm(company, ()=>renderConsultoria(el,user,company,state,isSuper)));
  }
}

function foda(label, text, tone, iconName){
  return '<div class="card"><div class="flex items-center gap-sm" style="margin-bottom:8px"><div style="width:26px;height:26px;border-radius:8px;background:var(--'+tone+'-soft);color:var(--'+tone+');display:flex;align-items:center;justify-content:center">'+icon(iconName)+'</div><div class="card-title" style="font-size:13.5px">'+label+'</div></div><p style="font-size:12.8px;color:var(--text-secondary);line-height:1.55">'+esc(text||'—')+'</p></div>';
}
function diagnosticoHtml(company){
  const diag = G.DB.consulting.diagnostics.filter(d=>d.companyId===company.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!diag) return ui.emptyState('clipboard','Todavía no se cargó un diagnóstico inicial.');
  return '<div class="subtle" style="font-size:12px;margin-bottom:12px">Diagnóstico del '+fmt.dateLong(diag.date)+'</div>'+
    '<div class="grid-2">'+
      foda('Fortalezas', diag.strengths, 'good', 'thumbs-up')+
      foda('Debilidades', diag.weaknesses, 'critical', 'alert-triangle')+
      foda('Oportunidades', diag.opportunities, 'accent', 'compass')+
      foda('Amenazas', diag.threats, 'warning', 'alert-triangle')+
    '</div>'+
    '<div style="margin-top:16px">'+ui.card('Problemas prioritarios', 'Foco de trabajo de la consultoría', '<p style="font-size:13px;line-height:1.6">'+esc(diag.priorityProblems)+'</p>')+'</div>';
}
function openDiagnosticoForm(company, onDone){
  const diag = G.DB.consulting.diagnostics.filter(d=>d.companyId===company.id).sort((a,b)=>b.date.localeCompare(a.date))[0];
  G.modal.form({
    title:'Diagnóstico de consultoría', submitLabel:'Guardar diagnóstico', wide:true,
    initial: diag || {date:G.TODAY_ISO},
    fields:[
      {key:'strengths', label:'Fortalezas', type:'textarea', fullWidth:true, required:true},
      {key:'weaknesses', label:'Debilidades', type:'textarea', fullWidth:true, required:true},
      {key:'opportunities', label:'Oportunidades', type:'textarea', fullWidth:true, required:true},
      {key:'threats', label:'Amenazas', type:'textarea', fullWidth:true, required:true},
      {key:'priorityProblems', label:'Problemas prioritarios', type:'textarea', fullWidth:true, required:true},
    ],
    onSubmit(v){
      if(diag){ G.crud.updateItem(G.DB.consulting.diagnostics, diag.id, v); }
      else { G.crud.addItem(G.DB.consulting.diagnostics, Object.assign({companyId:company.id, date:G.TODAY_ISO}, v), 'diag'); }
      G.logActivity('actualizó el diagnóstico de consultoría', company.name, company.id);
      G.toast('Diagnóstico guardado'); onDone();
    }
  });
}

function accionesSummaryStripHtml(company){
  const s = G.actionsSummary(company.id);
  return '<div class="kpi-grid" style="margin-bottom:16px">'+
    ui.kpiCard({icon:'alert-triangle', label:'Vencidas', value:s.vencidas})+
    ui.kpiCard({icon:'calendar', label:'Próximas a vencer', value:s.proximasAVencer})+
    ui.kpiCard({icon:'activity', label:'Críticas', value:s.criticas})+
    ui.kpiCard({icon:'check-circle', label:'Completadas', value:s.completadas})+
    '</div>';
}
function planAccionHtml(company){
  const rows = G.crud.byCompany(G.DB.consulting.actions, company.id);
  return accionesSummaryStripHtml(company)+
    '<div class="table-card"><div class="table-wrap"><table><thead><tr><th>Problema</th><th>Acción</th><th>Origen</th><th>Responsable</th><th>Vencimiento</th><th>Prioridad</th><th>Estado</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(a=>{
      const overdue = G.actionIsOverdue(a), dueSoon = G.actionIsDueSoon(a), critical = G.actionIsCritical(a);
      return '<tr'+(critical?' style="background:var(--critical-soft)"':'')+'><td style="max-width:180px;font-size:12.5px">'+esc(a.problem)+'</td><td style="max-width:220px">'+esc(a.action)+'</td><td>'+ui.badge('neutral',a.origin||'Manual')+'</td><td class="subtle">'+esc(a.responsible)+'</td>'+
      '<td class="subtle">'+fmt.date(a.dueDate)+(overdue?' '+ui.badge('critical','Vencida'):dueSoon?' '+ui.badge('warning','Próxima'):'')+'</td>'+
      '<td>'+ui.badge(a.priority==='Alta'?'critical':a.priority==='Media'?'warning':'neutral',a.priority)+'</td><td>'+ui.statusBadgeFor('status',a.status)+'</td>'+
      '<td><button class="btn btn-sm icon-btn" data-edit-action="'+a.id+'">'+icon('edit')+'</button></td></tr>';
    }).join('')
      : '<tr><td colspan="8">'+ui.emptyState('clipboard','No hay acciones cargadas todavía.')+'</td></tr>')+
    '</tbody></table></div></div>';
}
function openAccionForm(company, existing, onDone, opts){
  opts = opts || {};
  const objectives = G.DB.objectives.filter(o=>o.companyId===company.id);
  const indicators = G.DB.indicators.filter(i=>i.companyId===company.id);
  G.modal.form({
    title: existing?'Editar acción':'Nueva acción de mejora', subtitle: opts.subtitle, submitLabel: existing?'Guardar cambios':'Crear acción', wide:true,
    initial: existing || opts.prefill || {priority:'Media', status:'Pendiente', origin:'Manual', startDate:G.TODAY_ISO, dueDate:G.TODAY_ISO},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.consulting.actions, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'problem', label:'Problema / origen', required:true, fullWidth:true},
      {key:'action', label:'Acción a realizar', required:true, fullWidth:true},
      {key:'origin', label:'Origen', type:'select', options:['Manual','Diagnóstico','Consultoría'], required:true},
      {key:'objectiveId', label:'Objetivo asociado', type:'select', placeholder:'Sin objetivo asociado', options:objectives.map(o=>({value:o.id,label:o.name}))},
      {key:'indicatorId', label:'Indicador asociado', type:'select', placeholder:'Sin indicador asociado', options:indicators.map(i=>({value:i.id,label:i.name}))},
      {key:'responsible', label:'Responsable', required:true},
      {key:'startDate', label:'Fecha de inicio', type:'date', required:true},
      {key:'dueDate', label:'Fecha límite', type:'date', required:true},
      {key:'priority', label:'Prioridad', type:'select', options:['Baja','Media','Alta'], required:true},
      {key:'status', label:'Estado', type:'select', options:['Pendiente','En progreso','En riesgo','Completada','Cancelada'], required:true},
      {key:'comments', label:'Comentarios', type:'textarea', fullWidth:true},
      {key:'result', label:'Resultado', type:'textarea', fullWidth:true},
    ],
    onSubmit(v){
      if(existing){ G.crud.updateItem(G.DB.consulting.actions, existing.id, v); G.logActivity('actualizó una acción del plan de consultoría', v.problem, company.id); G.toast('Guardado'); onDone(); }
      else {
        const created = G.crud.addItem(G.DB.consulting.actions, Object.assign({companyId:company.id}, v), 'act');
        G.logActivity('creó una acción de consultoría', v.problem, company.id);
        G.toast('Acción creada');
        if(opts.onCreated) setTimeout(()=>opts.onCreated(created), 0); else onDone();
      }
    }
  });
}
G.openAccionForm = openAccionForm;

function reunionesHtml(company){
  const rows = G.crud.byCompany(G.DB.consulting.meetings, company.id).sort((a,b)=>b.date.localeCompare(a.date));
  if(!rows.length) return ui.emptyState('calendar','No hay reuniones registradas.');
  return '<div class="stack-16">'+rows.map(m=>
    '<div class="card"><div class="flex justify-between items-start"><div><div class="card-title">Reunión del '+fmt.dateLong(m.date)+'</div><div class="card-sub">'+esc(m.participants)+'</div></div>'+(m.nextMeeting?ui.badge('accent','Próxima: '+fmt.date(m.nextMeeting)):'')+'</div>'+
    '<div class="grid-2" style="margin-top:12px">'+
      '<div><div class="subtle" style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px">Temas tratados</div><p style="font-size:12.8px">'+esc(m.topics)+'</p></div>'+
      '<div><div class="subtle" style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px">Acuerdos</div><p style="font-size:12.8px">'+esc(m.agreements)+'</p></div>'+
    '</div>'+
    '<div style="margin-top:10px"><div class="subtle" style="font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:4px">Tareas asignadas</div><p style="font-size:12.8px">'+esc(m.tasks)+'</p></div>'+
    '</div>'
  ).join('')+'</div>';
}
function openReunionForm(company, onDone){
  G.modal.form({
    title:'Nueva reunión', submitLabel:'Guardar', wide:true,
    initial:{date:G.TODAY_ISO},
    fields:[
      {key:'date', label:'Fecha', type:'date', required:true},
      {key:'participants', label:'Participantes', required:true, fullWidth:true},
      {key:'topics', label:'Temas tratados', type:'textarea', fullWidth:true, required:true},
      {key:'agreements', label:'Acuerdos', type:'textarea', fullWidth:true},
      {key:'tasks', label:'Tareas asignadas', type:'textarea', fullWidth:true},
      {key:'nextMeeting', label:'Próxima reunión', type:'date'},
    ],
    onSubmit(v){
      G.crud.addItem(G.DB.consulting.meetings, Object.assign({companyId:company.id}, v), 'meet');
      G.logActivity('registró una reunión de consultoría', company.name, company.id);
      G.toast('Reunión registrada'); onDone();
    }
  });
}

function notasHtml(company){
  const rows = G.crud.byCompany(G.DB.consulting.notes, company.id).sort((a,b)=>b.date.localeCompare(a.date));
  return ui.infoCallout('Estas notas son privadas: solo son visibles para el Super Admin / Consultor y nunca para la empresa cliente.')+
    '<div class="stack-10" style="margin-top:14px">'+(rows.length?rows.map(n=>
      '<div class="card"><div class="flex justify-between"><b style="font-size:12.5px">'+esc(n.author)+'</b><span class="subtle" style="font-size:11.5px">'+fmt.date(n.date)+'</span></div><p style="font-size:13px;margin-top:6px">'+esc(n.text)+'</p></div>'
    ).join('') : ui.emptyState('lock','No hay notas privadas todavía.'))+'</div>';
}
function openNotaForm(company, onDone){
  G.modal.form({
    title:'Nueva nota privada', submitLabel:'Guardar nota',
    initial:{date:G.TODAY_ISO, author:'María Torres (Consultora)'},
    fields:[{key:'text', label:'Nota', type:'textarea', required:true, fullWidth:true, hint:'Visible únicamente para vos.'}],
    onSubmit(v){
      G.crud.addItem(G.DB.consulting.notes, Object.assign({companyId:company.id, date:G.TODAY_ISO, author:'María Torres (Consultora)'}, v), 'note');
      G.toast('Nota guardada'); onDone();
    }
  });
}

})();
</script>

<script>
/* ============================================================
   PART 15 — Administración: Usuarios y permisos, Configuración
   general, Auditoría, y Configuración por empresa (módulos +
   usuarios + actividad).
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

const PERM_MODULES = ['finanzas','costos','comercial','clientes','rrhh','innovacion','agro','turismo'];
const PERM_ACTIONS = [
  {key:'crear', label:'Crear'},
  {key:'editar', label:'Editar'},
  {key:'eliminar', label:'Eliminar'},
  {key:'exportar', label:'Exportar'},
];
const AVATAR_COLORS = ['#2a78d6','#eb6834','#1baf7a','#eda100','#e87ba4','#4a3aa7'];

function roleLabel(role){ return (G.ROLES[role]||{label:role}).label; }
function rolePillHtml(role){
  const cls = role==='SUPER_ADMIN'?'role-super':role==='ADMIN_EMPRESA'?'role-admin':'role-user';
  return '<span class="role-pill '+cls+'">'+esc(roleLabel(role))+'</span>';
}
function userAvatarHtml(u){
  return '<span class="user-row-avatar" style="background:'+(u.avatarColor||'#7a7f8c')+'">'+esc(G.initialsOf(u.name))+'</span>';
}
function companyNameOf(companyId){
  if(!companyId) return null;
  const c = G.DB.companies.find(c=>c.id===companyId);
  return c ? c.name : '—';
}

/* ============================================================
   Usuarios: shared table + form (used both globally and scoped
   to a single company from the company's Configuración page)
   ============================================================ */
function usersTableHtml(list, opts){
  opts = opts||{};
  const showCompany = !!opts.showCompany;
  return '<div class="table-card"><div class="table-wrap"><table><thead><tr>'+
    '<th>Usuario</th>'+(showCompany?'<th>Empresa</th>':'')+'<th>Rol</th><th>Módulos / permisos</th><th>Estado</th><th></th>'+
    '</tr></thead><tbody>'+
    (list.length? list.map(u=>{
      const modsSummary = u.role==='SUPER_ADMIN' ? 'Acceso total (todas las empresas)' :
        u.role==='ADMIN_EMPRESA' ? 'Acceso total a la empresa' :
        (u.allowedModules&&u.allowedModules.length ? u.allowedModules.map(k=>{const m=G.moduleByKey(k);return m?m.label:k;}).join(', ') : 'Sin módulos asignados');
      return '<tr>'+
        '<td><div class="flex items-center gap-sm">'+userAvatarHtml(u)+'<div><b>'+esc(u.name)+'</b><br><span class="subtle" style="font-size:11.5px">'+esc(u.email)+'</span></div></div></td>'+
        (showCompany?'<td>'+(u.companyId?esc(companyNameOf(u.companyId)):'<span class="subtle">— (Consultoría)</span>')+'</td>':'')+
        '<td>'+rolePillHtml(u.role)+'</td>'+
        '<td class="subtle" style="font-size:12px;max-width:260px">'+esc(modsSummary)+'</td>'+
        '<td>'+ui.badge(u.active!==false?'good':'neutral', u.active!==false?'Activo':'Inactivo')+'</td>'+
        '<td><div class="row-actions"><button class="btn btn-sm icon-btn" data-edit-user="'+u.id+'">'+icon('edit')+'</button>'+(u.role!=='SUPER_ADMIN'?'<button class="btn btn-sm icon-btn" data-del-user="'+u.id+'">'+icon('trash')+'</button>':'')+'</div></td>'+
        '</tr>';
    }).join('') : '<tr><td colspan="'+(showCompany?6:5)+'">'+ui.emptyState('users','No hay usuarios para mostrar.')+'</td></tr>')+
    '</tbody></table></div></div>';
}

function wireUsersTable(el, ctx, list, onDone){
  el.querySelectorAll('[data-edit-user]').forEach(b=>b.addEventListener('click', ()=>{
    const u = G.DB.users.find(x=>x.id===b.getAttribute('data-edit-user'));
    openUserForm(Object.assign({existing:u}, ctx), onDone);
  }));
  el.querySelectorAll('[data-del-user]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.getAttribute('data-del-user');
    const target = G.DB.users.find(x=>x.id===id);
    if(target && target.id===G.auth.currentUser().id){ G.toast('No podés eliminar tu propio usuario.'); return; }
    G.modal.confirm({title:'Eliminar usuario', danger:true, confirmLabel:'Eliminar',
      desc:'Esta acción no se puede deshacer. El usuario perderá el acceso a la plataforma.',
      onConfirm:()=>{
        G.crud.removeItem(G.DB.users, id);
        G.logActivity('eliminó un usuario', target?target.name:id, target?target.companyId:null);
        G.toast('Usuario eliminado'); onDone();
      }});
  }));
}

/* ---- User form (custom modal: role toggles company / módulos / permisos) ---- */
function defaultPermsFor(){
  const p = {};
  PERM_MODULES.forEach(m=> p[m] = ['crear','editar']);
  return p;
}
function moduleFlagLabel(key){
  if(key==='comercial') return 'Comercial (incluye Clientes)';
  const m = G.moduleByKey(key);
  return m ? m.label : key;
}
function dynamicUserFieldsHtml(state, opts){
  let html = '';
  if(!opts.lockCompanyId){
    html += '<div class="field"><label>Empresa'+(state.role!=='SUPER_ADMIN'?' *':'')+'</label>'+
      '<select name="companyId" '+(state.role==='SUPER_ADMIN'?'disabled':'required')+'>'+
      (state.role==='SUPER_ADMIN' ? '<option value="">— (acceso a todas)</option>' :
        '<option value="">Seleccionar empresa...</option>'+G.DB.companies.map(c=>'<option value="'+c.id+'" '+(state.companyId===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join(''))+
      '</select></div>';
  }
  if(state.role==='USUARIO_EMPRESA'){
    html += '<div class="field" style="grid-column:1/-1"><label>Módulos permitidos</label>'+
      '<div class="module-grid">'+
      G.OPTIONAL_MODULE_KEYS.map(k=>'<label class="checkline"><input type="checkbox" name="allowedModules" value="'+k+'" '+(state.allowedModules.includes(k)?'checked':'')+'/> '+esc(moduleFlagLabel(k))+'</label>').join('')+
      '</div><div class="hint">Además de estos módulos, siempre puede ver Dashboard, Planificación, Indicadores, Consultoría y Reportes si la empresa los tiene activos.</div></div>';

    html += '<div class="field" style="grid-column:1/-1"><label>Permisos por módulo</label>'+
      '<div class="table-card"><div class="table-wrap"><table class="perm-table"><thead><tr><th>Módulo</th>'+PERM_ACTIONS.map(a=>'<th>'+a.label+'</th>').join('')+'</tr></thead><tbody>'+
      PERM_MODULES.map(m=>'<tr><td>'+esc(moduleFlagLabel(m))+'</td>'+PERM_ACTIONS.map(a=>{
        const checked = (state.permissions[m]||[]).includes(a.key);
        return '<td><input type="checkbox" name="perm_'+m+'_'+a.key+'" '+(checked?'checked':'')+'/></td>';
      }).join('')+'</tr>').join('')+
      '</tbody></table></div></div>'+
      '<div class="hint">"Ver" está siempre habilitado si el módulo está asignado. "Exportar" habilita el botón "Imprimir / PDF" de ese módulo. Estos permisos definen qué acciones adicionales puede realizar el usuario dentro de cada módulo.</div></div>';
  }
  return html;
}

function openUserForm(opts, onDone){
  opts = opts || {};
  const existing = opts.existing;
  const lockCompanyId = opts.lockCompanyId;
  const allowedRoles = opts.allowedRoles || ['ADMIN_EMPRESA','USUARIO_EMPRESA','SUPER_ADMIN'];

  const state = {
    role: existing ? existing.role : (allowedRoles.includes('ADMIN_EMPRESA') ? 'ADMIN_EMPRESA' : allowedRoles[0]),
    companyId: existing ? existing.companyId : (lockCompanyId || null),
    allowedModules: existing ? (existing.allowedModules||[]).slice() : [],
    // Se arranca de los valores por defecto (que son los que ya rige el sistema
    // cuando un módulo no tiene permisos guardados explícitamente, ver
    // G.perm.userCan) y se pisan con lo que el usuario ya tenga guardado. Así,
    // si se agrega un módulo nuevo a PERM_MODULES más adelante, un usuario
    // existente no pierde silenciosamente el acceso que ya tenía sólo por
    // abrir y volver a guardar su formulario.
    permissions: Object.assign(defaultPermsFor(), existing && existing.permissions ? JSON.parse(JSON.stringify(existing.permissions)) : {}),
  };

  const overlay = G.modal.open(
    '<div class="modal-head"><div><h3>'+(existing?'Editar usuario':'Nuevo usuario')+'</h3>'+(existing?'<div class="card-sub">'+esc(existing.name)+'</div>':'<div class="card-sub">Creá un nuevo acceso a la plataforma.</div>')+'</div><button class="icon-btn" data-close>'+icon('x')+'</button></div>'+
    '<form id="userForm"><div class="modal-body">'+
      '<div class="form-grid">'+
        '<div class="field"><label>Nombre completo *</label><input type="text" name="name" required value="'+esc(existing?existing.name:'')+'"/></div>'+
        '<div class="field"><label>Email *</label><input type="email" name="email" required value="'+esc(existing?existing.email:'')+'"/></div>'+
        '<div class="field"><label>'+(existing?'Nueva contraseña':'Contraseña *')+'</label><input type="password" name="password" '+(existing?'':'required')+' autocomplete="new-password"/>'+
          '<div class="hint">'+(existing?'Dejar en blanco para no cambiarla.':'Mínimo 8 caracteres.')+'</div></div>'+
        '<div class="field"><label>Cargo</label><input type="text" name="title" placeholder="Ej: Gerente general" value="'+esc(existing?(existing.title||''):'')+'"/></div>'+
        '<div class="field"><label>Rol *</label><select name="role" required>'+
          allowedRoles.map(r=>'<option value="'+r+'" '+(state.role===r?'selected':'')+'>'+esc(roleLabel(r))+'</option>').join('')+
        '</select></div>'+
        '<div id="dynamicUserFields" style="display:contents">'+dynamicUserFieldsHtml(state, {lockCompanyId})+'</div>'+
        '<div class="field"><label class="checkline" style="margin-top:8px"><input type="checkbox" name="active" '+(existing?(existing.active!==false?'checked':''):'checked')+'/> Usuario activo</label></div>'+
      '</div>'+
      '<div id="userFormError" style="display:none;color:var(--critical);font-size:12.5px;font-weight:600;"></div>'+
    '</div>'+
    '<div class="modal-foot">'+(existing?'<button type="button" class="btn btn-danger" id="userDeleteBtn" style="margin-right:auto">'+icon('trash')+' Eliminar</button>':'')+'<button type="button" class="btn" data-close>Cancelar</button><button type="submit" class="btn btn-primary">'+(existing?'Guardar cambios':'Crear usuario')+'</button></div></form>',
    {wide:true}
  );
  overlay.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click', G.modal.close));

  function captureDynamicState(form){
    // Only overwrite allowedModules/permissions if those fields are actually present
    // in the form right now (i.e. the role was USUARIO_EMPRESA before this capture) —
    // otherwise we'd wipe out the sensible defaults when the role is switched away and back.
    if(form.querySelector('[name="allowedModules"]')){
      state.allowedModules = [...form.querySelectorAll('[name="allowedModules"]:checked')].map(x=>x.value);
      const perms = {};
      PERM_MODULES.forEach(m=>{
        const acts = PERM_ACTIONS.filter(a=> form.elements['perm_'+m+'_'+a.key] && form.elements['perm_'+m+'_'+a.key].checked).map(a=>a.key);
        perms[m] = acts;
      });
      state.permissions = perms;
    }
    if(!lockCompanyId){
      const cSel = form.elements['companyId'];
      if(cSel) state.companyId = cSel.value || null;
    }
  }
  function rerenderDynamic(){
    overlay.querySelector('#dynamicUserFields').innerHTML = dynamicUserFieldsHtml(state, {lockCompanyId});
  }

  const form = overlay.querySelector('#userForm');
  form.elements['role'].addEventListener('change', e=>{
    captureDynamicState(form);
    state.role = e.target.value;
    rerenderDynamic();
  });

  if(existing){
    overlay.querySelector('#userDeleteBtn').addEventListener('click', ()=>{
      if(existing.id===G.auth.currentUser().id){ G.toast('No podés eliminar tu propio usuario.'); return; }
      G.modal.close();
      G.modal.confirm({title:'Eliminar usuario', danger:true, confirmLabel:'Eliminar', desc:'Esta acción no se puede deshacer.', onConfirm: async ()=>{
        let res, body;
        try{
          res = await fetch('/api/users/'+existing.id, {method:'DELETE', credentials:'include'});
          body = res.ok ? {} : await res.json().catch(()=>({}));
        }catch(err){ G.toast('No se pudo conectar con el servidor.'); return; }
        if(!res.ok){
          if(body.error==='cannot_delete_self') G.toast('No podés eliminar tu propio usuario.');
          else if(res.status===403) G.toast('No tenés permiso para eliminar este usuario.');
          else G.toast('No se pudo eliminar el usuario.');
          return;
        }
        const i = G.DB.users.findIndex(u=>u.id===existing.id);
        if(i>=0) G.DB.users.splice(i,1);
        G.logActivity('eliminó un usuario', existing.name, existing.companyId);
        G.toast('Usuario eliminado'); onDone && onDone();
      }});
    });
  }

  form.addEventListener('submit', async e=>{
    e.preventDefault();
    captureDynamicState(form);
    const fd = new FormData(form);
    const errEl = overlay.querySelector('#userFormError');
    const submitBtn = form.querySelector('button[type="submit"]');
    errEl.style.display = 'none';
    const role = fd.get('role');
    const companyId = role==='SUPER_ADMIN' ? null : (lockCompanyId || state.companyId);
    if(role!=='SUPER_ADMIN' && !companyId){
      errEl.textContent = 'Seleccioná una empresa para este usuario.'; errEl.style.display='block'; return;
    }
    const password = fd.get('password') || '';
    if(!existing && password.length<8){
      errEl.textContent = 'La contraseña debe tener al menos 8 caracteres.'; errEl.style.display='block'; return;
    }
    if(existing && password && password.length<8){
      errEl.textContent = 'La contraseña debe tener al menos 8 caracteres.'; errEl.style.display='block'; return;
    }
    const payload = {
      name: fd.get('name'), email: fd.get('email'), title: fd.get('title')||'',
      role, companyId, active: !!fd.get('active'),
      allowedModules: role==='USUARIO_EMPRESA' ? state.allowedModules : [],
      permissions: role==='USUARIO_EMPRESA' ? state.permissions : {},
    };
    if(password) payload.password = password;

    const originalLabel = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = 'Guardando…';
    let res, body;
    try{
      if(existing){
        res = await fetch('/api/users/'+existing.id, {method:'PATCH', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      } else {
        res = await fetch('/api/users', {method:'POST', credentials:'include', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload)});
      }
      body = await res.json().catch(()=>({}));
    }catch(err){
      errEl.textContent = 'No se pudo conectar con el servidor. Probá de nuevo.'; errEl.style.display='block';
      submitBtn.disabled = false; submitBtn.textContent = originalLabel;
      return;
    }
    if(!res.ok){
      if(body.error==='email_taken') errEl.textContent = 'Ese email ya está registrado.';
      else if(body.error==='weak_password') errEl.textContent = 'La contraseña debe tener al menos 8 caracteres.';
      else if(body.error==='missing_field'||body.error==='missing_company') errEl.textContent = 'Completá todos los campos obligatorios.';
      else if(res.status===403) errEl.textContent = 'No tenés permiso para hacer este cambio.';
      else errEl.textContent = 'No se pudo guardar el usuario.';
      errEl.style.display='block';
      submitBtn.disabled = false; submitBtn.textContent = originalLabel;
      return;
    }
    if(existing){
      Object.assign(existing, body.user);
      G.logActivity('editó los datos de un usuario', existing.name, companyId);
      G.toast('Usuario actualizado');
    } else {
      G.DB.users.push(body.user);
      G.logActivity('creó un nuevo usuario con rol '+roleLabel(role), body.user.name, companyId);
      G.toast('Usuario creado');
    }
    G.modal.close();
    onDone && onDone();
  });
}

/* ============================================================
   Auditoría / Activity log
