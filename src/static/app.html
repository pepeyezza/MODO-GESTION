  G.charts.hbar(document.getElementById('globalSalesByCompany'), G.DB.companies.map(c=>({label:c.name, value: G.salesWindow(c.id, G.periodMonths(period)).total, color:c.logoColor})));

  el.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click', ()=>{
    el.dataset.period = b.getAttribute('data-period');
    renderGlobalDashboard(el, b.getAttribute('data-period'));
  }));
  el.querySelectorAll('[data-goto-company]').forEach(r=>r.addEventListener('click', ()=>{
    const id = r.getAttribute('data-goto-company');
    G.session.viewingCompanyId = id;
    G.navigate('company/'+id+'/dashboard');
  }));
  el.querySelectorAll('[data-company-filter]').forEach(sel=>sel.addEventListener('change', ()=>{
    filters[sel.getAttribute('data-company-filter')] = sel.value;
    renderGlobalDashboard(el, period);
  }));
  const clearBtn = el.querySelector('#companiesFilterClear');
  if(clearBtn) clearBtn.addEventListener('click', ()=>{
    el._companiesFilter = {estado:'', sector:'', avance:'', riesgo:'', actualizacion:''};
    renderGlobalDashboard(el, period);
  });
}
function periodToggleHtml(period){
  return '<div class="period-toggle">'+G.PERIODS.map(p=>'<button data-period="'+p.key+'" class="'+(p.key===period?'active':'')+'">'+p.label+'</button>').join('')+'</div>';
}
G.periodToggleHtml = periodToggleHtml;

function globalTrendSeries(months){
  const monthsArr = G.lastMonths(months);
  return [{name:'Facturación consolidada', data: monthsArr.map(mo=>{
    let total=0;
    G.DB.companies.forEach(c=> total += G.util.sum(G.DB.finance.incomes.filter(x=>x.companyId===c.id && x.date.startsWith(mo.key)), x=>x.amount));
    return {x: mo.label, y: total};
  })}];
}

function avanceBucket(pct){
  if(pct>=75) return 'alto';
  if(pct>=50) return 'medio';
  return 'bajo';
}
function actualizacionBucket(lastUpdated){
  const days = Math.round((new Date(G.TODAY_ISO)-new Date(lastUpdated))/86400000);
  if(days<=7) return 'reciente';
  if(days<=30) return 'mes';
  return 'antigua';
}
function companiesFilterBarHtml(filters){
  const sectors = [...new Set(G.DB.companies.map(c=>c.sector))];
  const estados = [...new Set(G.DB.companies.map(c=>c.status))];
  const opt = (val,label,current)=>'<option value="'+esc(val)+'"'+(val===current?' selected':'')+'>'+esc(label)+'</option>';
  const anyActive = filters.estado||filters.sector||filters.avance||filters.riesgo||filters.actualizacion;
  const selStyle = 'style="width:auto;flex:none"';
  return '<div class="flex gap-sm" style="flex-wrap:wrap;margin-bottom:14px">'+
    '<select data-company-filter="estado" class="filter-select" '+selStyle+'>'+opt('','Estado (todos)',filters.estado)+estados.map(s=>opt(s,s,filters.estado)).join('')+'</select>'+
    '<select data-company-filter="sector" class="filter-select" '+selStyle+'>'+opt('','Sector (todos)',filters.sector)+sectors.map(s=>opt(s,s,filters.sector)).join('')+'</select>'+
    '<select data-company-filter="avance" class="filter-select" '+selStyle+'>'+opt('','Nivel de avance (todos)',filters.avance)+opt('alto','Avance alto (≥75%)',filters.avance)+opt('medio','Avance medio (50-74%)',filters.avance)+opt('bajo','Avance bajo (<50%)',filters.avance)+'</select>'+
    '<select data-company-filter="riesgo" class="filter-select" '+selStyle+'>'+opt('','Riesgo (todos)',filters.riesgo)+G.RISK_TIERS.map(t=>opt(t.key,t.emoji+' '+t.label,filters.riesgo)).join('')+'</select>'+
    '<select data-company-filter="actualizacion" class="filter-select" '+selStyle+'>'+opt('','Última actualización (todas)',filters.actualizacion)+opt('reciente','Últimos 7 días',filters.actualizacion)+opt('mes','Últimos 30 días',filters.actualizacion)+opt('antigua','Hace más de 30 días',filters.actualizacion)+'</select>'+
    (anyActive ? '<button type="button" class="btn btn-sm" id="companiesFilterClear">'+icon('x')+' Limpiar filtros</button>' : '')+
  '</div>';
}
function myCompaniesTableHtml(period, filters){
  filters = filters || {};
  let companies = G.DB.companies.slice();
  if(filters.estado) companies = companies.filter(c=>c.status===filters.estado);
  if(filters.sector) companies = companies.filter(c=>c.sector===filters.sector);
  if(filters.avance) companies = companies.filter(c=>avanceBucket(c.managementProgress)===filters.avance);
  if(filters.riesgo) companies = companies.filter(c=>G.companyRiskTier(c.id).key===filters.riesgo);
  if(filters.actualizacion) companies = companies.filter(c=>actualizacionBucket(c.lastUpdated)===filters.actualizacion);

  if(!companies.length) return ui.emptyState('search','Ningún resultado con estos filtros.');

  const rows = companies.map(c=>{
    const kpi = G.companyKPIs(c.id, period);
    const pendingActions = G.DB.consulting.actions.filter(a=>a.companyId===c.id && a.status!=='Completada').length;
    const rentInd = G.DB.indicators.find(i=>i.companyId===c.id && i.name==='Rentabilidad neta');
    const diag = G.lastModoDiagnostic(c.id);
    const modoIdx = diag ? G.computeModoIndex(diag.scores, G.DB.modoWeights[c.id]) : null;
    const tier = G.companyRiskTier(c.id);
    return '<tr data-goto-company="'+c.id+'" style="cursor:pointer">'+
      '<td><b>'+esc(c.name)+'</b><div class="subtle" style="font-size:11px">'+esc(c.sector)+'</div></td>'+
      '<td class="num">'+(modoIdx!=null?'<b>'+modoIdx+'</b>/100':'<span class="subtle">—</span>')+'</td>'+
      '<td>'+ui.statusBadgeFor('status', c.status)+'</td>'+
      '<td class="num">'+fmt.currency(kpi.ventas,{compact:true})+'</td>'+
      '<td class="num">'+(rentInd?fmt.pct(rentInd.current):'—')+'</td>'+
      '<td class="num">'+G.alertsForCompany(c.id).filter(a=>a.level!=='good').length+'</td>'+
      '<td class="num">'+pendingActions+'</td>'+
      '<td>'+tier.emoji+' <span style="font-size:11.5px">'+esc(tier.label)+'</span></td>'+
      '<td class="num" style="font-family:var(--font-body);font-size:12px">'+fmt.timeAgo(c.lastUpdated)+'</td>'+
    '</tr>';
  }).join('');
  return '<div class="table-wrap"><table><thead><tr><th>Empresa</th><th class="num">Índice MODO</th><th>Estado</th><th class="num">Ventas</th><th class="num">Rentabilidad</th><th class="num">Alertas</th><th class="num">Acc. pendientes</th><th>Riesgo</th><th class="num">Actualizado</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

})();
</script>

<script>
/* ============================================================
   PART 9 — Dashboard de empresa
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

G.pages.dashboard = function(el, user, company, route){
  const period = el.dataset.period || 'mes';
  renderCompanyDashboard(el, user, company, period);
};

function renderCompanyDashboard(el, user, company, period){
  const kpi = G.companyKPIs(company.id, period);
  const alerts = G.alertsForCompany(company.id);
  const hasFin = G.moduleEnabledFor(company,'finanzas');
  const hasCost = G.moduleEnabledFor(company,'costos');
  const hasCom = G.moduleEnabledFor(company,'comercial');
  const hasRR = G.moduleEnabledFor(company,'rrhh');
  const objectives = G.DB.objectives.filter(o=>o.companyId===company.id);
  const indicators = G.DB.indicators.filter(i=>i.companyId===company.id);
  const pendingActions = G.DB.consulting.actions.filter(a=>a.companyId===company.id && a.status!=='Completada');

  let html = ui.pageHeader('Centro de Gestión — '+company.name, company.activity, G.periodToggleHtml(period)+ui.printBtn());

  const badAlerts = alerts.filter(a=>a.level!=='good');

  // ---- Estado actual ----
  html += sectionTitle('grid','Estado actual','Los números clave del período');
  html += '<div class="kpi-grid">';
  if(hasFin){
    html += ui.kpiCard({icon:'wallet', label:'Ingresos', value: fmt.currency(kpi.ingresos,{compact:true}), delta: kpi.deltaIngresos});
    html += ui.kpiCard({icon:'trending-up', label:'Egresos', value: fmt.currency(kpi.egresos,{compact:true}), delta: kpi.deltaEgresos!=null?-kpi.deltaEgresos:null});
    html += ui.kpiCard({icon:'banknote', label:'Resultado', value: fmt.currency(kpi.resultado,{compact:true}), delta: kpi.deltaResultado});
    html += ui.kpiCard({icon:'percent', label:'Margen', value: fmt.pct(kpi.margen,1)});
  } else {
    html += ui.kpiCard({icon:'users', label:'Clientes activos', value: kpi.clientesActivos});
    html += ui.kpiCard({icon:'user-check', label:'Empleados activos', value: kpi.empleadosActivos});
    html += ui.kpiCard({icon:'target', label:'Objetivos en curso', value: objectives.filter(o=>o.status!=='Cumplido').length});
    html += ui.kpiCard({icon:'clipboard', label:'Acciones pendientes', value: pendingActions.length});
  }
  html += '</div>';

  // ---- Alertas ----
  html += sectionTitle('alert-triangle','Alertas','Problemas que requieren atención');
  html += badAlerts.length
    ? '<div class="stack-10">'+badAlerts.map(a=>G.alertRowHtml(a)).join('')+'</div>'
    : ui.emptyState('check-circle','No hay alertas activas: todo se ve en orden.');

  // ---- Prioridades ----
  html += sectionTitle('compass','Prioridades','Qué debería atender primero, según el último diagnóstico');
  const diagForDash = G.lastModoDiagnostic(company.id);
  if(diagForDash){
    const prios = G.modoPriorities(diagForDash.scores, 3);
    html += prios.length
      ? '<div class="card"><div class="stack-16">'+prios.map((p,i)=>
          '<div class="flex justify-between items-center" style="gap:14px;'+(i<prios.length-1?'padding-bottom:12px;border-bottom:1px solid var(--border)':'')+'">'+
            '<div style="display:flex;gap:12px;align-items:flex-start"><div style="width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11.5px;flex:none">'+(i+1)+'</div>'+
            '<div><b style="font-size:13px">'+esc(p.label)+'</b> <span class="subtle mono" style="font-size:11px">('+p.score+'/100)</span><div class="subtle" style="font-size:12px;margin-top:2px">'+esc(p.suggestion)+'</div></div></div>'+
          '</div>'
        ).join('')+'</div><div style="margin-top:10px" data-nav="company/'+company.id+'/diagnostico" class="btn btn-sm" style="cursor:pointer;display:inline-flex">'+icon('activity')+' Ver diagnóstico completo</div></div>'
      : '<div class="card">'+ui.emptyState('check-circle','No hay áreas críticas en el último diagnóstico.')+'</div>';
  } else {
    html += '<div class="card">'+ui.emptyState('activity','Todavía no se realizó un diagnóstico MODO de esta empresa.')+'<div style="text-align:center;margin-top:-8px" data-nav="company/'+company.id+'/diagnostico" class="btn btn-sm btn-primary" style="cursor:pointer;display:inline-flex">'+icon('plus')+' Realizar diagnóstico</div></div>';
  }

  // ---- Acciones ----
  const accSum = G.actionsSummary(company.id);
  html += sectionTitle('check-circle','Acciones','Qué está haciendo la organización para mejorar');
  html += '<div class="kpi-grid">'+
    ui.kpiCard({icon:'alert-triangle', label:'Vencidas', value:accSum.vencidas})+
    ui.kpiCard({icon:'calendar', label:'Próximas a vencer', value:accSum.proximasAVencer})+
    ui.kpiCard({icon:'trending-up', label:'Críticas', value:accSum.criticas})+
    ui.kpiCard({icon:'check-circle', label:'Completadas', value:accSum.completadas})+
    '</div>';
  const openActionsForDash = G.DB.consulting.actions.filter(a=>a.companyId===company.id && G.actionIsOpen(a)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).slice(0,4);
  html += '<div class="card">'+(openActionsForDash.length
    ? '<div class="stack-10">'+openActionsForDash.map(a=>{
        const overdue = G.actionIsOverdue(a), dueSoon = G.actionIsDueSoon(a);
        return '<div class="flex justify-between items-center" style="gap:10px"><div><b style="font-size:12.8px">'+esc(a.action)+'</b><div class="subtle" style="font-size:11.5px">'+esc(a.responsible)+' · vence '+fmt.date(a.dueDate)+'</div></div>'+(overdue?ui.badge('critical','Vencida'):dueSoon?ui.badge('warning','Próxima'):ui.statusBadgeFor('status',a.status))+'</div>';
      }).join('')+'</div>'
    : ui.emptyState('check-circle','No hay acciones abiertas en este momento.'))+
    '<div style="margin-top:10px" data-nav="company/'+company.id+'/consultoria" class="btn btn-sm" style="cursor:pointer;display:inline-flex">'+icon('clipboard')+' Ver plan de acción completo</div></div>';

  // ---- Evolución ----
  html += sectionTitle('bar-chart','Evolución','Cómo cambió la empresa respecto de períodos anteriores');

  // Finanzas section
  if(hasFin){
    html += sectionTitle('wallet','Finanzas','Ingresos, egresos y resultado del negocio');
    html += '<div class="grid-2">'+
      ui.card('Evolución de ingresos y egresos', 'Últimos 10 meses', '<div id="dashFinChart"></div>')+
      ui.card('Flujo de fondos acumulado', 'Resultado acumulado del período', '<div id="dashCashFlow"></div>')+
      '</div>';
  }

  // Comercial section
  if(hasCom){
    html += sectionTitle('trending-up','Comercial','Ventas y comportamiento de clientes');
    const salesSeries = G.monthlySeriesFor(company.id, 10, 'sales');
    const clientsAll = G.DB.clients.filter(c=>c.companyId===company.id);
    html += '<div class="kpi-grid">'+
      ui.kpiCard({icon:'banknote', label:'Ventas del período', value: fmt.currency(kpi.ventas,{compact:true})}) +
      ui.kpiCard({icon:'users', label:'Clientes activos', value: kpi.clientesActivos, deltaText: clientsAll.length+' en total', deltaTone:'flat'}) +
      ui.kpiCard({icon:'plus', label:'Clientes nuevos', value: kpi.clientesNuevos}) +
      ui.kpiCard({icon:'banknote', label:'Ticket promedio', value: fmt.currency(kpi.ticketPromedio,{compact:true})}) +
      '</div>';
    html += '<div class="grid-2">'+
      ui.card('Evolución de ventas', 'Últimos 10 meses', '<div id="dashSalesChart"></div>')+
      ui.card('Ranking de clientes', 'Por facturación en el período', '<div id="dashTopClients"></div>')+
      '</div>';
  }

  // Costos section
  if(hasCost){
    html += sectionTitle('calculator','Costos','Estructura de costos del negocio');
    const cs = G.costsSummary(company.id);
    const periodSalesForVar = G.salesWindow(company.id, G.periodMonths(period)).sales;
    const totalVar = G.util.sum(periodSalesForVar, s=>{
      const p = G.DB.products.find(p=>p.id===s.productId);
      return p ? p.variableCost*s.qty : 0;
    });
    const margenBruto = kpi.ventas ? ((kpi.ventas-totalVar)/kpi.ventas*100) : 0;
    html += '<div class="kpi-grid">'+
      ui.kpiCard({icon:'calculator', label:'Costos fijos / mes', value: fmt.currency(cs.totalFixed,{compact:true})}) +
      ui.kpiCard({icon:'package', label:'Costo variable estimado', value: fmt.currency(totalVar,{compact:true})}) +
      ui.kpiCard({icon:'percent', label:'Margen bruto', value: fmt.pct(margenBruto,1)}) +
      ui.kpiCard({icon:'target', label:'Costo total', value: fmt.currency(cs.totalFixed+totalVar,{compact:true})}) +
      '</div>';
    html += '<div class="grid-2">'+
      ui.card('Costos fijos por categoría', '', '<div id="dashFixedDonut"></div>')+
      ui.card('Punto de equilibrio por producto', 'Unidades necesarias para cubrir costos fijos', '<div id="dashBreakeven"></div>')+
      '</div>';
  }

  // RRHH section
  if(hasRR){
    html += sectionTitle('user-check','Recursos Humanos','Dotación y costo laboral');
    const byArea = G.employeesByArea(company.id);
    const seniority = G.avgSeniorityYears(company.id);
    html += '<div class="kpi-grid">'+
      ui.kpiCard({icon:'users', label:'Empleados activos', value: kpi.empleadosActivos}) +
      ui.kpiCard({icon:'wallet', label:'Costo laboral / mes', value: fmt.currency(kpi.costoLaboral,{compact:true})}) +
      ui.kpiCard({icon:'percent', label:'Costo laboral / ventas', value: hasCom?fmt.pct(kpi.costoLaboralSobreVentas,1):'—'}) +
      ui.kpiCard({icon:'calendar', label:'Antigüedad promedio', value: seniority.toFixed(1)+' años'}) +
      '</div>';
    html += '<div class="grid-2">'+
      ui.card('Distribución por área', '', '<div id="dashAreaDonut"></div>')+
      ui.card('Dotación — últimos 10 meses', 'Altas acumuladas por mes de ingreso', '<div id="dashHeadcount"></div>')+
      '</div>';
  }

  // Gestión section (always)
  html += sectionTitle('target','Gestión','Objetivos, indicadores y avance');
  html += '<div class="grid-2">'+
    ui.card('Objetivos estratégicos', '', objectivesMiniListHtml(objectives))+
    ui.card('Indicadores clave', '', indicatorsMiniListHtml(indicators))+
    '</div>';

  // ---- Próximos pasos ----
  html += sectionTitle('arrow-right','Próximos pasos','Qué debería ocurrir a continuación');
  const nextSteps = [];
  const nextAction = G.DB.consulting.actions.filter(a=>a.companyId===company.id && G.actionIsOpen(a)).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
  if(nextAction) nextSteps.push({icon:'check-circle', text:'Avanzar con "'+nextAction.action+'" ('+esc(nextAction.responsible)+', vence '+fmt.date(nextAction.dueDate)+').'});
  if(diagForDash){
    const topPrio = G.modoPriorities(diagForDash.scores, 1)[0];
    if(topPrio) nextSteps.push({icon:'compass', text:'Reforzar '+topPrio.label+' ('+topPrio.score+'/100): '+topPrio.suggestion});
  } else {
    nextSteps.push({icon:'activity', text:'Realizar el primer diagnóstico MODO para tener prioridades claras.'});
  }
  if(badAlerts.filter(a=>a.level==='critical').length) nextSteps.push({icon:'alert-triangle', text:'Resolver las alertas críticas antes del cierre del período.'});
  html += '<div class="card"><div class="stack-10">'+
    nextSteps.map(s=>'<div class="flex items-center gap-sm">'+icon(s.icon,'subtle')+'<span style="font-size:12.8px">'+esc(s.text)+'</span></div>').join('')+
    '</div><div class="flex gap-sm" style="margin-top:14px;flex-wrap:wrap">'+
    '<div data-nav="company/'+company.id+'/historia" class="btn btn-sm" style="cursor:pointer;display:inline-flex">'+icon('calendar')+' Ver Historia de Gestión</div>'+
    '<div data-nav="company/'+company.id+'/red" class="btn btn-sm" style="cursor:pointer;display:inline-flex">'+icon('briefcase')+' ¿Necesitás ayuda? MODO Red / Consultor</div>'+
    '</div></div>';

  el.innerHTML = html;

  if(hasFin){
    const fs = G.monthlySeriesFor(company.id, 10, 'finance');
    G.charts.line(document.getElementById('dashFinChart'), [
      {name:'Ingresos', data: fs.map(m=>({x:m.label,y:m.income})), color: G.charts.seriesColor(0)},
      {name:'Egresos', data: fs.map(m=>({x:m.label,y:m.expense})), color: G.charts.seriesColor(1)},
    ]);
    let acc=0;
    const accSeries = fs.map(m=>{ acc+=m.result; return {x:m.label,y:acc}; });
    G.charts.line(document.getElementById('dashCashFlow'), [{name:'Resultado acumulado', data:accSeries}]);
  }
  if(hasCom){
    const ss = G.monthlySeriesFor(company.id, 10, 'sales');
    G.charts.line(document.getElementById('dashSalesChart'), [{name:'Ventas', data: ss.map(m=>({x:m.label,y:m.total}))}]);
    const top = G.salesByClient(company.id, G.periodMonths(period)).slice(0,6);
    G.charts.hbar(document.getElementById('dashTopClients'), top.length?top:[{label:'Sin ventas en el período', value:0}]);
  }
  if(hasCost){
    const cs = G.costsSummary(company.id);
    const byCat = G.util.groupBy(cs.fixed, c=>c.category);
    const donutData = Object.entries(byCat).map(([cat,arr])=>({label:cat, value:G.util.sum(arr,c=>c.amount)}));
    G.charts.donut(document.getElementById('dashFixedDonut'), donutData);
    const products = G.DB.products.filter(p=>p.companyId===company.id);
    G.charts.hbar(document.getElementById('dashBreakeven'), products.map(p=>{
      const be = G.breakEven(company.id, p.id);
      return {label:p.name, value: be && isFinite(be.units) ? Math.round(be.units) : 0};
    }), {money:false});
  }
  if(hasRR){
    const byArea = G.employeesByArea(company.id);
    G.charts.donut(document.getElementById('dashAreaDonut'), byArea, {money:false});
    const emps = G.DB.employees.filter(e=>e.companyId===company.id);
    const months = G.lastMonths(10);
    const headcount = months.map(mo=>{
      return {x:mo.label, y: emps.filter(e=> e.startDate <= mo.key+'-28').length};
    });
    G.charts.line(document.getElementById('dashHeadcount'), [{name:'Dotación', data:headcount}], {showArea:true, money:false});
  }

  el.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click', ()=>{
    el.dataset.period = b.getAttribute('data-period');
    renderCompanyDashboard(el, user, company, b.getAttribute('data-period'));
  }));
  el.querySelectorAll('[data-nav]').forEach(b=>b.addEventListener('click', ()=> G.navigate(b.getAttribute('data-nav'))));
}

function sectionTitle(iconName, title, desc){
  return '<div class="flex items-center gap-sm" style="margin:26px 0 12px"><div style="width:30px;height:30px;border-radius:9px;background:var(--accent-soft);display:flex;align-items:center;justify-content:center;color:var(--accent-600)">'+icon(iconName)+'</div><div><div style="font-family:var(--font-display);font-weight:700;font-size:15px">'+esc(title)+'</div><div class="subtle" style="font-size:11.5px">'+esc(desc)+'</div></div></div>';
}

function objectivesMiniListHtml(objectives){
  if(!objectives.length) return ui.emptyState('target','Todavía no se cargaron objetivos.');
  return '<div class="stack-10">'+objectives.slice(0,5).map(o=>{
    const pct = o.goal===0 ? (o.current===0?100:0) : Math.min(150, Math.round(o.current/o.goal*100));
    return '<div><div class="flex justify-between" style="margin-bottom:4px"><span style="font-size:12.8px;font-weight:600">'+esc(o.name)+'</span>'+ui.statusBadgeFor('status',o.status)+'</div>'+ui.progressBar(pct, o.status==='En riesgo'?'warning':o.status==='Cumplido'?'good':'')+'</div>';
  }).join('')+'</div>';
}
function indicatorsMiniListHtml(indicators){
  if(!indicators.length) return ui.emptyState('bar-chart','Todavía no se cargaron indicadores.');
  return '<div class="table-wrap"><table><thead><tr><th>Indicador</th><th class="num">Actual</th><th class="num">Objetivo</th></tr></thead><tbody>'+
    indicators.slice(0,6).map(i=>'<tr><td>'+esc(i.name)+'</td><td class="num">'+(i.unit==='$'?fmt.currency(i.current,{compact:true}):fmt.num(i.current,1)+i.unit)+'</td><td class="num subtle">'+(i.unit==='$'?fmt.currency(i.target,{compact:true}):fmt.num(i.target,1)+i.unit)+'</td></tr>').join('')+
    '</tbody></table></div>';
}

})();
</script>

<script>
/* ============================================================
   PART 10 — Módulos Finanzas y Costos
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

function tabsHtml(tabs, active){
  return '<div class="tabbar">'+tabs.map(t=>'<div class="tab '+(t.key===active?'active':'')+'" data-tab="'+t.key+'">'+esc(t.label)+'</div>').join('')+'</div>';
}
function wireTabs(el, onChange){
  el.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click', ()=> onChange(t.getAttribute('data-tab'))));
}
G.ui.tabsHtml = tabsHtml; G.ui.wireTabs = wireTabs;

/* ============================================================
   FINANZAS
   ============================================================ */
G.pages.finanzas = function(el, user, company){
  const state = el._finState || {tab:'resumen', period:'mes', filterCat:'', search:''};
  el._finState = state;
  renderFinanzas(el, user, company, state);
};

function renderFinanzas(el, user, company, state){
  const canEdit = G.perm.userCan(user, 'finanzas', 'editar');
  const canDelete = G.perm.userCan(user, 'finanzas', 'eliminar');
  const canCreate = G.perm.userCan(user, 'finanzas', 'crear');

  let body = '';
  if(state.tab==='resumen') body = finResumenHtml(company, state.period);
  else if(state.tab==='ingresos') body = finTableHtml(company, 'income', state, canCreate, canEdit, canDelete);
  else if(state.tab==='egresos') body = finTableHtml(company, 'expense', state, canCreate, canEdit, canDelete);
  else if(state.tab==='categorias') body = finCategoriesHtml(company);

  const canExportFin = G.perm.userCan(user, 'finanzas', 'exportar');
  el.innerHTML = ui.pageHeader('Finanzas', 'Ingresos, egresos y resultado. Pensado para pymes, no reemplaza a tu sistema contable.',
      state.tab==='resumen' ? G.periodToggleHtml(state.period)+(canExportFin?ui.printBtn():'') :
      (canCreate ? '<button class="btn" id="finImportBtn">'+icon('upload')+' Importar CSV</button><button class="btn" id="finQuickBtn">'+icon('mic')+' Carga rápida</button><button class="btn btn-primary" id="finNewBtn">'+icon('plus')+' '+(state.tab==='egresos'?'Nuevo egreso':'Nuevo ingreso')+'</button>' : '')) +
    tabsHtml([{key:'resumen',label:'Resumen'},{key:'ingresos',label:'Ingresos'},{key:'egresos',label:'Egresos'},{key:'categorias',label:'Categorías'}], state.tab) +
    body;

  wireTabs(el, tab=>{ state.tab=tab; renderFinanzas(el, user, company, state); });

  if(state.tab==='resumen'){
    mountFinResumenCharts(company, state.period);
    el.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click', ()=>{ state.period=b.getAttribute('data-period'); renderFinanzas(el,user,company,state); }));
  } else if(state.tab==='ingresos' || state.tab==='egresos'){
    const kind = state.tab==='ingresos' ? 'income' : 'expense';
    wireFinTable(el, user, company, kind, state, canEdit, canDelete);
    const newBtn = document.getElementById('finNewBtn');
    if(newBtn) newBtn.addEventListener('click', ()=> openFinForm(company, kind, null, ()=>renderFinanzas(el,user,company,state)));
    const quickBtn = document.getElementById('finQuickBtn');
    if(quickBtn) quickBtn.addEventListener('click', ()=> G.openQuickCapture(user, company, {type: kind, onDone: ()=>renderFinanzas(el,user,company,state)}));
    const importBtn = document.getElementById('finImportBtn');
    if(importBtn) importBtn.addEventListener('click', ()=>{
      const isIncome = kind==='income';
      const partyKey = isIncome ? 'client' : 'provider';
      G.openCsvImport({
        title:'Importar '+(isIncome?'ingresos':'egresos')+' desde CSV',
        columns:[
          {key:'date', label:'date', required:true}, {key:'concept', label:'concept', required:true},
          {key:partyKey, label:partyKey}, {key:'category', label:'category'}, {key:'method', label:'method'},
          {key:'amount', label:'amount', required:true}, {key:'notes', label:'notes'},
        ],
        onImport(rows){
          const list = isIncome ? G.DB.finance.incomes : G.DB.finance.expenses;
          rows.forEach(r=>{
            const payload = {companyId:company.id, date:r.date||G.TODAY_ISO, concept:r.concept, category:r.category||'Otros',
              method:r.method||'Transferencia', amount: parseFloat(r.amount)||0, notes:r.notes||''};
            payload[partyKey] = r[partyKey]||'';
            G.crud.addItem(list, payload, isIncome?'inc':'exp');
          });
          G.logActivity('importó '+rows.length+' '+(isIncome?'ingreso(s)':'egreso(s)')+' desde CSV', company.name, company.id);
          renderFinanzas(el,user,company,state);
        }
      });
    });
  } else if(state.tab==='categorias'){
    wireCategoriesForm(el, company, ()=>renderFinanzas(el,user,company,state));
  }
}

function finResumenHtml(company, period){
  const kpi = G.companyKPIs(company.id, period);
  return '<div class="kpi-grid">'+
    ui.kpiCard({icon:'wallet', label:'Ingresos', value: fmt.currency(kpi.ingresos,{compact:true}), delta:kpi.deltaIngresos})+
    ui.kpiCard({icon:'trending-up', label:'Egresos', value: fmt.currency(kpi.egresos,{compact:true}), delta: kpi.deltaEgresos!=null?-kpi.deltaEgresos:null})+
    ui.kpiCard({icon:'banknote', label:'Resultado del período', value: fmt.currency(kpi.resultado,{compact:true}), delta:kpi.deltaResultado})+
    ui.kpiCard({icon:'percent', label:'Margen', value: fmt.pct(kpi.margen,1)})+
    '</div>'+
    '<div class="grid-2">'+
      ui.card('Evolución de ingresos y egresos','Últimos 10 meses','<div id="finEvoChart"></div>')+
      ui.card('Flujo de fondos acumulado','Resultado acumulado del período','<div id="finCashChart"></div>')+
    '</div>'+
    '<div style="margin-top:16px">'+ui.card('Resultado mensual', 'Ingresos menos egresos, por mes', '<div id="finResultBar"></div>')+'</div>';
}
function mountFinResumenCharts(company){
  const fs = G.monthlySeriesFor(company.id, 10, 'finance');
  G.charts.line(document.getElementById('finEvoChart'), [
    {name:'Ingresos', data: fs.map(m=>({x:m.label,y:m.income})), color:G.charts.seriesColor(0)},
    {name:'Egresos', data: fs.map(m=>({x:m.label,y:m.expense})), color:G.charts.seriesColor(1)},
  ]);
  let acc=0;
  G.charts.line(document.getElementById('finCashChart'), [{name:'Acumulado', data: fs.map(m=>{ acc+=m.result; return {x:m.label,y:acc}; })}]);
  G.charts.bar(document.getElementById('finResultBar'), fs.map(m=>({label:m.label, value:m.result, color: m.result>=0? G.charts.seriesColor(2) : G.charts.seriesColor(7)})));
}

function finTableHtml(company, kind, state, canCreate, canEdit, canDelete){
  const list = kind==='income' ? G.DB.finance.incomes : G.DB.finance.expenses;
  const cats = (G.DB.financeCategories[company.id]||{})[kind] || [];
  let rows = G.crud.byCompany(list, company.id).sort((a,b)=> b.date.localeCompare(a.date));
  if(state.filterCat) rows = rows.filter(r=>r.category===state.filterCat);
  if(state.search) rows = rows.filter(r=> (r.concept+' '+(r[kind==='income'?'client':'provider']||'')).toLowerCase().includes(state.search.toLowerCase()));
  const total = G.util.sum(rows, r=>r.amount);

  return '<div class="table-card">'+
    '<div class="table-toolbar">'+
      '<div class="search-input">'+icon('search')+'<input type="text" placeholder="Buscar concepto o '+(kind==='income'?'cliente':'proveedor')+'..." value="'+esc(state.search)+'" id="finSearch"/></div>'+
      '<select class="filter-select" id="finCatFilter"><option value="">Todas las categorías</option>'+cats.map(c=>'<option value="'+esc(c)+'" '+(state.filterCat===c?'selected':'')+'>'+esc(c)+'</option>').join('')+'</select>'+
      '<div class="subtle" style="margin-left:auto;font-size:12.5px">'+rows.length+' registro(s) · Total <b class="mono">'+fmt.currency(total)+'</b></div>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Concepto</th><th>'+(kind==='income'?'Cliente':'Proveedor')+'</th><th>Categoría</th><th>Medio</th><th class="num">Importe</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(r=>'<tr>'+
      '<td>'+fmt.date(r.date)+'</td>'+
      '<td>'+esc(r.concept)+(r.notes?'<br><span class="subtle" style="font-size:11px">'+esc(r.notes)+'</span>':'')+'</td>'+
      '<td>'+esc(r[kind==='income'?'client':'provider']||'—')+'</td>'+
      '<td>'+ui.badge('neutral', r.category)+'</td>'+
      '<td class="subtle" style="font-size:12px">'+esc(r.method)+'</td>'+
      '<td class="num" style="color:'+(kind==='income'?'var(--good)':'var(--critical)')+'">'+(kind==='income'?'+':'−')+fmt.currency(r.amount)+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td>'+
    '</tr>').join('') : '<tr><td colspan="7">'+ui.emptyState(kind==='income'?'wallet':'trending-up','Todavía no hay '+(kind==='income'?'ingresos':'egresos')+' cargados.')+'</td></tr>')+
    '</tbody></table></div></div>';
}

function wireFinTable(el, user, company, kind, state, canEdit, canDelete){
  const searchEl = document.getElementById('finSearch');
  if(searchEl) searchEl.addEventListener('input', G.util.debounce(()=>{ state.search=searchEl.value; renderFinanzas(el,user,company,state); }, 250));
  const catEl = document.getElementById('finCatFilter');
  if(catEl) catEl.addEventListener('change', ()=>{ state.filterCat=catEl.value; renderFinanzas(el,user,company,state); });
  const list = kind==='income' ? G.DB.finance.incomes : G.DB.finance.expenses;
  el.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{
    const item = list.find(x=>x.id===b.getAttribute('data-edit'));
    openFinForm(company, kind, item, ()=>renderFinanzas(el,user,company,state));
  }));
  el.querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click', ()=>{
    const id = b.getAttribute('data-del');
    G.modal.confirm({title:'Eliminar registro', desc:'Esta acción no se puede deshacer.', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(list, id);
      G.logActivity('eliminó un '+(kind==='income'?'ingreso':'egreso')+' en Finanzas', company.name, company.id);
      G.toast('Registro eliminado'); renderFinanzas(el,user,company,state);
    }});
  }));
}

function openFinForm(company, kind, existing, onDone){
  const cats = (G.DB.financeCategories[company.id]||{})[kind] || [];
  const isIncome = kind==='income';
  G.modal.form({
    title: existing ? 'Editar '+(isIncome?'ingreso':'egreso') : (isIncome?'Nuevo ingreso':'Nuevo egreso'),
    submitLabel: existing?'Guardar cambios':'Registrar',
    initial: existing || {date: G.TODAY_ISO},
    onDelete: existing ? ()=>{
      const list = isIncome?G.DB.finance.incomes:G.DB.finance.expenses;
      G.crud.removeItem(list, existing.id);
      G.logActivity('eliminó un '+(isIncome?'ingreso':'egreso'), company.name, company.id);
      G.toast('Registro eliminado'); onDone();
    } : null,
    fields:[
      {key:'date', label:'Fecha', type:'date', required:true},
      {key:'concept', label:'Concepto', required:true, placeholder:isIncome?'Ej: Liquidación de ventas':'Ej: Pago de alquiler'},
      {key: isIncome?'client':'provider', label: isIncome?'Cliente':'Proveedor', placeholder: isIncome?'Nombre del cliente':'Nombre del proveedor'},
      {key:'category', label:'Categoría', type:'select', required:true, options:cats},
      {key:'method', label:'Medio de '+(isIncome?'cobro':'pago'), type:'select', required:true, options:['Transferencia','Efectivo','Tarjeta de débito','Tarjeta de crédito','Débito automático','Cheque']},
      {key:'amount', label:'Importe', type:'number', step:'0.01', required:true, placeholder:'0'},
      {key:'notes', label:'Observaciones', type:'textarea', fullWidth:true, placeholder:'Notas adicionales (opcional)'},
    ],
    onSubmit(v){
      if(v.amount<=0) return false;
      const list = isIncome ? G.DB.finance.incomes : G.DB.finance.expenses;
      if(existing){
        G.crud.updateItem(list, existing.id, v);
        G.logActivity('editó un '+(isIncome?'ingreso':'egreso')+' en Finanzas', v.concept, company.id);
        G.toast('Cambios guardados');
      } else {
        G.crud.addItem(list, Object.assign({companyId:company.id}, v), isIncome?'inc':'exp');
        G.logActivity('registró un nuevo '+(isIncome?'ingreso':'egreso')+' en Finanzas', v.concept, company.id);
        G.toast(isIncome?'Ingreso registrado':'Egreso registrado');
      }
      onDone();
    }
  });
}

function finCategoriesHtml(company){
  const cats = G.DB.financeCategories[company.id] || {income:[],expense:[]};
  const col = (kind,label)=> '<div class="card"><div class="card-title">'+label+'</div><div class="stack-10" style="margin-top:12px">'+
    cats[kind].map(c=>'<div class="flex justify-between items-center"><span class="badge badge-neutral">'+esc(c)+'</span></div>').join('')+
    '</div><form id="addCat_'+kind+'" class="flex gap-sm" style="margin-top:14px"><input type="text" name="newCat" placeholder="Nueva categoría..." style="flex:1"/><button class="btn btn-sm btn-primary" type="submit">'+icon('plus')+'</button></form></div>';
  return '<div class="grid-2">'+col('income','Categorías de ingresos')+col('expense','Categorías de egresos')+'</div>';
}
function wireCategoriesForm(el, company, onDone){
  ['income','expense'].forEach(kind=>{
    const form = document.getElementById('addCat_'+kind);
    if(!form) return;
    form.addEventListener('submit', e=>{
      e.preventDefault();
      const val = form.newCat.value.trim();
      if(!val) return;
      const cats = G.DB.financeCategories[company.id];
      if(!cats[kind].includes(val)){ cats[kind].push(val); G.persist(); G.toast('Categoría agregada'); onDone(); }
    });
  });
}

/* ============================================================
   COSTOS
   ============================================================ */
G.pages.costos = function(el, user, company){
  const state = el._costState || {tab:'resumen'};
  el._costState = state;
  renderCostos(el, user, company, state);
};

function isGastroCompany(company){
  const s = ((company.sector||'')+' '+(company.activity||'')).toLowerCase();
  return /gastronom|restaur|gourmet|cocina|bar y resto/.test(s);
}
G.isGastroCompany = isGastroCompany;

function renderCostos(el, user, company, state){
  const canCreate = G.perm.userCan(user,'costos','crear'), canEdit = G.perm.userCan(user,'costos','editar'), canDelete = G.perm.userCan(user,'costos','eliminar');
  const gastro = isGastroCompany(company);
  let body='', actions='';
  if(state.tab==='resumen'){ body = costResumenHtml(company); actions = G.perm.userCan(user,'costos','exportar')?ui.printBtn():''; }
  else if(state.tab==='productos'){ body = productsTableHtml(company, canEdit, canDelete); actions = canCreate?'<button class="btn btn-primary" id="prodNewBtn">'+icon('plus')+' Nueva ficha de producto</button>':''; }
  else if(state.tab==='carta'){ body = cartaHtml(company); actions = canCreate?'<button class="btn btn-primary" id="prodNewBtn">'+icon('plus')+' Nuevo plato</button>':''; }
  else if(state.tab==='fijos'){ body = costFixedTableHtml(company, canEdit, canDelete); actions = canCreate?'<button class="btn btn-primary" id="costNewBtn">'+icon('plus')+' Nuevo costo fijo</button>':''; }
  else if(state.tab==='variables'){ body = costVarTableHtml(company, canEdit, canDelete); actions = canCreate?'<button class="btn btn-primary" id="costNewVarBtn">'+icon('plus')+' Nuevo costo variable</button>':''; }
  else if(state.tab==='calculadora') body = priceCalculatorHtml(company);

  const tabs = [{key:'resumen',label:'Resumen'},{key:'productos',label:'Productos'}];
  if(gastro) tabs.push({key:'carta',label:'La Carta'});
  tabs.push({key:'fijos',label:'Costos fijos'},{key:'variables',label:'Costos variables'},{key:'calculadora',label:'Calculadora de precio'});

  el.innerHTML = ui.pageHeader('Costos', 'Estructura de costos, margen y punto de equilibrio de tu negocio.', actions) +
    tabsHtml(tabs, state.tab) +
    body;

  wireTabs(el, tab=>{ state.tab=tab; renderCostos(el,user,company,state); });

  if(state.tab==='resumen') mountCostResumenCharts(company);
  else if(state.tab==='productos' || state.tab==='carta'){
    const newBtn = document.getElementById('prodNewBtn');
    if(newBtn) newBtn.addEventListener('click', ()=>openProductForm(company, null, ()=>renderCostos(el,user,company,state)));
    el.querySelectorAll('[data-edit-prod]').forEach(b=>b.addEventListener('click', ()=>openProductForm(company, G.DB.products.find(p=>p.id===b.getAttribute('data-edit-prod')), ()=>renderCostos(el,user,company,state))));
    el.querySelectorAll('[data-del-prod]').forEach(b=>b.addEventListener('click', ()=>{
      G.modal.confirm({title:'Eliminar producto', desc:'Se va a eliminar la ficha del producto. Las ventas ya registradas no se modifican.', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{ G.crud.removeItem(G.DB.products, b.getAttribute('data-del-prod')); G.logActivity('eliminó la ficha de un producto', company.name, company.id); G.toast('Producto eliminado'); renderCostos(el,user,company,state); }});
    }));
    wireTargetMarginInput(el, company, ()=>renderCostos(el,user,company,state));
  } else if(state.tab==='fijos'){
    const newBtn = document.getElementById('costNewBtn');
    if(newBtn) newBtn.addEventListener('click', ()=>openFixedCostForm(company, null, ()=>renderCostos(el,user,company,state)));
    el.querySelectorAll('[data-edit-fixed]').forEach(b=>b.addEventListener('click', ()=>openFixedCostForm(company, G.DB.costsFixed.find(c=>c.id===b.getAttribute('data-edit-fixed')), ()=>renderCostos(el,user,company,state))));
    el.querySelectorAll('[data-del-fixed]').forEach(b=>b.addEventListener('click', ()=>{
      G.modal.confirm({title:'Eliminar costo fijo', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{ G.crud.removeItem(G.DB.costsFixed, b.getAttribute('data-del-fixed')); G.logActivity('eliminó un costo fijo', company.name, company.id); G.toast('Eliminado'); renderCostos(el,user,company,state); }});
    }));
  } else if(state.tab==='variables'){
    const newBtn = document.getElementById('costNewVarBtn');
    if(newBtn) newBtn.addEventListener('click', ()=>openVarCostForm(company, null, ()=>renderCostos(el,user,company,state)));
    el.querySelectorAll('[data-edit-var]').forEach(b=>b.addEventListener('click', ()=>openVarCostForm(company, G.DB.costsVariable.find(c=>c.id===b.getAttribute('data-edit-var')), ()=>renderCostos(el,user,company,state))));
    el.querySelectorAll('[data-del-var]').forEach(b=>b.addEventListener('click', ()=>{
      G.modal.confirm({title:'Eliminar costo variable', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{ G.crud.removeItem(G.DB.costsVariable, b.getAttribute('data-del-var')); G.logActivity('eliminó un costo variable', company.name, company.id); G.toast('Eliminado'); renderCostos(el,user,company,state); }});
    }));
  } else if(state.tab==='calculadora'){
    wirePriceCalculator(el, company);
  }
}

function costResumenHtml(company){
  const cs = G.costsSummary(company.id);
  const kpi = G.companyKPIs(company.id, 'mes');
  const totalVar = G.util.sum(G.salesWindow(company.id,1).sales, s=>{ const p=G.DB.products.find(p=>p.id===s.productId); return p?p.variableCost*s.qty:0; });
  const margenBruto = kpi.ventas ? ((kpi.ventas-totalVar)/kpi.ventas*100) : 0;
  return '<div class="kpi-grid">'+
    ui.kpiCard({icon:'calculator', label:'Costos fijos / mes', value: fmt.currency(cs.totalFixed,{compact:true})})+
    ui.kpiCard({icon:'package', label:'Costo variable estimado (mes)', value: fmt.currency(totalVar,{compact:true})})+
    ui.kpiCard({icon:'percent', label:'Margen bruto', value: fmt.pct(margenBruto,1)})+
    ui.kpiCard({icon:'target', label:'Costo total (mes)', value: fmt.currency(cs.totalFixed+totalVar,{compact:true})})+
    '</div>'+
    '<div class="grid-2">'+
      ui.card('Costos fijos por categoría','', '<div id="costFixedDonut"></div>')+
      ui.card('Punto de equilibrio por producto/servicio','Unidades necesarias para cubrir los costos fijos','<div id="costBreakevenChart"></div>')+
    '</div>'+
    ui.infoCallout('El <b>margen bruto</b> es lo que te queda de cada venta después de descontar los costos directos (materia prima, insumos, comisiones). El <b>punto de equilibrio</b> es la cantidad mínima que necesitás vender para cubrir tus costos fijos.');
}
function mountCostResumenCharts(company){
  const cs = G.costsSummary(company.id);
  const byCat = G.util.groupBy(cs.fixed, c=>c.category);
  G.charts.donut(document.getElementById('costFixedDonut'), Object.entries(byCat).map(([cat,arr])=>({label:cat, value:G.util.sum(arr,c=>c.amount)})));
  const products = G.DB.products.filter(p=>p.companyId===company.id);
  G.charts.hbar(document.getElementById('costBreakevenChart'), products.map(p=>{
    const be = G.breakEven(company.id, p.id);
    return {label:p.name, value: be&&isFinite(be.units)?Math.round(be.units):0};
  }), {money:false});
}

/* ---------- Ficha de producto: costo unitario, margen y sugerencia de precio ---------- */
// Única fuente de verdad para el estado de margen de un producto: la usan la tabla de
// Productos, La Carta y el resumen en vivo de la ficha, para que los tres siempre coincidan.
function productMarginInfo(product, company){
  const cost = product.variableCost||0, price = product.price||0;
  const marginAbs = price-cost;
  const marginPct = price>0 ? marginAbs/price*100 : 0;
  const target = (company && company.targetMarginPct!=null) ? company.targetMarginPct : 45;
  const suggestedPrice = (cost>0 && target<100) ? cost/(1-target/100) : null;
  let tone='neutral', label='Sin datos suficientes';
  if(price<=0){ tone='neutral'; label='Definí el precio'; }
  else if(cost<=0){ tone='neutral'; label='Definí el costo'; }
  else if(marginPct<0){ tone='critical'; label='El precio no cubre el costo'; }
  else if(marginPct<target-8){ tone='critical'; label='Subir precio'; }
  else if(marginPct<target){ tone='warning'; label='Cerca del objetivo'; }
  else { tone='good'; label='Margen saludable'; }
  return {cost, price, marginAbs, marginPct, target, suggestedPrice, tone, label};
}

    overlay.querySelectorAll('.pf-del').forEach(btn=>btn.addEventListener('click', ()=>{ draft.costComponents.splice(+btn.dataset.i,1); refreshRows(); }));

      }});
    });
  }

  document.getElementById('pfForm').addEventListener('submit', e=>{
    e.preventDefault();
    const name = document.getElementById('pfNameInp').value.trim();
    const category = document.getElementById('pfCatInp').value.trim();
    const price = parseFloat(document.getElementById('pfPriceInp').value)||0;
