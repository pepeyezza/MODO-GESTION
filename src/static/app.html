  // Resumen: KPIs, inventario de hacienda y clima (igual que antes)
  el.querySelectorAll('[data-edit-kpi]').forEach(btn=>btn.addEventListener('click', ()=>{
    const k = G.DB.indicators.find(x=>x.id===btn.getAttribute('data-edit-kpi'));
    if(k) G.openIndicatorForm(company, k, rerender);
  }));
  el.querySelectorAll('[data-update-kpi]').forEach(btn=>btn.addEventListener('click', e=>{
    e.stopPropagation();
    const k = G.DB.indicators.find(x=>x.id===btn.getAttribute('data-update-kpi'));
    if(k) G.openIndicatorUpdate(company, k, rerender);
  }));
  const livBtn = document.getElementById('agroLivestockNewBtn');
  if(livBtn) livBtn.addEventListener('click', ()=>openLivestockForm(company, null, rerender));
  el.querySelectorAll('[data-edit-livestock]').forEach(b=>b.addEventListener('click', ()=>{
    openLivestockForm(company, G.DB.livestockInventory.find(r=>r.id===b.getAttribute('data-edit-livestock')), rerender);
  }));
  el.querySelectorAll('[data-del-livestock]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar categoría de hacienda', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.livestockInventory, b.getAttribute('data-del-livestock'));
      G.logActivity('eliminó una categoría del inventario de hacienda', company.name, company.id);
      G.toast('Eliminado'); rerender();
    }});
  }));
  const rainBtn = document.getElementById('agroRainNewBtn');
  if(rainBtn) rainBtn.addEventListener('click', ()=>openRainfallForm(company, null, rerender));
  el.querySelectorAll('[data-edit-rain]').forEach(b=>b.addEventListener('click', ()=>{
    openRainfallForm(company, G.DB.rainfallLog.find(r=>r.id===b.getAttribute('data-edit-rain')), rerender);
  }));
  el.querySelectorAll('[data-del-rain]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar registro de lluvia', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.rainfallLog, b.getAttribute('data-del-rain'));
      G.logActivity('eliminó un registro climático', company.name, company.id);
      G.toast('Eliminado'); rerender();
    }});
  }));

  // Lotes
  const lotsViewSel = document.getElementById('agroLotsViewSel');
  if(lotsViewSel) lotsViewSel.addEventListener('change', ()=>{ state.lotsView = lotsViewSel.value; rerender(); });
  const newLotBtn = document.getElementById('agroNewLotBtn');
  if(newLotBtn) newLotBtn.addEventListener('click', ()=>openLotForm(company, null, rerender));
  el.querySelectorAll('[data-edit-lot]').forEach(b=>b.addEventListener('click', ()=>{
    openLotForm(company, G.DB.agroLots.find(r=>r.id===b.getAttribute('data-edit-lot')), rerender);
  }));
  el.querySelectorAll('[data-del-lot]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar lote', desc:'Las tareas ya cargadas para este lote no se borran, pero quedan sin lote asignado.', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.agroLots, b.getAttribute('data-del-lot'));
      G.logActivity('eliminó un lote', company.name, company.id);
      G.toast('Lote eliminado'); rerender();
    }});
  }));

  // Tareas de campo
  const lotFilter = document.getElementById('agroTaskLotFilter');
  if(lotFilter) lotFilter.addEventListener('change', ()=>{ state.taskLotFilter = lotFilter.value; rerender(); });
  const typeFilter = document.getElementById('agroTaskTypeFilter');
  if(typeFilter) typeFilter.addEventListener('change', ()=>{ state.taskTypeFilter = typeFilter.value; rerender(); });
  const newTaskBtn = document.getElementById('agroNewTaskBtn');
  if(newTaskBtn) newTaskBtn.addEventListener('click', ()=>openTaskForm(company, null, rerender));
  const quickBtn = document.getElementById('agroQuickBtn');
  if(quickBtn) quickBtn.addEventListener('click', ()=> G.openQuickCapture(user, company, {type:'agroTask', onDone: rerender}));
  el.querySelectorAll('[data-edit-task]').forEach(b=>b.addEventListener('click', ()=>{
    openTaskForm(company, G.DB.agroTasks.find(r=>r.id===b.getAttribute('data-edit-task')), rerender);
  }));
  el.querySelectorAll('[data-del-task]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar tarea', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.agroTasks, b.getAttribute('data-del-task'));
      G.logActivity('eliminó una tarea de campo', company.name, company.id);
      G.toast('Tarea eliminada'); rerender();
    }});
  }));

  // Ganado: movimientos (el inventario reutiliza los mismos handlers de Resumen, arriba)
  const moveBtn = document.getElementById('agroMoveNewBtn');
  if(moveBtn) moveBtn.addEventListener('click', ()=>openMovementForm(company, null, rerender));
  el.querySelectorAll('[data-edit-move]').forEach(b=>b.addEventListener('click', ()=>{
    openMovementForm(company, G.DB.agroLivestockMovements.find(r=>r.id===b.getAttribute('data-edit-move')), rerender);
  }));
  el.querySelectorAll('[data-del-move]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar movimiento', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.agroLivestockMovements, b.getAttribute('data-del-move'));
      G.logActivity('eliminó un movimiento de hacienda', company.name, company.id);
      G.toast('Eliminado'); rerender();
    }});
  }));

  // Maquinaria
  const machBtn = document.getElementById('agroMachNewBtn');
  if(machBtn) machBtn.addEventListener('click', ()=>openMachineForm(company, null, rerender));
  el.querySelectorAll('[data-edit-machine]').forEach(b=>b.addEventListener('click', ()=>{
    openMachineForm(company, G.DB.agroMachinery.find(r=>r.id===b.getAttribute('data-edit-machine')), rerender);
  }));
  el.querySelectorAll('[data-del-machine]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar máquina', desc:'Los registros de uso y mantenimiento ya cargados no se borran.', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.agroMachinery, b.getAttribute('data-del-machine'));
      G.logActivity('eliminó una máquina', company.name, company.id);
      G.toast('Eliminada'); rerender();
    }});
  }));
  const machLogBtn = document.getElementById('agroMachLogNewBtn');
  if(machLogBtn) machLogBtn.addEventListener('click', ()=>{
    if(!G.crud.byCompany(G.DB.agroMachinery, company.id).length){ G.toast('Cargá primero una máquina en "Maquinaria y equipos".'); return; }
    openMachineLogForm(company, null, rerender);
  });
  el.querySelectorAll('[data-edit-machlog]').forEach(b=>b.addEventListener('click', ()=>{
    openMachineLogForm(company, G.DB.agroMachineryLog.find(r=>r.id===b.getAttribute('data-edit-machlog')), rerender);
  }));
  el.querySelectorAll('[data-del-machlog]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar registro', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.agroMachineryLog, b.getAttribute('data-del-machlog'));
      G.logActivity('eliminó un registro de maquinaria', company.name, company.id);
      G.toast('Eliminado'); rerender();
    }});
  }));

  // Reportes
  const reportSel = document.getElementById('agroReportView');
  if(reportSel) reportSel.addEventListener('change', ()=>{ state.reportView = reportSel.value; rerender(); });
}

function openLivestockForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar categoría de hacienda':'Nueva categoría de hacienda', submitLabel: existing?'Guardar cambios':'Agregar',
    initial: existing || {date:G.TODAY_ISO},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.livestockInventory, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'category', label:'Categoría', type:'select', required:true, options:LIVESTOCK_CATEGORIES},
      {key:'qty', label:'Cantidad de cabezas', type:'number', required:true},
      {key:'date', label:'Fecha de actualización', type:'date', required:true},
    ],
    onSubmit(v){
      if(v.qty<0) return false;
      if(existing){ G.crud.updateItem(G.DB.livestockInventory, existing.id, v); G.logActivity('actualizó el inventario de hacienda', v.category, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.livestockInventory, Object.assign({companyId:company.id}, v), 'liv'); G.logActivity('cargó una categoría de hacienda', v.category, company.id); G.toast('Categoría agregada'); }
      onDone();
    }
  });
}
function openRainfallForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar registro de lluvia':'Nuevo registro de lluvia', submitLabel: existing?'Guardar cambios':'Agregar',
    initial: existing || {},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.rainfallLog, existing.id); G.toast('Eliminado'); onDone(); }:null,
    fields:[
      {key:'period', label:'Mes / período', required:true, placeholder:'Ej: Enero 2026'},
      {key:'mm', label:'Milímetros de lluvia', type:'number', step:'0.1', required:true},
    ],
    onSubmit(v){
      if(v.mm<0) return false;
      if(existing){ G.crud.updateItem(G.DB.rainfallLog, existing.id, v); G.logActivity('editó un registro climático', v.period, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.rainfallLog, Object.assign({companyId:company.id}, v), 'rain'); G.logActivity('cargó un registro climático', v.period, company.id); G.toast('Registro agregado'); }
      onDone();
    }
  });
}

})();
</script>

<script>
/* ============================================================
   PART 25 — Módulo Turismo y hotelería
   Se activa automáticamente para empresas cuyo rubro/actividad coincide con
   G.isTurismoCompany (ver Parte 4: G.SECTOR_MODULE_RULES). Maneja dos
   colecciones propias -- unidades (habitaciones, cabañas, departamentos...) y
   reservas -- y calcula ocupación, ingresos y próximos check-ins a partir de
   esas reservas. Primera versión simple: la ocupación e ingresos por mes son
   un cálculo directo sobre las reservas cargadas, sin prorratear estadías que
   cruzan de un mes a otro (se documenta esa simplificación en el reporte).
   ============================================================ */
(function(){
"use strict";
const G = window.GESTIONA;
const icon = G.icon, fmt = G.fmt, esc = G.util.escapeHtml, ui = G.ui;

const TURISMO_UNIT_TYPES = ['Habitación','Cabaña','Departamento','Domo / Carpa','Otro'];
const TURISMO_CHANNELS = ['Directo','Booking.com','Airbnb','Otro'];
const TURISMO_STATUSES = ['Confirmada','Check-in','Check-out','Cancelada'];
const TURISMO_TABS = [
  {key:'resumen', label:'Resumen'},
  {key:'unidades', label:'Unidades'},
  {key:'reservas', label:'Reservas'},
  {key:'reportes', label:'Reportes'},
];

function turismoStatusTone(s){
  const map = {'Confirmada':'accent','Check-in':'good','Check-out':'neutral','Cancelada':'critical'};
  return map[s]||'neutral';
}
// Noches entre dos fechas ISO (yyyy-mm-dd). Comparación por milisegundos en
// UTC para no depender de la zona horaria del navegador.
function turismoNights(checkIn, checkOut){
  if(!checkIn || !checkOut) return 0;
  const a = new Date(checkIn+'T00:00:00Z'), b = new Date(checkOut+'T00:00:00Z');
  const n = Math.round((b-a)/86400000);
  return n>0 ? n : 0;
}
function turismoUnitName(units, id){ const u = units.find(x=>x.id===id); return u?u.name:'Sin unidad'; }
function turismoMonthLabel(monthKey){
  const parts = (monthKey||'').split('-');
  const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  return (G.MONTHS_ES[m-1]||'')+' '+y;
}
function turismoMonthBounds(monthKey){
  const parts = (monthKey||'').split('-');
  const y = parseInt(parts[0],10), m = parseInt(parts[1],10);
  const start = new Date(Date.UTC(y, m-1, 1));
  const nextStart = new Date(Date.UTC(y, m, 1));
  const daysInMonth = Math.round((nextStart-start)/86400000);
  return {startIso: start.toISOString().slice(0,10), nextStartIso: nextStart.toISOString().slice(0,10), daysInMonth};
}
// Ocupación e ingresos de un mes puntual: para cada unidad activa, cuenta las
// noches de sus reservas (no canceladas) que caen dentro del mes, y estima el
// % de ocupación sobre los días del mes. El ingreso de una reserva que se
// solapa con el mes se cuenta completo (no se prorratea entre meses si la
// estadía cruza de uno a otro) -- una simplificación aceptada a propósito.
function turismoOccupancyForMonth(company, monthKey){
  const units = G.crud.byCompany(G.DB.turismoUnits, company.id).filter(u=>u.active!==false);
  const bookings = G.crud.byCompany(G.DB.turismoBookings, company.id).filter(b=>b.status!=='Cancelada');
  const {startIso, nextStartIso, daysInMonth} = turismoMonthBounds(monthKey);
  const perUnit = units.map(u=>{
    const nightsBooked = bookings.filter(b=>b.unitId===u.id).reduce((sum,b)=>{
      if(!b.checkIn || !b.checkOut) return sum;
      const from = b.checkIn > startIso ? b.checkIn : startIso;
      const to = b.checkOut < nextStartIso ? b.checkOut : nextStartIso;
      return sum + Math.max(0, turismoNights(from, to));
    }, 0);
    return {unit:u, nightsBooked, availableNights: daysInMonth, occupancyPct: daysInMonth ? (nightsBooked/daysInMonth*100) : 0};
  });
  const totalBooked = G.util.sum(perUnit, r=>r.nightsBooked);
  const totalAvailable = units.length*daysInMonth;
  const revenue = G.util.sum(bookings.filter(b=> b.checkIn && b.checkOut && b.checkIn<nextStartIso && b.checkOut>startIso), b=>parseFloat(b.amount)||0);
  return {perUnit, totalBooked, totalAvailable, occupancyPct: totalAvailable ? (totalBooked/totalAvailable*100) : 0, revenue, daysInMonth};
}
function turismoUpcomingCheckins(company, limit){
  const today = G.TODAY_ISO;
  const units = G.crud.byCompany(G.DB.turismoUnits, company.id);
  const rows = G.crud.byCompany(G.DB.turismoBookings, company.id)
    .filter(b=> b.status!=='Cancelada' && b.checkIn>=today)
    .sort((a,b)=> a.checkIn.localeCompare(b.checkIn));
  return rows.slice(0, limit||5).map(b=> Object.assign({}, b, {unitName: turismoUnitName(units, b.unitId)}));
}

G.pages.turismo = function(el, user, company){
  const state = el._turismoState || {tab:'resumen', bookingUnitFilter:'', bookingStatusFilter:'', reportMonth: G.TODAY_ISO.slice(0,7)};
  el._turismoState = state;
  renderTurismo(el, user, company, state);
};

function renderTurismo(el, user, company, state){
  const canCreate = G.perm.userCan(user,'turismo','crear'), canEdit = G.perm.userCan(user,'turismo','editar'), canDelete = G.perm.userCan(user,'turismo','eliminar');
  const canExport = G.perm.userCan(user,'turismo','exportar');

  let body = '';
  if(state.tab==='resumen') body = turismoResumenHtml(company);
  else if(state.tab==='unidades') body = turismoUnitsTableHtml(company, canCreate, canEdit, canDelete);
  else if(state.tab==='reservas') body = turismoBookingsTableHtml(company, state, canCreate, canEdit, canDelete);
  else if(state.tab==='reportes') body = turismoReportHtml(company, state);

  el.innerHTML = ui.pageHeader('Turismo y hotelería', 'Unidades, reservas, ocupación e ingresos por alojamiento.', turismoHeaderActionsHtml(state, canCreate, canExport)) +
    ui.tabsHtml(TURISMO_TABS, state.tab) +
    body;

  ui.wireTabs(el, tab=>{ state.tab=tab; renderTurismo(el, user, company, state); });

  wireTurismoPage(el, user, company, state, canCreate, canEdit, canDelete);
}

function turismoHeaderActionsHtml(state, canCreate, canExport){
  if(state.tab==='unidades') return canCreate ? '<button class="btn btn-primary" id="turismoNewUnitBtn">'+icon('plus')+' Nueva unidad</button>' : '';
  if(state.tab==='reservas') return canCreate ? '<button class="btn btn-primary" id="turismoNewBookingBtn">'+icon('plus')+' Nueva reserva</button>' : '';
  if(state.tab==='reportes') return '<input type="month" class="filter-select" id="turismoReportMonth" value="'+esc(state.reportMonth)+'"/>'+(canExport?ui.printBtn():'');
  return '';
}

/* ---------- Resumen ---------- */
function turismoResumenHtml(company){
  const activeUnits = G.crud.byCompany(G.DB.turismoUnits, company.id).filter(u=>u.active!==false);
  const bookings = G.crud.byCompany(G.DB.turismoBookings, company.id).filter(b=>b.status!=='Cancelada');
  const occ = turismoOccupancyForMonth(company, G.TODAY_ISO.slice(0,7));
  const activeBookings = bookings.filter(b=> b.checkOut >= G.TODAY_ISO);
  const upcoming = turismoUpcomingCheckins(company, 5);

  const kpis = '<div class="kpi-grid">'+
    ui.kpiCard({icon:'building', label:'Unidades activas', value: activeUnits.length}) +
    ui.kpiCard({icon:'percent', label:'Ocupación del mes', value: fmt.num(occ.occupancyPct,0)+'%'}) +
    ui.kpiCard({icon:'calendar', label:'Reservas activas', value: activeBookings.length}) +
    ui.kpiCard({icon:'wallet', label:'Ingresos del mes', value: fmt.currency(occ.revenue)}) +
  '</div>';

  const upcomingBody = '<div class="table-wrap"><table><thead><tr><th>Huésped</th><th>Unidad</th><th>Check-in</th><th>Check-out</th><th>Estado</th></tr></thead><tbody>'+
    (upcoming.length ? upcoming.map(b=>'<tr>'+
      '<td><b>'+esc(b.guestName)+'</b></td>'+
      '<td>'+esc(b.unitName)+'</td>'+
      '<td>'+fmt.date(b.checkIn)+'</td>'+
      '<td>'+fmt.date(b.checkOut)+'</td>'+
      '<td>'+ui.badge(turismoStatusTone(b.status), b.status)+'</td>'+
    '</tr>').join('') : '<tr><td colspan="5">'+ui.emptyState('calendar','Sin próximos check-ins.')+'</td></tr>')+
    '</tbody></table></div>';

  return kpis + ui.card('Próximos check-ins', upcoming.length?('Siguientes '+upcoming.length+' reserva(s)'):'', upcomingBody);
}

/* ---------- Unidades ---------- */
function turismoUnitsTableHtml(company, canCreate, canEdit, canDelete){
  const rows = G.crud.byCompany(G.DB.turismoUnits, company.id);
  return '<div class="table-card">'+
    '<div class="table-toolbar"><div class="subtle" style="font-size:12.5px">'+rows.length+' unidad(es)</div></div>'+
    '<div class="table-wrap"><table><thead><tr><th>Unidad</th><th>Tipo</th><th class="num">Capacidad</th><th class="num">Tarifa / noche</th><th>Estado</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(r=>'<tr>'+
      '<td><b>'+esc(r.name)+'</b></td>'+
      '<td>'+esc(r.type||'—')+'</td>'+
      '<td class="num mono">'+(r.capacity?fmt.num(parseFloat(r.capacity)||0):'—')+'</td>'+
      '<td class="num mono">'+(r.baseRate?fmt.currency(parseFloat(r.baseRate)||0):'—')+'</td>'+
      '<td>'+ui.badge(r.active!==false?'good':'neutral', r.active!==false?'Activa':'Inactiva')+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-unit="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-unit="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td>'+
    '</tr>').join('') : '<tr><td colspan="6">'+ui.emptyState('building','Todavía no cargaste unidades. Empezá agregando la primera habitación, cabaña o departamento.')+'</td></tr>')+
    '</tbody></table></div></div>';
}
function openTurismoUnitForm(company, existing, onDone){
  G.modal.form({
    title: existing?'Editar unidad':'Nueva unidad', submitLabel: existing?'Guardar cambios':'Agregar',
    initial: existing || {active:true},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.turismoUnits, existing.id); G.toast('Eliminada'); onDone(); }:null,
    fields:[
      {key:'name', label:'Nombre', required:true, placeholder:'Ej: Cabaña 3'},
      {key:'type', label:'Tipo', type:'select', required:true, options:TURISMO_UNIT_TYPES},
      {key:'capacity', label:'Capacidad (personas)', type:'number'},
      {key:'baseRate', label:'Tarifa base por noche ($)', type:'number', step:'0.01'},
      {key:'active', label:'Estado', type:'checkbox', checkLabel:'Unidad activa'},
    ],
    onSubmit(v){
      if(v.capacity<0 || v.baseRate<0) return false;
      if(existing){ G.crud.updateItem(G.DB.turismoUnits, existing.id, v); G.logActivity('editó una unidad de alojamiento', v.name, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.turismoUnits, Object.assign({companyId:company.id}, v), 'unit'); G.logActivity('cargó una nueva unidad de alojamiento', v.name, company.id); G.toast('Unidad agregada'); }
      onDone();
    }
  });
}

/* ---------- Reservas ---------- */
function turismoBookingsTableHtml(company, state, canCreate, canEdit, canDelete){
  const units = G.crud.byCompany(G.DB.turismoUnits, company.id);
  let rows = G.crud.byCompany(G.DB.turismoBookings, company.id).sort((a,b)=> b.checkIn.localeCompare(a.checkIn));
  if(state.bookingUnitFilter) rows = rows.filter(r=>r.unitId===state.bookingUnitFilter);
  if(state.bookingStatusFilter) rows = rows.filter(r=>r.status===state.bookingStatusFilter);
  const totalAmount = G.util.sum(rows.filter(r=>r.status!=='Cancelada'), r=>parseFloat(r.amount)||0);
  return '<div class="table-card">'+
    '<div class="table-toolbar">'+
      '<select class="filter-select" id="turismoBookingUnitFilter"><option value="">Todas las unidades</option>'+units.map(u=>'<option value="'+u.id+'" '+(state.bookingUnitFilter===u.id?'selected':'')+'>'+esc(u.name)+'</option>').join('')+'</select>'+
      '<select class="filter-select" id="turismoBookingStatusFilter"><option value="">Todos los estados</option>'+TURISMO_STATUSES.map(s=>'<option value="'+s+'" '+(state.bookingStatusFilter===s?'selected':'')+'>'+s+'</option>').join('')+'</select>'+
      '<div class="subtle" style="margin-left:auto;font-size:12.5px">'+rows.length+' reserva(s) · Total (sin canceladas) <b class="mono">'+fmt.currency(totalAmount)+'</b></div>'+
    '</div>'+
    '<div class="table-wrap"><table><thead><tr><th>Huésped</th><th>Unidad</th><th>Check-in</th><th>Check-out</th><th class="num">Noches</th><th class="num">Huéspedes</th><th>Canal</th><th>Estado</th><th class="num">Monto</th><th></th></tr></thead><tbody>'+
    (rows.length ? rows.map(r=>'<tr>'+
      '<td><b>'+esc(r.guestName)+'</b></td>'+
      '<td>'+esc(turismoUnitName(units, r.unitId))+'</td>'+
      '<td>'+fmt.date(r.checkIn)+'</td>'+
      '<td>'+fmt.date(r.checkOut)+'</td>'+
      '<td class="num mono">'+turismoNights(r.checkIn, r.checkOut)+'</td>'+
      '<td class="num mono">'+(r.guests?fmt.num(parseFloat(r.guests)||0):'—')+'</td>'+
      '<td class="subtle" style="font-size:12px">'+esc(r.channel||'—')+'</td>'+
      '<td>'+ui.badge(turismoStatusTone(r.status), r.status)+'</td>'+
      '<td class="num mono">'+(r.amount?fmt.currency(parseFloat(r.amount)||0):'—')+'</td>'+
      '<td><div class="row-actions">'+(canEdit?'<button class="btn btn-sm icon-btn" data-edit-booking="'+r.id+'">'+icon('edit')+'</button>':'')+(canDelete?'<button class="btn btn-sm icon-btn" data-del-booking="'+r.id+'">'+icon('trash')+'</button>':'')+'</div></td>'+
    '</tr>').join('') : '<tr><td colspan="10">'+ui.emptyState('calendar','Todavía no hay reservas cargadas.')+'</td></tr>')+
    '</tbody></table></div></div>';
}
function openTurismoBookingForm(company, existing, onDone){
  const units = G.crud.byCompany(G.DB.turismoUnits, company.id);
  const unitOptions = units.map(u=>({value:u.id,label:u.name}));
  G.modal.form({
    title: existing?'Editar reserva':'Nueva reserva', submitLabel: existing?'Guardar cambios':'Agregar',
    wide:true, cols3:true,
    initial: existing || {checkIn:G.TODAY_ISO, checkOut:G.TODAY_ISO, status:'Confirmada'},
    onDelete: existing?()=>{ G.crud.removeItem(G.DB.turismoBookings, existing.id); G.toast('Eliminada'); onDone(); }:null,
    fields:[
      {key:'guestName', label:'Huésped', required:true, placeholder:'Nombre y apellido'},
      {key:'unitId', label:'Unidad', type:'select', required:true, options:unitOptions, placeholder: unitOptions.length?'Seleccionar...':'Cargá primero una unidad'},
      {key:'checkIn', label:'Check-in', type:'date', required:true},
      {key:'checkOut', label:'Check-out', type:'date', required:true},
      {key:'guests', label:'Cantidad de huéspedes', type:'number'},
      {key:'channel', label:'Canal', type:'select', options:TURISMO_CHANNELS},
      {key:'status', label:'Estado', type:'select', required:true, options:TURISMO_STATUSES},
      {key:'amount', label:'Monto total ($)', type:'number', step:'0.01'},
      {key:'notes', label:'Notas', type:'textarea', fullWidth:true},
    ],
    onSubmit(v){
      if(v.checkOut<=v.checkIn) return false;
      if(existing){ G.crud.updateItem(G.DB.turismoBookings, existing.id, v); G.logActivity('editó una reserva', v.guestName, company.id); G.toast('Guardado'); }
      else { G.crud.addItem(G.DB.turismoBookings, Object.assign({companyId:company.id}, v), 'book'); G.logActivity('cargó una nueva reserva', v.guestName, company.id); G.toast('Reserva agregada'); }
      onDone();
    },
    errorMessage:'La fecha de check-out tiene que ser posterior a la de check-in.'
  });
}

/* ---------- Reportes ---------- */
function turismoReportHtml(company, state){
  const occ = turismoOccupancyForMonth(company, state.reportMonth);
  const body = '<div class="table-wrap"><table><thead><tr><th>Unidad</th><th class="num">Noches disponibles</th><th class="num">Noches ocupadas</th><th class="num">Ocupación</th></tr></thead><tbody>'+
    (occ.perUnit.length ? occ.perUnit.map(r=>'<tr>'+
      '<td><b>'+esc(r.unit.name)+'</b></td>'+
      '<td class="num mono">'+r.availableNights+'</td>'+
      '<td class="num mono">'+fmt.num(r.nightsBooked,0)+'</td>'+
      '<td class="num mono">'+fmt.num(r.occupancyPct,0)+'%</td>'+
    '</tr>').join('') : '<tr><td colspan="4">'+ui.emptyState('building','Cargá unidades y reservas para ver el reporte de ocupación.')+'</td></tr>')+
    '</tbody></table></div>';
  const summary = '<div class="kpi-grid" style="margin-bottom:16px">'+
    ui.kpiCard({icon:'percent', label:'Ocupación total del mes', value: fmt.num(occ.occupancyPct,0)+'%'}) +
    ui.kpiCard({icon:'wallet', label:'Ingresos del mes', value: fmt.currency(occ.revenue)}) +
  '</div>';
  return summary + ui.card('Ocupación por unidad', turismoMonthLabel(state.reportMonth), body) +
    '<div class="hint" style="margin-top:10px">Los ingresos y noches se muestran completos en el mes de referencia cuando la reserva se solapa con el período (no se prorratean entre meses si la estadía cruza de uno a otro).</div>';
}

/* ---------- Wiring de toda la página ---------- */
function wireTurismoPage(el, user, company, state, canCreate, canEdit, canDelete){
  const rerender = ()=> renderTurismo(el, user, company, state);

  // Unidades
  const newUnitBtn = document.getElementById('turismoNewUnitBtn');
  if(newUnitBtn) newUnitBtn.addEventListener('click', ()=>openTurismoUnitForm(company, null, rerender));
  el.querySelectorAll('[data-edit-unit]').forEach(b=>b.addEventListener('click', ()=>{
    openTurismoUnitForm(company, G.DB.turismoUnits.find(r=>r.id===b.getAttribute('data-edit-unit')), rerender);
  }));
  el.querySelectorAll('[data-del-unit]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar unidad', desc:'Las reservas ya cargadas para esta unidad no se borran.', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.turismoUnits, b.getAttribute('data-del-unit'));
      G.logActivity('eliminó una unidad de alojamiento', company.name, company.id);
      G.toast('Unidad eliminada'); rerender();
    }});
  }));

  // Reservas
  const unitFilter = document.getElementById('turismoBookingUnitFilter');
  if(unitFilter) unitFilter.addEventListener('change', ()=>{ state.bookingUnitFilter = unitFilter.value; rerender(); });
  const statusFilter = document.getElementById('turismoBookingStatusFilter');
  if(statusFilter) statusFilter.addEventListener('change', ()=>{ state.bookingStatusFilter = statusFilter.value; rerender(); });
  const newBookingBtn = document.getElementById('turismoNewBookingBtn');
  if(newBookingBtn) newBookingBtn.addEventListener('click', ()=>{
    if(!G.crud.byCompany(G.DB.turismoUnits, company.id).length){ G.toast('Cargá primero una unidad en "Unidades".'); return; }
    openTurismoBookingForm(company, null, rerender);
  });
  el.querySelectorAll('[data-edit-booking]').forEach(b=>b.addEventListener('click', ()=>{
    openTurismoBookingForm(company, G.DB.turismoBookings.find(r=>r.id===b.getAttribute('data-edit-booking')), rerender);
  }));
  el.querySelectorAll('[data-del-booking]').forEach(b=>b.addEventListener('click', ()=>{
    G.modal.confirm({title:'Eliminar reserva', danger:true, confirmLabel:'Eliminar', onConfirm:()=>{
      G.crud.removeItem(G.DB.turismoBookings, b.getAttribute('data-del-booking'));
      G.logActivity('eliminó una reserva', company.name, company.id);
      G.toast('Reserva eliminada'); rerender();
    }});
  }));

  // Reportes
  const monthInput = document.getElementById('turismoReportMonth');
  if(monthInput) monthInput.addEventListener('change', ()=>{ if(monthInput.value){ state.reportMonth = monthInput.value; rerender(); } });
}

})();
</script>
